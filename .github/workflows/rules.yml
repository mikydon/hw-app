name: Firestore rules
# Tests firestore.rules (accounts, friends, leaderboard, cloud backup) inside the Firestore emulator.
# The rules themselves are published by hand in the Firebase console (Firestore → Rules).
on:
  push:
    paths: ["firestore.rules", ".github/rules-test/**", ".github/workflows/rules.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .github/rules-test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - name: Rules tests in the emulator
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee out.txt || { echo "::error title=Rules test log::$(tail -n 60 out.txt | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }
