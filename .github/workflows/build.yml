name: Build and release
# On every push: build the website bundle, the test APK ("HW App Test") and, when the signing key
# secrets exist, the real APK.
# - other branches: the test APK goes to the "test-build" pre-release (always the newest one)
# - main: releases are synced with CHANGELOG.md (.github/scripts/releases.sh); the current app
#   version gets its APK, the live-update zip and update.json attached
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
      signed: ${{ steps.sign.outputs.signed == 'true' && steps.real.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - name: The committed index.html and fonts match the source
        run: git diff --exit-code --stat -- index.html fonts
      - id: ver
        run: node .github/scripts/version.mjs >> "$GITHUB_OUTPUT"
      - run: npx cap sync android
      - name: Test APK (HW App Test)
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug -PappVersionName=${{ steps.ver.outputs.version }} -PappVersionCode=${{ steps.ver.outputs.code }}
      # Checks the key before using it and reports problems as annotations (never the secrets themselves).
      - name: Signing key from secrets
        id: sign
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "signed=false" >> "$GITHUB_OUTPUT"
          if [ -z "$KS" ]; then echo "::warning::No ANDROID_KEYSTORE_BASE64 secret yet: only the test APK is built."; exit 0; fi
          [ -n "$PW" ] || { echo "::error::Secret ANDROID_KEYSTORE_PASSWORD is missing or empty."; exit 0; }
          [ -n "$ALIAS" ] || { echo "::error::Secret ANDROID_KEY_ALIAS is missing or empty."; exit 0; }
          printf '%s' "$KS" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/release.jks" 2>/dev/null \
            || { echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64 (copy the whole text from the PowerShell command again)."; exit 0; }
          size=$(stat -c %s "$RUNNER_TEMP/release.jks")
          echo "keystore file: $size bytes"
          if ! out=$(keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$PW" 2>&1); then
            msg=$(echo "$out" | grep -i "error\|exception" | head -1); msg=${msg//"$PW"/***}
            trimmed=$(printf '%s' "$PW" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            if [ "$trimmed" != "$PW" ] && keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$trimmed" >/dev/null 2>&1; then
              echo "::error::ANDROID_KEYSTORE_PASSWORD has an extra space or new line at the start/end. Edit the secret and paste the password without it."
            else
              echo "::error::The keystore can't be opened with ANDROID_KEYSTORE_PASSWORD ($size bytes): ${msg:-unknown error}. The password in the secret is not the one used when the keystore was created."
            fi
            exit 0
          fi
          aliases=$(echo "$out" | grep -i "PrivateKeyEntry" | cut -d, -f1 | tr '\n' ' ')
          if ! echo "$out" | grep -iq "^$ALIAS,"; then
            echo "::error::Alias from ANDROID_KEY_ALIAS not found in the keystore. The keystore has: ${aliases:-no keys}"
            exit 0
          fi
          echo "keystore OK, alias found"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Real APK (signed)
        id: real
        if: steps.sign.outputs.signed == 'true'
        continue-on-error: true
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon assembleRelease -PappVersionName=${{ steps.ver.outputs.version }} -PappVersionCode=${{ steps.ver.outputs.code }} 2>&1 | tee "$RUNNER_TEMP/release.log"; then
            why=$(grep -A6 "What went wrong" "$RUNNER_TEMP/release.log" | head -8 | tr '\n' ' '); why=${why//"$ANDROID_KEYSTORE_PASSWORD"/***}
            echo "::error::Real APK build failed: ${why:-see the log}"
            exit 1
          fi
      - name: Collect files
        env:
          V: ${{ steps.ver.outputs.version }}
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          rm -f "$RUNNER_TEMP/release.jks"
          mkdir dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/HW-App-Test-$V.apk"
          (cd www && zip -qrX "../dist/hw-app-web-$V.zip" .)
          if [ "$SIGNED" = "true" ] && [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "dist/HW-App-$V.apk"
            "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "dist/HW-App-$V.apk" | head -3 || true
          fi
          node .github/scripts/update-json.mjs "$V" > dist/update.json
          cat dist/update.json
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 30

  test-build:
    needs: build
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Update the "test-build" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          V: ${{ needs.build.outputs.version }}
        run: |
          gh release delete test-build --cleanup-tag --yes 2>/dev/null || true
          gh release create test-build --prerelease --target "$GITHUB_SHA" --title "Test build ($GITHUB_REF_NAME, $V)" \
            --notes "> **Test version, not for everyday use.** It installs as a separate app, **HW App Test**, next to the real one and has its own data. Built from branch \`$GITHUB_REF_NAME\`, commit ${GITHUB_SHA::7}. To install: download the .apk on the phone and open it (allow installing from your browser if Android asks)." \
            "dist/HW-App-Test-$V.apk"

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Sync releases with CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.build.outputs.version }}
          SIGNED: ${{ needs.build.outputs.signed }}
          DIST: dist
        run: .github/scripts/releases.sh
