name: Build and release
# On every push: build the website bundle, the test APK ("HW App Test") and, when the signing key
# secrets exist, the real APK (GitHub build, flavor "direct") and the Google Play bundle (.aab, flavor "play", 1.6.1).
# - other branches: the test APK goes to the "test-build" pre-release (always the newest one)
# - main: releases are synced with CHANGELOG.md (.github/scripts/releases.sh); the current app
#   version gets its APK, the live-update zip and update.json attached
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
      signed: ${{ steps.sign.outputs.signed == 'true' && steps.real.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Texts in every language match en.js (src/i18n/check.mjs)
        run: node src/i18n/check.mjs
      - run: npm run build
      - name: The committed index.html and fonts match the source
        run: git diff --exit-code --stat -- index.html fonts
      - id: ver
        run: node .github/scripts/version.mjs >> "$GITHUB_OUTPUT"
      - run: npx cap sync android
      - name: Test APK (HW App Test)
        working-directory: android
        # Job logs can't be read from Claude sessions, so a failure is reported as annotations (R8 errors, missing rules).
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon assembleDirectDebug -PappVersionName=${{ steps.ver.outputs.version }} -PappVersionCode=${{ steps.ver.outputs.code }} 2>&1 | tee "$RUNNER_TEMP/debug.log"; then
            echo "::error::$(grep -A12 'What went wrong' "$RUNNER_TEMP/debug.log" | head -14 | tr '\n' ' ' | cut -c1-1800)"
            echo "::error::$(grep -E '^ERROR|Missing class|R8:' "$RUNNER_TEMP/debug.log" | head -20 | tr '\n' ' ' | cut -c1-3000)"
            for f in $(find app/build/outputs/mapping -name missing_rules.txt 2>/dev/null); do echo "::error::missing_rules.txt: $(grep -v '^#' "$f" | tr '\n' ' ' | cut -c1-1500)"; done
            exit 1
          fi
      # Checks the key before using it and reports problems as annotations (never the secrets themselves).
      - name: Signing key from secrets
        id: sign
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "signed=false" >> "$GITHUB_OUTPUT"
          if [ -z "$KS" ]; then echo "::warning::No ANDROID_KEYSTORE_BASE64 secret yet: only the test APK is built."; exit 0; fi
          [ -n "$PW" ] || { echo "::error::Secret ANDROID_KEYSTORE_PASSWORD is missing or empty."; exit 0; }
          [ -n "$ALIAS" ] || { echo "::error::Secret ANDROID_KEY_ALIAS is missing or empty."; exit 0; }
          printf '%s' "$KS" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/release.jks" 2>/dev/null \
            || { echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64 (copy the whole text from the PowerShell command again)."; exit 0; }
          size=$(stat -c %s "$RUNNER_TEMP/release.jks")
          echo "keystore file: $size bytes"
          if ! out=$(keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$PW" 2>&1); then
            msg=$(echo "$out" | grep -i "error\|exception" | head -1); msg=${msg//"$PW"/***}
            trimmed=$(printf '%s' "$PW" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            if [ "$trimmed" != "$PW" ] && keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$trimmed" >/dev/null 2>&1; then
              echo "::error::ANDROID_KEYSTORE_PASSWORD has an extra space or new line at the start/end. Edit the secret and paste the password without it."
            else
              echo "::error::The keystore can't be opened with ANDROID_KEYSTORE_PASSWORD ($size bytes): ${msg:-unknown error}. The password in the secret is not the one used when the keystore was created."
            fi
            exit 0
          fi
          aliases=$(echo "$out" | grep -i "PrivateKeyEntry" | cut -d, -f1 | tr '\n' ' ')
          if ! echo "$out" | grep -iq "^$ALIAS,"; then
            echo "::error::Alias from ANDROID_KEY_ALIAS not found in the keystore. The keystore has: ${aliases:-no keys}"
            exit 0
          fi
          echo "keystore OK, alias found"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Real APK and Google Play bundle (signed)
        id: real
        if: steps.sign.outputs.signed == 'true'
        continue-on-error: true
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon assembleDirectRelease bundlePlayRelease -PappVersionName=${{ steps.ver.outputs.version }} -PappVersionCode=${{ steps.ver.outputs.code }} 2>&1 | tee "$RUNNER_TEMP/release.log"; then
            why=$(grep -A6 "What went wrong" "$RUNNER_TEMP/release.log" | head -8 | tr '\n' ' '); why=${why//"$ANDROID_KEYSTORE_PASSWORD"/***}
            echo "::error::Real APK build failed: ${why:-see the log}"
            exit 1
          fi
      - name: Collect files
        env:
          V: ${{ steps.ver.outputs.version }}
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          rm -f "$RUNNER_TEMP/release.jks"
          mkdir dist
          cp android/app/build/outputs/apk/direct/debug/app-direct-debug.apk "dist/HW-App-Test-$V.apk"
          tsigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$tsigner" verify "dist/HW-App-Test-$V.apk" || { echo "::error::test APK signature check failed"; exit 1; }
          (cd www && zip -qrX "../dist/hw-app-web-$V.zip" .)
          if [ "$SIGNED" = "true" ] && [ -f android/app/build/outputs/apk/direct/release/app-direct-release.apk ]; then
            cp android/app/build/outputs/apk/direct/release/app-direct-release.apk "dist/HW-App-$V.apk"
            signer=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
            cert=$("$signer" verify --print-certs "dist/HW-App-$V.apk" | grep -m2 "DN:\|SHA-256" | tr '\n' ' ')
            echo "::notice::Real APK $V signed. $cert"
            # 1.7.5: notifications stopped after R8 renamed the FCM receive path; check it is there by its real names
            dexdump=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)dexdump
            dx="$RUNNER_TEMP/dex"; rm -rf "$dx"; mkdir -p "$dx"; unzip -q -o "dist/HW-App-$V.apk" 'classes*.dex' -d "$dx"
            svc=$(for f in "$dx"/classes*.dex; do "$dexdump" "$f"; done | awk "/Class descriptor  : 'Lio\/capawesome\/capacitorjs\/plugins\/firebase\/messaging\/MessagingService;'/{on=1} on&&/Class descriptor/&&!/MessagingService;/{on=0} on" | grep -c "name          : 'onMessageReceived'\|name          : 'onNewToken'")
            all=$(for f in "$dx"/classes*.dex; do "$dexdump" "$f"; done | grep "Class descriptor")
            rm_=$(echo "$all" | grep -c "'Lcom/google/firebase/messaging/RemoteMessage;'")
            # 1.7.5: the real app must be built like the tested one (no renaming): Capacitor keeps its own names
            cap=$(echo "$all" | grep -c "'Lcom/getcapacitor/annotation/CapacitorPlugin;'\|'Lcom/getcapacitor/Plugin;'\|'Lcom/getcapacitor/annotation/Permission;'")
            if [ "$svc" -ge 2 ] && [ "$rm_" -ge 1 ] && [ "$cap" -ge 3 ]; then echo "::notice::Real APK keeps its real names like the test build (push receive path, Capacitor plugins and permissions)"; else echo "::error::R8 renamed code in the real APK (push methods $svc/2, RemoteMessage $rm_, Capacitor classes $cap/3)"; exit 1; fi
          fi
          # Google Play bundle (1.6.1): signed with the same key (Play's upload key = the app signing key Michael gives Play)
          aab=android/app/build/outputs/bundle/playRelease/app-play-release.aab
          if [ "$SIGNED" = "true" ] && [ -f "$aab" ]; then
            jarsigner -verify "$aab" >/dev/null || { echo "::error::Play bundle signature check failed"; exit 1; }
            fp=$(keytool -printcert -jarfile "$aab" | grep -m1 "SHA256:" | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f')
            cp "$aab" "dist/HW-App-$V-play.aab"
            if [ "$fp" = "40c63283d3dae2aef66eaf11106541505cb12127120d508b066d4ef676410e1c" ]; then
              echo "::notice::Google Play bundle $V signed with the release key ($fp)"
            else
              echo "::error::Google Play bundle $V is signed with an unexpected key: $fp"; exit 1
            fi
            # the merged manifest of the Play build: no APK installing; list the permissions as a notice
            mf=$(grep -l "uses-permission" $(find android/app/build/intermediates -path "*playRelease*" -name AndroidManifest.xml) | head -1)
            [ -n "$mf" ] || { echo "::error::merged Play manifest not found"; exit 1; }
            if grep -q "uses-permission.*REQUEST_INSTALL_PACKAGES" "$mf"; then echo "::error::the Play build still asks for REQUEST_INSTALL_PACKAGES ($mf): $(grep -m3 "uses-permission.*REQUEST_INSTALL_PACKAGES" "$mf" | tr -s ' ' | tr '\n' ' ')"; exit 1; fi
            dmf=$(grep -l "uses-permission" $(find android/app/build/intermediates -path "*directRelease*" -name AndroidManifest.xml) | head -1)
            grep -q "uses-permission.*REQUEST_INSTALL_PACKAGES" "$dmf" || { echo "::error::the GitHub APK lost REQUEST_INSTALL_PACKAGES (in-app APK updates)"; exit 1; }
            perms=$(grep -o 'uses-permission[^>]*android:name="[^"]*"' "$mf" | sed 's/.*android:name="//; s/"$//; s/android\.permission\.//' | sort -u | tr '\n' ' ')
            echo "::notice title=Google Play build permissions::$perms"
          fi
          node .github/scripts/update-json.mjs "$V" > dist/update.json
          cat dist/update.json
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 30

  test-build:
    needs: build
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Update the "test-build" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          V: ${{ needs.build.outputs.version }}
        run: |
          gh release delete test-build --cleanup-tag --yes 2>/dev/null || true
          gh release create test-build --prerelease --target "$GITHUB_SHA" --title "Test build ($GITHUB_REF_NAME, $V)" \
            --notes "> **Test version, not for everyday use.** It installs as a separate app, **HW App Test**, next to the real one and has its own data. Built from branch \`$GITHUB_REF_NAME\`, commit ${GITHUB_SHA::7}. To install: download the .apk on the phone and open it (allow installing from your browser if Android asks)." \
            "dist/HW-App-Test-$V.apk"

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Sync releases with CHANGELOG.md
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.build.outputs.version }}
          SIGNED: ${{ needs.build.outputs.signed }}
          DIST: dist
        run: .github/scripts/releases.sh
      # 1.6.5: "HW App x.y.z is out" to the GitHub app (topics upd-direct-<lang>), once, when its release is created.
      # The Google Play app gets it from the "Notify Google Play users" workflow after Google approved the version.
      - uses: actions/setup-node@v7
        if: steps.sync.outputs.created != ''
        with:
          node-version: 22
      - name: Notify the GitHub app about the new version
        if: steps.sync.outputs.created != ''
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node .github/scripts/notify-update.mjs direct "${{ steps.sync.outputs.created }}"
