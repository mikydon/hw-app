xInfo:"touche pour les infos",exReplacedBy:"D\xE9sactiv\xE9. Le jour {d} utilise \xE0 la place : {name}.",exCanDo:"Je peux faire : {name}",resetAll:"\u{1F9F9} Repartir de z\xE9ro",resetAllD:"Supprime s\xE9ances, XP, niveaux, s\xE9rie, rangs et badges. Le nom, la photo et les r\xE9glages restent.",resetAllTitle:"Repartir de z\xE9ro ?",resetAllBody:"Toutes tes s\xE9ances ({count}) seront supprim\xE9es, avec tout ce qui en d\xE9coule : XP, niveaux, s\xE9rie, gels, rangs et badges. Ton nom, ta photo et tes r\xE9glages restent. Impossible d'annuler, alors enregistre d'abord une sauvegarde si tu pourrais vouloir r\xE9cup\xE9rer les donn\xE9es.",resetAllBackup:"\u{1F4BE} D'abord une sauvegarde",resetAllYes:"Oui, tout supprimer",msgResetAll:"\u2713 C'est fait. Tu repars de z\xE9ro."},pl:{workouts:{one:"{n} s\xE9ance",many:"{n} s\xE9ances",other:"{n} s\xE9ances"},days:{one:"{n} jour",many:"{n} jours",other:"{n} jours"},daysAgo:{one:"il y a {n} jour",many:"il y a {n} jours",other:"il y a {n} jours"},rounds:{one:"{n} tour",many:"{n} tours",other:"{n} tours"},sets:{one:"{n} s\xE9rie",many:"{n} s\xE9ries",other:"{n} s\xE9ries"},prs:{one:"{n} record perso",many:"{n} records perso",other:"{n} records perso"},weeks:{one:"{n} semaine",many:"{n} semaines",other:"{n} semaines"},pushups:{one:"{n} pompe",many:"{n} pompes",other:"{n} pompes"},reps:{one:"{n} r\xE9p\xE9tition",many:"{n} r\xE9p\xE9titions",other:"{n} r\xE9p\xE9titions"},birthdays:{one:"{n} anniversaire",many:"{n} anniversaires",other:"{n} anniversaires"}},units:{arm:"/bras",leg:"/jambe",side:"/c\xF4t\xE9"},perUnit:{arm:"par bras",leg:"par jambe",side:"par c\xF4t\xE9"},themes:{navy:"Marine",black:"Noir",forest:"For\xEAt",plum:"Prune",ocean:"Oc\xE9an",wine:"Vin",slate:"Ardoise",coffee:"Caf\xE9"},ranks:["Bois","Fer","Bronze","Argent","Or","Platine","Diamant"],ex:{k1:{name:"Pompe",muscles:"Pectoraux, triceps, avant des \xE9paules",tempo:"3 s en descente, courte pause, remont\xE9e",how:"Mains un peu plus \xE9cart\xE9es que les \xE9paules, corps align\xE9 de la t\xEAte aux talons, abdos et fessiers contract\xE9s. Descends en 3 secondes jusqu'\xE0 ce que ta poitrine fr\xF4le le sol, marque une courte pause et repousse vers le haut. Garde les coudes \xE0 ~45\xB0 du corps, pas \xE9cart\xE9s sur les c\xF4t\xE9s.",tip:"D\xE8s que tu fais 25+ au premier tour, pose tes mains sur deux gros livres. Ta poitrine descend plus bas, le muscle s'\xE9tire davantage et se d\xE9veloppe plus. Les livres doivent \xEAtre stables et de m\xEAme hauteur pour ne pas glisser. Si tes \xE9paules font mal, descends moins bas.",lvl:"Pose tes mains sur deux gros livres pour que ta poitrine descende plus bas. Tes chiffres vont baisser au d\xE9but, c'est normal. Les livres doivent \xEAtre stables pour ne pas glisser."},row1:{name:"Rowing au cadre de porte",muscles:"Dos (grands dorsaux), arri\xE8re des \xE9paules, biceps",tempo:"1 s en tirant, 1 s de maintien, 3 s en revenant",how:"Place-toi dans l'embrasure d'une porte ouverte, de profil par rapport au cadre. Attrape le cadre d'une main \xE0 hauteur de poitrine, pieds tout pr\xE8s du cadre. Penche-toi en arri\xE8re, bras tendu et corps droit. Tire-toi vers le cadre : le coude part en arri\xE8re le long du corps, serre l'omoplate vers l'arri\xE8re. Reviens lentement. Fais toutes les r\xE9p\xE9titions d'un bras, puis de l'autre.",tip:"Plus tes pieds sont proches du cadre et plus tu te penches en arri\xE8re, plus c'est dur. Tiens le cadre solide, pas la porte, et entra\xEEne-toi pieds nus pour ne pas glisser.",lvl:"Rapproche tes pieds du cadre et penche-toi plus en arri\xE8re."},n1:{name:"Squat ATG",muscles:"Quadriceps, fessiers",tempo:"3 s en descente, 1 s de pause en bas, remont\xE9e",how:"Pieds \xE9cart\xE9s \xE0 largeur d'\xE9paules, pointes l\xE9g\xE8rement vers l'ext\xE9rieur. Descends en 3 secondes aussi bas que possible, cuisses sous les genoux, talons au sol. Tiens 1 seconde en bas et remonte.",tip:"Le tempo lent et la pause en bas rendent un squat facile difficile. Si tu fais 20+ m\xEAme avec le tempo, remplace-le par le Squat 1 et 1/4.",lvl:"Remplace-le par le Squat 1 et 1/4 (\u21C4 Remplacer)."},b5:{name:"Gainage (planche)",muscles:"Toute la sangle abdominale",how:"Avant-bras sous les \xE9paules, corps align\xE9 de la t\xEAte aux talons. Contracte abdos et fessiers comme si quelqu'un allait te donner un coup dans le ventre. Ne laisse pas tes hanches monter ni s'affaisser.",tip:"Quand tu tiens 60 s aux deux tours, remplace-la par la Planche sur une jambe. C'est bien plus dur.",lvl:"Remplace-la par la Planche sur une jambe (\u21C4 Remplacer)."},r1:{name:"Pompe pike",muscles:"\xC9paules, triceps",tempo:"3 s en descente, remont\xE9e",how:"Mets-toi en V invers\xE9 : mains au sol, hanches hautes, jambes aussi tendues que possible. Plie les coudes et descends le sommet de la t\xEAte vers le sol, juste devant tes mains, pour que tes mains et ta t\xEAte forment un triangle. Repousse vers le haut.",tip:"Quand tu fais 15+ aux deux tours, remplace-les par les Pompes pik\xE9 pieds sur une chaise. Plus de ton poids va sur les \xE9paules.",lvl:"Remplace-les par les Pompes pik\xE9 pieds sur une chaise (\u21C4 Remplacer)."},row2:{name:"Rowing \xE0 la porte avec serviette",muscles:"Milieu du dos, omoplates, biceps",tempo:"1 s en tirant, 1 s de maintien, 3 s en revenant",how:"Ouvre la porte et place-toi face \xE0 sa tranche, la porte entre tes pieds. Passe une serviette autour des deux poign\xE9es et tiens-en les extr\xE9mit\xE9s, ou attrape directement les deux poign\xE9es. Penche-toi en arri\xE8re, bras tendus et corps droit. Tire ta poitrine vers la tranche de la porte, serre les omoplates et redescends lentement.",tip:"V\xE9rifie d'abord que les poign\xE9es sont solides et ne bougent pas. Si quelque chose bouge, fais plut\xF4t le rowing au cadre de porte (jour A). La s\xE9curit\xE9 d'abord.",lvl:"Rapproche tes pieds de la porte et penche-toi plus en arri\xE8re."},n2:{name:"Squat bulgare",muscles:"Quadriceps, fessiers",tempo:"3 s en descente, remont\xE9e",how:"Dos \xE0 une chaise, pose le dessus de ton pied arri\xE8re sur l'assise. Fais un grand pas en avant avec le pied avant. Descends en 3 secondes, le genou arri\xE8re va vers le sol. Remonte en poussant dans le talon du pied avant.",tip:"Place ton pied avant assez loin pour que ton genou reste au-dessus du pied. Buste l\xE9g\xE8rement pench\xE9 en avant = plus de fessiers. Mets la chaise contre un mur pour qu'elle ne glisse pas sous ton pied.",lvl:"Ralentis : 4 s en descente et 2 s de pause en bas."},b2:{name:"Dead bug",muscles:"Abdominaux profonds",tempo:"lentement, 2 s pour tendre, 2 s pour revenir",how:"Allonge-toi sur le dos, bras tendus vers le plafond, jambes lev\xE9es, genoux \xE0 90\xB0. Descends lentement le bras droit derri\xE8re la t\xEAte et la jambe gauche vers le sol, puis reviens et change de c\xF4t\xE9.",tip:"Le bas du dos doit rester plaqu\xE9 au sol tout le temps. S'il se d\xE9colle, descends moins la jambe.",lvl:"Descends le bras et la jambe plus lentement : 3 s pour tendre, 3 s pour revenir."},k3:{name:"Pompe diamant",muscles:"Triceps, int\xE9rieur des pectoraux",tempo:"3 s en descente, remont\xE9e",how:"Place tes mains sous ta poitrine, pouces et index qui se touchent pour former un diamant. Descends, coudes vers l'arri\xE8re le long du corps. Ta poitrine va vers tes mains.",tip:"Si tes poignets ou tes coudes font mal, \xE9carte un peu les mains. Les pompes serr\xE9es travaillent presque autant les triceps. La version plus dure : Pompes diamant pieds sur une chaise, tu peux les remplacer par celles-ci.",lvl:"Remplace-les par les Pompes diamant pieds sur une chaise (\u21C4 Remplacer)."},row3:{name:"Rowing large au cadre de porte",muscles:"Arri\xE8re des \xE9paules, haut du dos",tempo:"1 s en tirant, 1 s de maintien, 3 s en revenant",how:"M\xEAme position que pour le rowing au cadre de porte, mais attrape le cadre \xE0 hauteur d'\xE9paule et tire le coude sur le c\xF4t\xE9, pas le long du corps. Ton bras et ton buste forment un T. Tu dois le sentir \xE0 l'arri\xE8re de l'\xE9paule et entre les omoplates.",tip:"Cet angle travaille l'arri\xE8re des \xE9paules et le haut du dos. Vu de dos, ce sont eux qui rendent tes \xE9paules plus larges et plus \xE9paisses.",lvl:"Rapproche tes pieds du cadre et penche-toi plus en arri\xE8re."},n7:{name:"Leg curl gliss\xE9 (serviette)",muscles:"Ischio-jambiers, fessiers",tempo:"3 s pour tendre, 1 s pour revenir",how:"Allonge-toi sur le dos sur un sol lisse (parquet, carrelage), talons sur une serviette ou en chaussettes. Monte les hanches en pont. Fais glisser tes jambes vers l'avant en 3 secondes jusqu'\xE0 ce qu'elles soient presque tendues, hanches toujours en l'air. Puis ram\xE8ne tes talons vers tes fessiers.",tip:"Sur la moquette ou \xE7a ne glisse pas ? Remplace-le par un pont classique.",lvl:"Fais-le sur une jambe, garde l'autre en l'air. Commence avec une amplitude plus courte. En cas de crampe ou si les hanches tombent, reviens \xE0 deux jambes."},b4:{name:"Crunch bicyclette",muscles:"Obliques, tous les abdos",tempo:"lentement, 1 s par c\xF4t\xE9",how:"Allonge-toi sur le dos, mains derri\xE8re la t\xEAte, \xE9paules d\xE9coll\xE9es du sol. Am\xE8ne le coude droit vers le genou gauche en tendant la jambe droite. Puis change. C'est le buste qui tourne, pas seulement les coudes.",tip:"Va lentement. Agiter vite les coudes ne sert \xE0 rien, \xE0 part tirer sur ta nuque.",lvl:"Ralentis \xE0 2 s par c\xF4t\xE9."},kKnee:{name:"Pompe sur les genoux",muscles:"Pectoraux, triceps, avant des \xE9paules",tempo:"3 s en descente, remont\xE9e",how:"\xC0 genoux, mains un peu plus \xE9cart\xE9es que les \xE9paules. Garde le corps align\xE9 des genoux \xE0 la t\xEAte, sans sortir les fesses. Descends la poitrine vers le sol en 3 secondes et repousse.",tip:"D\xE8s que tu en fais 20 aux deux tours, reviens \xE0 la pompe classique."},kIncl:{name:"Pompe inclin\xE9e",muscles:"Pectoraux, triceps, avant des \xE9paules",tempo:"3 s en descente, remont\xE9e",how:"Pose tes mains sur une table solide, un lit ou un rebord de fen\xEAtre. Garde le corps align\xE9 des talons \xE0 la t\xEAte. Descends la poitrine vers le bord et repousse. Plus l'appui est bas, plus c'est dur.",tip:"Un bon remplacement quand tes poignets font mal au sol ou que tu commences \xE0 manquer de force."},superman:{name:"Superman",muscles:"Bas du dos, fessiers, arri\xE8re des \xE9paules",tempo:"mont\xE9e, 2 s de maintien, descente",how:"Allonge-toi sur le ventre, bras tendus devant toi. D\xE9colle en m\xEAme temps les bras, la poitrine et les jambes du sol, tiens 2 secondes et redescends lentement. Regarde le sol, ne bascule pas la t\xEAte en arri\xE8re.",tip:"Ce n'est pas un tirage comme le rowing, mais \xE7a renforce ton dos quand tu n'as rien pour faire du rowing."},ytw:{name:"Y-T-W au sol",muscles:"Milieu et haut du dos, arri\xE8re des \xE9paules",tempo:"tiens chaque position 1 s",how:"Allonge-toi sur le ventre, front sur une serviette. L\xE8ve tes bras tendus en Y et tiens 1 s. Puis ouvre-les sur les c\xF4t\xE9s en T. Enfin, ram\xE8ne les coudes vers les c\xF4tes en W et serre les omoplates. Y + T + W = 1 r\xE9p\xE9tition.",tip:"Pouces vers le haut, garde les \xE9paules loin des oreilles."},lunge:{name:"Fente arri\xE8re",muscles:"Quadriceps, fessiers",tempo:"2 s en descente, remont\xE9e",how:"Debout, le buste droit. Fais un grand pas en arri\xE8re : le genou arri\xE8re descend presque au sol et le genou avant se plie \xE0 90\xB0. Pousse dans le talon du pied avant pour revenir debout. Fais toutes les r\xE9p\xE9titions d'une jambe, puis de l'autre.",tip:"Plus douce pour les genoux qu'une fente avant. Garde le buste droit."},bridge:{name:"Pont fessier",muscles:"Fessiers, ischio-jambiers",tempo:"mont\xE9e, 2 s de contraction, descente",how:"Allonge-toi sur le dos, genoux pli\xE9s, pieds au sol. Pousse dans les talons et monte les hanches jusqu'\xE0 ce que ton corps forme une ligne droite des genoux aux \xE9paules. Serre les fessiers 2 secondes en haut et redescends lentement.",tip:"La version plus dure est le Pont sur une jambe. Quand celui-ci devient facile, remplace-le par celui-l\xE0."},r1e:{name:"Pompes pik\xE9 pieds sur une chaise",muscles:"\xC9paules, triceps",tempo:"3 s en bas, en haut",how:"Pose les pieds sur une chaise, les mains au sol un peu devant, et monte les hanches pour que ton buste soit presque vertical. Plie les coudes et descends la t\xEAte vers le sol juste devant les mains, coudes vers l'arri\xE8re, pas sur les c\xF4t\xE9s. Repousse vers le haut.",tip:"Plus le buste est vertical, plus le poids va sur les \xE9paules. Serre les fessiers pour ne pas cambrer le bas du dos. La chaise doit \xEAtre stable, id\xE9alement contre un mur. Descends la t\xEAte lentement, ne tombe jamais dessus."},k3e:{name:"Pompes diamant pieds sur une chaise",muscles:"Triceps, int\xE9rieur des pectoraux, \xE9paules",tempo:"3 s en bas, en haut",how:"Pose les pieds sur une chaise et les mains sous la poitrine, pouces et index qui se touchent pour former un diamant. Corps align\xE9 de la t\xEAte aux talons. Descends, coudes vers l'arri\xE8re le long du corps, poitrine vers les mains. Repousse vers le haut.",tip:"Ne l\xE8ve pas les hanches et ne les laisse pas tomber. Si tes poignets ou tes coudes font mal, \xE9carte un peu les mains. La chaise doit \xEAtre stable, id\xE9alement contre un mur."},n1q:{name:"Squat 1 et 1/4",muscles:"Avant des cuisses, fessiers",tempo:"en bas, un quart en haut, en bas, en haut",how:"Pieds \xE0 largeur d'\xE9paules, pointes un peu vers l'ext\xE9rieur. Descends tout en bas, remonte seulement d'un quart, redescends tout en bas et seulement ensuite rel\xE8ve-toi. \xC7a fait 1 r\xE9p\xE9tition. Talons toujours au sol.",tip:"Les muscles passent deux fois par la partie la plus dure et la plus profonde du squat, d'o\xF9 la difficult\xE9. Ne te laisse pas tomber, descends avec contr\xF4le."},b5l:{name:"Planche sur une jambe",muscles:"Tout le gainage, fessiers",how:"Comme une planche normale : avant-bras sous les \xE9paules, corps align\xE9 de la t\xEAte aux talons. L\xE8ve une jambe tendue un peu du sol ; \xE0 mi-temps, repose-la et l\xE8ve l'autre. Garde les hanches \xE0 plat, sans les tourner.",tip:"Ne l\xE8ve pas la jambe haut, juste au-dessus du sol suffit. Le but est que les hanches ne bougent pas."},sbridge:{name:"Pont sur une jambe",muscles:"Fessiers, ischio-jambiers",tempo:"mont\xE9e, 2 s de contraction, descente",how:"Allonge-toi sur le dos, genoux pli\xE9s, pieds au sol. Tends une jambe en l'air et garde les cuisses l'une contre l'autre. Pousse dans le talon de la jambe au sol et monte les hanches jusqu'\xE0 ce que ton corps forme une ligne droite du genou aux \xE9paules. En haut, serre les fessiers 2 secondes et redescends lentement. D'abord toutes les r\xE9p\xE9titions d'une jambe, puis de l'autre.",tip:"Garde les hanches \xE0 niveau, ne les laisse pas tomber du c\xF4t\xE9 de la jambe lev\xE9e. Note le nombre pour une jambe : 10 \xE0 gauche + 10 \xE0 droite = note 10. En cas de crampe \xE0 l'arri\xE8re de la cuisse, reviens au pont sur deux jambes."},wallsit:{name:"Chaise (wall sit)",muscles:"Quadriceps",how:"Plaque ton dos contre un mur et descends jusqu'\xE0 ce que tes cuisses soient parall\xE8les au sol et tes genoux \xE0 90\xB0. Tout le dos contre le mur, genoux au-dessus des chevilles. Tiens.",tip:"Ne pose pas les mains sur tes cuisses, sinon tu t'aides."},birddog:{name:"Bird dog",muscles:"Sangle abdominale, bas du dos, fessiers",tempo:"tends, 2 s de maintien, reviens",how:"Mets-toi \xE0 quatre pattes : mains sous les \xE9paules, genoux sous les hanches. Tends en m\xEAme temps le bras droit vers l'avant et la jambe gauche vers l'arri\xE8re, corps align\xE9. Tiens 2 secondes, reviens et change de c\xF4t\xE9.",tip:"Tes hanches ne doivent pas tourner. Imagine un verre d'eau pos\xE9 sur le bas de ton dos."},hollow:{name:"Hollow body",muscles:"Toute la sangle abdominale",how:"Allonge-toi sur le dos, bras tendus derri\xE8re la t\xEAte. Plaque le bas du dos au sol et d\xE9colle un peu du sol les \xE9paules et les jambes tendues. Tiens sans bouger.",tip:"Si le bas de ton dos se d\xE9colle, l\xE8ve les jambes plus haut ou plie-les."},legraise:{name:"Relev\xE9 de jambes",muscles:"Bas des abdos, fl\xE9chisseurs de la hanche",tempo:"2 s en mont\xE9e, 2 s en descente",how:"Allonge-toi sur le dos, bras le long du corps. L\xE8ve lentement tes jambes tendues jusqu'\xE0 la verticale, puis redescends-les lentement presque jusqu'au sol, sans les poser. Le bas du dos reste au sol.",tip:"Si le bas du dos te fait mal, plie les genoux."}},warm:{w1:{name:"Moulinets de bras",dose:"15\xD7 vers l'avant, 15\xD7 vers l'arri\xE8re",why:"D\xE9lie tes \xE9paules avant les pompes et les rowings."},w2:{name:"Balanc\xE9s de jambe",dose:"10\xD7 par jambe, en te tenant au mur",why:"D\xE9lie tes hanches avant les squats."},w3:{name:"World's greatest stretch",dose:"5\xD7 par c\xF4t\xE9",why:"Hanches, haut du dos et ischios en m\xEAme temps."},w4:{name:"Chenille (inchworm)",dose:"5\xD7",why:"\xC9chauffe tout ton corps et t'am\xE8ne en position de planche."}},cool:{c1:{name:"Fl\xE9chisseur de hanche, gauche",why:"Rester beaucoup assis (\xE9cole, ordi) raccourcit l'avant des hanches. Si tu ne fais qu'un \xE9tirement, fais celui-l\xE0.",how:"Genou gauche au sol, pied droit devant. Serre les fessiers et avance les hanches jusqu'\xE0 sentir un \xE9tirement \xE0 l'avant de la hanche gauche. Ne creuse pas le bas du dos."},c2:{name:"Fl\xE9chisseur de hanche, droite",why:"Pareil de l'autre c\xF4t\xE9.",how:"Genou droit au sol, pied gauche devant. Serre les fessiers et avance les hanches."},c4:{name:"Cobra",why:"\xC9tire les abdos et l'avant des hanches. \xC7a compense tous les enroulements des exercices d'abdos.",how:"Allonge-toi sur le ventre, paumes sous les \xE9paules, coudes pr\xE8s du corps. Laisse les hanches au sol et pousse lentement avec les bras jusqu'\xE0 sentir un \xE9tirement agr\xE9able dans le ventre. Garde les \xE9paules basses, loin des oreilles ; les coudes n'ont pas besoin d'\xEAtre tendus. Si \xE7a pince dans le bas du dos, descends un peu."},c3:{name:"Posture de l'enfant",why:"Calme ta respiration et d\xE9tend ton dos. Juste pour le bien-\xEAtre.",how:"Genoux \xE9cart\xE9s, assieds tes fesses sur tes talons, tends les bras le plus loin possible devant toi, front au sol. Respire lentement."}},fig:{k1:["En haut","En bas, coudes \xE0 ~45\xB0 du corps"],k3:["En haut","En bas, coudes serr\xE9s"],b5:["Correct : corps droit","Incorrect : bas du dos qui s'affaisse"],n1:["D\xE9part","En bas, talons au sol"],r1:["En haut","En bas, t\xEAte devant les mains"],row1:["D\xE9part, bras tendu","Tirage, coude en arri\xE8re"],row3:["D\xE9part, main \xE0 hauteur d'\xE9paule","Coude sur le c\xF4t\xE9, \xE0 ~90\xB0 du corps"],row2:["D\xE9part, bras tendus","Poitrine vers la porte"],n2:["En haut","En bas, genou arri\xE8re vers le sol"],b2:["D\xE9part","Bras et jambe oppos\xE9e vers le bas"],n7:["Hanches en l'air, talons pr\xE8s des fessiers","Jambes gliss\xE9es, hanches toujours en l'air"],b4:["Coude vers le genou oppos\xE9","Change de c\xF4t\xE9"],kKnee:["En haut, genoux au sol","En bas, coudes \xE0 ~45\xB0 du corps"],kIncl:["Mains sur la table, en haut","Poitrine vers le bord, coudes \xE0 ~45\xB0 du corps"],superman:["Sur le ventre","D\xE9colle et tiens 2 s"],ytw:["Y : bras en diagonale vers l'avant","T : bras sur les c\xF4t\xE9s","W : coudes vers les c\xF4tes"],lunge:["D\xE9part","Pas en arri\xE8re, genou vers le sol"],bridge:["Sur le dos, genoux pli\xE9s","Hanches en haut, fessiers serr\xE9s"],sbridge:["Sur le dos, une jambe en l'air","Hanches en haut, fessiers serr\xE9s"],r1e:["En haut, pieds sur la chaise","En bas, t\xEAte devant les mains"],k3e:["En haut, pieds sur la chaise","En bas, coudes serr\xE9s"],n1q:["Tout en bas","Un quart en haut","De nouveau tout en bas","Seulement ensuite en haut"],b5l:["Une jambe en l'air","\xC0 mi-temps, change de jambe"],wallsit:["Genoux ~90\xB0, dos au mur"],birddog:["\xC0 quatre pattes : bras et genoux ~90\xB0","Bras et jambe oppos\xE9e"],hollow:["Bas du dos plaqu\xE9 au sol"],legraise:["Jambes en l'air","Descends lentement, sans les poser au sol"],hf:["Genou arri\xE8re au sol, hanches en avant"],cobra:["Hanches au sol, poitrine en haut"],child:["Fesses sur les talons, bras loin devant"]},ch:{w3:"Fais 3 s\xE9ances",pr1:"Bats un record perso",r3:"Fais 3 tours une fois",warm:"\xC9chauffement complet 2\xD7",cool:"\xC9tirements apr\xE8s une s\xE9ance 2\xD7",push100:"100 pompes au total (tous types)",rank:"Atteins un nouveau rang",reps300:"300 r\xE9p\xE9titions au total",legs100:"100 r\xE9p\xE9titions de jambes"},ach:{workouts:["S\xE9ances","{x}"],streak:["S\xE9rie","s\xE9rie de {x}"],records:["Records","{x}"],ranks:["Collectionneur de rangs","somme des rangs de tous les exercices : {n}"],weeks:["D\xE9fis de la semaine","{x} \xE0 100\xA0%"],level:["Niveau","niveau {n}"],rounds3:["Trois tours","{x} avec 3 tours"],pushups:["Pompes d'affil\xE9e","{x} en une s\xE9rie"],reps:["R\xE9p\xE9titions","{x} au total"],birthday:["Anniversaires","{x} avec l'appli"],calories:["Calories","{x} avec calories not\xE9es"]},news14:[["Menu","en bas une barre \xE0 3 onglets, le profil via la photo en haut \xE0 droite.","un seul menu \u2630 en haut \xE0 droite avec tout : Entra\xEEnement, Calories, Historique, Profil, R\xE9glages."],["S\xE9ance en arri\xE8re-plan","pendant la s\xE9ance, impossible d'aller ailleurs.","la s\xE9ance se r\xE9duit en petite fen\xEAtre en bas, le temps et les sons continuent, un toucher pour revenir."],["Compteur de r\xE9p\xE9titions","le nombre \xE9tait pr\xE9r\xE9gl\xE9 selon la derni\xE8re fois ou estim\xE9.","il part de 0 et affiche ton dernier r\xE9sultat avec un objectif +1."],["Dernier tour","1\u20132 r\xE9p\xE9titions en r\xE9serve.","jusqu'\xE0 l'\xE9chec technique : tant que chaque r\xE9p\xE9tition est propre."],["Calories","n'existaient pas.","un calculateur (perdre, garder, prendre) et un journal des repas. Les s\xE9ances de l'appli s'ajoutent toutes seules."],["Badges","15 badges : tu les avais ou non.","11 types avec niveaux Bois \u2192 Diamant et une barre de progression. Ce que tu avais reste."],["Anniversaire","rien.","avec ta date de naissance : surprise, confettis, un freeze en plus et un badge d'anniversaire."],["Planche","30 \u2013 75 s.","aussi 15 s."],["S\xE9curit\xE9","les versions plus dures sans avertissement.","des avertissements sur les \xE9tapes risqu\xE9es (crampe, hanches, chaise contre un mur, livres stables)."],["Astuces","n'existaient pas.","un jour sur deux, un \xAB Le savais-tu ? \xBB avec un bouton qui t'y emm\xE8ne."]],news141:["Le calculateur de calories demande \xAB Homme ou femme ? \xBB.","Les champs obligatoires ont un ast\xE9risque * ; pour la naissance, seule l'ann\xE9e est obligatoire."],news142:["\xAB Nouveaut\xE9s \xBB a des pages : la premi\xE8re est la grande mise \xE0 jour, glisse vers la gauche pour les petites.","Apr\xE8s une petite mise \xE0 jour, une carte sur l'accueil t'emm\xE8ne \xE0 sa page. Elle n'appara\xEEt que la premi\xE8re fois."],news10:[["Appli","un site dans le navigateur (Browser beta).","une vraie appli Android avec une ic\xF4ne sur l'\xE9cran d'accueil. Sur le site, elle est dans le menu \u2192 \u{1F4F1} Appli Android."],["Tes donn\xE9es","enregistr\xE9es dans le navigateur.","enregistr\xE9es dans l'appli. Transf\xE8re-les avec une sauvegarde : dans le navigateur R\xE9glages \u2192 Sauvegarder, dans l'appli R\xE9glages \u2192 Restaurer une sauvegarde."],["Mises \xE0 jour","nouvelle version \xE0 la prochaine visite.","les petites se t\xE9l\xE9chargent seules et s'activent au prochain d\xE9marrage ; pour une grosse, l'appli te montre o\xF9 r\xE9cup\xE9rer le nouvel APK."],["Sauvegarde","un fichier \xE9tait t\xE9l\xE9charg\xE9.","le menu Partager s'ouvre : enregistre-la dans Fichiers ou sur Google Drive, ou envoie-la-toi."],["Hors ligne","les polices venaient de Google, sans internet l'appli avait un autre look.","les polices sont dans l'appli, tout marche hors ligne."],["Bouton retour","\u2013","ferme une fen\xEAtre ou le menu ; pendant une s\xE9ance, il te ram\xE8ne \xE0 l'accueil et la s\xE9ance continue."],["Num\xE9ros de version","Browser beta 1.0.0 \xE0 1.4.2.","on recompte \xE0 partir de 1.0.0, la premi\xE8re version de l'appli."]],quotes:["La discipline t'emm\xE8ne l\xE0 o\xF9 la motivation ne peut pas aller.","Pas besoin d'en avoir envie. Fais juste la premi\xE8re s\xE9rie, le reste suit.","Chaque r\xE9p\xE9tition est une brique. Un corps se construit brique par brique.","13 minutes aujourd'hui. Un corps pour la vie.","Ne rate jamais deux fois de suite.","De petits pas un jour sur deux valent mieux que de grands plans jamais commenc\xE9s.","Ton futur toi te remerciera pour aujourd'hui.","Le but n'est pas la s\xE9ance parfaite. Le but, c'est d'\xEAtre l\xE0.","Quand \xE7a commence \xE0 br\xFBler, c'est l\xE0 que tu progresses.","Compare-toi seulement \xE0 la personne que tu \xE9tais la semaine derni\xE8re.","Pendant que les autres cherchent la motivation, ta s\xE9ance est d\xE9j\xE0 faite.","S\xE9ries dures, vie plus facile.","Toute personne forte a commenc\xE9 de z\xE9ro."],restDay:["Les muscles se construisent \xE0 l'entra\xEEnement, mais ils grandissent gr\xE2ce \xE0 la nourriture et au sommeil.","Aujourd'hui, c'est repos. \xC7a fait aussi partie du plan.","Se reposer, ce n'est pas \xEAtre paresseux. C'est maintenant que tu progresses.","Le travail est fait. Laisse maintenant ton corps se reconstruire.","Bien manger, bien dormir. \xC7a aussi, c'est de l'entra\xEEnement.","La force ne se construit pas en un jour. Elle se construit un jour sur deux, mois apr\xE8s mois.","Celui qui sait se reposer tient plus longtemps.","Aujourd'hui, tu recharges les batteries pour ta prochaine s\xE9ance.","La r\xE9gularit\xE9, c'est ton super-pouvoir. Garde-la.","Les progr\xE8s ne se voient pas toujours tout de suite. Mais ils sont l\xE0.","Sois fier de ne pas l\xE2cher.","Aujourd'hui appartient \xE0 la r\xE9cup\xE9ration. Profites-en.","De petits pas, beaucoup de jours d'affil\xE9e. C'est comme \xE7a qu'arrivent les grands changements."],doneTitles:["S\xE9ance du jour d\xE9j\xE0 faite","C'est bon pour aujourd'hui","Aujourd'hui, c'est coch\xE9","Mission accomplie !"],doneSubs:["Le jour {day} est boucl\xE9. Maintenant, mange et dors : tes muscles grandissent pendant le repos.","Le jour {day} est derri\xE8re toi. Beau travail, maintenant repose-toi.","Jour {day} boucl\xE9. Une brique de plus dans le mur.","Jour {day} enregistr\xE9. Ta prochaine s\xE9ance, c'est dans deux jours.","Jour {day} fait. Maintenant c'est ton corps qui bosse, profite du reste de la journ\xE9e.","Jour {day} assur\xE9. C'est comme \xE7a qu'on construit la discipline."],facts:["Tu peux t'entra\xEEner tous les jours, mais un jour sur deux, c'est l'id\xE9al. Les muscles grandissent pendant le repos, pas pendant l'entra\xEEnement.","Le sommeil est ton meilleur compl\xE9ment. 7\u20139 heures par nuit = r\xE9cup\xE9ration plus rapide.","Les derni\xE8res r\xE9p\xE9titions d'une s\xE9rie font le plus de travail. Ce sont elles qui construisent le muscle.","Une descente lente (3 secondes) donne plus de travail \xE0 tes muscles que des r\xE9p\xE9titions rapides.","Des prot\xE9ines \xE0 chaque repas aident tes muscles \xE0 grandir.","La r\xE9gularit\xE9 bat l'intensit\xE9. Mieux vaut 13 minutes un jour sur deux qu'une heure une fois par mois.","Bois un peu d'eau. M\xEAme une l\xE9g\xE8re soif fait baisser tes performances.","Respire lentement : inspire par le nez, expire par la bouche. Tu te calmeras plus vite.","Amplitude compl\xE8te = plus de muscle au travail. Moins de r\xE9p\xE9titions, mais compl\xE8tes."],moti:["Je crois en toi, tu vas y arriver ! \u{1F4AA}","Chaque s\xE9rie te rapproche de ton objectif.","Tu as plus de force que tu ne le crois.","Encore un peu, tu peux le faire.","Aujourd'hui compte. N'abandonne pas.","C'est maintenant que tu progresses.","Ton futur toi te remerciera."],cheers:["S\xE9rie solide !" idealmente {date}",copyAI:"Copia log per l'IA",dayRound:"Giorno {d}, giro {r} di {n}",quit:"Esci",quitSave:"Uscire e salvare?",quitConfirm:"Uscire davvero?",progressAria:"{done} di {total} completati",videoYT:"\u25B6 Video su YouTube",ladderTitle:"Ranghi (serie migliore: {v})",ladderNone:"Ranghi (serie migliore: ancora nessuna)",rankStart:"inizio",figureAria:"Disegno: {labels}",figBelly:"Linea gialla = lato della pancia",figTowel:"Linea arancione = asciugamano o panno resistente",figTowelSlide:"Arancione = asciugamano sotto i talloni, scivola sul pavimento",photoAlt:"Foto profilo",hide:"Nascondi",editWorkout:"\u270F\uFE0F Modifica",editTitle:"Modifica allenamento",addTitle:"Aggiungi allenamento",addWorkout:"\u2795 Aggiungi un allenamento a mano",addWorkoutD:"Per un allenamento fatto senza l'app o che hai dimenticato di salvare.",fDate:"Data",fDay:"Giorno",fRounds:"Giri",roundN:"Giro {r}",secondsUnit:"secondi",editHint:"Se non hai fatto un giro, lascia la casella vuota. Se non hai fatto per niente un esercizio, toglilo con \u2715.",removeEx:"Togli {name}",addEx:"\u2795 Aggiungi esercizio\u2026",editEmpty:"Inserisci almeno un numero, oppure elimina l'allenamento.",editBadDate:"Scegli una data che non sia nel futuro.",grp_push:"Spinta",grp_pull:"Trazione",grp_legs:"Gambe",grp_core:"Core",exMenu:"\u{1F3CB}\uFE0F Esercizi",exMenuD:"Come si fa ogni esercizio e quali puoi fare.",exTitle:"Esercizi",exIntro:"Tocca un esercizio per vedere come si fa. Disattiva quelli che non puoi fare (niente porta, niente sedia, dolore\u2026). L'app user\xE0 un altro esercizio dello stesso tipo, cos\xEC ogni allenamento avr\xE0 sempre spinta, trazione, gambe e core.",grpOn:"{on} su {n} attivi",grpLast:"Ne \xE8 rimasto solo uno, quindi sar\xE0 in ogni allenamento.",grpLastLock:"\xC8 l'ultimo esercizio di questo tipo, quindi deve restare attivo. Altrimenti questi muscoli non verrebbero allenati per niente.",exAlt:"alternativa",exInfo:"tocca per info",exReplacedBy:"Disattivato. Il giorno {d} usa al suo posto: {name}.",exCanDo:"Posso farlo: {name}",resetAll:"\u{1F9F9} Ricomincia da zero",resetAllD:"Elimina allenamenti, XP, livelli, serie, ranghi e badge. Nome, foto e impostazioni restano.",resetAllTitle:"Ricominciare da zero?",resetAllBody:"Verranno eliminati tutti i tuoi allenamenti ({count}) e tutto ci\xF2 che ne deriva: XP, livelli, la serie, i congelamenti, i ranghi e i badge. Nome, foto e impostazioni restano. Non si pu\xF2 annullare, quindi salva prima un backup se potresti volere di nuovo i dati.",resetAllBackup:"\u{1F4BE} Prima salva un backup",resetAllYes:"S\xEC, elimina tutto",msgResetAll:"\u2713 Fatto. Riparti da zero."},pl:{workouts:{one:"{n} allenamento",many:"{n} allenamenti",other:"{n} allenamenti"},days:{one:"{n} giorno",many:"{n} giorni",other:"{n} giorni"},daysAgo:{one:"{n} giorno fa",many:"{n} giorni fa",other:"{n} giorni fa"},rounds:{one:"{n} giro",many:"{n} giri",other:"{n} giri"},sets:{one:"{n} serie",many:"{n} serie",other:"{n} serie"},prs:{one:"{n} record personale",many:"{n} record personali",other:"{n} record personali"},weeks:{one:"{n} settimana",many:"{n} settimane",other:"{n} settimane"},pushups:{one:"{n} piegamento",many:"{n} piegamenti",other:"{n} piegamenti"},reps:{one:"{n} ripetizione",many:"{n} ripetizioni",other:"{n} ripetizioni"},birthdays:{one:"{n} compleanno",many:"{n} compleanni",other:"{n} compleanni"}},units:{arm:"/braccio",leg:"/gamba",side:"/lato"},perUnit:{arm:"per braccio",leg:"per gamba",side:"per lato"},themes:{navy:"Blu notte",black:"Nero",forest:"Foresta",plum:"Prugna",ocean:"Oceano",wine:"Vino",slate:"Ardesia",coffee:"Caff\xE8"},ranks:["Legno","Ferro","Bronzo","Argento","Oro","Platino","Diamante"],ex:{k1:{name:"Piegamento",muscles:"Petto, tricipiti, deltoidi anteriori",tempo:"3 s gi\xF9, breve pausa, su",how:"Mani un po' pi\xF9 larghe delle spalle, corpo dritto dalla testa ai talloni, addominali e glutei contratti. Scendi in 3 secondi finch\xE9 il petto quasi tocca il pavimento, fermati un attimo e spingi di nuovo su. Tieni i gomiti a ~45\xB0 dal corpo, non aperti verso l'esterno.",tip:"Quando arrivi a 25+ nel primo giro, appoggia le mani su due libri spessi. Il petto scende pi\xF9 in basso, il muscolo si allunga di pi\xF9 e cresce di pi\xF9. I libri devono essere stabili e della stessa altezza, cos\xEC non scivolano. Se ti fanno male le spalle, scendi meno.",lvl:"Appoggia le mani su due libri spessi cos\xEC il petto scende pi\xF9 in basso. All'inizio i tuoi numeri caleranno, \xE8 normale. I libri devono essere stabili, cos\xEC non scivolano."},row1:{name:"Rematore allo stipite",muscles:"Schiena (dorsali), deltoidi posteriori, bicipiti",tempo:"1 s su, 1 s tenuta, 3 s indietro",how:"Mettiti in una porta aperta, di fianco allo stipite. Afferra lo stipite con una mano all'altezza del petto, piedi proprio accanto allo stipite. Lasciati andare indietro con il braccio teso e il corpo dritto. Tirati verso lo stipite: il gomito va indietro lungo il corpo, stringi la scapola indietro. Torna lentamente. Fai tutte le ripetizioni con un braccio, poi con l'altro.",tip:"Pi\xF9 i piedi sono vicini allo stipite e pi\xF9 ti inclini indietro, pi\xF9 \xE8 difficile. Tieniti allo stipite solido, non alla porta, e allenati a piedi nudi cos\xEC non scivoli.",lvl:"Avvicina i piedi allo stipite e inclinati pi\xF9 indietro."},n1:{name:"Squat ATG",muscles:"Quadricipiti, glutei",tempo:"3 s gi\xF9, 1 s pausa in basso, su",how:"Piedi alla larghezza delle spalle, punte leggermente in fuori. Scendi in 3 secondi pi\xF9 in basso che puoi, cosce sotto le ginocchia, talloni a terra. Resta 1 secondo in basso e risali.",tip:"Il tempo lento e la pausa in basso rendono difficile uno squat facile. Se fai 20+ anche con il tempo, sostituiscilo con lo Squat 1 e 1/4.",lvl:"Sostituiscilo con lo Squat 1 e 1/4 (\u21C4 Cambia)."},b5:{name:"Plank",muscles:"Tutto il core",how:"Avambracci sotto le spalle, corpo dritto dalla testa ai talloni. Contrai addominali e glutei come se qualcuno stesse per darti un pugno nello stomaco. Non lasciare che i fianchi salgano o cedano.",tip:"Quando tieni 60 s in entrambi i giri, sostituiscilo con il Plank su una gamba. \xC8 molto pi\xF9 difficile.",lvl:"Sostituiscilo con il Plank su una gamba (\u21C4 Cambia)."},r1:{name:"Pike push-up",muscles:"Spalle, tricipiti",tempo:"3 s gi\xF9, su",how:"Mettiti a V rovesciata: mani a terra, fianchi alti, gambe pi\xF9 tese che puoi. Piega i gomiti e porta la sommit\xE0 della testa verso il pavimento appena davanti alle mani, cos\xEC mani e testa formano un triangolo. Spingi di nuovo su.",tip:"Quando fai 15+ in entrambi i giri, sostituiscili con i Piegamenti pike con piedi sulla sedia. Pi\xF9 peso va sulle spalle.",lvl:"Sostituiscili con i Piegamenti pike con piedi sulla sedia (\u21C4 Cambia)."},row2:{name:"Rematore alla porta con asciugamano",muscles:"Centro della schiena, scapole, bicipiti",tempo:"1 s su, 1 s tenuta, 3 s indietro",how:"Apri la porta e mettiti di fronte al suo bordo, con la porta tra i piedi. Passa un asciugamano attorno a entrambe le maniglie e tienine le estremit\xE0, oppure afferra direttamente le due maniglie. Lasciati andare indietro con le braccia tese e il corpo dritto. Porta il petto verso il bordo della porta, stringi le scapole e torna gi\xF9 lentamente.",tip:"Prima controlla che le maniglie siano solide e non si muovano. Se qualcosa si muove, fai invece il rematore allo stipite (giorno A). La sicurezza prima di tutto.",lvl:"Avvicina i piedi alla porta e inclinati pi\xF9 indietro."},n2:{name:"Squat bulgaro",muscles:"Quadricipiti, glutei",tempo:"3 s gi\xF9, su",how:"Mettiti davanti a una sedia e appoggia il dorso del piede posteriore sulla seduta. Fai un bel passo avanti con il piede anteriore. Scendi in 3 secondi, il ginocchio posteriore va verso il pavimento. Spingi su attraverso il tallone del piede anteriore.",tip:"Porta il piede anteriore abbastanza avanti da tenere il ginocchio sopra il piede. Busto leggermente inclinato in avanti = pi\xF9 glutei. Appoggia la sedia al muro, cos\xEC non scivola sotto il piede.",lvl:"Rallenta: 4 s gi\xF9 e 2 s di pausa in basso."},b2:{name:"Dead bug",muscles:"Addominali profondi",tempo:"lentamente, 2 s fuori, 2 s dentro",how:"Sdraiati sulla schiena, braccia tese verso il soffitto, gambe sollevate con le ginocchia a 90\xB0. Abbassa lentamente il braccio destro dietro la testa e la gamba sinistra verso il pavimento, poi torna e cambia lato.",tip:"La zona lombare deve restare schiacciata a terra per tutto il tempo. Se si solleva, non abbassare cos\xEC tanto la gamba.",lvl:"Abbassa braccio e gamba pi\xF9 lentamente, 3 s fuori e 3 s dentro."},k3:{name:"Piegamento a diamante",muscles:"Tricipiti, parte interna del petto",tempo:"3 s gi\xF9, su",how:"Metti le mani sotto il petto cos\xEC pollici e indici si toccano e formano un diamante. Scendi con i gomiti che vanno indietro lungo il corpo. Il petto va verso le mani.",tip:"Se ti fanno male i polsi o i gomiti, allarga un po' le mani. I piegamenti stretti lavorano i tricipiti quasi allo stesso modo. La versione pi\xF9 difficile sono i Piegamenti diamante con piedi sulla sedia, puoi sostituirli con quelli.",lvl:"Sostituiscili con i Piegamenti diamante con piedi sulla sedia (\u21C4 Cambia)."},row3:{name:"Rematore largo allo stipite",muscles:"Deltoidi posteriori, parte alta della schiena",tempo:"1 s su, 1 s tenuta, 3 s indietro",how:"Stessa posizione del rematore allo stipite, ma afferra lo stipite all'altezza della spalla e porta il gomito di lato, non lungo il corpo. Braccio e busto formano una T. Dovresti sentirlo dietro la spalla e tra le scapole.",tip:"Questo angolo allena i deltoidi posteriori e la parte alta della schiena. Rendono le spalle pi\xF9 larghe e piene viste da dietro.",lvl:"Avvicina i piedi allo stipite e inclinati pi\xF9 indietro."},n7:{name:"Leg curl con asciugamano",muscles:"Femorali, glutei",tempo:"3 s fuori, 1 s dentro",how:"Sdraiati sulla schiena su un pavimento liscio (parquet, piastrelle), talloni su un asciugamano o con i calzini. Solleva i fianchi in un ponte. Fai scivolare le gambe in avanti in 3 secondi finch\xE9 sono quasi tese, fianchi sempre su. Poi riporta i talloni verso i glutei.",tip:"Sei sul tappeto o non riesci a scivolare? Sostituiscilo con un ponte normale.",lvl:"Fallo con una gamba sola, tieni l'altra in aria. Inizia con un'escursione pi\xF9 corta. Se arriva un crampo o i fianchi cedono, torna a due gambe."},b4:{name:"Bicycle crunch",muscles:"Obliqui, tutti gli addominali",tempo:"lentamente, 1 s per lato",how:"Sdraiati sulla schiena, mani dietro la testa, spalle sollevate da terra. Porta il gomito destro verso il ginocchio sinistro mentre distendi la gamba destra. Poi cambia. Ruota il busto, non solo i gomiti.",tip:"Vai piano. Sbattere i gomiti in fretta non serve a niente, affatica solo il collo.",lvl:"Rallenta a 2 s per lato."},kKnee:{name:"Piegamento sulle ginocchia",muscles:"Petto, tricipiti, deltoidi anteriori",tempo:"3 s gi\xF9, su",how:"In ginocchio, mani un po' pi\xF9 larghe delle spalle. Tieni il corpo dritto dalle ginocchia alla testa, non spingere i fianchi indietro. Porta il petto verso il pavimento in 3 secondi e spingi di nuovo su.",tip:"Quando ne fai 20 in entrambi i giri, torna al piegamento normale."},kIncl:{name:"Piegamento inclinato",muscles:"Petto, tricipiti, deltoidi anteriori",tempo:"3 s gi\xF9, su",how:"Appoggia le mani su un tavolo robusto, un letto o un davanzale. Tieni il corpo dritto dai talloni alla testa. Porta il petto verso il bordo e spingi indietro. Pi\xF9 basso \xE8 l'appoggio, pi\xF9 \xE8 difficile.",tip:"Una buona alternativa quando ti fanno male i polsi a terra o stai finendo le forze."},superman:{name:"Superman",muscles:"Zona lombare, glutei, deltoidi posteriori",tempo:"su, 2 s tenuta, gi\xF9",how:"Sdraiati a pancia in gi\xF9 con le braccia tese davanti a te. Solleva braccia, petto e gambe da terra nello stesso momento, tieni 2 secondi e torna gi\xF9 lentamente. Guarda il pavimento, non piegare il collo all'indietro.",tip:"Non \xE8 una trazione come un rematore, ma rinforza la schiena quando non hai dove fare il rematore."},ytw:{name:"Y-T-W a terra",muscles:"Centro e parte alta della schiena, deltoidi posteriori",tempo:"tieni ogni posizione 1 s",how:"Sdraiati a pancia in gi\xF9, fronte su un asciugamano. Solleva le braccia tese a Y e tieni 1 s. Poi aprile di lato a T. Infine porta i gomiti verso le costole a W e stringi le scapole. Y + T + W = 1 ripetizione.",tip:"Pollici verso l'alto, tieni le spalle lontane dalle orecchie."},lunge:{name:"Affondo indietro",muscles:"Quadricipiti, glutei",tempo:"2 s gi\xF9, su",how:"In piedi, busto dritto. Fai un bel passo indietro, il ginocchio posteriore arriva quasi a terra e quello anteriore si piega a 90\xB0. Spingi attraverso il tallone del piede anteriore per tornare in piedi. Fai tutte le ripetizioni con una gamba, poi con l'altra.",tip:"Pi\xF9 delicato sulle ginocchia dell'affondo in avanti. Tieni il busto dritto."},bridge:{name:"Ponte glutei",muscles:"Glutei, femorali",tempo:"su, 2 s contrazione, gi\xF9",how:"Sdraiati sulla schiena, ginocchia piegate, piedi a terra. Spingi con i talloni e solleva i fianchi finch\xE9 il corpo forma una linea dritta dalle ginocchia alle spalle. Stringi i glutei per 2 secondi in alto e torna gi\xF9 lentamente.",tip:"La versione pi\xF9 difficile \xE8 il Ponte su una gamba. Quando questo ti sembra facile, sostituiscilo con quello."},r1e:{name:"Piegamenti pike con piedi sulla sedia",muscles:"Spalle, tricipiti",tempo:"3 s gi\xF9, su",how:"Metti i piedi su una sedia, le mani a terra un po' pi\xF9 avanti e porta i fianchi in alto, cos\xEC il busto \xE8 quasi verticale. Piega i gomiti e porta la testa verso terra appena davanti alle mani, gomiti indietro, non di lato. Spingi di nuovo su.",tip:"Pi\xF9 il busto \xE8 verticale, pi\xF9 peso va sulle spalle. Stringi i glutei per non inarcare la zona lombare. La sedia deve essere stabile, meglio contro il muro. Scendi con la testa piano, non caderci mai sopra."},k3e:{name:"Piegamenti diamante con piedi sulla sedia",muscles:"Tricipiti, petto interno, spalle",tempo:"3 s gi\xF9, su",how:"Metti i piedi su una sedia e le mani sotto il petto in modo che pollici e indici si tocchino formando un diamante. Corpo dritto dalla testa ai talloni. Scendi con i gomiti indietro lungo il corpo, petto verso le mani. Spingi di nuovo su.",tip:"Non alzare n\xE9 far cadere i fianchi. Se ti fanno male i polsi o i gomiti, allarga un po' le mani. La sedia deve essere stabile, meglio contro il muro."},n1q:{name:"Squat 1 e 1/4",muscles:"Parte anteriore delle cosce, glutei",tempo:"gi\xF9, un quarto su, gi\xF9, su",how:"Piedi alla larghezza delle spalle, punte leggermente in fuori. Scendi fino in fondo, risali solo di un quarto, scendi di nuovo fino in fondo e solo allora alzati. Questa \xE8 1 ripetizione. Talloni sempre a terra.",tip:"I muscoli passano due volte nella parte pi\xF9 dura e profonda dello squat, per questo \xE8 pi\xF9 difficile. Non lasciarti cadere, scendi con controllo."},b5l:{name:"Plank su una gamba",muscles:"Tutto il core, glutei",how:"Come un plank normale: avambracci sotto le spalle, corpo dritto dalla testa ai talloni. Solleva una gamba tesa poco da terra; a met\xE0 tempo appoggiala e solleva l'altra. Fianchi in linea, non ruotarli.",tip:"Non sollevare troppo la gamba, basta staccarla da terra. L'importante \xE8 che i fianchi non si muovano."},sbridge:{name:"Ponte su una gamba",muscles:"Glutei, femorali",tempo:"su, 2 s contrazione, gi\xF9",how:"Sdraiati sulla schiena, ginocchia piegate, piedi a terra. Distendi una gamba in aria e tieni le cosce vicine. Spingi con il tallone della gamba a terra e solleva i fianchi finch\xE9 il corpo forma una linea retta dal ginocchio alle spalle. In alto stringi i glutei per 2 secondi e scendi piano. Prima tutte le ripetizioni con una gamba, poi con l'altra.",tip:"Tieni i fianchi in linea, non lasciarli cadere dal lato della gamba sollevata. Registra il numero di una gamba: 10 sinistra + 10 destra = scrivi 10. Se arriva un crampo al femorale, torna al ponte su due gambe."},wallsit:{name:"Wall sit",muscles:"Quadricipiti",how:"Appoggia la schiena al muro e scivola gi\xF9 finch\xE9 le cosce sono parallele al pavimento e le ginocchia a 90\xB0. Tutta la schiena sul muro, ginocchia sopra le caviglie. Tieni.",tip:"Non appoggiare le mani sulle cosce, altrimenti ti aiuti."},birddog:{name:"Bird dog",muscles:"Core, zona lombare, glutei",tempo:"allunga, 2 s tenuta, torna",how:"Mettiti a quattro zampe: mani sotto le spalle, ginocchia sotto i fianchi. Allunga il braccio destro in avanti e la gamba sinistra indietro nello stesso momento, corpo in linea retta. Tieni 2 secondi, torna e cambia lato.",tip:"I fianchi non devono ruotare. Immagina un bicchiere d'acqua sulla zona lombare."},hollow:{name:"Hollow body hold",muscles:"Tutto il core",how:"Sdraiati sulla schiena con le braccia tese dietro la testa. Schiaccia la zona lombare a terra e solleva un po' le spalle e le gambe tese dal pavimento. Tieni senza muoverti.",tip:"Se la zona lombare si stacca da terra, alza di pi\xF9 le gambe o piegale."},legraise:{name:"Leg raise",muscles:"Addominali bassi, flessori dell'anca",tempo:"2 s su, 2 s gi\xF9",how:"Sdraiati sulla schiena, braccia lungo i fianchi. Solleva lentamente le gambe tese finch\xE9 sono verticali e abbassale lentamente quasi fino a terra, ma senza appoggiarle. La zona lombare resta a terra.",tip:"Se ti fa male la zona lombare, piega le ginocchia."}},warm:{w1:{name:"Circonduzioni delle braccia",dose:"15\xD7 avanti, 15\xD7 indietro",why:"Scioglie le spalle prima di piegamenti e rematori."},w2:{name:"Slanci delle gambe",dose:"10\xD7 per gamba, tieniti a un muro",why:"Scioglie i fianchi prima degli squat."},w3:{name:"World's greatest stretch",dose:"5\xD7 per lato",why:"Anche, parte alta della schiena e femorali in un colpo solo."},w4:{name:"Inchworm",dose:"5\xD7",why:"Scalda tutto il corpo e ti porta in plank."}},cool:{c1:{name:"Flessori dell'anca, sinistra",why:"Stare molto seduti (scuola, computer) accorcia la parte anteriore delle anche. Se fai un solo allungamento, fai questo.",how:"Appoggia il ginocchio sinistro a terra, piede destro davanti. Stringi i glutei e porta i fianchi in avanti finch\xE9 senti l'allungamento davanti all'anca sinistra. Non inarcare la zona lombare."},c2:{name:"Flessori dell'anca, destra",why:"Lo stesso dall'altro lato.",how:"Appoggia il ginocchio destro a terra, piede sinistro davanti. Stringi i glutei e porta i fianchi in avanti."},c4:{name:"Cobra",why:"Allunga l'addome e la parte anteriore delle anche. Bilancia tutto l'arrotolarsi degli esercizi per l'addome.",how:"Sdraiati a pancia in gi\xF9, mani sotto le spalle, gomiti vicini al corpo. Lascia i fianchi a terra e spingi piano con le braccia verso l'alto finch\xE9 senti un allungamento piacevole sull'addome. Spalle basse, lontane dalle orecchie; i gomiti non devono essere del tutto tesi. Se senti fastidio nella zona lombare, scendi un po'."},c3:{name:"Posizione del bambino",why:"Calma il respiro e rilassa la schiena. Solo per stare bene.",how:"Ginocchia divaricate, siediti con i fianchi sui talloni, allunga le braccia in avanti pi\xF9 che puoi, fronte a terra. Respira lentamente."}},fig:{k1:["Su","Gi\xF9, gomiti a ~45\xB0 dal corpo"],k3:["Su","Gi\xF9, gomiti stretti"],b5:["Giusto: corpo dritto","Sbagliato: zona lombare che cede"],n1:["Inizio","Gi\xF9, talloni a terra"],r1:["Su","Gi\xF9, testa davanti alle mani"],row1:["Inizio, braccio teso","Tira, gomito indietro"],row3:["Inizio, mano all'altezza della spalla","Gomito di lato, a ~90\xB0 dal corpo"],row2:["Inizio, braccia tese","Petto verso la porta"],n2:["Su","Gi\xF9, ginocchio posteriore verso terra"],b2:["Inizio","Braccio e gamba opposta gi\xF9"],n7:["Fianchi su, talloni vicino ai glutei","Gambe in avanti, fianchi sempre su"],b4:["Gomito al ginocchio opposto","Cambia lato"],kKnee:["Su, ginocchia a terra","Gi\xF9, gomiti a ~45\xB0 dal corpo"],kIncl:["Mani sul tavolo, su","Petto verso il bordo, gomiti a ~45\xB0 dal corpo"],superman:["A pancia in gi\xF9","Solleva e tieni 2 s"],ytw:["Y: braccia in diagonale avanti","T: braccia ai lati","W: gomiti verso le costole"],lunge:["Inizio","Passo indietro, ginocchio verso terra"],bridge:["Sdraiati, ginocchia piegate","Fianchi su, stringi i glutei"],sbridge:["Sdraiati, una gamba su","Fianchi su, stringi i glutei"],r1e:["Su, piedi sulla sedia","Gi\xF9, testa davanti alle mani"],k3e:["Su, piedi sulla sedia","Gi\xF9, gomiti stretti"],n1q:["Fino in fondo","Un quarto su","Di nuovo fino in fondo","Solo allora su"],b5l:["Una gamba su","A met\xE0 tempo cambia gamba"],wallsit:["Ginocchia ~90\xB0, schiena al muro"],birddog:["A quattro zampe: braccia e ginocchia ~90\xB0","Braccio e gamba opposta"],hollow:["Zona lombare schiacciata a terra"],legraise:["Gambe su","Abbassa piano, senza appoggiarle a terra"],hf:["Ginocchio dietro a terra, fianchi avanti"],cobra:["Fianchi a terra, petto su"],child:["Fianchi sui talloni, braccia ben avanti"]},ch:{w3:"Fai 3 allenamenti",pr1:"Batti un record personale",r3:"Fai 3 giri una volta",warm:"Riscaldamento completo 2\xD7",cool:"Stretching dopo l'allenamento 2\xD7",push100:"100 piegamenti in totale (di ogni tipo)",rank:"Raggiungi un nuovo rango",reps300:"300 ripetizioni in totale",legs100:"100 ripetizioni per le gambe"},ach:{workouts:["Allenamenti","{x}"],streak:["Serie di giorni","serie di {x}"],records:["Record","{x}"],ranks:["Collezionista di ranghi","somma dei ranghi in tutti gli esercizi: {n}"],weeks:["Sfide settimanali","{x} al 100%"],level:["Livello","livello {n}"],rounds3:["Tre giri","{x} con 3 giri"],pushups:["Piegamenti di fila","{x} in una serie"],reps:["Ripetizioni","{x} in totale"],birthday:["Compleanni","{x} con l'app"],calories:["Calorie","{x} con calorie registrate"]},news14:[["Menu","in basso una barra con 3 schede, il profilo dalla foto in alto a destra.","un unico menu \u2630 in alto a destra con tutto: Allenamento, Calorie, Storico, Profilo, Impostazioni."],["Allenamento in sottofondo","durante l'allenamento non potevi andare altrove.","l'allenamento si riduce a una finestrella in basso, tempo e suoni continuano, un tocco per tornare."],["Contatore ripetizioni","il numero era impostato in anticipo in base all'ultima volta o stimato.","parte da 0 e mostra l'ultimo risultato con un obiettivo +1."],["Ultimo giro","1\u20132 ripetizioni di riserva.","fino al cedimento tecnico: finch\xE9 ogni ripetizione \xE8 pulita."],["Calorie","non c'erano.","un calcolatore (dimagrire, mantenere, aumentare) e un diario dei pasti. Gli allenamenti dell'app si aggiungono da soli."],["Badge","15 badge: o li avevi o no.","11 tipi con livelli Legno \u2192 Diamante e una barra di quanto manca. Quello che avevi resta."],["Compleanno","niente.","con la data di nascita: sorpresa, coriandoli, un freeze in pi\xF9 e un badge di compleanno."],["Plank","30 \u2013 75 s.","anche 15 s."],["Sicurezza","le versioni pi\xF9 difficili senza avvisi.","avvisi nei passaggi rischiosi (crampi, fianchi, sedia contro il muro, libri stabili)."],["Consigli","non c'erano.","a giorni alterni un \xABLo sapevi?\xBB con un pulsante che ti porta l\xEC."]],news141:["Il calcolatore di calorie chiede \xABUomo o donna?\xBB.","I campi obbligatori hanno un asterisco *; della data di nascita \xE8 obbligatorio solo l'anno."],news142:["\xABNovit\xE0\xBB ha pi\xF9 pagine: la prima \xE8 il grande aggiornamento, scorri a sinistra per quelli piccoli.","Dopo un piccolo aggiornamento, una scheda nella home ti porta alla sua pagina. Compare solo la prima volta."],news10:[["App","un sito nel browser (Browser beta).","una vera app Android con l'icona nella schermata Home. Sul sito la trovi nel menu \u2192 \u{1F4F1} App per Android."],["I tuoi dati","salvati nel browser.","salvati nell'app. Spostali con un backup: nel browser Impostazioni \u2192 Salva backup, nell'app Impostazioni \u2192 Ripristina da backup."],["Aggiornamenti","nuova versione alla prossima apertura del sito.","quelli piccoli si scaricano da soli e partono al prossimo avvio; per uno grande l'app ti mostra dove scaricare il nuovo APK."],["Backup","si scaricava un file.","si apre il menu Condividi: salvalo in File o su Google Drive, oppure invialo a te stesso."],["Offline","i font arrivavano da Google, senza internet l'app sembrava diversa.","i font sono nell'app, tutto funziona offline."],["Tasto indietro","\u2013","chiude una finestra o il menu; durante l'allenamento ti riporta alla home e l'allenamento continua."],["Numeri di versione","Browser beta da 1.0.0 a 1.4.2.","si riparte da 1.0.0, la prima versione dell'app."]],quotes:["La disciplina ti porta dove la motivazione non arriva.","Non serve averne voglia. Fai solo la prima serie, il resto viene da s\xE9.","Ogni ripetizione \xE8 un mattone. Un fisico si costruisce mattone dopo mattone.","13 minuti oggi. Un fisico per la vita.","Mai saltare due volte di fila.","Piccoli passi a giorni alterni battono grandi piani mai iniziati.","Il te del futuro ti ringrazier\xE0 per oggi.","Non conta l'allenamento perfetto. Conta esserci.","Dove inizia a bruciare, inizia la crescita.","Confrontati solo con chi eri la settimana scorsa.","Mentre gli altri cercano la motivazione, tu hai gi\xE0 finito l'allenamento.","Serie dure, vita pi\xF9 facile.","Ogni persona forte \xE8 partita da zero."],restDay:["I muscoli si costruiscono con l'allenamento, ma crescono con il cibo e il sonno.","Oggi si riposa. Anche questo fa parte del piano.","Riposare non \xE8 pigrizia. \xC8 adesso che cresci.","Il lavoro \xE8 fatto. Ora lascia che il corpo si ricostruisca.","Mangia bene, dormi bene. Anche questo \xE8 allenamento.","La forza non si costruisce in un giorno. Si costruisce a giorni alterni, mese dopo mese.","Chi sa riposare dura di pi\xF9.","Oggi ricarichi le batterie per il prossimo allenamento.","La costanza \xE8 il tuo superpotere. Tienila stretta.","I progressi non si vedono sempre subito. Ma ci sono.","Sii orgoglioso di non mollare.","Oggi \xE8 il giorno del recupero. Goditelo.","Piccoli passi, tanti giorni di fila. \xC8 cos\xEC che arrivano i grandi cambiamenti."],doneTitles:["Allenamento di oggi gi\xE0 fatto","Per oggi \xE8 fatta","Oggi \xE8 spuntato","Missione compiuta!"],doneSubs:["Il giorno {day} \xE8 completato. Ora mangia e dormi: i muscoli crescono mentre riposi.","Il giorno {day} \xE8 alle spalle. Bel lavoro, ora riposati.","Giorno {day} fatto. Un altro mattone nel muro.","Giorno {day} registrato. Il prossimo allenamento \xE8 tra due giorni.","Giorno {day} completato. Ora lavora il tuo corpo, tu goditi il resto della giornata.","Giorno {day} superato. Cos\xEC si costruisce la disciplina."],facts:["Puoi allenarti ogni giorno, ma a giorni alterni \xE8 meglio. I muscoli crescono mentre riposi, non mentre ti alleni.","Il sonno \xE8 il tuo integratore migliore. 7\u20139 ore a notte = recupero pi\xF9 rapido.","Le ultime ripetizioni di una serie fanno il lavoro pi\xF9 grosso. Sono quelle che costruiscono muscolo.","Una discesa lenta (3 secondi) d\xE0 ai muscoli pi\xF9 lavoro delle ripetizioni veloci.","Le proteine a ogni pasto aiutano i muscoli a crescere.","La costanza batte l'intensit\xE0. Meglio 13 minuti a giorni alterni che un'ora una volta al mese.","Bevi un po' d'acqua. Anche una leggera sete abbassa la tua prestazione.","Respira lentamente: dentro dal naso, fuori dalla bocca. Ti calmi prima.","Movimento completo = pi\xF9 muscoli al lavoro. Meno ripetizioni, ma complete."],moti:["Credo in te, ce la fai! \u{1F4AA}","Ogni serie ti avvicina al tuo obiettivo.","Sei pi\xF9 forte di quanto pensi.","Ancora un po', puoi farcela.","Oggi conta. Non mollare.","\xC8 questo il momento in cui cresci.","Il te del futuro ti ringrazier\xE0."],cheers:["Serie potente!","Cos\xEC si fa!","Modalit\xE0 bestia!","Sei on fire!","Lavoro pulito!","Questa \xE8 la strada per un fisico forte.","Ci sei quasi!"],finish:["Un altro mattone nel muro. Cos\xEC si fa.","Fatto. Ora mangia bene e dormi, \xE8 l\xEC che crescono i muscoli.","La forza non \xE8 talento. \xC8 la somma di giorni esattamente come questo.",  passar de 25 na primeira rodada, apoie as m\xE3os em dois livros grossos. O peito desce mais, o m\xFAsculo alonga mais e cresce mais. Os livros devem ser firmes e da mesma altura para n\xE3o escorregar. Se os ombros doerem, des\xE7a menos.",lvl:"Apoie as m\xE3os em dois livros grossos para o peito descer mais. No come\xE7o seus n\xFAmeros v\xE3o cair, tudo bem. Os livros devem ser firmes para n\xE3o escorregar."},row1:{name:"Remada no batente da porta",muscles:"Costas (dorsais), ombros (parte de tr\xE1s), b\xEDceps",tempo:"1 s subindo, 1 s segurando, 3 s voltando",how:"Fique numa porta aberta, de lado para o batente. Segure o batente com uma m\xE3o na altura do peito, com os p\xE9s bem colados ao batente. Incline-se para tr\xE1s com o bra\xE7o esticado e o corpo reto. Puxe-se at\xE9 o batente: o cotovelo vai para tr\xE1s rente ao corpo, aperte a esc\xE1pula para tr\xE1s. Volte devagar. Fa\xE7a todas as repeti\xE7\xF5es com um bra\xE7o, depois com o outro.",tip:"Quanto mais perto do batente estiverem os p\xE9s e quanto mais voc\xEA inclinar para tr\xE1s, mais dif\xEDcil fica. Segure o batente firme, n\xE3o a porta, e treine descal\xE7o para os p\xE9s n\xE3o escorregarem.",lvl:"Aproxime os p\xE9s do batente e incline-se mais para tr\xE1s."},n1:{name:"Agachamento ATG",muscles:"Coxa (parte da frente), gl\xFAteos",tempo:"3 s descendo, 1 s de pausa embaixo, sobe",how:"P\xE9s na largura dos ombros, pontas levemente para fora. Des\xE7a em 3 segundos o mais fundo que conseguir, coxas abaixo dos joelhos, calcanhares no ch\xE3o. Segure 1 segundo l\xE1 embaixo e suba.",tip:"O ritmo lento e a pausa embaixo tornam um agachamento f\xE1cil em dif\xEDcil. Se fizer 20+ mesmo com o ritmo, troque pelo Agachamento 1 e 1/4.",lvl:"Troque pelo Agachamento 1 e 1/4 (\u21C4 Trocar)."},b5:{name:"Prancha",muscles:"Core inteiro",how:"Antebra\xE7os embaixo dos ombros, corpo reto da cabe\xE7a aos calcanhares. Contraia o abd\xF4men e os gl\xFAteos como se algu\xE9m fosse dar um soco na sua barriga. N\xE3o deixe o quadril subir nem cair.",tip:"Quando segurar 60 s nas duas rodadas, troque pela Prancha com uma perna. \xC9 bem mais dif\xEDcil.",lvl:"Troque pela Prancha com uma perna (\u21C4 Trocar)."},r1:{name:"Flex\xE3o pike",muscles:"Ombros, tr\xEDceps",tempo:"3 s descendo, sobe",how:"Fa\xE7a um V invertido: m\xE3os no ch\xE3o, quadril alto, pernas o mais esticadas poss\xEDvel. Dobre os cotovelos e des\xE7a o topo da cabe\xE7a at\xE9 o ch\xE3o, logo \xE0 frente das m\xE3os, de modo que m\xE3os e cabe\xE7a formem um tri\xE2ngulo. Empurre de volta para cima.",tip:"Quando fizer 15+ nas duas rodadas, troque pela Flex\xE3o pike com p\xE9s na cadeira. Mais do seu peso vai para os ombros.",lvl:"Troque pela Flex\xE3o pike com p\xE9s na cadeira (\u21C4 Trocar)."},row2:{name:"Remada na porta com toalha",muscles:"Meio das costas, esc\xE1pulas, b\xEDceps",tempo:"1 s subindo, 1 s segurando, 3 s voltando",how:"Abra a porta e fique de frente para a borda dela, com a porta entre os p\xE9s. Passe uma toalha em volta das duas ma\xE7anetas e segure as pontas, ou segure as duas ma\xE7anetas direto. Incline-se para tr\xE1s com os bra\xE7os esticados e o corpo reto. Puxe o peito at\xE9 a borda da porta, aperte as esc\xE1pulas e des\xE7a devagar.",tip:"Antes, confira se as ma\xE7anetas est\xE3o firmes e n\xE3o se mexem. Se algo se mexer, fa\xE7a a remada no batente (dia A) no lugar. Seguran\xE7a em primeiro lugar.",lvl:"Aproxime os p\xE9s da porta e incline-se mais para tr\xE1s."},n2:{name:"Agachamento b\xFAlgaro",muscles:"Coxa (parte da frente), gl\xFAteos",tempo:"3 s descendo, sobe",how:"Fique de costas para uma cadeira e apoie o peito do p\xE9 de tr\xE1s no assento. D\xEA um passo grande \xE0 frente com o p\xE9 da frente. Des\xE7a em 3 segundos, com o joelho de tr\xE1s indo em dire\xE7\xE3o ao ch\xE3o. Suba empurrando pelo calcanhar do p\xE9 da frente.",tip:"Coloque o p\xE9 da frente longe o bastante para o joelho ficar acima do p\xE9. Inclinar o tronco um pouco para a frente = mais gl\xFAteo. Encoste a cadeira na parede para ela n\xE3o deslizar sob o p\xE9.",lvl:"V\xE1 mais devagar: 4 s descendo e 2 s de pausa embaixo."},b2:{name:"Dead bug",muscles:"M\xFAsculos profundos do abd\xF4men",tempo:"devagar, 2 s indo, 2 s voltando",how:"Deite de barriga para cima, bra\xE7os esticados para o teto, pernas elevadas com os joelhos a 90\xB0. Des\xE7a devagar o bra\xE7o direito para tr\xE1s da cabe\xE7a e a perna esquerda em dire\xE7\xE3o ao ch\xE3o, depois volte e troque de lado.",tip:"A lombar tem que ficar colada no ch\xE3o o tempo todo. Se ela levantar, n\xE3o des\xE7a tanto a perna.",lvl:"Des\xE7a o bra\xE7o e a perna mais devagar, 3 s indo e 3 s voltando."},k3:{name:"Flex\xE3o diamante",muscles:"Tr\xEDceps, parte interna do peito",tempo:"3 s descendo, sobe",how:"Coloque as m\xE3os embaixo do peito, com os polegares e os indicadores se tocando e formando um diamante. Des\xE7a com os cotovelos indo para tr\xE1s rente ao corpo. O peito vai em dire\xE7\xE3o \xE0s m\xE3os.",tip:"Se os punhos ou cotovelos doerem, afaste um pouco as m\xE3os. A flex\xE3o fechada trabalha o tr\xEDceps quase igual. A vers\xE3o mais dif\xEDcil \xE9 a Flex\xE3o diamante com p\xE9s na cadeira; voc\xEA pode trocar por ela.",lvl:"Troque pela Flex\xE3o diamante com p\xE9s na cadeira (\u21C4 Trocar)."},row3:{name:"Remada aberta no batente",muscles:"Ombros (parte de tr\xE1s), parte de cima das costas",tempo:"1 s subindo, 1 s segurando, 3 s voltando",how:"Mesma posi\xE7\xE3o da remada no batente, mas segure o batente na altura do ombro e puxe o cotovelo para o lado, n\xE3o rente ao corpo. O bra\xE7o e o tronco formam um T. Voc\xEA deve sentir na parte de tr\xE1s do ombro e entre as esc\xE1pulas.",tip:"Esse \xE2ngulo trabalha a parte de tr\xE1s dos ombros e a parte de cima das costas. Eles deixam os ombros mais largos e encorpados vistos de tr\xE1s.",lvl:"Aproxime os p\xE9s do batente e incline-se mais para tr\xE1s."},n7:{name:"Flexora deslizante com toalha",muscles:"Posteriores da coxa, gl\xFAteos",tempo:"3 s esticando, 1 s voltando",how:"Deite de barriga para cima num ch\xE3o liso (madeira, piso frio), com os calcanhares sobre uma toalha ou de meias. Suba o quadril numa ponte. Deslize as pernas para a frente em 3 segundos at\xE9 ficarem quase esticadas, com o quadril ainda no alto. Depois puxe os calcanhares de volta at\xE9 os gl\xFAteos.",tip:"Est\xE1 no tapete ou n\xE3o consegue deslizar? Troque por uma ponte normal.",lvl:"Fa\xE7a com uma perna s\xF3, mantendo a outra no ar. Comece com amplitude menor. Se der c\xE3ibra ou o quadril cair, volte para as duas pernas."},b4:{name:"Abdominal bicicleta",muscles:"Obl\xEDquos, abd\xF4men inteiro",tempo:"devagar, 1 s por lado",how:"Deite de barriga para cima, m\xE3os atr\xE1s da cabe\xE7a, ombros fora do ch\xE3o. Leve o cotovelo direito ao joelho esquerdo enquanto estica a perna direita. Depois troque. \xC9 o tronco que gira, n\xE3o s\xF3 os cotovelos.",tip:"V\xE1 devagar. Ficar batendo os cotovelos r\xE1pido n\xE3o adianta nada, s\xF3 for\xE7a o pesco\xE7o.",lvl:"Diminua para 2 s por lado."},kKnee:{name:"Flex\xE3o com joelhos apoiados",muscles:"Peito, tr\xEDceps, ombros (parte da frente)",tempo:"3 s descendo, sobe",how:"Fique de joelhos, m\xE3os um pouco mais abertas que os ombros. Mantenha o corpo reto dos joelhos \xE0 cabe\xE7a, sem empinar o quadril. Des\xE7a o peito at\xE9 o ch\xE3o em 3 segundos e empurre de volta para cima.",tip:"Quando fizer 20 nas duas rodadas, volte para a flex\xE3o normal."},kIncl:{name:"Flex\xE3o inclinada",muscles:"Peito, tr\xEDceps, ombros (parte da frente)",tempo:"3 s descendo, sobe",how:"Apoie as m\xE3os numa mesa firme, numa cama ou no parapeito da janela. Mantenha o corpo reto dos calcanhares \xE0 cabe\xE7a. Des\xE7a o peito at\xE9 a borda e empurre de volta. Quanto mais baixo o apoio, mais dif\xEDcil.",tip:"Uma boa substituta quando o punho d\xF3i no ch\xE3o ou quando a for\xE7a est\xE1 acabando."},superman:{name:"Superman",muscles:"Lombar, gl\xFAteos, ombros (parte de tr\xE1s)",tempo:"sobe, 2 s segurando, desce",how:"Deite de barriga para baixo com os bra\xE7os esticados \xE0 frente. Tire os bra\xE7os, o peito e as pernas do ch\xE3o ao mesmo tempo, segure 2 segundos e des\xE7a devagar. Olhe para o ch\xE3o, n\xE3o jogue o pesco\xE7o para tr\xE1s.",tip:"N\xE3o \xE9 um exerc\xEDcio de puxar como a remada, mas fortalece as costas quando voc\xEA n\xE3o tem onde fazer remada."},ytw:{name:"Y-T-W no ch\xE3o",muscles:"Meio e parte de cima das costas, ombros (parte de tr\xE1s)",tempo:"segure cada posi\xE7\xE3o por 1 s",how:"Deite de barriga para baixo, testa apoiada numa toalha. Levante os bra\xE7os esticados formando um Y e segure 1 s. Depois abra para os lados formando um T. Por fim, puxe os cotovelos at\xE9 as costelas formando um W e aperte as esc\xE1pulas. Y + T + W = 1 repeti\xE7\xE3o.",tip:"Polegares para cima, ombros longe das orelhas."},lunge:{name:"Afundo reverso",muscles:"Coxa (parte da frente), gl\xFAteos",tempo:"2 s descendo, sobe",how:"Fique em p\xE9, com a postura ereta. D\xEA um passo grande para tr\xE1s: o joelho de tr\xE1s vai quase at\xE9 o ch\xE3o e o joelho da frente dobra a 90\xB0. Empurre pelo calcanhar do p\xE9 da frente para voltar \xE0 posi\xE7\xE3o em p\xE9. Fa\xE7a todas as repeti\xE7\xF5es com uma perna, depois com a outra.",tip:"Pega mais leve nos joelhos que o afundo para a frente. Mantenha o tronco ereto."},bridge:{name:"Eleva\xE7\xE3o p\xE9lvica",muscles:"Gl\xFAteos, posteriores da coxa",tempo:"sobe, 2 s contraindo, desce",how:"Deite de barriga para cima, joelhos dobrados, p\xE9s no ch\xE3o. Empurre pelos calcanhares e suba o quadril at\xE9 o corpo formar uma linha reta dos joelhos aos ombros. Contraia os gl\xFAteos por 2 segundos l\xE1 em cima e des\xE7a devagar.",tip:"A vers\xE3o mais dif\xEDcil \xE9 a Eleva\xE7\xE3o p\xE9lvica unilateral. Quando esta ficar f\xE1cil, troque por ela."},r1e:{name:"Flex\xE3o pike com p\xE9s na cadeira",muscles:"Ombros, tr\xEDceps",tempo:"3 s descendo, sobe",how:"Coloque os p\xE9s numa cadeira e as m\xE3os no ch\xE3o um pouco \xE0 frente, com o quadril bem alto para o tronco ficar quase vertical. Dobre os cotovelos e des\xE7a a cabe\xE7a at\xE9 o ch\xE3o logo \xE0 frente das m\xE3os, cotovelos para tr\xE1s, n\xE3o para os lados. Empurre de volta para cima.",tip:"Quanto mais vertical o tronco, mais peso vai para os ombros. Contraia os gl\xFAteos para n\xE3o arquear a lombar. A cadeira deve ficar firme, de prefer\xEAncia encostada na parede. Des\xE7a a cabe\xE7a devagar, nunca caia sobre ela."},k3e:{name:"Flex\xE3o diamante com p\xE9s na cadeira",muscles:"Tr\xEDceps, parte interna do peito, ombros",tempo:"3 s descendo, sobe",how:"Coloque os p\xE9s numa cadeira e as m\xE3os sob o peito, com polegares e indicadores se tocando em forma de diamante. Corpo reto da cabe\xE7a aos calcanhares. Des\xE7a com os cotovelos para tr\xE1s junto ao corpo, peito em dire\xE7\xE3o \xE0s m\xE3os. Empurre de volta para cima.",tip:"N\xE3o deixe o quadril subir nem cair. Se os punhos ou cotovelos doerem, afaste um pouco as m\xE3os. A cadeira deve ficar firme, de prefer\xEAncia encostada na parede."},n1q:{name:"Agachamento 1 e 1/4",muscles:"Frente das coxas, gl\xFAteos",tempo:"desce, um quarto acima, desce, sobe",how:"P\xE9s na largura dos ombros, pontas um pouco para fora. Des\xE7a at\xE9 embaixo, suba s\xF3 um quarto, des\xE7a de novo at\xE9 embaixo e s\xF3 ent\xE3o fique de p\xE9. Isso \xE9 1 repeti\xE7\xE3o. Calcanhares sempre no ch\xE3o.",tip:"Os m\xFAsculos passam duas vezes pela parte mais dif\xEDcil e profunda do agachamento, por isso \xE9 mais dif\xEDcil. N\xE3o despenque, des\xE7a com controle."},b5l:{name:"Prancha com uma perna",muscles:"Todo o core, gl\xFAteos",how:"Como a prancha normal: antebra\xE7os sob os ombros, corpo reto da cabe\xE7a aos calcanhares. Levante uma perna esticada um pouco do ch\xE3o; na metade do tempo, abaixe e levante a outra. Quadril nivelado, sem girar.",tip:"N\xE3o levante muito a perna, basta tirar do ch\xE3o. O importante \xE9 o quadril n\xE3o se mexer."},sbridge:{name:"Eleva\xE7\xE3o p\xE9lvica unilateral",muscles:"Gl\xFAteos, posteriores da coxa",tempo:"sobe, 2 s contraindo, desce",how:"Deite de costas, joelhos dobrados, p\xE9s no ch\xE3o. Estique uma perna no ar e mantenha as coxas juntas. Empurre pelo calcanhar da perna no ch\xE3o e suba o quadril at\xE9 o corpo formar uma linha reta do joelho aos ombros. Em cima, contraia os gl\xFAteos por 2 segundos e des\xE7a devagar. Primeiro todas as repeti\xE7\xF5es com uma perna, depois com a outra.",tip:"Mantenha o quadril nivelado, sem deixar cair para o lado da perna levantada. Anote o n\xFAmero de uma perna: 10 esquerda + 10 direita = anote 10. Se der c\xE3ibra no posterior da coxa, volte para a ponte com as duas pernas."},wallsit:{name:"Cadeirinha na parede",muscles:"Coxa (parte da frente)",how:"Encoste as costas numa parede e deslize para baixo at\xE9 as coxas ficarem paralelas ao ch\xE3o e os joelhos a 90\xB0. Costas inteiras na parede, joelhos acima dos tornozelos. Segure.",tip:"N\xE3o apoie as m\xE3os nas coxas, sen\xE3o voc\xEA est\xE1 se ajudando."},birddog:{name:"Bird dog",muscles:"Core, lombar, gl\xFAteos",tempo:"estica, 2 s segurando, volta",how:"Fique de quatro apoios: m\xE3os embaixo dos ombros, joelhos embaixo do quadril. Estique o bra\xE7o direito para a frente e a perna esquerda para tr\xE1s ao mesmo tempo, com o corpo em linha reta. Segure 2 segundos, volte e troque de lado.",tip:"O quadril n\xE3o pode girar. Imagine um copo d'\xE1gua em cima da sua lombar."},hollow:{name:"Hollow body",muscles:"Core inteiro",how:"Deite de barriga para cima com os bra\xE7os esticados para tr\xE1s da cabe\xE7a. Pressione a lombar no ch\xE3o e tire os ombros e as pernas esticadas um pouco do ch\xE3o. Segure sem se mexer.",tip:"Se a lombar sair do ch\xE3o, suba mais as pernas ou dobre os joelhos."},legraise:{name:"Eleva\xE7\xE3o de pernas",muscles:"Parte de baixo do abd\xF4men, flexores do quadril",tempo:"2 s subindo, 2 s descendo",how:"Deite de barriga para cima, bra\xE7os ao lado do corpo. Suba devagar as pernas esticadas at\xE9 ficarem na vertical e des\xE7a devagar at\xE9 quase o ch\xE3o, mas sem encostar. A lombar fica no ch\xE3o.",tip:"Se a lombar doer, dobre os joelhos."}},warm:{w1:{name:"C\xEDrculos com os bra\xE7os",dose:"15\xD7 para a frente, 15\xD7 para tr\xE1s",why:"Solta os ombros antes das flex\xF5es e remadas."},w2:{name:"Balan\xE7o de pernas",dose:"10\xD7 cada perna, apoiado na parede",why:"Solta o quadril antes dos agachamentos."},w3:{name:"World's greatest stretch",dose:"5\xD7 cada lado",why:"Quadril, parte de cima das costas e posteriores de uma vez s\xF3."},w4:{name:"Inchworm",dose:"5\xD7",why:"Aquece o corpo inteiro e te leva at\xE9 a prancha."}},cool:{c1:{name:"Flexor do quadril, esquerdo",why:"Ficar muito tempo sentado (escola, computador) encurta a parte da frente do quadril. Se for fazer s\xF3 um alongamento, fa\xE7a este.",how:"Ajoelhe com o joelho esquerdo no ch\xE3o e o p\xE9 direito \xE0 frente. Contraia os gl\xFAteos e leve o quadril para a frente at\xE9 sentir alongar a parte da frente do quadril esquerdo. N\xE3o arqueie a lombar."},c2:{name:"Flexor do quadril, direito",why:"O mesmo do outro lado.",how:"Ajoelhe com o joelho direito no ch\xE3o e o p\xE9 esquerdo \xE0 frente. Contraia os gl\xFAteos e leve o quadril para a frente."},c4:{name:"Cobra",why:"Alonga o abd\xF4men e a frente do quadril. Compensa todo o enrolar dos exerc\xEDcios de abd\xF4men.",how:"Deite de bru\xE7os, palmas sob os ombros, cotovelos junto ao corpo. Deixe o quadril no ch\xE3o e empurre devagar com os bra\xE7os at\xE9 sentir um alongamento agrad\xE1vel no abd\xF4men. Ombros baixos, longe das orelhas; os cotovelos n\xE3o precisam ficar totalmente esticados. Se incomodar na lombar, des\xE7a um pouco."},c3:{name:"Postura da crian\xE7a",why:"Acalma a respira\xE7\xE3o e relaxa as costas. Puro bem-estar.",how:"Joelhos afastados, sente o quadril para tr\xE1s sobre os calcanhares, estique os bra\xE7os
