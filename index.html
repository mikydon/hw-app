 {name}",lvlTitle:"\u2B06 Time for a harder version.",lvlBody:"Last time you hit the target in every round.",lastRound:"Last round. This is the set that builds muscle: go close to failure, keep 1\u20132 reps in reserve. \u{1F4AA}",less:"Less",more:"More",reps:"reps",newRank:"New rank: {rank}!",pr:"\u{1F3C6} Personal record",numFromLast:"The number is set from last time.",numGuess:"The number is just a guess.",adjust:"Do the set and change it to what you actually did.",doneBtn:"Done, {v}",secondsHint:"seconds. After you start, you get 5 s to get into position.",getReady:"get into position",hold:"hold",giveUp:"I can't, stop",cheerDefault:"Good set!",newPR:"\u{1F3C6} New personal record!",roundDone:"Round done! Rest before round {r} of {n}",rest:"Rest",next:"Next",prepare:"Get your spot ready while it counts down.",ready:"I'm ready",coolTitle:"Workout done",coolIntro:"Stretching at the end is optional. Experts agree it doesn't help recovery or muscle growth, only flexibility. If you want it, these two make sense: hip flexor (both sides) and child's pose. 90 seconds in total.",coolDone:"\u2713 done",coolPrep:"get into position, {n}",coolHold:"hold, {n} s",hideHowTo:"\u25BE hide instructions",showHowTo:"\u25B8 how to",video:"\u25B6 Video",saveWorkout:"Save workout",skipSave:"Skip and save workout",nothingSaved:"Nothing saved",nothingSavedD:"You didn't finish any set, so nothing was added to your history.",great:"Great job!",dayDate:"Day {d}, {date}",levelLine:"Level {lvl}, {into} / {need} XP. Streak: {streak} in a row.",levelUp:"\u26A1 Level up! Level {lvl}",challengeDone:"\u2713 Challenge done: {text}",nextLine:"Next workout: day {d}, ideally {date}",copyAI:"Copy log for AI",dayRound:"Day {d}, round {r} of {n}",quit:"Quit",quitSave:"Quit and save?",quitConfirm:"Really quit?",progressAria:"{done} of {total} done",videoYT:"\u25B6 Video on YouTube",ladderTitle:"Ranks (best set: {v})",ladderNone:"Ranks (best set: none yet)",rankStart:"start",figureAria:"Drawing: {labels}",photoAlt:"Profile photo"},pl:{workouts:{one:"{n} workout",other:"{n} workouts"},days:{one:"{n} day",other:"{n} days"},daysAgo:{one:"{n} day ago",other:"{n} days ago"},rounds:{one:"{n} round",other:"{n} rounds"},sets:{one:"{n} set",other:"{n} sets"},prs:{one:"{n} personal record",other:"{n} personal records"}},units:{arm:"/arm",leg:"/leg",side:"/side"},perUnit:{arm:"per arm",leg:"per leg",side:"per side"},themes:{navy:"Navy",black:"Black",forest:"Forest",plum:"Plum"},ranks:["Wood","Iron","Bronze","Silver","Gold","Platinum","Diamond"],ex:{k1:{name:"Push-up",muscles:"Chest, triceps, front shoulders",tempo:"3 s down, short pause, up",how:"Hands slightly wider than your shoulders, body straight from head to heels, abs and glutes tight. Lower yourself for 3 seconds until your chest almost touches the floor, hold briefly and push back up. Keep your elbows at about 45\xB0 to your body, not flared out.",tip:"Once you hit 25+ in the first round, put your hands on two thick books. Your chest goes deeper, the muscle stretches more and grows more.",lvl:"Put your hands on two thick books so your chest goes deeper. Your numbers will drop at first, that's fine."},row1:{name:"Door frame row",muscles:"Back (lats), rear shoulders, biceps",tempo:"1 s up, 1 s hold, 3 s back",how:"Stand in an open doorway, side-on to the frame. Grab the frame with one hand at chest height, feet right next to the frame. Lean back with your arm straight and your body straight. Pull yourself to the frame: elbow goes back along your body, squeeze your shoulder blade back. Return slowly. Do all reps with one arm, then the other.",tip:"The closer your feet are to the frame and the further you lean back, the harder it gets. Hold the solid frame, not the door, and train barefoot so your feet don't slip.",lvl:"Move your feet closer to the frame and lean back further."},n1:{name:"ATG squat",muscles:"Front thighs, glutes",tempo:"3 s down, 1 s pause at the bottom, up",how:"Feet shoulder-width apart, toes slightly out. Lower yourself for 3 seconds as deep as you can, thighs below your knees, heels on the floor. Hold for 1 second at the bottom and stand up.",tip:"The slow tempo and the pause turn an easy squat into a hard one. If you do 20+ even with the tempo, switch to the harder version.",lvl:"Do a 1\xBC squat: down, a quarter of the way up, all the way down again, then up. That's 1 rep."},b5:{name:"Plank",muscles:"Whole core",how:"Forearms under your shoulders, body straight from head to heels. Brace your abs and glutes as if someone were about to punch your stomach. Don't let your hips rise or sag.",tip:"Once you hold 60 s in both rounds, lift one leg during the plank (alternate). It's much harder.",lvl:"Lift one leg during the plank and switch legs halfway through."},r1:{name:"Pike push-up",muscles:"Shoulders, triceps",tempo:"3 s down, up",how:"Get into an inverted V: hands on the floor, hips high, legs as straight as you can. Bend your elbows and lower the top of your head to the floor just in front of your hands, so your hands and head form a triangle. Push back up.",tip:"Once you do 15+ in both rounds, put your feet on a chair. More of your weight goes onto your shoulders.",lvl:"Put your feet on a chair."},row2:{name:"Towel door row",muscles:"Mid back, shoulder blades, biceps",tempo:"1 s up, 1 s hold, 3 s back",how:"Open the door and stand facing its edge, with the door between your feet. Loop a towel around both handles and hold its ends, or grab both handles directly. Lean back with your arms straight and your body straight. Pull your chest to the edge of the door, squeeze your shoulder blades and lower slowly.",tip:"First check that the handles are solid and don't move. If anything moves, do the door frame row (day A) instead. Safety comes first.",lvl:"Move your feet closer to the door and lean back further."},n2:{name:"Bulgarian split squat",muscles:"Front thighs, glutes",tempo:"3 s down, up",how:"Stand in front of a chair and put the top of your back foot on the seat. Take a big step forward with your front foot. Lower yourself for 3 seconds, your back knee goes towards the floor. Push up through the heel of your front foot.",tip:"Put your front foot far enough forward that your knee stays above your foot. Leaning your torso slightly forward = more glutes.",lvl:"Slow down: 4 s down and a 2 s pause at the bottom."},b2:{name:"Dead bug",muscles:"Deep abdominal muscles",tempo:"slowly, 2 s out, 2 s back",how:"Lie on your back, arms straight up to the ceiling, legs raised with knees at 90\xB0. Slowly lower your right arm behind your head and your left leg towards the floor, then come back and switch sides.",tip:"Your lower back must stay pressed to the floor the whole time. If it lifts, don't lower your leg as far.",lvl:"Lower your arm and leg more slowly, 3 s out and 3 s back."},k3:{name:"Diamond push-up",muscles:"Triceps, inner chest",tempo:"3 s down, up",how:"Place your hands under your chest so your thumbs and index fingers touch and form a diamond. Lower yourself with your elbows going back along your body. Your chest goes towards your hands.",tip:"If your wrists or elbows hurt, move your hands a bit apart. A close-grip push-up works the triceps almost as much.",lvl:"Put your feet on a chair."},row3:{name:"Wide door frame row",muscles:"Rear shoulders, upper back",tempo:"1 s up, 1 s hold, 3 s back",how:"Same stance as the door frame row, but grab the frame at shoulder height and pull your elbow out to the side, not along your body. Your arm and torso form a T. You should feel it at the back of your shoulder and between your shoulder blades.",tip:"This angle trains the rear shoulders and upper back. They make your shoulders look wider and thicker from behind.",lvl:"Move your feet closer to the frame and lean back further."},n7:{name:"Towel hamstring curl",muscles:"Hamstrings, glutes",tempo:"3 s out, 1 s back",how:"Lie on your back on a smooth floor (wood, tiles), heels on a towel or in socks. Lift your hips into a bridge. Slide your legs out for 3 seconds until they're almost straight, hips still up. Then pull your heels back to your glutes.",tip:"It won't slide on carpet. Then do a single-leg bridge instead: hips up, one leg in the air, and log reps per leg.",lvl:"Do it with one leg, keep the other in the air."},b4:{name:"Bicycle crunch",muscles:"Obliques, whole abs",tempo:"slowly, 1 s per side",how:"Lie on your back, hands behind your head, shoulders off the floor. Bring your right elbow to your left knee while straightening your right leg. Then switch. Your torso rotates, not just your elbows.",tip:"Go slowly. Quick elbow flapping does nothing except strain your neck.",lvl:"Slow down to 2 s per side."},kKnee:{name:"Knee push-up",muscles:"Chest, triceps, front shoulders",tempo:"3 s down, up",how:"Kneel, hands slightly wider than your shoulders. Keep your body straight from knees to head, don't stick your hips out. Lower your chest to the floor for 3 seconds and push back up.",tip:"Once you do 20 in both rounds, go back to the regular push-up."},kIncl:{name:"Incline push-up",muscles:"Chest, triceps, front shoulders",tempo:"3 s down, up",how:"Put your hands on a sturdy table, bed or windowsill. Keep your body straight from heels to head. Lower your chest to the edge and push back. The lower the support, the harder it is.",tip:"A good replacement when your wrists hurt on the floor or you're running out of strength."},superman:{name:"Superman",muscles:"Lower back, glutes, rear shoulders",tempo:"up, 2 s hold, down",how:"Lie on your stomach with your arms stretched out in front of you. Lift your arms, chest and legs off the floor at the same time, hold for 2 seconds and lower slowly. Look at the floor, don't tilt your neck back.",tip:"It isn't a pull like a row, but it strengthens your back when you have nowhere to row."},ytw:{name:"Floor Y-T-W",muscles:"Mid and upper back, rear shoulders",tempo:"hold each position for 1 s",how:"Lie on your stomach, forehead on a towel. Lift your straight arms into a Y and hold for 1 s. Then out to the sides into a T. Finally pull your elbows to your ribs into a W and squeeze your shoulder blades. Y + T + W = 1 rep.",tip:"Thumbs point up, keep your shoulders away from your ears."},lunge:{name:"Reverse lunge",muscles:"Front thighs, glutes",tempo:"2 s down, up",how:"Stand tall. Take a big step back, your back knee goes almost to the floor and your front knee bends to 90\xB0. Push through the heel of your front foot back to standing. Do all reps with one leg, then the other.",tip:"Easier on the knees than a forward lunge. Keep your torso upright."},bridge:{name:"Glute bridge",muscles:"Glutes, hamstrings",tempo:"up, 2 s squeeze, down",how:"Lie on your back, knees bent, feet on the floor. Push through your heels and lift your hips until your body forms a straight line from knees to shoulders. Squeeze your glutes for 2 seconds at the top and lower slowly.",tip:"Harder version: one leg in the air. Then log reps per leg."},wallsit:{name:"Wall sit",muscles:"Front thighs",how:"Lean your back against a wall and slide down until your thighs are parallel to the floor and your knees are at 90\xB0. Whole back on the wall, knees above your ankles. Hold.",tip:"Don't put your hands on your thighs, or you're helping yourself."},birddog:{name:"Bird dog",muscles:"Core, lower back, glutes",tempo:"reach, 2 s hold, back",how:"Get on all fours: hands under your shoulders, knees under your hips. Reach your right arm forward and your left leg back at the same time, body in a straight line. Hold for 2 seconds, come back and switch sides.",tip:"Your hips must not rotate. Imagine a glass of water on your lower back."},hollow:{name:"Hollow body hold",muscles:"Whole core",how:"Lie on your back with your arms stretched behind your head. Press your lower back into the floor and lift your shoulders and straight legs a little off the floor. Hold without moving.",tip:"If your lower back lifts off the floor, raise your legs higher or bend them."},legraise:{name:"Leg raise",muscles:"Lower abs, hip flexors",tempo:"2 s up, 2 s down",how:"Lie on your back, arms by your sides. Slowly raise your straight legs until they're vertical and slowly lower them almost to the floor, but don't put them down. Your lower back stays on the floor.",tip:"If your lower back hurts, bend your knees."}},warm:{w1:{name:"Arm circles",dose:"15\xD7 forward, 15\xD7 back",why:"Loosens your shoulders before push-ups and rows."},w2:{name:"Leg swings",dose:"10\xD7 each leg, hold a wall",why:"Loosens your hips before squats."},w3:{name:"World's greatest stretch",dose:"5\xD7 each side",why:"Hips, upper back and hamstrings at once."},w4:{name:"Inchworm",dose:"5\xD7",why:"Warms up your whole body and takes you into a plank."}},cool:{c1:{name:"Hip flexor, left",why:"Sitting a lot (school, computer) shortens the front of your hips. If you only do one stretch, do this one.",how:"Kneel on your left knee, right foot in front. Squeeze your glutes and shift your hips forward until you feel a stretch at the front of your left hip. Don't arch your lower back."},c2:{name:"Hip flexor, right",why:"The same on the other side.",how:"Kneel on your right knee, left foot in front. Squeeze your glutes and shift your hips forward."},c3:{name:"Child's pose",why:"Calms your breathing and relaxes your back. Purely for feeling good.",how:"Knees apart, sit your hips back on your heels, reach your arms as far forward as you can, forehead on the floor. Breathe slowly."}},fig:{k1:["Up","Down"],k3:["Up","Down, elbows in"],b5:["Right: straight body","Wrong: sagging lower back"],n1:["Start","Down, heels on the floor"],r1:["Up","Down, head in front of hands"],row1:["Start, arm straight","Pull, elbow back"],row3:["Start, hand at shoulder height","Elbow out to the side, high"],row2:["Start, arms straight","Chest to the door"],n2:["Up","Down, back knee to the floor"],b2:["Start","Arm and opposite leg down"],n7:["Hips up, heels near glutes","Slide legs out, hips still up"],b4:["Elbow to opposite knee","Switch sides"],kKnee:["Up, knees on the floor","Down"],kIncl:["Hands on the table, up","Chest to the edge"],superman:["Lie on your stomach","Lift and hold 2 s"],ytw:["Y: arms forward and up","W: elbows to ribs"],lunge:["Start","Step back, knee to the floor"],bridge:["Lie down, knees bent","Hips up, squeeze glutes"],wallsit:["Thighs level, back on the wall"],birddog:["On all fours","Arm and opposite leg"],hollow:["Lower back pressed to the floor"],legraise:["Legs up","Lower slowly, don't touch down"],hf:["Back knee down, hips forward"],child:["Hips to heels, arms far forward"]},ch:{w3:"Do 3 workouts",pr1:"Beat a personal record",r3:"Do 3 rounds once",warm:"Full warm-up 2\xD7",cool:"Stretch after a workout 2\xD7",push100:"100 push-ups in total (all kinds)",rank:"Reach a new rank",reps300:"300 reps in total",legs100:"100 leg reps"},ach:{first:["First step","1st workout"],w5:["High five","5 workouts"],w10:["Perfect ten","10 workouts"],w25:["Quarter century","25 workouts"],w50:["Half century","50 workouts"],s3:["On a roll","Streak of 3"],s7:["Unstoppable","Streak of 7"],s15:["Discipline","Streak of 15"],pr:["Record breaker","1st personal record"],gold:["Golden","Gold in 1 exercise"],diamond:["Diamond","Diamond in 1 exercise"],week:["Perfect week","All 3 challenges"],lvl5:["Level 5","Reach level 5"],r3:["Three rounds","Do 3 rounds"],push30:["Thirty","30 push-ups in one set"]},quotes:["Discipline takes you where motivation can't.","You don't need to feel like it. Just do the first set, the rest follows.","Every rep is a brick. A body is built brick by brick.","13 minutes today. A body for life.","Never miss twice in a row.","Small steps every other day beat big plans you never start.","Your future self will thank you for today.","It's not about the perfect workout. It's about showing up.","Where it starts to burn, growth begins.","Muscles are built by training, but they grow with food and sleep.","Compare yourself only to who you were last week.","While others look for motivation, you've already trained.","Hard sets, easier life.","Every strong person started from zero."],facts:["You can train every day, but every other day is best. Muscles grow while you rest, not while you train.","Sleep is your best supplement. 7\u20139 hours a night = faster recovery.","The last reps of a set do the most work. They're the ones that build muscle.","A slow lowering phase (3 seconds) gives your muscles more work than fast reps.","Protein in every meal helps your muscles grow.","Consistency beats intensity. Better 13 minutes every other day than an hour once a month.","Have some water. Even mild thirst lowers your performance.","Breathe slowly: in through your nose, out through your mouth. You'll calm down faster.","Full range of motion = more muscle at work. Fewer reps, but full ones."],moti:["I believe in you, you've got this! \u{1F4AA}","Every set takes you closer to your goal.","You're stronger than you think.","Just a bit more, you can do it.","Today counts. Don't give up.","This is the moment where you grow.","Your future self will thank you."],cheers:["Strong set!","That's how it's done!","Beast mode!","You're on fire!","Clean work!","This is the road to a strong body.","Almost there!"],finish:["Another brick in the wall. That's how it's done.","Done. Now eat well and sleep, that's when muscles grow.","Strength isn't talent. It's the sum of days exactly like this one.","Done. This is discipline in action.","Today you did what most people only plan."]};var op={ui:{loading:"Na\u010D\xEDtavam\u2026",close:"Zavrie\u0165",cancel:"Zru\u0161i\u0165",save:"Ulo\u017Ei\u0165",home:"Domov",back:"Sp\xE4\u0165",start:"\u0160tart",stop:"Stop",copied:"\u2713 Skop\xEDrovan\xE9",dayN:"De\u0148 {d}",tabTrain:"Tr\xE9ning",tabHistory:"Hist\xF3ria",tabSettings:"Nastavenia",tabProfile:"Profil",mainMenu:"Hlavn\xE9 menu",openProfile:"Otvori\u0165 profil",streakAria:"S\xE9ria {n}",levelAria:"Level {n}",weeklyChallenges:"V\xFDzvy t\xFD\u017Ed\u0148a",chLeft ok, akoby \u0165a mal niekto udrie\u0165 do brucha. Zadok nedv\xEDhaj ani nep\xFA\u0161\u0165aj dole.",tip:"Ke\u010F d\xE1\u0161 60 s v oboch kol\xE1ch, zdvihni po\u010Das planku jednu nohu (striedaj). Je to ove\u013Ea \u0165a\u017E\u0161ie.",lvl:"Po\u010Das planku zdvihni jednu nohu, v polovici \u010Dasu nohy vyme\u0148."},r1:{name:"Pike klik",muscles:"Ramen\xE1, triceps",tempo:"3 s dole, hore",how:"Postav sa do obr\xE1ten\xE9ho V: ruky na zemi, zadok vysoko, nohy \u010Do najrovnej\u0161ie. Ohni lakte a sp\xFA\u0161\u0165aj temeno hlavy k zemi k\xFAsok pred rukami, tak\u017Ee ruky a hlava tvoria trojuholn\xEDk. Zatla\u010D sa sp\xE4\u0165 hore.",tip:"Ke\u010F d\xE1\u0161 15+ v oboch kol\xE1ch, polo\u017E nohy na stoli\u010Dku. Viac tvojej v\xE1hy p\xF4jde na ramen\xE1.",lvl:"Polo\u017E nohy na stoli\u010Dku."},row2:{name:"Veslovanie s uter\xE1kom o dvere",muscles:"Stredn\xFD chrb\xE1t, lopatky, biceps",tempo:"1 s hore, 1 s podr\u017E, 3 s sp\xE4\u0165",how:"Otvor dvere a postav sa \u010Delom k ich hrane, tak\u017Ee dvere m\xE1\u0161 medzi chodidlami. Prevle\u010D uter\xE1k cez obe k\u013Eu\u010Dky a chy\u0165 jeho konce, alebo chy\u0165 priamo obe k\u013Eu\u010Dky. Zaklo\u0148 sa s vystret\xFDmi rukami, telo rovn\xE9. Pritiahni hrudn\xEDk k hrane dver\xED, lopatky k sebe, a pomaly sp\xE4\u0165.",tip:"Najprv over, \u017Ee k\u013Eu\u010Dky s\xFA pevn\xE9 a neh\xFDbu sa. Ak sa nie\u010Do h\xFDbe, rob rad\u0161ej veslovanie o r\xE1m (z d\u0148a A). Bezpe\u010Dnos\u0165 je d\xF4le\u017Eitej\u0161ia ne\u017E cvik.",lvl:"Daj chodidl\xE1 bli\u017E\u0161ie k dver\xE1m a viac sa zaklo\u0148."},n2:{name:"Bulharsk\xFD drep",muscles:"Predn\xE9 stehn\xE1, zadok",tempo:"3 s dole, hore",how:"Postav sa pred stoli\u010Dku a zadn\xFA nohu polo\u017E n\xE1rtom na sedadlo. Prednou nohou urob ve\u013Ek\xFD krok vpred. 3 sekundy sa sp\xFA\u0161\u0165aj, zadn\xE9 koleno ide k zemi. Zatla\u010D sa cez p\xE4tu prednej nohy hore.",tip:"Predn\xE9 chodidlo daj tak \u010Faleko, aby koleno zostalo nad chodidlom. Mierny predklon trupu = viac zaberie zadok.",lvl:"Spoma\u013E: 4 s dole a 2 s pauza dole."},b2:{name:"Dead bug",muscles:"Hlbok\xE9 bru\u0161n\xE9 svaly",tempo:"pomaly, 2 s tam, 2 s sp\xE4\u0165",how:"\u013Dahni na chrb\xE1t, ruky vystri ku stropu, nohy zdvihni s kolenami v 90\xB0. Pomaly sp\xFA\u0161\u0165aj prav\xFA ruku za hlavu a \u013Eav\xFA nohu k zemi, potom sa vr\xE1\u0165 a vyme\u0148 strany.",tip:"Spodok chrbta mus\xED cel\xFD \u010Das osta\u0165 pritla\u010Den\xFD k zemi. Ak sa odlep\xED, nesp\xFA\u0161\u0165aj nohu tak n\xEDzko.",lvl:"Sp\xFA\u0161\u0165aj ruku a nohu pomal\u0161ie, 3 s tam a 3 s sp\xE4\u0165."},k3:{name:"Diamond klik",muscles:"Triceps, vn\xFAtorn\xE1 hru\u010F",tempo:"3 s dole, hore",how:"Ruky daj pod hrudn\xEDk tak, aby sa palce a ukazov\xE1ky dot\xFDkali a tvorili diamant. Sp\xFA\u0161\u0165aj sa, lakte id\xFA dozadu popri tele. Hrudn\xEDk smeruje k ruk\xE1m.",tip:"Ak bolia z\xE1p\xE4stia alebo lakte, daj ruky k\xFAsok od seba. \xDAzky klik za\u0165a\u017E\xED triceps skoro rovnako.",lvl:"Polo\u017E nohy na stoli\u010Dku."},row3:{name:"\u0160irok\xE9 veslovanie o r\xE1m",muscles:"Zadn\xE9 ramen\xE1, horn\xFD chrb\xE1t",tempo:"1 s hore, 1 s podr\u017E, 3 s sp\xE4\u0165",how:"Rovnak\xE9 postavenie ako pri veslovan\xED o r\xE1m, ale r\xE1m chy\u0165 vo v\xFD\u0161ke ramena a lake\u0165 \u0165ahaj do strany, nie popri tele. Ruka a trup tvoria p\xEDsmeno T. C\xEDti\u0165 to m\xE1\u0161 vzadu na ramene a medzi lopatkami.",tip:"Tento uhol tr\xE9nuje zadn\xE9 ramen\xE1 a horn\xFD chrb\xE1t. Pr\xE1ve tie robia ramen\xE1 zozadu \u0161ir\u0161ie a hrub\u0161ie.",lvl:"Daj chodidl\xE1 bli\u017E\u0161ie k r\xE1mu a viac sa zaklo\u0148."},n7:{name:"Hamstring curl s uter\xE1kom",muscles:"Zadn\xE9 stehn\xE1, zadok",tempo:"3 s von, 1 s sp\xE4\u0165",how:"\u013Dahni na chrb\xE1t na hladk\xFA podlahu (parkety, dla\u017Eba), p\xE4ty polo\u017E na uter\xE1k alebo cvi\u010D v pono\u017Ek\xE1ch. Zdvihni boky do most\xEDka. 3 sekundy vys\xFAvaj nohy dopredu, k\xFDm nie s\xFA skoro vystret\xE9, boky st\xE1le hore. Potom pritiahni p\xE4ty sp\xE4\u0165 k zadku.",tip:"Na koberci to nek\u013A\u017Ee. Vtedy rob jednonoh\xFD most\xEDk: boky hore, jedna noha vo vzduchu, a zap\xED\u0161 po\u010Det na jednu nohu.",lvl:"Rob ho jednou nohou, druh\xFA dr\u017E vo vzduchu."},b4:{name:"Bicycle crunch",muscles:"\u0160ikm\xE9 bru\u0161n\xE9 svaly, cel\xE9 brucho",tempo:"pomaly, 1 s na stranu",how:"\u013Dahni na chrb\xE1t, ruky za hlavu, ramen\xE1 zdvihni od zeme. Prav\xFD lake\u0165 k \u013Eav\xE9mu kolenu, pritom vystri prav\xFA nohu. Potom naopak. Ot\xE1\u010Da sa trup, nie len lakte.",tip:"Pomaly. R\xFDchle \u0161ibanie lak\u0165ami nerob\xED ni\u010D, len nam\xE1ha krk.",lvl:"Spoma\u013E na 2 s na ka\u017Ed\xFA stranu."},kKnee:{name:"Klik na kolen\xE1ch",muscles:"Hru\u010F, triceps, predn\xE9 ramen\xE1",tempo:"3 s dole, hore",how:"K\u013Eakni si, ruky daj o nie\u010Do \u0161ir\u0161ie ako ramen\xE1. Telo dr\u017E rovn\xE9 od kolien po hlavu, zadok nevystrkuj. 3 sekundy sa sp\xFA\u0161\u0165aj hrudn\xEDkom k zemi a zatla\u010D sa hore.",tip:"Ke\u010F d\xE1\u0161 20 v oboch kol\xE1ch, vr\xE1\u0165 sa ku klasick\xE9mu kliku."},kIncl:{name:"\u0160ikm\xFD klik o st\xF4l",muscles:"Hru\u010F, triceps, predn\xE9 ramen\xE1",tempo:"3 s dole, hore",how:"Polo\u017E ruky na pevn\xFD st\xF4l, poste\u013E alebo parapet. Telo dr\u017E rovn\xE9 od piat po hlavu. Sp\xFA\u0161\u0165aj hrudn\xEDk k hrane a zatla\u010D sa sp\xE4\u0165. \u010C\xEDm ni\u017E\u0161ia opora, t\xFDm je to \u0165a\u017E\u0161ie.",tip:"Dobr\xE1 n\xE1hrada, ke\u010F \u0165a bolia z\xE1p\xE4stia na zemi alebo u\u017E nevl\xE1dze\u0161."},superman:{name:"Superman",muscles:"Spodn\xFD chrb\xE1t, zadok, zadn\xE9 ramen\xE1",tempo:"hore, 2 s podr\u017E, dole",how:"\u013Dahni na brucho, ruky vystri pred seba. Zdvihni naraz ruky, hrudn\xEDk a nohy od zeme, 2 sekundy podr\u017E a pomaly spusti. Pozeraj sa do zeme, krk nezakl\xE1\u0148aj.",tip:"Nie je to \u0165ah ako veslovanie, ale posiln\xED chrb\xE1t, ke\u010F nem\xE1\u0161 kde veslova\u0165."},ytw:{name:"Y-T-W na zemi",muscles:"Stredn\xFD a horn\xFD chrb\xE1t, zadn\xE9 ramen\xE1",tempo:"ka\u017Ed\xE1 poloha 1 s podr\u017E",how:"\u013Dahni na brucho, \u010Delo na uter\xE1k. Zdvihni vystret\xE9 ruky do tvaru Y a podr\u017E 1 s. Potom do str\xE1n do tvaru T. Nakoniec stiahni lakte k rebr\xE1m do tvaru W a lopatky k sebe. Y + T + W = 1 opakovanie.",tip:"Palce smeruj\xFA hore a ramen\xE1 dr\u017E \u010Faleko od u\u0161\xED."},lunge:{name:"Reverzn\xFD v\xFDpad",muscles:"Predn\xE9 stehn\xE1, zadok",tempo:"2 s dole, hore",how:"Stoj vzpriamene. Urob ve\u013Ek\xFD krok dozadu, zadn\xE9 koleno ide skoro k zemi a predn\xE9 zviera 90\xB0. Zatla\u010D sa cez p\xE4tu prednej nohy sp\xE4\u0165 do stoja. Najprv v\u0161etky opakovania jednou nohou, potom druhou.",tip:"\u0160etrnej\u0161\xED na kolen\xE1 ako v\xFDpad dopredu. Trup dr\u017E vzpriamen\xFD."},bridge:{name:"Most\xEDk",muscles:"Zadok, zadn\xE9 stehn\xE1",tempo:"hore, 2 s stla\u010D, dole",how:"\u013Dahni na chrb\xE1t, kolen\xE1 pokr\u010D, chodidl\xE1 na zemi. Zatla\u010D cez p\xE4ty a zdvihni boky, k\xFDm telo netvor\xED rovn\xFA \u010Diaru od kolien po ramen\xE1. Hore 2 sekundy stla\u010D zadok a pomaly spusti.",tip:"\u0164a\u017E\u0161ia verzia: jedna noha vo vzduchu. Zap\xED\u0161 potom po\u010Det na jednu nohu."},wallsit:{name:"Wall sit",muscles:"Predn\xE9 stehn\xE1",how:"Opri sa chrbtom o stenu a z\xED\u010F dole, k\xFDm stehn\xE1 nie s\xFA vodorovne so zemou a kolen\xE1 nezvieraj\xFA 90\xB0. Chrb\xE1t cel\xFD na stene, kolen\xE1 nad \u010Dlenkami. Dr\u017E.",tip:"Ruky ned\xE1vaj na stehn\xE1, inak si pom\xE1ha\u0161."},birddog:{name:"Bird dog",muscles:"Stred tela, spodn\xFD chrb\xE1t, zadok",tempo:"vystri, 2 s podr\u017E, sp\xE4\u0165",how:"K\u013Eakni si na \u0161tyri: ruky pod ramenami, kolen\xE1 pod bokmi. Vystri naraz prav\xFA ruku dopredu a \u013Eav\xFA nohu dozadu, telo tvor\xED rovn\xFA \u010Diaru. Podr\u017E 2 sekundy, vr  r\u0119k\u0105, potem drug\u0105.",tip:"Im bli\u017Cej framugi masz stopy i im bardziej si\u0119 odchylasz, tym trudniej. Trzymaj solidn\u0105 framug\u0119, nie drzwi, i \u0107wicz boso, \u017Ceby stopy si\u0119 nie \u015Blizga\u0142y.",lvl:"Przysu\u0144 stopy bli\u017Cej framugi i odchyl si\u0119 bardziej."},n1:{name:"Przysiad ATG",muscles:"Prz\xF3d ud, po\u015Bladki",tempo:"3 s w d\xF3\u0142, 1 s pauzy na dole, w g\xF3r\u0119",how:"Stopy na szeroko\u015B\u0107 bark\xF3w, palce lekko na zewn\u0105trz. Opuszczaj si\u0119 przez 3 sekundy tak nisko, jak dasz rad\u0119: uda poni\u017Cej kolan, pi\u0119ty na pod\u0142odze. Zatrzymaj si\u0119 na 1 sekund\u0119 na dole i wsta\u0144.",tip:"Wolne tempo i pauza zmieniaj\u0105 \u0142atwy przysiad w trudny. Je\u015Bli robisz 20+ nawet z tym tempem, przejd\u017A na trudniejsz\u0105 wersj\u0119.",lvl:"Zr\xF3b przysiad 1\xBC: w d\xF3\u0142, \u0107wier\u0107 drogi w g\xF3r\u0119, znowu na sam d\xF3\u0142, potem w g\xF3r\u0119. To 1 powt\xF3rzenie."},b5:{name:"Deska (plank)",muscles:"Ca\u0142y core",how:"Przedramiona pod barkami, cia\u0142o w linii prostej od g\u0142owy do pi\u0119t. Napnij brzuch i po\u015Bladki, jakby kto\u015B mia\u0142 ci\u0119 zaraz uderzy\u0107 w brzuch. Biodra nie mog\u0105 i\u015B\u0107 w g\xF3r\u0119 ani opada\u0107.",tip:"Gdy wytrzymasz 60 s w obu rundach, unie\u015B w desce jedn\u0105 nog\u0119 (na zmian\u0119). To du\u017Co trudniejsze.",lvl:"Unie\u015B w desce jedn\u0105 nog\u0119 i w po\u0142owie czasu zmie\u0144 nog\u0119."},r1:{name:"Pompka pike",muscles:"Barki, triceps",tempo:"3 s w d\xF3\u0142, w g\xF3r\u0119",how:"Ustaw si\u0119 w odwr\xF3cone V: d\u0142onie na pod\u0142odze, biodra wysoko, nogi jak najprostsze. Ugnij \u0142okcie i opu\u015B\u0107 czubek g\u0142owy do pod\u0142ogi tu\u017C przed d\u0142o\u0144mi, tak \u017Ceby d\u0142onie i g\u0142owa tworzy\u0142y tr\xF3jk\u0105t. Wypchnij si\u0119 z powrotem w g\xF3r\u0119.",tip:"Gdy zrobisz 15+ w obu rundach, oprzyj stopy na krze\u015Ble. Wi\u0119cej ci\u0119\u017Caru cia\u0142a przejdzie na barki.",lvl:"Oprzyj stopy na krze\u015Ble."},row2:{name:"Wios\u0142owanie z r\u0119cznikiem na drzwiach",muscles:"\u015Arodek plec\xF3w, \u0142opatki, biceps",tempo:"1 s w g\xF3r\u0119, 1 s trzymaj, 3 s z powrotem",how:"Otw\xF3rz drzwi i sta\u0144 przodem do ich kraw\u0119dzi, z drzwiami mi\u0119dzy stopami. Prze\u0142\xF3\u017C r\u0119cznik wok\xF3\u0142 obu klamek i trzymaj go za ko\u0144ce albo z\u0142ap bezpo\u015Brednio obie klamki. Odchyl si\u0119 do ty\u0142u z prostymi r\u0119kami i prostym cia\u0142em. Przyci\u0105gnij klatk\u0119 do kraw\u0119dzi drzwi, \u015Bci\u015Bnij \u0142opatki i opuszczaj si\u0119 powoli.",tip:"Najpierw sprawd\u017A, czy klamki s\u0105 solidne i si\u0119 nie ruszaj\u0105. Je\u015Bli cokolwiek si\u0119 rusza, zr\xF3b zamiast tego wios\u0142owanie we framudze (dzie\u0144 A). Bezpiecze\u0144stwo przede wszystkim.",lvl:"Przysu\u0144 stopy bli\u017Cej drzwi i odchyl si\u0119 bardziej."},n2:{name:"Przysiad bu\u0142garski",muscles:"Prz\xF3d ud, po\u015Bladki",tempo:"3 s w d\xF3\u0142, w g\xF3r\u0119",how:"Sta\u0144 przed krzes\u0142em i oprzyj grzbiet tylnej stopy na siedzisku. Zr\xF3b du\u017Cy krok do przodu przedni\u0105 stop\u0105. Opuszczaj si\u0119 przez 3 sekundy, tylne kolano idzie w stron\u0119 pod\u0142ogi. Wypchnij si\u0119 w g\xF3r\u0119 przez pi\u0119t\u0119 przedniej stopy.",tip:"Postaw przedni\u0105 stop\u0119 na tyle daleko, \u017Ceby kolano zosta\u0142o nad stop\u0105. Lekkie pochylenie tu\u0142owia do przodu = wi\u0119cej po\u015Bladk\xF3w.",lvl:"Zwolnij: 4 s w d\xF3\u0142 i 2 s pauzy na dole."},b2:{name:"Dead bug",muscles:"G\u0142\u0119bokie mi\u0119\u015Bnie brzucha",tempo:"powoli, 2 s w d\xF3\u0142, 2 s z powrotem",how:"Po\u0142\xF3\u017C si\u0119 na plecach, r\u0119ce wyprostowane w g\xF3r\u0119 do sufitu, nogi uniesione, kolana zgi\u0119te pod k\u0105tem 90\xB0. Powoli opu\u015B\u0107 praw\u0105 r\u0119k\u0119 za g\u0142ow\u0119, a lew\u0105 nog\u0119 w stron\u0119 pod\u0142ogi, potem wr\xF3\u0107 i zmie\u0144 strony.",tip:"Dolna cz\u0119\u015B\u0107 plec\xF3w ca\u0142y czas musi by\u0107 doci\u015Bni\u0119ta do pod\u0142ogi. Je\u015Bli si\u0119 odrywa, nie opuszczaj nogi a\u017C tak nisko.",lvl:"Opuszczaj r\u0119k\u0119 i nog\u0119 wolniej, 3 s w d\xF3\u0142 i 3 s z powrotem."},k3:{name:"Pompka diamentowa",muscles:"Triceps, wewn\u0119trzna cz\u0119\u015B\u0107 klatki",tempo:"3 s w d\xF3\u0142, w g\xF3r\u0119",how:"U\u0142\xF3\u017C d\u0142onie pod klatk\u0105 tak, \u017Ceby kciuki i palce wskazuj\u0105ce si\u0119 styka\u0142y i tworzy\u0142y diament. Opuszczaj si\u0119, \u0142okcie id\u0105 do ty\u0142u wzd\u0142u\u017C cia\u0142a. Klatka schodzi w stron\u0119 d\u0142oni.",tip:"Je\u015Bli bol\u0105 ci\u0119 nadgarstki albo \u0142okcie, rozsu\u0144 troch\u0119 d\u0142onie. Pompka w w\u0105skim chwycie anga\u017Cuje triceps prawie tak samo.",lvl:"Oprzyj stopy na krze\u015Ble."},row3:{name:"Szerokie wios\u0142owanie we framudze",muscles:"Tylne barki, g\xF3rna cz\u0119\u015B\u0107 plec\xF3w",tempo:"1 s w g\xF3r\u0119, 1 s trzymaj, 3 s z powrotem",how:"Ustawienie jak przy wios\u0142owaniu we framudze, ale z\u0142ap framug\u0119 na wysoko\u015Bci bark\xF3w i ci\u0105gnij \u0142okie\u0107 na bok, nie wzd\u0142u\u017C cia\u0142a. R\u0119ka i tu\u0142\xF3w tworz\u0105 liter\u0119 T. Powinno by\u0107 czu\u0107 to z ty\u0142u barku i mi\u0119dzy \u0142opatkami.",tip:"Ten k\u0105t trenuje tylne barki i g\xF3r\u0119 plec\xF3w. Dzi\u0119ki nim barki wygl\u0105daj\u0105 z ty\u0142u szerzej i masywniej.",lvl:"Przysu\u0144 stopy bli\u017Cej framugi i odchyl si\u0119 bardziej."},n7:{name:"Uginanie n\xF3g na r\u0119czniku",muscles:"Ty\u0142 ud, po\u015Bladki",tempo:"3 s od siebie, 1 s z powrotem",how:"Po\u0142\xF3\u017C si\u0119 na plecach na g\u0142adkiej pod\u0142odze (drewno, p\u0142ytki), pi\u0119ty na r\u0119czniku albo w skarpetkach. Unie\u015B biodra do mostka. Przez 3 sekundy wysuwaj nogi, a\u017C b\u0119d\u0105 prawie proste, biodra ca\u0142y czas w g\xF3rze. Potem przyci\u0105gnij pi\u0119ty z powrotem do po\u015Bladk\xF3w.",tip:"Na dywanie nie b\u0119dzie si\u0119 \u015Blizga\u0107. Wtedy zr\xF3b zamiast tego mostek na jednej nodze: biodra w g\xF3r\u0119, jedna noga w powietrzu, i zapisuj powt\xF3rzenia na nog\u0119.",lvl:"R\xF3b to jedn\u0105 nog\u0105, drug\u0105 trzymaj w powietrzu."},b4:{name:"Rowerek",muscles:"Mi\u0119\u015Bnie sko\u015Bne, ca\u0142y brzuch",tempo:"powoli, 1 s na stron\u0119",how:"Po\u0142\xF3\u017C si\u0119 na plecach, d\u0142onie za g\u0142ow\u0105, barki nad pod\u0142og\u0105. Przyci\u0105gnij prawy \u0142okie\u0107 do lewego kolana, jednocze\u015Bnie prostuj\u0105c praw\u0105 nog\u0119. Potem zmie\u0144 stron\u0119. Skr\u0119ca si\u0119 tu\u0142\xF3w, nie tylko \u0142okcie.",tip:"R\xF3b to powoli. Szybkie machanie \u0142okciami nic nie daje, tylko obci\u0105\u017Ca szyj\u0119.",lvl:"Zwolnij do 2 s na stron\u0119."},kKnee:{name:"Pompka na kolanach",muscles:"Klatka piersiowa, triceps, przednie barki",tempo:"3 s w d\xF3\u0142, w g\xF3r\u0119",how:"Ukl\u0119knij, d\u0142onie troch\u0119 szerzej ni\u017C barki. Cia\u0142o proste od kolan do g\u0142owy, nie wypychaj bioder. Przez 3 sekundy opuszczaj klatk\u0119 do pod\u0142ogi i wypchnij si\u0119 z powrotem.",tip:"Gdy zrobisz 20 w obu rundach, wr\xF3\u0107 do zwyk\u0142ej pompki."},kIncl:{name:"Pompka z r\u0119kami na podwy\u017Cszeniu",muscles:"Klatka piersiowa, triceps, przednie barki",tempo:"3 s w d\xF3\u0142, w g\xF3r\u0119",how:"Oprzyj d\u0142onie na stabilnym stole, \u0142\xF3\u017Cku albo parapecie. Cia\u0142o proste od pi\u0119t do g\u0142owy. Opu\u015B\u0107 klatk\u0119 do kraw\u0119dzi i wypchnij si\u0119 z powrotem. Im ni\u017Csze podparcie, tym trudniej.",tip:"Dobry zamiennik, gdy na pod\u0142odze bol\u0105 ci\u0119 nadgarstki albo ko\u0144cz\u0105 ci si\u0119 si\u0142y."},superman:{name:"Superman",muscles:"Dolna cz\u0119\u015B\u0107 plec\xF3w, po\u015Bladki, tylne barki",tempo:"w g\xF3r\u0119, 2 s trzymaj, w d\xF eg\u0142a po cegle.","Dzi\u015B 13 minut. Cia\u0142o na ca\u0142e \u017Cycie.","Nigdy nie odpuszczaj dwa razy z rz\u0119du.","Ma\u0142e kroki co drugi dzie\u0144 bij\u0105 wielkie plany, kt\xF3rych nigdy nie zaczynasz.","Twoje przysz\u0142e ja podzi\u0119kuje ci za dzi\u015B.","Nie chodzi o idealny trening. Chodzi o to, \u017Ceby si\u0119 pojawi\u0107.","Tam, gdzie zaczyna pali\u0107, zaczyna si\u0119 wzrost.","Mi\u0119\u015Bnie buduje trening, ale rosn\u0105 dzi\u0119ki jedzeniu i snowi.","Por\xF3wnuj si\u0119 tylko do siebie sprzed tygodnia.","Inni szukaj\u0105 motywacji, a ty masz ju\u017C trening za sob\u0105.","Ci\u0119\u017Ckie serie, \u0142atwiejsze \u017Cycie.","Ka\u017Cdy silny cz\u0142owiek zaczyna\u0142 od zera."],facts:["Mo\u017Cesz trenowa\u0107 codziennie, ale co drugi dzie\u0144 jest najlepiej. Mi\u0119\u015Bnie rosn\u0105 podczas odpoczynku, nie podczas treningu.","Sen to tw\xF3j najlepszy suplement. 7\u20139 godzin na noc = szybsza regeneracja.","Ostatnie powt\xF3rzenia w serii robi\u0105 najwi\u0119cej roboty. To one buduj\u0105 mi\u0119\u015Bnie.","Wolne opuszczanie (3 sekundy) daje mi\u0119\u015Bniom wi\u0119cej pracy ni\u017C szybkie powt\xF3rzenia.","Bia\u0142ko w ka\u017Cdym posi\u0142ku pomaga mi\u0119\u015Bniom rosn\u0105\u0107.","Regularno\u015B\u0107 wygrywa z intensywno\u015Bci\u0105. Lepiej 13 minut co drugi dzie\u0144 ni\u017C godzina raz w miesi\u0105cu.","Napij si\u0119 wody. Nawet lekkie pragnienie obni\u017Ca form\u0119.","Oddychaj powoli: wdech nosem, wydech ustami. Szybciej si\u0119 uspokoisz.","Pe\u0142ny zakres ruchu = wi\u0119cej pracuj\u0105cych mi\u0119\u015Bni. Mniej powt\xF3rze\u0144, ale pe\u0142nych."],moti:["Wierz\u0119 w ciebie, dasz rad\u0119! \u{1F4AA}","Ka\u017Cda seria przybli\u017Ca ci\u0119 do celu.","Masz wi\u0119cej si\u0142y, ni\u017C my\u015Blisz.","Jeszcze troch\u0119, dasz rad\u0119.","Dzisiaj si\u0119 liczy. Nie poddawaj si\u0119.","To jest moment, w kt\xF3rym ro\u015Bniesz.","Twoje przysz\u0142e ja ci podz pFail:"Das Backup konnte nicht gespeichert werden.",msgNotBackup:"Das ist kein Backup aus dieser App.",msgRestored:"\u2713 Daten wiederhergestellt.",msgStreakReset:"Serie zur\xFCckgesetzt.",about:"HW App \xB7 Version {v}",privacy:"Alle deine Daten werden nur auf diesem Ger\xE4t gespeichert.",warmup:"Aufw\xE4rmen",warmupHint:"Etwa 3 Minuten. Mach die \xDCbung und tippe sie an. Sieh auch die erste Runde des Trainings als Aufw\xE4rmen, gib da noch nicht alles.",letsGo:"Los geht's",skipWarmup:"Aufw\xE4rmen \xFCberspringen",videoOf:"Video: {name}",swapTitle:"\xDCbung tauschen",swapHint:"{name} geht nicht? W\xE4hl einen Ersatz. Gilt nur f\xFCr dieses Training, in allen Runden.",swapBack:"\u21A9 Zur\xFCck zum Original: {name}",lastShort:". Letztes Mal {v}",tag_easier:"leichter",tag_noDoor:"ohne T\xFCr",tag_noChair:"ohne Stuhl",tag_hold:"halten",tag_similar:"\xE4hnlich",howTo:"Anleitung",swap:"\u21C4 Tauschen",tempo:"Tempo",lastLine:"Letztes Mal ({date}): {res}",newExHint:"Neue \xDCbung, fang locker an und finde deine Zahl.",rankFrom:"{rank} ab {v}",topRank:"H\xF6chster Rang!",replacing:"ersetzt: {name}",lvlTitle:"\u2B06 Zeit f\xFCr eine schwerere Variante.",lvlBody:"Letztes Mal hast du in jeder Runde das Ziel erreicht.",lastRound:"Letzte Runde. Das ist der Satz, der Muskeln aufbaut: Geh nah ans Muskelversagen, mit 1\u20132 Wiederholungen in Reserve. \u{1F4AA}",less:"Weniger",more:"Mehr",reps:"Wdh.",newRank:"Neuer Rang: {rank}!",pr:"\u{1F3C6} Pers\xF6nlicher Rekord",numFromLast:"Die Zahl basiert auf dem letzten Mal.",numGuess:"Die Zahl ist nur gesch\xE4tzt.",adjust:"Mach den Satz und stell ein, was du wirklich geschafft hast.",doneBtn:"Fertig, {v}",secondsHint:"Sekunden. Nach dem Start hast du 5 s, um in Position zu gehen.",getReady:"in Position gehen",hold:"halten",giveUp:"Geht nicht mehr, stopp",cheerDefault:"Guter Satz!",newPR:"\u{1F3C6} Neuer pers\xF6nlicher Rekord!",roundDone:"Runde geschafft! Pause vor Runde {r} von {n}",rest:"Pause",next:"Als N\xE4chstes",prepare:"Mach deinen Platz bereit, w\xE4hrend der Countdown l\xE4uft.",ready:"Ich bin bereit",coolTitle:"Training geschafft",coolIntro:"Dehnen am Ende ist optional. Fachleute sind sich einig: Es hilft nicht bei Regeneration oder Muskelaufbau, nur bei der Beweglichkeit. Wenn du willst, lohnen sich diese zwei: H\xFCftbeuger (beide Seiten) und Kindhaltung. Insgesamt 90 Sekunden.",coolDone:"\u2713 erledigt",coolPrep:"in Position gehen, {n}",coolHold:"halten, {n} s",hideHowTo:"\u25BE Anleitung ausblenden",showHowTo:"\u25B8 Anleitung",video:"\u25B6 Video",saveWorkout:"Training speichern",skipSave:"\xDCberspringen und speichern",nothingSaved:"Nichts gespeichert",nothingSavedD:"Du hast keinen Satz abgeschlossen, also wurde nichts zum Verlauf hinzugef\xFCgt.",great:"Super gemacht!",dayDate:"Tag {d}, {date}",levelLine:"Level {lvl}, {into} / {need} XP. Serie: {streak} am St\xFCck.",levelUp:"\u26A1 Level-up! Level {lvl}",challengeDone:"\u2713 Challenge geschafft: {text}",nextLine:"N\xE4chstes Training: Tag {d}, am besten {date}",copyAI:"Log f\xFCr KI kopieren",dayRound:"Tag {d}, Runde {r} von {n}",quit:"Beenden",quitSave:"Beenden und speichern?",quitConfirm:"Wirklich beenden?",progressAria:"{done} von {total} erledigt",videoYT:"\u25B6 Video auf YouTube",ladderTitle:"R\xE4nge (bester Satz: {v})",ladderNone:"R\xE4nge (bester Satz: noch keiner)",rankStart:"Start",figureAria:"Zeichnung: {labels}",photoAlt:"Profilfoto"},pl:{workouts:{one:"{n} Training",other:"{n} Trainings"},days:{one:"{n} Tag",other:"{n} Tage"},daysAgo:{one:"vor {n} Tag",other:"vor {n} Tagen"},rounds:{one:"{n} Runde",other:"{n} Runden"},sets:{one:"{n} Satz",other:"{n} S\xE4tze"},prs:{one:"{n} pers\xF6nlicher Rekord",other:"{n} pers\xF6nliche Rekorde"}},units:{arm:"/Arm",leg:"/Bein",side:"/Seite"},perUnit:{arm:"pro Arm",leg:"pro Bein",side:"pro Seite"},themes:{navy:"Marine",black:"Schwarz",forest:"Wald",plum:"Pflaume"},ranks:["Holz","Eisen","Bronze","Silber","Gold","Platin","Diamant"],ex:{k1:{name:"Liegest\xFCtz",muscles:"Brust, Trizeps, vordere Schultern",tempo:"3 s runter, kurze Pause, hoch",how:"H\xE4nde etwas weiter als schulterbreit, K\xF6rper gerade von Kopf bis Ferse, Bauch und Po angespannt. Senk dich 3 Sekunden lang ab, bis deine Brust fast den Boden ber\xFChrt, halte kurz und dr\xFCck dich wieder hoch. Ellbogen etwa im 45\xB0-Winkel zum K\xF6rper, nicht nach au\xDFen abspreizen.",tip:"Sobald du in der ersten Runde 25+ schaffst, stell die H\xE4nde auf zwei dicke B\xFCcher. Deine Brust geht tiefer, der Muskel wird st\xE4rker gedehnt und w\xE4chst mehr.",lvl:"Stell die H\xE4nde auf zwei dicke B\xFCcher, damit deine Brust tiefer geht. Deine Zahlen sinken erst mal, das ist okay."},row1:{name:"T\xFCrrahmen-Rudern",muscles:"R\xFCcken (Latissimus), hintere Schultern, Bizeps",tempo:"1 s ziehen, 1 s halten, 3 s zur\xFCck",how:"Stell dich seitlich in eine offene T\xFCr. Greif den Rahmen mit einer Hand auf Brusth\xF6he, F\xFC\xDFe direkt am Rahmen. Lehn dich mit gestrecktem Arm und geradem K\xF6rper zur\xFCck. Zieh dich zum Rahmen: Ellbogen nah am K\xF6rper nach hinten, Schulterblatt nach hinten ziehen. Langsam zur\xFCck. Alle Wiederholungen mit einem Arm, dann mit dem anderen.",tip:"Je n\xE4her deine F\xFC\xDFe am Rahmen sind und je weiter du dich zur\xFCcklehnst, desto schwerer wird's. Halt dich am festen Rahmen fest, nicht an der T\xFCr, und trainier barfu\xDF, damit deine F\xFC\xDFe nicht wegrutschen.",lvl:"Stell die F\xFC\xDFe n\xE4her an den Rahmen und lehn dich weiter zur\xFCck."},n1:{name:"ATG-Kniebeuge",muscles:"Oberschenkelvorderseite, Po",tempo:"3 s runter, 1 s Pause unten, hoch",how:"F\xFC\xDFe schulterbreit, Zehen leicht nach au\xDFen. Geh 3 Sekunden lang so tief runter, wie du kannst, Oberschenkel unter Knieh\xF6he, Fersen am Boden. Halte unten 1 Sekunde und steh auf.",tip:"Das langsame Tempo und die Pause machen aus einer leichten Kniebeuge eine harte. Wenn du auch mit Tempo 20+ schaffst, wechsel zur schwereren Variante.",lvl:"Mach eine 1\xBC-Kniebeuge: runter, ein Viertel hoch, wieder ganz runter, dann hoch. Das ist 1 Wiederholung."},b5:{name:"Unterarmst\xFCtz",muscles:"Gesamter Rumpf",how:"Unterarme unter den Schultern, K\xF6rper gerade von Kopf bis Ferse. Spann Bauch und Po an, als w\xFCrde dir gleich jemand in den Bauch boxen. H\xFCfte weder hochschieben noch durchh\xE4ngen lassen.",tip:"Sobald du in beiden Runden 60 s h\xE4ltst, heb w\xE4hrend des Unterarmst\xFCtzes ein Bein (abwechselnd). Das ist deutlich schwerer.",lvl:"Heb w\xE4hrend des Unterarmst\xFCtzes ein Bein und wechsel nach der H\xE4lfte der Zeit."},r1:{name:"Pike Push-up",muscles:"Schultern, Trizeps",tempo:"3 s runter, hoch",how:"Geh in ein umgedrehtes V: H\xE4nde am Boden, H\xFCfte hoch, Beine so gestreckt wie m\xF6glich. Beug die Ellbogen und senk deinen Scheitel knapp vor den H\xE4nden zum Boden, sodass H\xE4nde und Kopf ein Dreieck bilden. Dr\xFCck dich wieder hoch.",tip:"Sobald du in beiden Runden 15+ schaffst, stell die F\xFC\xDFe auf einen Stuhl. So lastet mehr Gewicht auf deinen Schultern.",lvl:"Stell die F\xFC\xDFe auf einen Stuhl."},row2:{name:"T\xFCr-Rudern mit Handtuch",muscles:"Mittlerer R\xFCcken, Schulterbl\xE4tter, Bizeps",tempo:"1 s ziehen, 1 s halten, 3 s zur\xFCck",how:"\xD6ffne die T\xFCr und stell dich frontal vor ihre Kante, die T\xFCr zwischen deinen F\xFC\xDFen. Leg ein Handtuch um beide Klinken und halt die Enden fest, oder greif direkt beide Klinken. Lehn dich mit gestreckten Armen und geradem K\xF6rper zur\xFCck. Zieh die Brust zur T\xFCrkante, dr\xFCck die Schulterbl\xE4tter zusammen und geh langsam zur\xFCck.",tip:"Check zuerst, ob die Klinken fest sind und sich nicht bewegen. Wenn sich irgendwas bewegt, mach stattdessen T\xFCrrahmen-Rudern (Tag A). Sicherheit geht vor.",lvl:"Stell die F\xFC\xDFe n\xE4her an die T\xFCr und lehn dich weiter zur\xFCck."},n2:{name:"Bulgarische Kniebeuge",muscles:"Oberschenkelvorderseite, Po",tempo:"3 s runter, hoch",how:"Stell dich vor einen Stuhl und leg den Spann deines hinteren Fu\xDFes auf die Sitzfl\xE4che. Mach mit dem vorderen Fu\xDF einen gro\xDFen Schritt nach vorn. Senk dich 3 Sekunden lang ab, das hintere Knie geht Richtung Boden. Dr\xFCck dich \xFCber die Ferse des vorderen Fu\xDFes hoch.",tip:"Stell den vorderen Fu\xDF so weit nach vorn, dass dein Knie \xFCber dem Fu\xDF bleibt. Oberk\xF6rper leicht nach vorn geneigt = mehr Po.",lvl:"Langsamer: 4 s runter und 2 s Pause unten."},b2:{name:"Dead Bug",muscles:"Tiefe Bauchmuskulatur",tempo:"langsam, 2 s raus, 2 s zur\xFCck",how:"Leg dich auf den R\xFCcken, Arme gestreckt zur Decke, Beine angehoben mit Knien im 90\xB0-Winkel. Senk langsam den rechten Arm hinter den Kopf und das linke Bein Richtung Boden, dann zur\xFCck und Seite wechseln.",tip:"Dein unterer R\xFCcken muss die ganze Zeit fest am Boden bleiben. Wenn er abhebt, senk das Bein nicht so weit ab.",lvl:"Arm und Bein langsamer absenken, 3 s raus und 3 s zur\xFCck."},k3:{name:"Diamant-Liegest\xFCtz",muscles:"Trizeps, innere Brust",tempo:"3 s runter, hoch",how:"Setz die H\xE4nde unter deine Brust, sodass sich Daumen und Zeigefinger ber\xFChren und eine Raute bilden. Senk dich ab, die Ellbogen gehen nah am K\xF6rper nach hinten. Deine Brust geht Richtung H\xE4nde.",tip:"Wenn Handgelenke oder Ellbogen wehtun, nimm die H\xE4nde etwas auseinander. Ein enger Liegest\xFCtz trainiert den Trizeps fast genauso.",lvl:"Stell die F\xFC\xDFe auf einen Stuhl."},row3:{name:"Breites T\xFCrrahmen-Rudern",muscles:"Hintere Schultern, oberer R\xFCcken",tempo:"1 s ziehen, 1 s halten, 3 s zur\xFCck",how:"Gleiche Position wie beim T\xFCrrahmen-Rudern, aber greif den Rahmen auf Schulterh\xF6he und zieh den Ellbogen seitlich nach au\xDFen, nicht am K\xF6rper entlang. Arm und Oberk\xF6rper bilden ein T. Du solltest es hinten an der Schulter und zwischen den Schulterbl\xE4ttern sp\xFCren.",tip:"Dieser Winkel trainiert hintere Schultern und oberen R\xFCcken. Sie lassen deine Schultern von hinten breiter und kr\xE4ftiger wirken.",lvl:"Stell die F\xFC\xDFe n\xE4her an den Rahmen und lehn dich weiter zur\xFCck."},n7:{name:"Beinbeuger mit Handtuch",muscles:"Oberschenkelr\xFCckseite, Po",tempo:"3 s raus, 1 s zur\xFCck",how:"Leg dich auf einem glatten Boden (Holz, Fliesen) auf den R\xFCcken, Fersen auf einem Handtuch oder in Socken. Heb die H\xFCfte in eine Br\xFCcke. Schieb die Beine 3 Sekunden lang nach vorn, bis sie fast gestreckt sind, H\xFCfte bleibt oben. Dann zieh die Fersen zur\xFCck zum Po.",tip:"Auf Teppich rutscht es nicht. Mach dann stattdessen eine einbeinige Glute Bridge: H\xFCfte hoch, ein Bein in der Luft, und trag die Wiederholungen pro Bein ein.",lvl:"Mach's mit einem Bein, das andere bleibt in der Luft."},b4:{name:"Bicycle Crunch",muscles:"Seitliche Bauchmuskeln, gesamter Bauch",tempo:"langsam, 1 s pro Seite",how:"Leg dich auf den R\xFCcken, H\xE4nde hinter dem Kopf, Schultern vom Boden abgehoben. F\xFChr den rechten Ellbogen zum linken Knie und streck dabei das rechte Bein. Dann wechseln. Dein Oberk\xF6rper dreht sich mit, nicht nur die Ellbogen.",tip:"Mach langsam. Schnelles Ellbogen-Flattern bringt nichts au\xDFer einem verspannten Nacken.",lvl:"Langsamer: 2 s pro Seite."},kKnee:{name:"Knie-Liegest\xFCtz",muscles:"Brust, Trizeps, vordere Schultern",tempo:"3 s runter, hoch",how:"Geh auf die Knie, H\xE4nde etwas weiter als schulterbreit. K\xF6rper gerade von Knien bis Kopf, Po nicht rausstrecken. Senk die Brust 3 Sekunden lang zum Boden und dr\xFCck dich wieder hoch.",tip:"Sobald du in beiden Runden 20 schaffst, geh zur\xFCck zum normalen Liegest\xFCtz."},kIncl:{name:"Incline-Liegest\xFCtz",muscles:"Brust, Trizeps, vordere Schultern",tempo:"3 s runter, hoch",how:"St\xFCtz die H\xE4nde auf einen stabilen Tisch, ein Bett oder eine Fensterbank. K\xF6rper gerade von Ferse bis Kopf. Senk die Brust zur Kante und dr\xFCck dich zur\xFCck. Je niedriger die Auflage, desto schwerer.",tip:"Guter Ersatz, wenn dir am Boden die Handgelenke wehtun oder die Kraft ausgeht."},superman:{name:"Superman",muscles:"Unterer R\xFCcken, Po, hintere Schultern",tempo:"hoch, 2 s halten, runter",how:"Leg dich auf den Bauch, Arme nach vorn gestreckt. Heb Arme, Brust und Beine gleichzeitig vom Boden, halte 2 Sekunden und senk sie langsam ab. Blick zum Boden, Kopf nicht in den Nacken legen.",tip:"Es ist keine Zug\xFCbung wie Rudern, aber es st\xE4rkt deinen R\xFCcken, wenn du nirgends rudern kannst."},ytw:{name:"Y-T-W am Boden",muscles:"Mittlerer und oberer R\xFCcken, hintere Schultern",tempo:"jede Position 1 s halten",how:"Leg dich auf den Bauch, Stirn auf einem Handtuch. Heb die gestreckten Arme zu einem Y und halte 1 s. Dann seitlich zu einem T. Zum Schluss zieh die Ellbogen zu den Rippen zu einem W und dr\xFCck die Schulterbl\xE4tter zusammen. Y + T + W = 1 Wiederholung.",tip:"Daumen zeigen nach oben, Schultern weg von den Ohren."},lunge:{name:"Ausfallschritt r\xFCckw\xE4rts",muscles:"Oberschenkelvorderseite, Po",tempo:"2 s runter, hoch",how:"Steh aufrecht. Mach einen gro\xDFen Schritt nach hinten, das hintere Knie geht fast bis zum Boden, das vordere Knie beugt sich auf 90\xB0. Dr\xFCck dich \xFCber die Ferse des vorderen Fu\xDFes zur\xFCck in den Stand. Alle Wiederholungen mit einem Bein, dann mit dem anderen.",tip:"Schonender f\xFCr die Knie als ein Ausfallschritt nach vorn. Oberk\xF6rper aufrecht halten."},bridge:{name:"Glute Bridge",muscles:"Po, Oberschenkelr\xFCckseite",tempo:"hoch, 2 s anspannen, runter",how:"Leg dich auf den R\xFCcken, Knie angewinkelt, F\xFC\xDFe am Boden. Dr\xFCck dich \xFCber die Fersen hoch und heb die H\xFCfte, bis dein K\xF6rper von Knien bis Schultern eine gerade Linie bildet. Spann oben 2 Sekunden den Po an und senk dich langsam ab.",tip:"Schwerere Variante: ein Bein in der Luft. Dann trag die Wiederholungen pro Bein ein."},wallsit:{name:"Wall Sit",muscles:"Oberschenkelvorderseite",how:"Lehn dich mit dem R\xFCcken an eine Wand und rutsch runter, bis deine Oberschenkel parallel zum Boden sind und die Knie im 90\xB0-Winkel. Ganzer R\xFCcken an der Wand, Knie \xFCber den Kn\xF6cheln. Halten.",tip:"Leg die H\xE4nde nicht auf die Oberschenkel, sonst hilfst du nach."},birddog:{name:"Bird Dog",muscles:"Rumpf, unterer R\xFCcken, Po",tempo:"strecken, 2 s halten, zur\xFCck",how:"Geh in den Vierf\xFC\xDFlerstand: H\xE4nde unter den Schultern, Knie unter der H\xFCfte. Streck gleichzeitig den rechten Arm nach vorn und das linke Bein nach hinten, K\xF6rper in einer geraden Linie. Halte 2 Sekunden, geh zur\xFCck und wechsel die Seite.",tip:"Deine H\xFCfte darf sich nicht verdrehen. Stell dir ein Glas Wasser auf deinem unteren R\xFCcken vor."},hollow:{name:"Hollow Body Hold",muscles:"Gesamter Rumpf",how:"Leg dich auf den R\xFCcken, Arme hinter dem Kopf gestreckt. Dr\xFCck den unteren R\xFCcken in den Boden und heb Schultern und gestreckte Beine ein St\xFCck vom Boden ab. Halte, ohne dich zu bewegen.",tip:"Wenn dein unterer R\xFCcken vom Boden abhebt, nimm die Beine h\xF6her oder winkel sie an."},legraise:{name:"Beinheben",muscles:"Unterer Bauch, H\xFCftbeuger",tempo:"2 s hoch, 2 s runter",how:"Leg dich auf den R\xFCcken, Arme neben dem K\xF6rper. Heb die gestreckten Beine langsam, bis sie senkrecht sind, und senk sie langsam fast bis zum Boden, aber leg sie nicht ab. Dein unterer R\xFCcken bleibt am Boden.",tip:"Wenn dir der untere R\xFCcken wehtut, winkel die Knie an."}},warm:{w1:{name:"Armkreisen",dose:"15\xD7 vorw\xE4rts, 15\xD7 r\xFCckw\xE4rts",why:"Lockert deine Schultern vor Liegest\xFCtzen und Rudern."},w2:{name:"Beinpendeln",dose:"10\xD7 pro Bein, an der Wand festhalten",why:"Lockert deine H\xFCfte vor Kniebeugen."},w3:{name:"World's Greatest Stretch",dose:"5\xD7 pro Seite",why:"H\xFCfte, oberer R\xFCcken und Oberschenkelr\xFCckseite auf einmal."},w4:{name:"Inchworm",dose:"5\xD7",why:"W\xE4rmt den ganzen K\xF6rper auf und bringt dich in den Liegest\xFCtz."}},cool:{c1:{name:"H\xFCftbeuger, links",why:"Viel Sitzen (Schule, Computer) verk\xFCrzt die Vorderseite deiner H\xFCfte. Wenn du nur eine Dehnung machst, dann diese.",how:"Knie dich auf das linke Knie, rechter Fu\xDF vorne. Spann den Po an und schieb die H\xFCfte nach vorn, bis du eine Dehnung vorne an der linken H\xFCfte sp\xFCrst. Kein Hohlkreuz machen."},c2:{name:"H\xFCftbeuger, rechts",why:"Das Gleiche auf der anderen Seite.",how:"Knie dich auf das rechte Knie, linker Fu\xDF vorne. Spann den Po an und schieb die H\xFCfte nach vorn."},c3:{name:"Kindhaltung",why:"Beruhigt deine Atmung und entspannt den R\xFCcken. Einfach nur zum Wohlf\xFChlen.",how:"Knie auseinander, setz die H\xFCfte zur\xFCck auf die Fersen, streck die Arme so weit wie m\xF6glich nach vorn, Stirn auf den Boden. Atme langsam."}},fig:{k1:["Oben","Unten"],k3:["Oben","Unten, Ellbogen eng"],b5:["Richtig: K\xF6rper gerade","Falsch: Hohlkreuz"],n1:["Start","Unten, Fersen am Boden"],r1:["Oben","Unten, Kopf vor den H\xE4nden"],row1:["Start, Arm gestreckt","Ziehen, Ellbogen nach hinten"],row3:["Start, Hand auf Schulterh\xF6he","Ellbogen hoch zur Seite"],row2:["Start, Arme gestreckt","Brust zur T\xFCr"],n2:["Oben","Unten, hinteres Knie zum Boden"],b2:["Start","Arm und Gegenbein runter"],n7:["H\xFCfte hoch, Fersen am Po","Beine raus, H\xFCfte bleibt oben"],b4:["Ellbogen zum Gegenknie","Seite wechseln"],kKnee:["Oben, Knie am Boden","Unten"],kIncl:["H\xE4nde auf dem Tisch, oben","Brust zur Kante"],superman:["Auf dem Bauch liegen","Heben, 2 s halten"],ytw:["Y: Arme nach vorn oben","W: Ellbogen zu den Rippen"],lunge:["Start","Schritt zur\xFCck, Knie zum Boden"],bridge:["Liegen, Knie angewinkelt","H\xFCfte hoch, Po anspannen"],wallsit:["Oberschenkel waagrecht, R\xFCcken an der Wand"],birddog:["Vierf\xFC\xDFlerstand","Arm und Gegenbein"],hollow:["Unterer R\xFCcken fest am Boden"],legraise:["Beine oben","Langsam runter, nicht ablegen"],hf:["Hinteres Knie unten, H\xFCfte vor"],child:["H\xFCfte zu den Fersen, Arme weit vor"]},ch:{w3:"3 Trainings machen",pr1:"Einen pers\xF6nlichen Rekord brechen",r3:"Einmal 3 Runden machen",warm:"2\xD7 komplett aufw\xE4rmen",cool:"2\xD7 nach dem Training dehnen",push100:"100 Liegest\xFCtze insgesamt (alle Arten)",rank:"Einen neuen Rang erreichen",reps300:"300 Wiederholungen insgesamt",legs100:"100 Bein-Wiederholungen"},ach:{first:["Erster Schritt","1. Training"],w5:["High Five","5 Trainings"],w10:["Perfekte Zehn","10 Trainings"],w25:["Vierteljahrhundert","25 Trainings"],w50:["Halbes Jahrhundert","50 Trainings"],s3:["L\xE4uft bei dir","Serie von 3"],s7:["Unaufhaltsam","Serie von 7"],s15:["Disziplin","Serie von 15"],pr:["Rekordbrecher","1. pers\xF6nlicher Rekord"],gold:["Goldwert","Gold in 1 \xDCbung"],diamond:["Diamant","Diamant in 1 \xDCbung"],week:["Perfekte Woche","Alle 3 Challenges"],lvl5:["Level 5","Erreiche Level 5"],r3:["Drei Runden","Mach 3 Runden"],push30:["Drei\xDFig","30 Liegest\xFCtze in einem Satz"]},quotes:["Disziplin bringt dich dahin, wo Motivation nicht hinkommt.","Du musst keine Lust haben. Mach einfach den ersten Satz, der Rest kommt von allein.","Jede Wiederholung ist ein Ziegelstein. Ein K\xF6rper wird Stein f\xFCr Stein gebaut.","Heute 13 Minuten. Ein K\xF6rper f\xFCrs Leben.","Setz nie zweimal hintereinander aus.","Kleine Schritte jeden zweiten Tag schlagen gro\xDFe Pl\xE4ne, die du nie anf\xE4ngst.","Dein zuk\xFCnftiges Ich wird dir f\xFCr heute danken.","Es geht nicht ums perfekte Training. Es geht ums Dranbleiben.","Wo es anf\xE4ngt zu brennen, beginnt das Wachstum.","Muskeln werden im Training aufgebaut, aber sie wachsen durch Essen und Schlaf.","Vergleich dich nur mit dem, der du letzte Woche warst.","W\xE4hrend andere noch Motivation suchen, hast du schon trainiert.","Harte S\xE4tze, leichteres Leben.","Jeder starke Mensch hat mal bei null angefangen."],facts:["Du kannst jeden Tag trainieren, aber jeden zweiten Tag ist am besten. Muskeln wachsen in der Pause, nicht beim Training.","Schlaf ist dein bestes Supplement. 7\u20139 Stunden pro Nacht = schnellere Regeneration.","Die letzten Wiederholungen eines Satzes leisten die meiste Arbeit. Genau die bauen Muskeln auf.","Langsames Absenken (3 Sekunden) gibt deinen Muskeln mehr Arbeit als schnelle Wiederholungen.","Protein in jeder Mahlzeit hilft deinen Muskeln beim Wachsen.","Regelm\xE4\xDFigkeit schl\xE4gt Intensit\xE4t. Lieber 13 Minuten jeden zweiten Tag als eine Stunde einmal im Monat.","Trink etwas Wasser. Schon leichter Durst senkt deine Leistung.","Atme langsam: durch die Nase ein, durch den Mund aus. So beruhigst du dich schneller.","Volle Bewegungsamplitude = mehr Muskeln im Einsatz. Weniger Wiederholungen, daf\xFCr vollst\xE4ndige."],moti:["Ich glaub an dich, du schaffst das! \u{1F4AA}","Jeder Satz bringt dich deinem Ziel n\xE4her.","Du bist st\xE4rker, als du denkst.","Nur noch ein bisschen, du packst das.","Heute z\xE4hlt. Gib nicht auf.","Genau jetzt w\xE4chst du.","Dein zuk\xFCnftiges Ich wird dir danken."],cheers:["Starker Satz!","So geht das!","Beast Mode!","Du bist on fire!","Saubere Arbeit!","So baut man einen starken K\xF6rper.","Fast geschafft!"],finish:["Wieder ein Stein in der Mauer. So geht das.","Geschafft. Jetzt gut essen und schlafen, dann wachsen die Muskeln.","St\xE4rke ist kein Talent. Sie ist die Summe aus genau solchen Tagen.","Fertig. Das ist Disziplin in Aktion.","Heute hast du gemacht, was die meisten nur planen."]};var up={ui:{loading:"Cargando\u2026",close:"Cerrar",cancel:"Cancelar",save:"Guardar",home:"Inicio",back:"Atr\xE1s",start:"Empezar",stop:"Parar",copied:"\u2713 Copiado",dayN:"D\xEDa {d}",tabTrain:"Entrenar",tabHistory:"Historial",tabSettings:"Ajustes",tabProfile:"Perfil",mainMenu:"Men\xFA principal",openProfile:"Abrir perfil",streakAria:"Racha {n}",levelAria:"Nivel {n}",weeklyChallenges:"Retos semanales",chLeft:"{done}/3, {left} por delante",chFooter:"Completa los 3 y ganas un \u{1F9CA} protector de racha.",firstWorkout:"Tu primer entrenamiento. \xA1Vamos!",anytime:"Cuando quieras.",idealOn:"Lo ideal: {date}, porque entrenas en d\xEDas alternos.",trainedYesterday:"Ayer entrenaste el d\xEDa {day}. Seg\xFAn el plan (d\xEDas alternos), el pr\xF3ximo entrenamiento es ma\xF1ana, pero tambi\xE9n "\xA1Nuevo rango: {rank}!",pr:"\u{1F3C6} R\xE9cord personal",numFromLast:"El n\xFAmero viene de la \xFAltima vez.",numGuess:"El n\xFAmero es solo una estimaci\xF3n.",adjust:"Haz la serie y c\xE1mbialo por lo que hiciste de verdad.",doneBtn:"Hecho, {v}",secondsHint:"segundos. Al empezar, tienes 5 s para ponerte en posici\xF3n.",getReady:"ponte en posici\xF3n",hold:"aguanta",giveUp:"No puedo m\xE1s, parar",cheerDefault:"\xA1Buena serie!",newPR:"\u{1F3C6} \xA1Nuevo r\xE9cord personal!",roundDone:"\xA1Ronda terminada! Descansa antes de la ronda {r} de {n}",rest:"Descanso",next:"Siguiente",prepare:"Prepara tu sitio mientras corre el tiempo.",ready:"\xA1Vamos!",coolTitle:"Entrenamiento terminado",coolIntro:"Estirar al final es opcional. Los expertos coinciden en que no ayuda a la recuperaci\xF3n ni al crecimiento muscular, solo a la flexibilidad. Si te apetece, estos dos tienen sentido: flexor de cadera (ambos lados) y postura del ni\xF1o. 90 segundos en total.",coolDone:"\u2713 hecho",coolPrep:"ponte en posici\xF3n, {n}",coolHold:"aguanta, {n} s",hideHowTo:"\u25BE ocultar instrucciones",showHowTo:"\u25B8 c\xF3mo se hace",video:"\u25B6 Video",saveWorkout:"Guardar entrenamiento",skipSave:"Saltar y guardar entrenamiento",nothingSaved:"No se guard\xF3 nada",nothingSavedD:"No terminaste ninguna serie, as\xED que no se a\xF1adi\xF3 nada a tu historial.",great:"\xA1Buen trabajo!",dayDate:"D\xEDa {d}, {date}",levelLine:"Nivel {lvl}, {into} / {need} XP. Racha: {streak}.",levelUp:"\u26A1 \xA1Subiste de nivel! Nivel {lvl}",challengeDone:"\u2713 Reto completado: {text}",nextLine:"Pr\xF3ximo entrenamiento: d\xEDa {d}, idealmente el {date}",copyAI:"Copiar registro para IA",dayRound:"D\xEDa {d}, ronda {r} de {n}",quit:"Salir",quitSave:"\xBFSalir y guardar?",quitConfirm:"\xBFSeguro que quieres salir?",progressAria:"{done} de {total} hechos",videoYT:"\u25B6 Video en YouTube",ladderTitle:"Rangos (mejor serie: {v})",ladderNone:"Rangos (mejor serie: a\xFAn ninguna)",rankStart:"inicio",figureAria:"Dibujo: {labels}",photoAlt:"Foto de perfil"},pl:{workouts:{one:"{n} entrenamiento",other:"{n} entrenamientos"},days:{one:"{n} d\xEDa",other:"{n} d\xEDas"},daysAgo:{one:"hace {n} d\xEDa",other:"hace {n} d\xEDas"},rounds:{one:"{n} ronda",other:"{n} rondas"},sets:{one:"{n} serie",other:"{n} series"},prs:{one:"{n} r\xE9cord personal",other:"{n} r\xE9cords personales"}},units:{arm:"/brazo",leg:"/pierna",side:"/lado"},perUnit:{arm:"por brazo",leg:"por pierna",side:"por lado"},themes:{navy:"Marino",black:"Negro",forest:"Bosque",plum:"Ciruela"},ranks:["Madera","Hierro","Bronce","Plata","Oro","Platino","Diamante"],ex:{k1:{name:"Flexi\xF3n",muscles:"Pecho, tr\xEDceps, deltoides anterior",tempo:"3 s abajo, pausa corta, arriba",how:"Manos un poco m\xE1s abiertas que los hombros, cuerpo recto de la cabeza a los talones, abdomen y gl\xFAteos apretados. Baja durante 3 segundos hasta que el pecho casi toque el suelo, aguanta un instante y vuelve a subir. Mant\xE9n los codos a unos 45\xB0 del cuerpo, no abiertos hacia los lados.",tip:"Cuando llegues a 25+ en la primera ronda, apoya las manos en dos libros gruesos. El pecho baja m\xE1s, el m\xFAsculo se estira m\xE1s y crece m\xE1s.",lvl:"Apoya las manos en dos libros gruesos para que el pecho baje m\xE1s. Al principio har\xE1s menos reps, es normal."},row1:{name:"Remo en el marco de la puerta",muscles:"Espalda (dorsales), deltoides posterior, b\xEDceps",tempo:"1 s arriba, 1 s pausa, 3 s de vuelta",how:"Ponte en una puerta abierta, de lado al marco. Agarra el marco con una mano a la altura del pecho, con los pies justo al lado del marco. Incl\xEDnate hacia atr\xE1s con el brazo estirado y el cuerpo recto. Tira de ti hacia el marco: el codo va hacia atr\xE1s pegado al cuerpo, lleva el om\xF3plato hacia atr\xE1s. Vuelve despacio. Haz todas las reps con un brazo y luego con el otro.",tip:"Cuanto m\xE1s cerca del marco est\xE9n tus pies y m\xE1s te inclines hacia atr\xE1s, m\xE1s dif\xEDcil es. Agarra el marco firme, no la puerta, y entrena sin zapatos ni calcetines para que los pies no resbalen.",lvl:"Acerca los pies al marco e incl\xEDnate m\xE1s hacia atr\xE1s."},n1:{name:"Sentadilla ATG",muscles:"Cu\xE1driceps, gl\xFAteos",tempo:"3 s abajo, 1 s de pausa abajo, arriba",how:"Pies a la anchura de los hombros, puntas un poco hacia fuera. Baja durante 3 segundos lo m\xE1s profundo que puedas, con los muslos por debajo de las rodillas y los talones en el suelo. Aguanta 1 segundo abajo y sube.",tip:"El ritmo lento y la pausa convierten una sentadilla f\xE1cil en una dif\xEDcil. Si haces 20+ incluso con este ritmo, pasa a la versi\xF3n m\xE1s dif\xEDcil.",lvl:"Haz una sentadilla 1\xBC: bajas, subes un cuarto, vuelves a bajar del todo y subes. Eso es 1 rep."},b5:{name:"Plancha",muscles:"Todo el core",how:"Antebrazos debajo de los hombros, cuerpo recto de la cabeza a los talones. Aprieta el abdomen y los gl\xFAteos como si alguien fuera a darte un golpe en el est\xF3mago. No dejes que la cadera suba ni se hunda.",tip:"Cuando aguantes 60 s en las dos rondas, levanta una pierna durante la plancha (alternando). Es mucho m\xE1s dif\xEDcil.",lvl:"Levanta una pierna durante la plancha y cambia de pierna a la mitad."},r1:{name:"Flexi\xF3n pike",muscles:"Hombros, tr\xEDceps",tempo:"3 s abajo, arriba",how:"Ponte en V invertida: manos en el suelo, cadera alta, piernas lo m\xE1s rectas que puedas. Dobla los codos y baja la coronilla hacia el suelo justo delante de las manos, de modo que manos y cabeza formen un tri\xE1ngulo. Vuelve a subir.",tip:"Cuando hagas 15+ en las dos rondas, pon los pies en una silla. As\xED cargas m\xE1s peso sobre los hombros.",lvl:"Pon los pies en una silla."},row2:{name:"Remo con toalla en la puerta",muscles:"Espalda media, om\xF3platos, b\xEDceps",tempo:"1 s arriba, 1 s pausa, 3 s de vuelta",how:"Abre la puerta y col\xF3cate de frente al canto, con la puerta entre los pies. Pasa una toalla alrededor de los dos pomos y ag\xE1rrala por los extremos, o agarra los dos pomos directamente. Incl\xEDnate hacia atr\xE1s con los brazos estirados y el cuerpo recto. Lleva el pecho hacia el canto de la puerta, junta los om\xF3platos y baja despacio.",tip:"Primero comprueba que los pomos est\xE9n firmes y no se muevan. Si algo se mueve, haz mejor el remo en el marco de la puerta (d\xEDa A). La seguridad es lo primero.",lvl:"Acerca los pies a la puerta e incl\xEDnate m\xE1s hacia atr\xE1s."},n2:{name:"Sentadilla b\xFAlgara",muscles:"Cu\xE1driceps, gl\xFAteos",tempo:"3 s abajo, arriba",how:"Ponte delante de una silla y apoya el empeine del pie de atr\xE1s en el asiento. Da un paso largo hacia delante con el otro pie. Baja durante 3 segundos, con la rodilla de atr\xE1s yendo hacia el suelo. Sube empujando con el tal\xF3n del pie de delante.",tip:"Adelanta el pie de delante lo suficiente para que la rodilla quede sobre el pie. Inclinar un poco el torso hacia delante = m\xE1s gl\xFAteos.",lvl:"Ve m\xE1s lento: 4 s abajo y 2 s de pausa abajo."},b2:{name:"Dead bug",muscles:"M\xFAsculos abdominales profundos",tempo:"despacio, 2 s afuera, 2 s de vuelta",how:"T\xFAmbate boca arriba, brazos estirados hacia el techo, piernas en el aire con las rodillas a 90\xB0. Baja despacio el brazo derecho por detr\xE1s de la cabeza y la pierna izquierda hacia el suelo, luego vuelve y cambia de lado.",tip:"La zona lumbar tiene que quedarse pegada al suelo todo el tiempo. Si se levanta, no bajes tanto la pierna.",lvl:"Baja el brazo y la pierna m\xE1s despacio, 3 s afuera y 3 s de vuelta."},k3:{name:"Flexi\xF3n diamante",muscles:"Tr\xEDceps, parte interna del pecho",tempo:"3 s abajo, arriba",how:"Coloca las manos debajo del pecho, de modo que los pulgares y los \xEDndices se toquen y formen un diamante. Baja con los codos yendo hacia atr\xE1s pegados al cuerpo. El pecho va hacia las manos.",tip:"Si te duelen las mu\xF1ecas o los codos, separa un poco las manos. Una flexi\xF3n con agarre cerrado trabaja los tr\xEDceps casi igual.",lvl:"Pon los pies en una silla."},row3:{name:"Remo abierto en el marco de la puerta",muscles:"Deltoides posterior, espalda alta",tempo:"1 s arriba, 1 s pausa, 3 s de vuelta",how:"Misma posici\xF3n que el remo en el marco de la puerta, pero agarra el marco a la altura del hombro y lleva el codo hacia el lado, no pegado al cuerpo. El brazo y el torso forman una T. Deber\xEDas sentirlo en la parte de atr\xE1s del hombro y entre los om\xF3platos.",tip:"Este \xE1ngulo trabaja el deltoides posterior y la espalda alta. Hacen que los hombros se vean m\xE1s anchos y gruesos por detr\xE1s.",lvl:"Acerca los pies al marco e incl\xEDnate m\xE1s hacia atr\xE1s."},n7:{name:"Curl femoral con toalla",muscles:"Isquiotibiales, gl\xFAteos",tempo:"3 s afuera, 1 s de vuelta",how:"T\xFAmbate boca arriba en un suelo liso (madera, baldosas), con los talones sobre una toalla o en calcetines. Sube la cadera en puente. Desliza las piernas hacia fuera durante 3 segundos hasta que est\xE9n casi rectas, con la cadera todav\xEDa arriba. Luego lleva los talones de vuelta hacia los gl\xFAteos.",tip:"En alfombra no se desliza. En ese caso haz un puente a una pierna: cadera arriba, una pierna en el aire, y apunta las reps por pierna.",lvl:"Hazlo con una pierna y mant\xE9n la otra en el aire."},b4:{name:"Abdominal bicicleta",muscles:"Oblicuos, todo el abdomen",tempo:"despacio, 1 s por lado",how:"T\xFAmbate boca arriba, manos detr\xE1s de la cabeza, hombros despegados del suelo. Lleva el codo derecho hacia la rodilla izquierda mientras estiras la pierna derecha. Luego cambia. Gira el torso, no solo los codos.",tip:"Ve despacio. Mover los codos r\xE1pido no sirve de nada, solo carga el cuello.",lvl:"Ve m\xE1s lento: 2 s por lado."},kKnee:{name:"Flexi\xF3n de rodillas",muscles:"Pecho, tr\xEDceps, deltoides anterior",tempo:"3 s abajo, arriba",how:"De rodillas, manos un poco m\xE1s abiertas que los hombros. Mant\xE9n el cuerpo recto de las rodillas a la cabeza, sin sacar la cadera. Baja el pecho al suelo durante 3 segundos y vuelve a subir.",tip:"Cuando hagas 20 en las dos rondas, vuelve a la flexi\xF3n normal."},kIncl:{name:"Flexi\xF3n inclinada",muscles:"Pecho, tr\xEDceps, deltoides anterior",tempo:"3 s abajo, arriba",how:"Apoya las manos en una mesa firme, una cama o el alf\xE9izar de una ventana. Mant\xE9n el cuerpo recto de los talones a la cabeza. Baja el pecho hacia el borde y empuja de vuelta. Cuanto m\xE1s bajo sea el apoyo, m\xE1s dif\xEDcil.",tip:"Buena alternativa cuando te duelen las mu\xF1ecas en el suelo o te quedas sin fuerza."},superman:{name:"Superman",muscles:"Zona lumbar, gl\xFAteos, deltoides posterior",tempo:"arriba, 2 s pausa, abajo",how:"T\xFAmbate boca abajo con los brazos estirados hacia delante. Levanta los brazos, el pecho y las piernas del suelo a la vez, aguanta 2 segundos y baja despacio. Mira al suelo, no eches el cuello hacia atr\xE1s.",tip:"No es un ejercicio de tir\xF3n como el remo, pero fortalece la espalda cuando no tienes d\xF3nde hacer remo."},ytw:{name:"Y-T-W en el suelo",muscles:"Espalda media y alta, deltoides posterior",tempo:"aguanta cada posici\xF3n 1 s",how:"T\xFAmbate boca abajo, con la frente sobre una toalla. Levanta los brazos estirados en Y y aguanta 1 s. Luego \xE1brelos a los lados en T. Por \xFAltimo, lleva los codos hacia las costillas en W y junta los om\xF3platos. Y + T + W = 1 rep.",tip:"Pulgares hacia arriba, hombros lejos de las orejas."},lunge:{name:"Zancada hacia atr\xE1s",muscles:"Cu\xE1driceps, gl\xFAteos",tempo:"2 s abajo, arriba",how:"De pie, con la espalda recta. Da un paso largo hacia atr\xE1s: la rodilla de atr\xE1s baja casi hasta el suelo y la de delante se dobla a 90\xB0. Empuja con el tal\xF3n del pie de delante para volver a ponerte de pie. Haz todas las reps con una pierna y luego con la otra.",tip:"Es m\xE1s suave para las rodillas que la zancada hacia delante. Mant\xE9n el torso erguido."},bridge:{name:"Puente de gl\xFAteos",muscles:"Gl\xFAteos, isquiotibiales",tempo:"arriba, 2 s apretando, abajo",how:"T\xFAmbate boca arriba, rodillas dobladas, pies en el suelo. Empuja con los talones y sube la cadera hasta que el cuerpo forme una l\xEDnea recta de las rodillas a los hombros. Aprieta los gl\xFAteos 2 segundos arriba y baja despacio.",tip:"Versi\xF3n m\xE1s dif\xEDcil: una pierna en el aire. En ese caso, apunta las reps por pierna."},wallsit:{name:"Sentadilla en pared",muscles:"Cu\xE1driceps",how:"Apoya la espalda en una pared y desl\xEDzate hacia abajo hasta que los muslos queden paralelos al suelo y las rodillas a 90\xB0. Toda la espalda en la pared, rodillas sobre los tobillos. Aguanta.",tip:"No apoyes las manos en los muslos, o te estar\xE1s ayudando."},birddog:{name:"Bird dog",muscles:"Core, zona lumbar, gl\xFAteos",tempo:"estira, 2 s pausa, vuelve",how:"Ponte en cuatro apoyos: manos debajo de los hombros, rodillas debajo de la cadera. Estira a la vez el brazo derecho hacia delante y la pierna izquierda hacia atr\xE1s, con el cuerpo en l\xEDnea recta. Aguanta 2 segundos, vuelve y cambia de lado.",tip:"La cadera no debe girar. Imagina un vaso de agua sobre la zona lumbar."},hollow:{name:"Hollow body",muscles:"Todo el core",how:"T\xFAmbate boca arriba con los brazos estirados por detr\xE1s de la cabeza. Pega la zona lumbar al suelo y levanta un poco del suelo los hombros y las piernas estiradas. Aguanta sin moverte.",tip:"Si la zona lumbar se despega del suelo, sube m\xE1s las piernas o d\xF3blalas."},legraise:{name:"Elevaci\xF3n de piernas",muscles:"Abdomen inferior, flexores de cadera",tempo:"2 s arriba, 2 s abajo",how:"T\xFAmbate boca arriba, brazos a los lados. Sube despacio las piernas estiradas hasta que queden verticales y b\xE1jalas despacio casi hasta el suelo, pero sin apoyarlas. La zona lumbar se queda en el suelo.",tip:"Si te duele la zona lumbar, dobla las rodillas."}},warm:{w1:{name:"C\xEDrculos de brazos",dose:"15\xD7 hacia delante, 15\xD7 hacia atr\xE1s",why:"Suelta los hombros antes de las flexiones y los remos."},w2:{name:"Balanceo de piernas",dose:"10\xD7 cada pierna, apoy\xE1ndote en una pared",why:"Suelta la cadera antes de las sentadillas."},w3:{name:"El mejor estiramiento del mundo",dose:"5\xD7 cada lado",why:"Cadera, espalda alta e isquiotibiales a la vez."},w4:{name:"Inchworm (gusano)",dose:"5\xD7",why:"Calienta todo el cuerpo y te lleva a la posici\xF3n de plancha."}},cool:{c1:{name:"Flexor de cadera, izquierda",why:"Pasar muchas horas en la silla (clases, PC) acorta la parte delantera de la cadera. Si solo haces un estiramiento, que sea este.",how:"Apoya la rodilla izquierda en el suelo, con el pie derecho delante. Aprieta los gl\xFAteos y lleva la cadera hacia delante hasta notar el estiramiento en la parte delantera de la cadera izquierda. No arquees la zona lumbar."},c2:{name:"Flexor de cadera, derecha",why:"Lo mismo del otro lado.",how:"Apoya la rodilla derecha en el suelo, con el pie izquierdo delante. Aprieta los gl\xFAteos y lleva la cadera hacia delante."},c3:{name:"Postura del ni\xF1o",why:"Calma la respiraci\xF3n y relaja la espalda. Solo para sentirte bien.",how:"Rodillas separadas, si\xE9ntate con la cadera sobre los talones, estira los brazos hacia delante todo lo que puedas, frente en el suelo. Respira despacio."}},fig:{k1:["Arriba","Abajo"],k3:["Arriba","Abajo, codos pegados"],b5:["Bien: cuerpo recto","Mal: lumbar hundida"],n1:["Inicio","Abajo, talones en el suelo"],r1:["Arriba","Abajo, cabeza delante de las manos"],row1:["Inicio, brazo estirado","Tira, codo atr\xE1s"],row3:["Inicio, mano a la altura del hombro","Codo hacia el lado, alto"],row2:["Inicio, brazos estirados","Pecho hacia la puerta"],n2:["Arriba","Abajo, rodilla de atr\xE1s al suelo"],b2:["Inicio","Brazo y pierna contraria abajo"],n7:["Cadera arriba, talones cerca de los gl\xFAteos","Piernas afuera, cadera arriba"],b4:["Codo a la rodilla contraria","Cambia de lado"],kKnee:["Arriba, rodillas en el suelo","Abajo"],kIncl:["Manos en la mesa, arriba","Pecho al borde"],superman:["Boca abajo","Levanta y aguanta 2 s"],ytw:["Y: brazos hacia delante y arriba","W: codos a las costillas"],lunge:["Inicio","Paso atr\xE1s, rodilla al suelo"],bridge:["Boca arriba, rodillas dobladas","Cadera arriba, aprieta gl\xFAteos"],wallsit:["Muslos paralelos, espalda en la pared"],birddog:["En cuatro apoyos","Brazo y pierna contraria"],hollow:["Lumbar pegada al suelo"],legraise:["Piernas arriba","Baja despacio, sin tocar el suelo"],hf:["Rodilla de atr\xE1s abajo, cadera adelante"],child:["Cadera a los talones, brazos bien adelante"]},ch:{w3:"Haz 3 entrenamientos",pr1:"Supera un r\xE9cord personal",r3:"Haz 3 rondas una vez",warm:"Calentamiento completo 2\xD7",cool:"Estira despu\xE9s de entrenar 2\xD7",push100:"100 flexiones en total (de cualquier tipo)",rank:"Consigue un rango nuevo",reps300:"300 reps en total",legs100:"100 reps de piernas"},ach:{first:["Primer paso","1.er entrenamiento"],w5:["Choca esos cinco","5 entrenamientos"],w10:["Un diez","10 entrenamientos"],w25:["Cuarto de siglo","25 entrenamientos"],w50:["Medio siglo","50 entrenamientos"],s3:["En racha","Racha de 3"],s7:["Imparable","Racha de 7"],s15:["Disciplina","Racha de 15"],pr:["Rompe r\xE9cords","1.er r\xE9cord personal"],gold:["De oro","Oro en 1 ejercicio"],diamond:["Diamante","Diamante en 1 ejercicio"],week:["Semana perfecta","Los 3 retos"],lvl5:["Nivel 5","Llega al nivel 5"],r3:["Tres rondas","Haz 3 rondas"],push30:["Treinta","30 flexiones en una serie"]},quotes:["La disciplina te lleva adonde la motivaci\xF3n no llega.","No hace falta que te apetezca. Haz la primera serie, lo dem\xE1s viene solo.","Cada rep es un ladrillo. Un cuerpo se construye ladrillo a ladrillo.","13 minutos hoy. Un cuerpo para toda la vida.","Nunca faltes dos veces seguidas.","Pasos peque\xF1os en d\xEDas alternos valen m\xE1s que grandes planes que nunca empiezas.","Tu yo del futuro te dar\xE1 las gracias por hoy.","No se trata del entrenamiento perfecto. Se trata de no faltar.","Donde empieza a quemar, empieza el crecimiento.","El m\xFAsculo se construye entrenando, pero crece comiendo y durmiendo.","Comp\xE1rate solo con quien eras la semana pasada.","Mientras otros buscan motivaci\xF3n, t\xFA ya entrenaste.","Series duras, vida m\xE1s f\xE1cil.","Toda persona fuerte empez\xF3 desde cero."],facts:["Puedes entrenar todos los d\xEDas, pero en d\xEDas alternos es lo mejor. Los m\xFAsculos crecen mientras descansas, no mientras entrenas.","El sue\xF1o es tu mejor suplemento. 7\u20139 horas por noche = recuperaci\xF3n m\xE1s r\xE1pida.","Las \xFAltimas reps de una serie son las que m\xE1s trabajan. Son las que construyen m\xFAsculo.","Bajar despacio (3 segundos) da m\xE1s trabajo a tus m\xFAsculos que las reps r\xE1pidas.","Tomar prote\xEDna en cada comida ayuda a que tus m\xFAsculos crezcan.","La constancia gana a la intensidad. Mejor 13 minutos en d\xEDas alternos que una hora una vez al mes.","Bebe un poco de agua. Incluso una sed leve baja tu rendimiento.","Respira despacio: inhala por la nariz, exhala por la boca. Te calmar\xE1s antes.","Rango de movimiento completo = m\xE1s m\xFAsculo trabajando. Menos reps, pero completas."],moti:["Creo en ti, \xA1t\xFA puedes! \u{1F4AA}","Cada serie te acerca a tu meta.","Tienes m\xE1s fuerza de la que crees.","Solo un poco m\xE1s, t\xFA puedes.","Hoy cuenta. No te rindas.","Este es el momento en que creces.","Tu yo del futuro te lo agradecer\xE1."],cheers:["\xA1Serie potente!","\xA1As\xED se hace!","\xA1Modo bestia!","\xA1Est\xE1s que ardes!","\xA1Trabajo limpio!","Este es el camino a un cuerpo fuerte.","\xA1Ya casi!"],finish:["Otro ladrillo en el muro. As\xED se hace.","Listo. Ahora come bien y duerme, que es cuando crece el m\xFAsculo.","La fuerza no es talento. Es la suma de d\xEDas exactamente como este.","Listo. Esto es disciplina en acci\xF3n.","Hoy hiciste lo que la mayor\xEDa solo planea."]};var cp={ui:{loading:"Chargement\u2026",close:"Fermer",cancel:"Annuler",save:"Enregistrer",home:"Accueil",back:"Retour",start:"D\xE9marrer",stop:"Arr\xEAter",copied:"\u2713 Copi\xE9",dayN:"Jour {d}",tabTrain:"Entra\xEEnement",tabHist
