 Runde nicht gemacht, lass das Feld leer. Hast du eine \xDCbung gar nicht gemacht, entferne sie mit \u2715.",removeEx:"{name} entfernen",addEx:"\u2795 \xDCbung hinzuf\xFCgen\u2026",editEmpty:"Trag mindestens eine Zahl ein oder l\xF6sch das Training.",editBadDate:"W\xE4hle ein Datum, das nicht in der Zukunft liegt.",grp_push:"Dr\xFCcken",grp_pull:"Ziehen",grp_legs:"Beine",grp_core:"Rumpf",exMenu:"\u{1F3CB}\uFE0F \xDCbungen",exMenuD:"Wie jede \xDCbung geht und welche du machen kannst.",exTitle:"\xDCbungen",exIntro:"Tippe auf eine \xDCbung, um zu sehen, wie sie geht. Schalte die aus, die du nicht machen kannst (keine T\xFCr, kein Stuhl, Schmerzen\u2026). Die App nimmt dann eine andere \xDCbung derselben Art, sodass jedes Training weiter Dr\xFCcken, Ziehen, Beine und Rumpf hat.",grpOn:"{on} von {n} an",grpLast:"Nur noch eine \xFCbrig, also ist sie in jedem Training dabei.",grpLastLock:"Das ist die letzte \xDCbung dieser Art, deshalb muss sie an bleiben. Sonst w\xFCrdest du diese Muskeln gar nicht trainieren.",exAlt:"Alternative",exInfo:"tippen f\xFCr Infos",exReplacedBy:"Aus. Tag {d} nimmt stattdessen: {name}.",exCanDo:"Kann ich machen: {name}",resetAll:"\u{1F9F9} Ganz von vorn anfangen",resetAllD:"L\xF6scht Trainings, XP, Level, Serie, R\xE4nge und Abzeichen. Name, Foto und Einstellungen bleiben.",resetAllTitle:"Von vorn anfangen?",resetAllBody:"Damit werden alle deine Trainings ({count}) gel\xF6scht und alles, was daraus folgt: XP, Level, die Serie, Freezes, R\xE4nge und Abzeichen. Name, Foto und Einstellungen bleiben. Das l\xE4sst sich nicht r\xFCckg\xE4ngig machen, also speichere zuerst ein Backup, falls du die Daten noch brauchen k\xF6nntest.",resetAllBackup:"\u{1F4BE} Zuerst Backup speichern",resetAllYes:"Ja, alles l\xF6schen",msgResetAll:"\u2713 Erledigt. Du f\xE4ngst bei null an."},pl:{workouts:{one:"{n} Training",other:"{n} Trainings"},days:{one:"{n} Tag",other:"{n} Tage"},daysAgo:{one:"vor {n} Tag",other:"vor {n} Tagen"},rounds:{one:"{n} Runde",other:"{n} Runden"},sets:{one:"{n} Satz",other:"{n} S\xE4tze"},prs:{one:"{n} pers\xF6nlicher Rekord",other:"{n} pers\xF6nliche Rekorde"},weeks:{one:"{n} Woche",other:"{n} Wochen"},pushups:{one:"{n} Liegest\xFCtz",other:"{n} Liegest\xFCtze"},reps:{one:"{n} Wiederholung",other:"{n} Wiederholungen"},birthdays:{one:"{n} Geburtstag",other:"{n} Geburtstage"}},units:{arm:"/Arm",leg:"/Bein",side:"/Seite"},perUnit:{arm:"pro Arm",leg:"pro Bein",side:"pro Seite"},themes:{navy:"Marine",black:"Schwarz",forest:"Wald",plum:"Pflaume",ocean:"Ozean",wine:"Wein",slate:"Schiefer",coffee:"Kaffee"},ranks:["Holz","Eisen","Bronze","Silber","Gold","Platin","Diamant"],ex:{k1:{name:"Liegest\xFCtz",muscles:"Brust, Trizeps, vordere Schultern",tempo:"3 s runter, kurze Pause, hoch",how:"H\xE4nde etwas weiter als schulterbreit, K\xF6rper gerade von Kopf bis Ferse, Bauch und Po angespannt. Senk dich 3 Sekunden lang ab, bis deine Brust fast den Boden ber\xFChrt, halte kurz und dr\xFCck dich wieder hoch. Ellbogen im ~45\xB0-Winkel zum K\xF6rper, nicht nach au\xDFen abspreizen.",tip:"Sobald du in der ersten Runde 25+ schaffst, stell die H\xE4nde auf zwei dicke B\xFCcher. Deine Brust geht tiefer, der Muskel wird st\xE4rker gedehnt und w\xE4chst mehr. Die B\xFCcher m\xFCssen stabil und gleich hoch sein, damit nichts rutscht. Wenn die Schultern schmerzen, geh weniger tief.",lvl:"Stell die H\xE4nde auf zwei dicke B\xFCcher, damit deine Brust tiefer geht. Deine Zahlen sinken erst mal, das ist okay. Die B\xFCcher m\xFCssen stabil sein, damit nichts rutscht."},row1:{name:"T\xFCrrahmen-Rudern",muscles:"R\xFCcken (Latissimus), hintere Schultern, Bizeps",tempo:"1 s ziehen, 1 s halten, 3 s zur\xFCck",how:"Stell dich seitlich in eine offene T\xFCr. Greif den Rahmen mit einer Hand auf Brusth\xF6he, F\xFC\xDFe direkt am Rahmen. Lehn dich mit gestrecktem Arm und geradem K\xF6rper zur\xFCck. Zieh dich zum Rahmen: Ellbogen nah am K\xF6rper nach hinten, Schulterblatt nach hinten ziehen. Langsam zur\xFCck. Alle Wiederholungen mit einem Arm, dann mit dem anderen.",tip:"Je n\xE4her deine F\xFC\xDFe am Rahmen sind und je weiter du dich zur\xFCcklehnst, desto schwerer wird's. Halt dich am festen Rahmen fest, nicht an der T\xFCr, und trainier barfu\xDF, damit deine F\xFC\xDFe nicht wegrutschen.",lvl:"Stell die F\xFC\xDFe n\xE4her an den Rahmen und lehn dich weiter zur\xFCck."},n1:{name:"ATG-Kniebeuge",muscles:"Oberschenkelvorderseite, Po",tempo:"3 s runter, 1 s Pause unten, hoch",how:"F\xFC\xDFe schulterbreit, Zehen leicht nach au\xDFen. Geh 3 Sekunden lang so tief runter, wie du kannst, Oberschenkel unter Knieh\xF6he, Fersen am Boden. Halte unten 1 Sekunde und steh auf.",tip:"Langsames Tempo und die Pause unten machen aus einer leichten Kniebeuge eine schwere. Wenn du 20+ auch mit Tempo schaffst, tausch sie gegen die 1\xBC-Kniebeuge.",lvl:"Tausch sie gegen die 1\xBC-Kniebeuge (\u21C4 Tauschen)."},b5:{name:"Unterarmst\xFCtz",muscles:"Gesamter Rumpf",how:"Unterarme unter den Schultern, K\xF6rper gerade von Kopf bis Ferse. Spann Bauch und Po an, als w\xFCrde dir gleich jemand in den Bauch boxen. H\xFCfte weder hochschieben noch durchh\xE4ngen lassen.",tip:"Wenn du 60 s in beiden Runden h\xE4ltst, tausch ihn gegen den Einbeinigen Plank. Das ist viel schwerer.",lvl:"Tausch ihn gegen den Einbeinigen Plank (\u21C4 Tauschen)."},r1:{name:"Pike Push-up",muscles:"Schultern, Trizeps",tempo:"3 s runter, hoch",how:"Geh in ein umgedrehtes V: H\xE4nde am Boden, H\xFCfte hoch, Beine so gestreckt wie m\xF6glich. Beug die Ellbogen und senk deinen Scheitel knapp vor den H\xE4nden zum Boden, sodass H\xE4nde und Kopf ein Dreieck bilden. Dr\xFCck dich wieder hoch.",tip:"Wenn du 15+ in beiden Runden schaffst, tausch sie gegen den Pike-Liegest\xFCtz mit F\xFC\xDFen auf dem Stuhl. Mehr deines Gewichts geht auf die Schultern.",lvl:"Tausch sie gegen den Pike-Liegest\xFCtz mit F\xFC\xDFen auf dem Stuhl (\u21C4 Tauschen)."},row2:{name:"T\xFCr-Rudern mit Handtuch",muscles:"Mittlerer R\xFCcken, Schulterbl\xE4tter, Bizeps",tempo:"1 s ziehen, 1 s halten, 3 s zur\xFCck",how:"\xD6ffne die T\xFCr und stell dich frontal vor ihre Kante, die T\xFCr zwischen deinen F\xFC\xDFen. Leg ein Handtuch um beide Klinken und halt die Enden fest, oder greif direkt beide Klinken. Lehn dich mit gestreckten Armen und geradem K\xF6rper zur\xFCck. Zieh die Brust zur T\xFCrkante, dr\xFCck die Schulterbl\xE4tter zusammen und geh langsam zur\xFCck.",tip:"Check zuerst, ob die Klinken fest sind und sich nicht bewegen. Wenn sich irgendwas bewegt, mach stattdessen T\xFCrrahmen-Rudern (Tag A). Sicherheit geht vor.",lvl:"Stell die F\xFC\xDFe n\xE4her an die T\xFCr und lehn dich weiter zur\xFCck."},n2:{name:"Bulgarische Kniebeuge",muscles:"Oberschenkelvorderseite, Po",tempo:"3 s runter, hoch",how:"Stell dich vor einen Stuhl und leg den Spann deines hinteren Fu\xDFes auf die Sitzfl\xE4che. Mach mit dem vorderen Fu\xDF einen gro\xDFen Schritt nach vorn. Senk dich 3 Sekunden lang ab, das hintere Knie geht Richtung Boden. Dr\xFCck dich \xFCber die Ferse des vorderen Fu\xDFes hoch.",tip:"Stell den vorderen Fu\xDF so weit nach vorn, dass dein Knie \xFCber dem Fu\xDF bleibt. Oberk\xF6rper leicht nach vorn geneigt = mehr Po. Stell den Stuhl an die Wand, damit er unter dem Fu\xDF nicht wegrutscht.",lvl:"Langsamer: 4 s runter und 2 s Pause unten."},b2:{name:"Dead Bug",muscles:"Tiefe Bauchmuskulatur",tempo:"langsam, 2 s raus, 2 s zur\xFCck",how:"Leg dich auf den R\xFCcken, Arme gestreckt zur Decke, Beine angehoben mit Knien im 90\xB0-Winkel. Senk langsam den rechten Arm hinter den Kopf und das linke Bein Richtung Boden, dann zur\xFCck und Seite wechseln.",tip:"Dein unterer R\xFCcken muss die ganze Zeit fest am Boden bleiben. Wenn er abhebt, senk das Bein nicht so weit ab.",lvl:"Arm und Bein langsamer absenken, 3 s raus und 3 s zur\xFCck."},k3:{name:"Diamant-Liegest\xFCtz",muscles:"Trizeps, innere Brust",tempo:"3 s runter, hoch",how:"Setz die H\xE4nde unter deine Brust, sodass sich Daumen und Zeigefinger ber\xFChren und eine Raute bilden. Senk dich ab, die Ellbogen gehen nah am K\xF6rper nach hinten. Deine Brust geht Richtung H\xE4nde.",tip:"Wenn Handgelenke oder Ellbogen schmerzen, setz die H\xE4nde etwas auseinander. Ein enger Liegest\xFCtz belastet den Trizeps fast genauso. Die schwerere Variante ist der Diamant-Liegest\xFCtz mit F\xFC\xDFen auf dem Stuhl, du kannst dagegen tauschen.",lvl:"Tausch sie gegen den Diamant-Liegest\xFCtz mit F\xFC\xDFen auf dem Stuhl (\u21C4 Tauschen)."},row3:{name:"Breites T\xFCrrahmen-Rudern",muscles:"Hintere Schultern, oberer R\xFCcken",tempo:"1 s ziehen, 1 s halten, 3 s zur\xFCck",how:"Gleiche Position wie beim T\xFCrrahmen-Rudern, aber greif den Rahmen auf Schulterh\xF6he und zieh den Ellbogen seitlich nach au\xDFen, nicht am K\xF6rper entlang. Arm und Oberk\xF6rper bilden ein T. Du solltest es hinten an der Schulter und zwischen den Schulterbl\xE4ttern sp\xFCren.",tip:"Dieser Winkel trainiert hintere Schultern und oberen R\xFCcken. Sie lassen deine Schultern von hinten breiter und kr\xE4ftiger wirken.",lvl:"Stell die F\xFC\xDFe n\xE4her an den Rahmen und lehn dich weiter zur\xFCck."},n7:{name:"Beinbeuger mit Handtuch",muscles:"Oberschenkelr\xFCckseite, Po",tempo:"3 s raus, 1 s zur\xFCck",how:"Leg dich auf einem glatten Boden (Holz, Fliesen) auf den R\xFCcken, Fersen auf einem Handtuch oder in Socken. Heb die H\xFCfte in eine Br\xFCcke. Schieb die Beine 3 Sekunden lang nach vorn, bis sie fast gestreckt sind, H\xFCfte bleibt oben. Dann zieh die Fersen zur\xFCck zum Po.",tip:"Auf Teppich oder es rutscht nicht? Tausch sie gegen eine normale Glute Bridge.",lvl:"Mach's mit einem Bein, das andere bleibt in der Luft. Fang mit k\xFCrzerem Bewegungsweg an. Bei Krampf oder absinkender H\xFCfte zur\xFCck auf beide Beine."},b4:{name:"Bicycle Crunch",muscles:"Seitliche Bauchmuskeln, gesamter Bauch",tempo:"langsam, 1 s pro Seite",how:"Leg dich auf den R\xFCcken, H\xE4nde hinter dem Kopf, Schultern vom Boden abgehoben. F\xFChr den rechten Ellbogen zum linken Knie und streck dabei das rechte Bein. Dann wechseln. Dein Oberk\xF6rper dreht sich mit, nicht nur die Ellbogen.",tip:"Mach langsam. Schnelles Ellbogen-Flattern bringt nichts au\xDFer einem verspannten Nacken.",lvl:"Langsamer: 2 s pro Seite."},kKnee:{name:"Knie-Liegest\xFCtz",muscles:"Brust, Trizeps, vordere Schultern",tempo:"3 s runter, hoch",how:"Geh auf die Knie, H\xE4nde etwas weiter als schulterbreit. K\xF6rper gerade von Knien bis Kopf, Po nicht rausstrecken. Senk die Brust 3 Sekunden lang zum Boden und dr\xFCck dich wieder hoch.",tip:"Sobald du in beiden Runden 20 schaffst, geh zur\xFCck zum normalen Liegest\xFCtz."},kIncl:{name:"Incline-Liegest\xFCtz",muscles:"Brust, Trizeps, vordere Schultern",tempo:"3 s runter, hoch",how:"St\xFCtz die H\xE4nde auf einen stabilen Tisch, ein Bett oder eine Fensterbank. K\xF6rper gerade von Ferse bis Kopf. Senk die Brust zur Kante und dr\xFCck dich zur\xFCck. Je niedriger die Auflage, desto schwerer.",tip:"Guter Ersatz, wenn dir am Boden die Handgelenke wehtun oder die Kraft ausgeht."},superman:{name:"Superman",muscles:"Unterer R\xFCcken, Po, hintere Schultern",tempo:"hoch, 2 s halten, runter",how:"Leg dich auf den Bauch, Arme nach vorn gestreckt. Heb Arme, Brust und Beine gleichzeitig vom Boden, halte 2 Sekunden und senk sie langsam ab. Blick zum Boden, Kopf nicht in den Nacken legen.",tip:"Es ist keine Zug\xFCbung wie Rudern, aber es st\xE4rkt deinen R\xFCcken, wenn du nirgends rudern kannst."},ytw:{name:"Y-T-W am Boden",muscles:"Mittlerer und oberer R\xFCcken, hintere Schultern",tempo:"jede Position 1 s halten",how:"Leg dich auf den Bauch, Stirn auf einem Handtuch. Heb die gestreckten Arme zu einem Y und halte 1 s. Dann seitlich zu einem T. Zum Schluss zieh die Ellbogen zu den Rippen zu einem W und dr\xFCck die Schulterbl\xE4tter zusammen. Y + T + W = 1 Wiederholung.",tip:"Daumen zeigen nach oben, Schultern weg von den Ohren."},lunge:{name:"Ausfallschritt r\xFCckw\xE4rts",muscles:"Oberschenkelvorderseite, Po",tempo:"2 s runter, hoch",how:"Steh aufrecht. Mach einen gro\xDFen Schritt nach hinten, das hintere Knie geht fast bis zum Boden, das vordere Knie beugt sich auf 90\xB0. Dr\xFCck dich \xFCber die Ferse des vorderen Fu\xDFes zur\xFCck in den Stand. Alle Wiederholungen mit einem Bein, dann mit dem anderen.",tip:"Schonender f\xFCr die Knie als ein Ausfallschritt nach vorn. Oberk\xF6rper aufrecht halten."},bridge:{name:"Glute Bridge",muscles:"Po, Oberschenkelr\xFCckseite",tempo:"hoch, 2 s anspannen, runter",how:"Leg dich auf den R\xFCcken, Knie angewinkelt, F\xFC\xDFe am Boden. Dr\xFCck dich \xFCber die Fersen hoch und heb die H\xFCfte, bis dein K\xF6rper von Knien bis Schultern eine gerade Linie bildet. Spann oben 2 Sekunden den Po an und senk dich langsam ab.",tip:"Die schwerere Variante ist die Einbeinige Glute Bridge. Wenn dir diese leicht f\xE4llt, tausch sie dagegen."},r1e:{name:"Pike-Liegest\xFCtz mit F\xFC\xDFen auf dem Stuhl",muscles:"Schultern, Trizeps",tempo:"3 s runter, hoch",how:"Leg die F\xFC\xDFe auf einen Stuhl, die H\xE4nde etwas davor auf den Boden, und schieb die H\xFCfte hoch, sodass der Oberk\xF6rper fast senkrecht ist. Beug die Ellbogen und senk den Kopf knapp vor den H\xE4nden zum Boden, die Ellbogen gehen nach hinten, nicht zur Seite. Dr\xFCck dich wieder hoch.",tip:"Je senkrechter der Oberk\xF6rper, desto mehr Gewicht geht auf die Schultern. Spann den Po an, damit du kein Hohlkreuz machst. Der Stuhl muss fest stehen, am besten an der Wand. Senk den Kopf langsam, lass dich nie darauf fallen."},k3e:{name:"Diamant-Liegest\xFCtz mit F\xFC\xDFen auf dem Stuhl",muscles:"Trizeps, innere Brust, Schultern",tempo:"3 s runter, hoch",how:"Leg die F\xFC\xDFe auf einen Stuhl und die H\xE4nde so unter die Brust, dass sich Daumen und Zeigefinger ber\xFChren und einen Diamanten bilden. K\xF6rper gerade von Kopf bis Ferse. Senk dich ab, die Ellbogen gehen nah am K\xF6rper nach hinten, die Brust zu den H\xE4nden. Dr\xFCck dich wieder hoch.",tip:"H\xFCfte weder hochschieben noch durchh\xE4ngen lassen. Wenn Handgelenke oder Ellbogen schmerzen, setz die H\xE4nde etwas auseinander. Der Stuhl muss fest stehen, am besten an der Wand."},n1q:{name:"1\xBC-Kniebeuge",muscles:"Oberschenkelvorderseite, Po",tempo:"runter, ein Viertel hoch, runter, hoch",how:"F\xFC\xDFe schulterbreit, Zehen leicht nach au\xDFen. Geh ganz runter, komm nur ein Viertel hoch, geh wieder ganz runter und steh erst dann auf. Das ist 1 Wiederholung. Fersen bleiben am Boden.",tip:"Die Muskeln arbeiten zweimal im schwersten, tiefsten Teil der Kniebeuge, deshalb ist sie schwerer. Nicht runterfallen lassen, kontrolliert absenken."},b5l:{name:"Einbeiniger Plank",muscles:"Ganzer Rumpf, Po",how:"Wie ein normaler Plank: Unterarme unter den Schultern, K\xF6rper gerade von Kopf bis Ferse. Heb ein gestrecktes Bein etwas vom Boden, nach der H\xE4lfte der Zeit leg es ab und heb das andere. H\xFCfte gerade halten, nicht verdrehen.",tip:"Heb das Bein nicht hoch, knapp \xFCber dem Boden reicht. Es geht darum, dass die H\xFCfte ruhig bleibt."},sbridge:{name:"Einbeinige Glute Bridge",muscles:"Po, Oberschenkelr\xFCckseite",tempo:"hoch, 2 s anspannen, runter",how:"Leg dich auf den R\xFCcken, Knie angewinkelt, F\xFC\xDFe am Boden. Streck ein Bein in die Luft und halte die Oberschenkel nebeneinander. Dr\xFCck \xFCber die Ferse des Standbeins und heb die H\xFCfte, bis dein K\xF6rper vom Knie bis zu den Schultern eine gerade Linie bildet. Oben 2 Sekunden den Po anspannen und langsam absenken. Erst alle Wiederholungen mit einem Bein, dann mit dem anderen.",tip:"Halte die H\xFCfte gerade, lass sie nicht zur Seite des gehobenen Beins absinken. Trag die Zahl f\xFCr ein Bein ein: 10 links + 10 rechts = 10 eintragen. Bei einem Krampf im hinteren Oberschenkel zur\xFCck zur Glute Bridge auf beiden Beinen."},wallsit:{name:"Wall Sit",muscles:"Oberschenkelvorderseite",how:"Lehn dich mit dem R\xFCcken an eine Wand und rutsch runter, bis deine Oberschenkel parallel zum Boden sind und die Knie im 90\xB0-Winkel. Ganzer R\xFCcken an der Wand, Knie \xFCber den Kn\xF6cheln. Halten.",tip:"Leg die H\xE4nde nicht auf die Oberschenkel, sonst hilfst du nach."},birddog:{name:"Bird Dog",muscles:"Rumpf, unterer R\xFCcken, Po",tempo:"strecken, 2 s halten, zur\xFCck",how:"Geh in den Vierf\xFC\xDFlerstand: H\xE4nde unter den Schultern, Knie unter der H\xFCfte. Streck gleichzeitig den rechten Arm nach vorn und das linke Bein nach hinten, K\xF6rper in einer geraden Linie. Halte 2 Sekunden, geh zur\xFCck und wechsel die Seite.",tip:"Deine H\xFCfte darf sich nicht verdrehen. Stell dir ein Glas Wasser auf deinem unteren R\xFCcken vor."},hollow:{name:"Hollow Body Hold",muscles:"Gesamter Rumpf",how:"Leg dich auf den R\xFCcken, Arme hinter dem Kopf gestreckt. Dr\xFCck den unteren R\xFCcken in den Boden und heb Schultern und gestreckte Beine ein St\xFCck vom Boden ab. Halte, ohne dich zu bewegen.",tip:"Wenn dein unterer R\xFCcken vom Boden abhebt, nimm die Beine h\xF6her oder winkel sie an."},legraise:{name:"Beinheben",muscles:"Unterer Bauch, H\xFCftbeuger",tempo:"2 s hoch, 2 s runter",how:"Leg dich auf den R\xFCcken, Arme neben dem K\xF6rper. Heb die gestreckten Beine langsam, bis sie senkrecht sind, und senk sie langsam fast bis zum Boden, aber leg sie nicht ab. Dein unterer R\xFCcken bleibt am Boden.",tip:"Wenn dir der untere R\xFCcken wehtut, winkel die Knie an."}},warm:{w1:{name:"Armkreisen",dose:"15\xD7 vorw\xE4rts, 15\xD7 r\xFCckw\xE4rts",why:"Lockert deine Schultern vor Liegest\xFCtzen und Rudern."},w2:{name:"Beinpendeln",dose:"10\xD7 pro Bein, an der Wand festhalten",why:"Lockert deine H\xFCfte vor Kniebeugen."},w3:{name:"World's Greatest Stretch",dose:"5\xD7 pro Seite",why:"H\xFCfte, oberer R\xFCcken und Oberschenkelr\xFCckseite auf einmal."},w4:{name:"Inchworm",dose:"5\xD7",why:"W\xE4rmt den ganzen K\xF6rper auf und bringt dich in den Liegest\xFCtz."}},cool:{c1:{name:"H\xFCftbeuger, links",why:"Viel Sitzen (Schule, Computer) verk\xFCrzt die Vorderseite deiner H\xFCfte. Wenn du nur eine Dehnung machst, dann diese.",how:"Knie dich auf das linke Knie, rechter Fu\xDF vorne. Spann den Po an und schieb die H\xFCfte nach vorn, bis du eine Dehnung vorne an der linken H\xFCfte sp\xFCrst. Kein Hohlkreuz machen."},c2:{name:"H\xFCftbeuger, rechts",why:"Das Gleiche auf der anderen Seite.",how:"Knie dich auf das rechte Knie, linker Fu\xDF vorne. Spann den Po an und schieb die H\xFCfte nach vorn."},c4:{name:"Kobra",why:"Dehnt den Bauch und die Vorderseite der H\xFCfte. Ein Gegengewicht zu all dem Einrollen bei den Bauch\xFCbungen.",how:"Leg dich auf den Bauch, Handfl\xE4chen unter die Schultern, Ellbogen nah am K\xF6rper. Lass die H\xFCfte am Boden und dr\xFCck dich langsam mit den Armen hoch, bis du eine angenehme Dehnung im Bauch sp\xFCrst. Schultern weg von den Ohren, die Ellbogen m\xFCssen nicht ganz gestreckt sein. Wenn es im unteren R\xFCcken zwickt, geh tiefer."},c3:{name:"Kindhaltung",why:"Beruhigt deine Atmung und entspannt den R\xFCcken. Einfach nur zum Wohlf\xFChlen.",how:"Knie auseinander, setz die H\xFCfte zur\xFCck auf die Fersen, streck die Arme so weit wie m\xF6glich nach vorn, Stirn auf den Boden. Atme langsam."}},fig:{k1:["Oben","Unten, Ellbogen ~45\xB0 vom K\xF6rper"],k3:["Oben","Unten, Ellbogen eng"],b5:["Richtig: K\xF6rper gerade","Falsch: Hohlkreuz"],n1:["Start","Unten, Fersen am Boden"],r1:["Oben","Unten, Kopf vor den H\xE4nden"],row1:["Start, Arm gestreckt","Ziehen, Ellbogen nach hinten"],row3:["Start, Hand auf Schulterh\xF6he","Ellbogen zur Seite, ~90\xB0 vom K\xF6rper"],row2:["Start, Arme gestreckt","Brust zur T\xFCr"],n2:["Oben","Unten, hinteres Knie zum Boden"],b2:["Start","Arm und Gegenbein runter"],n7:["H\xFCfte hoch, Fersen am Po","Beine raus, H\xFCfte bleibt oben"],b4:["Ellbogen zum Gegenknie","Seite wechseln"],kKnee:["Oben, Knie am Boden","Unten, Ellbogen ~45\xB0 vom K\xF6rper"],kIncl:["H\xE4nde auf dem Tisch, oben","Brust zur Kante, Ellbogen ~45\xB0 vom K\xF6rper"],superman:["Auf dem Bauch liegen","Heben, 2 s halten"],ytw:["Y: Arme schr\xE4g nach vorn","T: Arme zur Seite","W: Ellbogen zu den Rippen"],lunge:["Start","Schritt zur\xFCck, Knie zum Boden"],bridge:["Liegen, Knie angewinkelt","H\xFCfte hoch, Po anspannen"],sbridge:["Liegen, ein Bein oben","H\xFCfte hoch, Po anspannen"],r1e:["Oben, F\xFC\xDFe auf dem Stuhl","Unten, Kopf vor den H\xE4nden"],k3e:["Oben, F\xFC\xDFe auf dem Stuhl","Unten, Ellbogen am K\xF6rper"],n1q:["Ganz runter","Ein Viertel hoch","Wieder ganz runter","Erst dann hoch"],b5l:["Ein Bein oben","Nach der H\xE4lfte Beine wechseln"],wallsit:["Knie ~90\xB0, R\xFCcken an der Wand"],birddog:["Vierf\xFC\xDFlerstand: Arme und Knie ~90\xB0","Arm und Gegenbein"],hollow:["Unterer R\xFCcken fest am Boden"],legraise:["Beine oben","Langsam runter, nicht auf den Boden ablegen"],hf:["Hinteres Knie unten, H\xFCfte vor"],cobra:["H\xFCfte am Boden, Brust hoch"],child:["H\xFCfte zu den Fersen, Arme weit vor"]},ch:{w3:"3 Trainings machen",pr1:"Einen pers\xF6nlichen Rekord brechen",r3:"Einmal 3 Runden machen",warm:"2\xD7 komplett aufw\xE4rmen",cool:"2\xD7 nach dem Training dehnen",push100:"100 Liegest\xFCtze insgesamt (alle Arten)",rank:"Einen neuen Rang erreichen",reps300:"300 Wiederholungen insgesamt",legs100:"100 Bein-Wiederholungen"},ach:{workouts:["Trainings","{x}"],streak:["Serie","eine Serie von {x}"],records:["Rekorde","{x}"],ranks:["Rang-Sammler","Rangstufen in allen \xDCbungen: {n}"],weeks:["Wochen-Challenges","{x} zu 100\xA0%"],level:["Level","Level {n}"],rounds3:["Drei Runden","{x} mit 3 Runden"],pushups:["Liegest\xFCtze am St\xFCck","{x} in einem Satz"],reps:["Wiederholungen","{x} insgesamt"],birthday:["Geburtstage","{x} mit der App"],calories:["Kalorien","{x} mit Kalorien-Eintrag"]},news14:[["Men\xFC","unten eine Leiste mit 3 Tabs, Profil \xFCber das Foto oben rechts.","ein \u2630-Men\xFC oben rechts mit allem: Training, Kalorien, Verlauf, Profil, Einstellungen."],["Training im Hintergrund","w\xE4hrend des Trainings konnte man nirgendwo anders hin.","das Training schrumpft unten auf ein kleines Fenster, Zeit und T\xF6ne laufen weiter, antippen bringt dich zur\xFCck."],["Wiederholungsz\xE4hler","die Zahl war vorab nach dem letzten Mal oder gesch\xE4tzt eingestellt.","er startet bei 0 und zeigt dein letztes Ergebnis mit einem +1-Ziel."],["Letzte Runde","1\u20132 Wiederholungen in Reserve.","bis zum technischen Versagen: solange jede Wiederholung sauber ist."],["Kalorien","gab es nicht.","Rechner (abnehmen, halten, zunehmen) und t\xE4gliches Essensprotokoll. Trainings aus der App werden automatisch dazugerechnet."],["Abzeichen","15 Abzeichen: hat man oder nicht.","11 Arten mit Stufen Holz \u2192 Diamant und einem Balken, was noch fehlt. Was du hattest, bleibt."],["Geburtstag","nichts.","mit Geburtsdatum eine \xDCberraschung, Konfetti, ein extra Freeze und ein Geburtstagsabzeichen."],["Plank","30 \u2013 75 s.","auch 15 s."],["Sicherheit","schwerere Varianten ohne Hinweise.","Hinweise bei riskanten Schritten (Krampf, H\xFCfte, Stuhl an der Wand, stabile B\xFCcher)."],["Tipps","gab es nicht.","jeden zweiten Tag ein \u201ESchon gewusst?\u201C mit einem Knopf, der dich hinf\xFChrt."]],news141:["Der Kalorienrechner fragt \u201EMann oder Frau?\u201C.","Pflichtfelder haben ein Sternchen *, beim Geburtsdatum ist nur das Jahr Pflicht."],news142:["Die Neuigkeiten haben jetzt Seiten: zuerst das gro\xDFe Update, nach links wischen f\xFCr die kleinen.","Nach einem kleinen Update f\xFChrt dich eine Karte auf dem Startbildschirm direkt zu seiner Seite. Nur beim ersten Mal."],news10:[["App","eine Website im Browser (Browser beta).","eine echte Android-App mit Symbol auf dem Startbildschirm. Auf der Website findest du sie im Men\xFC \u2192 \u{1F4F1} Android-App."],["Deine Daten","im Browser gespeichert.","in der App gespeichert. Mitnehmen mit einem Backup: im Browser Einstellungen \u2192 Backup speichern, in der App Einstellungen \u2192 Backup wiederherstellen."],["Updates","neue Version beim n\xE4chsten \xD6ffnen der Seite.","kleine Updates laden sich selbst und gelten ab dem n\xE4chsten Start; bei einem gro\xDFen zeigt dir die App, wo es die neue APK gibt."],["Backup","wurde als Datei heruntergeladen.","\xF6ffnet das Teilen-Men\xFC: speichere es in \u201EDateien\u201C oder auf Google Drive oder schick es dir selbst."],["Offline","die Schriften kamen von Google, ohne Internet sah die App anders aus.","die Schriften sind in der App, alles funktioniert offline."],["Zur\xFCck-Taste","\u2013","schlie\xDFt ein Fenster oder das Men\xFC; im Training geht es zur Startseite und das Training l\xE4uft weiter."],["Versionsnummern","Browser beta 1.0.0 bis 1.4.2.","die Z\xE4hlung beginnt neu bei 1.0.0, der ersten App-Version."]],quotes:["Disziplin bringt dich dahin, wo Motivation nicht hinkommt.","Du musst keine Lust haben. Mach einfach den ersten Satz, der Rest kommt von allein.","Jede Wiederholung ist ein Ziegelstein. Ein K\xF6rper wird Stein f\xFCr Stein gebaut.","Heute 13 Minuten. Ein K\xF6rper f\xFCrs Leben.","Setz nie zweimal hintereinander aus.","Kleine Schritte jeden zweiten Tag schlagen gro\xDFe Pl\xE4ne, die du nie anf\xE4ngst.","Dein zuk\xFCnftiges Ich wird dir f\xFCr heute danken.","Es geht nicht ums perfekte Training. Es geht ums Dranbleiben.","Wo es anf\xE4ngt zu brennen, beginnt das Wachstum.","Vergleich dich nur mit dem, der du letzte Woche warst.","W\xE4hrend andere noch Motivation suchen, hast du schon trainiert.","Harte S\xE4tze, leichteres Leben.","Jeder starke Mensch hat mal bei null angefangen."],restDay:["Muskeln werden im Training aufgebaut, aber sie wachsen durch Essen und Schlaf.","Heute ist Ruhetag. Auch der geh\xF6rt zum Plan.","Ausruhen ist nicht faul. Genau jetzt w\xE4chst du.","Die Arbeit ist getan. Jetzt lass deinen K\xF6rper aufbauen.","Gut essen, gut schlafen. Auch das ist Training.","St\xE4rke entsteht nicht an einem Tag. Sie entsteht jeden zweiten Tag, Monat f\xFCr Monat.","Wer sich ausruhen kann, h\xE4lt l\xE4nger durch.","Heute l\xE4dst du die Akkus f\xFCr dein n\xE4chstes Training.","Regelm\xE4\xDFigkeit ist deine Superkraft. Bleib dran.","Fortschritt sieht man nicht immer sofort. Aber er passiert.","Sei stolz darauf, dass du dranbleibst.","Heute geh\xF6rt der Erholung. Genie\xDF ihn.","Kleine Schritte, viele Tage hintereinander. So entstehen gro\xDFe Ver\xE4nderungen."],doneTitles:["Du hast heute schon trainiert","F\xFCr heute erledigt","Heute abgehakt","Mission erf\xFCllt!"],doneSubs:["Tag {day} ist erledigt. Jetzt essen und schlafen, deine Muskeln wachsen in der Pause.","Tag {day} liegt hinter dir. Gute Arbeit, jetzt erhol dich.","Tag {day} ist erledigt. Noch ein Stein in der Mauer.","Tag {day} ist eingetragen. Dein n\xE4chstes Training ist in zwei Tagen.","Tag {day} geschafft. Jetzt arbeitet dein K\xF6rper, genie\xDF den Rest des Tages.","Tag {day} gemeistert. So baut man Disziplin auf."],facts:["Du kannst jeden Tag trainieren, aber jeden zweiten Tag ist am besten. Muskeln wachsen in der Pause, nicht beim Training.","Schlaf ist dein bestes Supplement. 7\u20139 Stunden pro Nacht = schnellere Regeneration.","Die letzten Wiederholungen eines Satzes leisten die meiste Arbeit. Genau die bauen Muskeln auf.","Langsames Absenken (3 Sekunden) gibt deinen Muskeln mehr Arbeit als schnelle Wiederholungen.","Protein in jeder Mahlzeit hilft deinen Muskeln beim Wachsen.","Regelm\xE4\xDFigkeit schl\xE4gt Intensit\xE4t. Lieber 13 Minuten jeden zweiten Tag als eine Stunde einmal im Monat.","Trink etwas Wasser. Schon leichter Durst senkt deine Leistung.","Atme langsam: durch die Nase ein, durch den Mund aus. So beruhigst du dich schneller.","Volle Bewegungsamplitude = mehr Muskeln im Einsatz. Weniger Wiederholungen, daf\xFCr vollst\xE4ndige."],moti:["Ich glaub an dich, du schaffst das! \u{1F4AA}","Jeder Satz bringt dich deinem Ziel n\xE4her.","Du bist st\xE4rker, als du denkst.","Nur noch ein bisschen, du packst das.","Heute z\xE4hlt. Gib nicht auf.","Genau jetzt w\xE4chst du.","Dein zuk\xFCnftiges Ich wird dir danken."],cheers:["Starker Satz!","So geht das!","Beast Mode!","Du bist on fire!","Saubere Arbeit!","So baut man einen starken K\xF6rper.","Fast geschafft!"],finish:["Wieder ein Stein in der Mauer. So geht das.","Geschafft. Jetzt gut essen und schlafen, dann wachsen die Muskeln.","St\xE4rke ist kein Talent. Sie ist die Summe aus genau solchen Tagen.","Fertig. Das ist Disziplin in Aktion.","Heute hast du gemacht, was die meisten nur planen."]};var sh={ui:{loading:"Cargando\u2026",close:"Cerrar",cancel:"Cancelar",save:"Guardar",home:"Inicio",back:"Atr\xE1s",start:"Empezar",stop:"Parar",copied:"\u2713 Copiado",dayN:"D\xEDa {d}",tabTrain:"Entrenar",tabHistory:"Historial",tabSettings:"Ajustes",tabProfile:"Perfil",mainMenu:"Men\xFA principal",tabCalories:"Calor\xEDas",newsTitle:"Novedades de la {v}",newsIntro:"Una gran actualizaci\xF3n. Aqu\xED est\xE1 todo lo nuevo y c\xF3mo era antes.",newsBefore:"Antes:",newsNow:"Ahora:",newsOk:"Genial, vamos",newsLink:"Novedades",newsSmall:"Una actualizaci\xF3n peque\xF1a, no hay que descargar nada nuevo.",newsSwipe:"Actualizaciones peque\xF1as: desliza a la izquierda o toca aqu\xED \u203A",newsPrev:"Anterior",newsNext:"Siguiente",updTitle:"La app se ha actualizado a la {v}",updBtn:"Mira las novedades",msgBackupShared:"\u2713 Copia lista. Gu\xE1rdala en Archivos o en Google Drive, o env\xEDatela.",backupSaveDApp:"Abre el men\xFA Compartir: guarda el archivo en Archivos o en Google Drive, o env\xEDatelo.",apkUpdTitle:"Nueva versi\xF3n de la app: {v}",apkUpdBody:"Una actualizaci\xF3n grande: descarga e instala el nuevo APK. Tus datos se quedan.",apkUpdBtn:"Descargar",welcomeMove:"\xBFUsabas HW App en el navegador? Pasa tus datos: en el navegador Ajustes \u2192 Guardar copia de seguridad; luego aqu\xED Ajustes \u2192 Restaurar copia de seguridad.",welcomeMoveBtn:"Abrir Ajustes",getAndroid:"\u{1F4F1} App para Android",hintTitle:"\xBFSab\xEDas que\u2026?",hintGo:"Mostrar",hint_themes:"\xBFOtro color? En Ajustes \u2192 Apariencia hay 8 temas.",hint_exercises:"\xBFNo te sale un ejercicio? Ajustes \u2192 Ejercicios: des mientos.",grpLastLock:"Es el \xFAltimo ejercicio de este tipo, as\xED que tiene que seguir activado. Si no, no entrenar\xEDas estos m\xFAsculos.",exAlt:"alternativa",exInfo:"toca para ver info",exReplacedBy:"Desactivado. El d\xEDa {d} usar\xE1 en su lugar: {name}.",exCanDo:"Puedo hacer: {name}",resetAll:"\u{1F9F9} Empezar de cero",resetAllD:"Borra entrenamientos, XP, niveles, racha, rangos e insignias. El nombre, la foto y los ajustes se mantienen.",resetAllTitle:"\xBFEmpezar de cero?",resetAllBody:"Se borrar\xE1n todos tus entrenamientos ({count}) y todo lo que sale de ellos: XP, niveles, la racha, congelaciones, rangos e insignias. Tu nombre, tu foto y tus ajustes se mantienen. No se puede deshacer, as\xED que guarda primero una copia si crees que podr\xEDas querer los datos.",resetAllBackup:"\u{1F4BE} Guardar copia primero",resetAllYes:"S\xED, borrar todo",msgResetAll:"\u2713 Hecho. Empiezas de cero."},pl:{workouts:{one:"{n} entrenamiento",other:"{n} entrenamientos"},days:{one:"{n} d\xEDa",other:"{n} d\xEDas"},daysAgo:{one:"hace {n} d\xEDa",other:"hace {n} d\xEDas"},rounds:{one:"{n} ronda",other:"{n} rondas"},sets:{one:"{n} serie",other:"{n} series"},prs:{one:"{n} r\xE9cord personal",other:"{n} r\xE9cords personales"},weeks:{one:"{n} semana",other:"{n} semanas"},pushups:{one:"{n} flexi\xF3n",other:"{n} flexiones"},reps:{one:"{n} repetici\xF3n",other:"{n} repeticiones"},birthdays:{one:"{n} cumplea\xF1os",other:"{n} cumplea\xF1os"}},units:{arm:"/brazo",leg:"/pierna",side:"/lado"},perUnit:{arm:"por brazo",leg:"por pierna",side:"por lado"},themes:{navy:"Marino",black:"Negro",forest:"Bosque",plum:"Ciruela",ocean:"Oc\xE9ano",wine:"Vino",slate:"Pizarra",coffee:"Caf\xE9"},ranks:["Madera","Hierro","Bronce","Plata","Oro","Platino","Diamante"],ex:{k1:{name:"Flexi\xF3n",muscles:"Pecho, tr\xEDceps, deltoides anterior",tempo:"3 s abajo, pausa corta, arriba",how:"Manos un poco m\xE1s abiertas que los hombros, cuerpo recto de la cabeza a los talones, abdomen y gl\xFAteos apretados. Baja durante 3 segundos hasta que el pecho casi toque el suelo, aguanta un instante y vuelve a subir. Mant\xE9n los codos a ~45\xB0 del cuerpo, no abiertos hacia los lados.",tip:"Cuando llegues a 25+ en la primera ronda, apoya las manos en dos libros gruesos. El pecho baja m\xE1s, el m\xFAsculo se estira m\xE1s y crece m\xE1s. Los libros deben ser firmes y de la misma altura para que no resbalen. Si te duelen los hombros, baja menos.",lvl:"Apoya las manos en dos libros gruesos para que el pecho baje m\xE1s. Al principio har\xE1s menos reps, es normal. Los libros deben ser firmes para que no resbalen."},row1:{name:"Remo en el marco de la puerta",muscles:"Espalda (dorsales), deltoides posterior, b\xEDceps",tempo:"1 s arriba, 1 s pausa, 3 s de vuelta",how:"Ponte en una puerta abierta, de lado al marco. Agarra el marco con una mano a la altura del pecho, con los pies justo al lado del marco. Incl\xEDnate hacia atr\xE1s con el brazo estirado y el cuerpo recto. Tira de ti hacia el marco: el codo va hacia atr\xE1s pegado al cuerpo, lleva el om\xF3plato hacia atr\xE1s. Vuelve despacio. Haz todas las reps con un brazo y luego con el otro.",tip:"Cuanto m\xE1s cerca del marco est\xE9n tus pies y m\xE1s te inclines hacia atr\xE1s, m\xE1s dif\xEDcil es. Agarra el marco firme, no la puerta, y entrena sin zapatos ni calcetines para que los pies no resbalen.",lvl:"Acerca los pies al marco e incl\xEDnate m\xE1s hacia atr\xE1s."},n1:{name:"Sentadilla ATG",muscles:"Cu\xE1driceps, gl\xFAteos",tempo:"3 s abajo, 1 s de pausa abajo, arriba",how:"Pies a la anchura de los hombros, puntas un poco hacia fuera. Baja durante 3 segundos lo m\xE1s profundo que puedas, con los muslos por debajo de las rodillas y los talones en el suelo. Aguanta 1 segundo abajo y sube.",tip:"El tempo lento y la pausa abajo convierten una sentadilla f\xE1cil en dif\xEDcil. Si haces 20+ incluso con el tempo, c\xE1mbiala por la Sentadilla 1 y 1/4.",lvl:"C\xE1mbiala por la Sentadilla 1 y 1/4 (\u21C4 Cambiar)."},b5:{name:"Plancha",muscles:"Todo el core",how:"Antebrazos debajo de los hombros, cuerpo recto de la cabeza a los talones. Aprieta el abdomen y los gl\xFAteos como si alguien fuera a darte un golpe en el est\xF3mago. No dejes que la cadera suba ni se hunda.",tip:"Cuando aguantes 60 s en ambas rondas, c\xE1mbiala por la Plancha con una pierna. Es mucho m\xE1s dif\xEDcil.",lvl:"C\xE1mbiala por la Plancha con una pierna (\u21C4 Cambiar)."},r1:{name:"Flexi\xF3n pike",muscles:"Hombros, tr\xEDceps",tempo:"3 s abajo, arriba",how:"Ponte en V invertida: manos en el suelo, cadera alta, piernas lo m\xE1s rectas que puedas. Dobla los codos y baja la coronilla hacia el suelo justo delante de las manos, de modo que manos y cabeza formen un tri\xE1ngulo. Vuelve a subir.",tip:"Cuando hagas 15+ en ambas rondas, c\xE1mbiala por la Flexi\xF3n pike con pies en la silla. M\xE1s peso ir\xE1 a los hombros.",lvl:"C\xE1mbiala por la Flexi\xF3n pike con pies en la silla (\u21C4 Cambiar)."},row2:{name:"Remo con toalla en la puerta",muscles:"Espalda media, om\xF3platos, b\xEDceps",tempo:"1 s arriba, 1 s pausa, 3 s de vuelta",how:"Abre la puerta y col\xF3cate de frente al canto, con la puerta entre los pies. Pasa una toalla alrededor de los dos pomos y ag\xE1rrala por los extremos, o agarra los dos pomos directamente. Incl\xEDnate hacia atr\xE1s con los brazos estirados y el cuerpo recto. Lleva el pecho hacia el canto de la puerta, junta los om\xF3platos y baja despacio.",tip:"Primero comprueba que los pomos est\xE9n firmes y no se muevan. Si algo se mueve, haz mejor el remo en el marco de la puerta (d\xEDa A). La seguridad es lo primero.",lvl:"Acerca los pies a la puerta e incl\xEDnate m\xE1s hacia atr\xE1s."},n2:{name:"Sentadilla b\xFAlgara",muscles:"Cu\xE1driceps, gl\xFAteos",tempo:"3 s abajo, arriba",how:"Ponte delante de una silla y apoya el empeine del pie de atr\xE1s en el asiento. Da un paso largo hacia delante con el otro pie. Baja durante 3 segundos, con la rodilla de atr\xE1s yendo hacia el suelo. Sube empujando con el tal\xF3n del pie de delante.",tip:"Adelanta el pie de delante lo suficiente para que la rodilla quede sobre el pie. Inclinar un poco el torso hacia delante = m\xE1s gl\xFAteos. Apoya la silla contra la pared para que no se deslice bajo el pie.",lvl:"Ve m\xE1s lento: 4 s abajo y 2 s de pausa abajo."},b2:{name:"Dead bug",muscles:"M\xFAsculos abdominales profundos",tempo:"despacio, 2 s afuera, 2 s de vuelta",how:"T\xFAmbate boca arriba, brazos estirados hacia el techo, piernas en el aire con las rodillas a 90\xB0. Baja despacio el brazo derecho por detr\xE1s de la cabeza y la pierna izquierda hacia el suelo, luego vuelve y cambia de lado.",tip:"La zona lumbar tiene que quedarse pegada al suelo todo el tiempo. Si se levanta, no bajes tanto la pierna.",lvl:"Baja el brazo y la pierna m\xE1s despacio, 3 s afuera y 3 s de vuelta."},k3:{name:"Flexi\xF3n diamante",muscles:"Tr\xEDceps, parte interna del pecho",tempo:"3 s abajo, arriba",how:"Coloca las manos debajo del pecho, de modo que los pulgares y los \xEDndices se toquen y formen un diamante. Baja con los codos yendo hacia atr\xE1s pegados al cuerpo. El pecho va hacia las manos.",tip:"Si te duelen las mu\xF1ecas o los codos, separa un poco las manos. La flexi\xF3n cerrada trabaja el tr\xEDceps casi igual. La versi\xF3n m\xE1s dif\xEDcil es la Flexi\xF3n diamante con pies en la silla; puedes cambiarla por esa.",lvl:"C\xE1mbiala por la Flexi\xF3n diamante con pies en la silla (\u21C4 Cambiar)."},row3:{name:"Remo abierto en el marco de la puerta",muscles:"Deltoides posterior, espalda alta",tempo:"1 s arriba, 1 s pausa, 3 s de vuelta",how:"Misma posici\xF3n que el remo en el marco de la puerta, pero agarra el marco a la altura del hombro y lleva el codo hacia el lado, no pegado al cuerpo. El brazo y el torso forman una T. Deber\xEDas sentirlo en la parte de atr\xE1s del hombro y entre los om\xF3platos.",tip:"Este \xE1ngulo trabaja el deltoides posterior y la espalda alta. Hacen que los hombros se vean m\xE1s anchos y gruesos por detr\xE1s.",lvl:"Acerca los pies al marco e incl\xEDnate m\xE1s hacia atr\xE1s."},n7:{name:"Curl femoral con toalla",muscles:"Isquiotibiales, gl\xFAteos",tempo:"3 s afuera, 1 s de vuelta",how:"T\xFAmbate boca arriba en un suelo liso (madera, baldosas), con los talones sobre una toalla o en calcetines. Sube la cadera en puente. Desliza las piernas hacia fuera durante 3 segundos hasta que est\xE9n casi rectas, con la cadera todav\xEDa arriba. Luego lleva los talones de vuelta hacia los gl\xFAteos.",tip:"\xBFEst\xE1s en alfombra o no puedes deslizar? C\xE1mbialo por un puente normal.",lvl:"Hazlo con una pierna y mant\xE9n la otra en el aire. Empieza con menos recorrido. Si te da un calambre o se cae la cadera, vuelve a las dos piernas."},b4:{name:"Abdominal bicicleta",muscles:"Oblicuos, todo el abdomen",tempo:"despacio, 1 s por lado",how:"T\xFAmbate boca arriba, manos detr\xE1s de la cabeza, hombros despegados del suelo. Lleva el codo derecho hacia la rodilla izquierda mientras estiras la pierna derecha. Luego cambia. Gira el torso, no solo los codos.",tip:"Ve despacio. Mover los codos r\xE1pido no sirve de nada, solo carga el cuello.",lvl:"Ve m\xE1s lento: 2 s por lado."},kKnee:{name:"Flexi\xF3n de rodillas",muscles:"Pecho, tr\xEDceps, deltoides anterior",tempo:"3 s abajo, arriba",how:"De rodillas, manos un poco m\xE1s abiertas que los hombros. Mant\xE9n el cuerpo recto de las rodillas a la cabeza, sin sacar la cadera. Baja el pecho al suelo durante 3 segundos y vuelve a subir.",tip:"Cuando hagas 20 en las dos rondas, vuelve a la flexi\xF3n normal."},kIncl:{name:"Flexi\xF3n inclinada",muscles:"Pecho, tr\xEDceps, deltoides anterior",tempo:"3 s abajo, arriba",how:"Apoya las manos en una mesa firme, una cama o el alf\xE9izar de una ventana. Mant\xE9n el cuerpo recto de los talones a la cabeza. Baja el pecho hacia el borde y empuja de vuelta. Cuanto m\xE1s bajo sea el apoyo, m\xE1s dif\xEDcil.",tip:"Buena alternativa cuando te duelen las mu\xF1ecas en el suelo o te quedas sin fuerza."},superman:{name:"Superman",muscles:"Zona lumbar, gl\xFAteos, deltoides posterior",tempo:"arriba, 2 s pausa, abajo",how:"T\xFAmbate boca abajo con los brazos estirados hacia delante. Levanta los brazos, el pecho y las piernas del suelo a la vez, aguanta 2 segundos y baja despacio. Mira al suelo, no eches el cuello hacia atr\xE1s.",tip:"No es un ejercicio de tir\xF3n como el remo, pero fortalece la espalda cuando no tienes d\xF3nde hacer remo."},ytw:{name:"Y-T-W en el suelo",muscles:"Espalda media y alta, deltoides posterior",tempo:"aguanta cada posici\xF3n 1 s",how:"T\xFAmbate boca abajo, con la frente sobre una toalla. Levanta los brazos estirados en Y y aguanta 1 s. Luego \xE1brelos a los lados en T. Por \xFAltimo, lleva los codos hacia las costillas en W y junta los om\xF3platos. Y + T + W = 1 rep.",tip:"Pulgares hacia arriba, hombros lejos de las orejas."},lunge:{name:"Zancada hacia atr\xE1s",muscles:"Cu\xE1driceps, gl\xFAteos",tempo:"2 s abajo, arriba",how:"De pie, con la espalda recta. Da un paso largo hacia atr\xE1s: la rodilla de atr\xE1s baja casi hasta el suelo y la de delante se dobla a 90\xB0. Empuja con el tal\xF3n del pie de delante para volver a ponerte de pie. Haz todas las reps con una pierna y luego con la otra.",tip:"Es m\xE1s suave para las rodillas que la zancada hacia delante. Mant\xE9n el torso erguido."},bridge:{name:"Puente de gl\xFAteos",muscles:"Gl\xFAteos, isquiotibiales",tempo:"arriba, 2 s apretando, abajo",how:"T\xFAmbate boca arriba, rodillas dobladas, pies en el suelo. Empuja con los talones y sube la cadera hasta que el cuerpo forme una l\xEDnea recta de las rodillas a los hombros. Aprieta los gl\xFAteos 2 segundos arriba y baja despacio.",tip:"La versi\xF3n m\xE1s dif\xEDcil es el Puente a una pierna. Cuando este te resulte f\xE1cil, c\xE1mbialo por ese."},r1e:{name:"Flexi\xF3n pike con pies en la silla",muscles:"Hombros, tr\xEDceps",tempo:"3 s abajo, arriba",how:"Pon los pies en una silla y las manos en el suelo un poco por delante, con la cadera alta para que el torso quede casi vertical. Dobla los codos y baja la cabeza al suelo justo delante de las manos, con los codos hacia atr\xE1s, no hacia los lados. Vuelve a subir.",tip:"Cuanto m\xE1s vertical el torso, m\xE1s peso va a los hombros. Aprieta los gl\xFAteos para no arquear la zona lumbar. La silla debe estar firme, mejor apoyada contra la pared. Baja la cabeza despacio, nunca caigas sobre ella."},k3e:{name:"Flexi\xF3n diamante con pies en la silla",muscles:"Tr\xEDceps, pecho interior, hombros",tempo:"3 s abajo, arriba",how:"Pon los pies en una silla y las manos bajo el pecho de modo que pulgares e \xEDndices se toquen y formen un diamante. Cuerpo recto de la cabeza a los talones. Baja con los codos hacia atr\xE1s pegados al cuerpo y el pecho hacia las manos. Vuelve a subir.",tip:"Que la cadera no suba ni se hunda. Si te duelen las mu\xF1ecas o los codos, separa un poco las manos. La silla debe estar firme, mejor apoyada contra la pared."},n1q:{name:"Sentadilla 1 y 1/4",muscles:"Parte delantera del muslo, gl\xFAteos",tempo:"abajo, un cuarto arriba, abajo, arriba",how:"Pies a la anchura de los hombros, puntas un poco hacia fuera. Baja del todo, sube solo un cuarto, vuelve a bajar del todo y solo entonces ponte de pie. Eso es 1 rep. Talones siempre en el suelo.",tip:"Los m\xFAsculos pasan dos veces por la parte m\xE1s dura y profunda de la sentadilla, por eso es m\xE1s dif\xEDcil. No te dejes caer, baja con control."},b5l:{name:"Plancha con una pierna",muscles:"Todo el core, gl\xFAteos",how:"Como la plancha normal: antebrazos bajo los hombros, cuerpo recto de la cabeza a los talones. Levanta una pierna estirada un poco del suelo; a mitad de tiempo b\xE1jala y levanta la otra. Cadera nivelada, sin girarla.",tip:"No subas mucho la pierna, basta con despegarla del suelo. Lo importante es que la cadera no se mueva."},sbridge:{name:"Puente a una pierna",muscles:"Gl\xFAteos, isquiotibiales",tempo:"arriba, 2 s apretando, abajo",how:"T\xFAmbate boca arriba, rodillas dobladas, pies en el suelo. Estira una pierna en el aire y mant\xE9n los muslos juntos. Empuja con el tal\xF3n de la pierna apoyada y sube la cadera hasta que el cuerpo forme una l\xEDnea recta de la rodilla a los hombros. Arriba aprieta los gl\xFAteos 2 segundos y baja despacio. Primero todas las reps con una pierna y luego con la otra.",tip:"Mant\xE9n la cadera nivelada, que no caiga hacia el lado de la pierna levantada. Apunta el n\xFAmero de una pierna: 10 izquierda + 10 derecha = apunta 10. Si te da un calambre en el isquio, vuelve al puente con las dos piernas."},wallsit:{name:"Sentadilla en pared",muscles:"Cu\xE1driceps",how:"Apoya la espalda en una pared y desl\xEDzate hacia abajo hasta que los muslos queden paralelos al suelo y las rodillas a 90\xB0. Toda la espalda en la pared, rodillas sobre los tobillos. Aguanta.",tip:"No apoyes las manos en los muslos, o te estar\xE1s ayudando."},birddog:{name:"Bird dog",muscles:"Core, zona lumbar, gl\xFAteos",tempo:"estira, 2 s pausa, vuelve",how:"Ponte en cuatro apoyos: manos debajo de los hombros, rodillas debajo de la cadera. Estira a la vez el brazo derecho hacia delante y la pierna izquierda hacia atr\xE1s, con el cuerpo en l\xEDnea recta. Aguanta 2 segundos, vuelve y cambia de lado.",tip:"La cadera no debe girar. Imagina un vaso de agua sobre la zona lumbar."},hollow:{name:"Hollow body",muscles:"Todo el core",how:"T\xFAmbate boca arriba con los brazos estirados por detr\xE1s de la cabeza. Pega la zona lumbar al suelo y levanta un poco del suelo los hombros y las piernas estiradas. Aguanta sin moverte.",tip:"Si la zona lumbar se despega del suelo, sube m\xE1s las piernas o d\xF3blalas."},legraise:{name:"Elevaci\xF3n de piernas",muscles:"Abdomen inferior, flexores de cadera",tempo:"2 s arriba, 2 s abajo",how:"T\xFAmbate boca arriba, brazos a los lados. Sube despacio las piernas estiradas hasta que queden verticales y b\xE1jalas despacio casi hasta el suelo, pero sin apoyarlas. La zona lumbar se queda en el suelo.",tip:"Si te duele la zona lumbar, dobla las rodillas."}},warm:{w1:{name:"C\xEDrculos de brazos",dose:"15\xD7 hacia delante, 15\xD7 hacia atr\xE1s",why:"Suelta los hombros antes de las flexiones y los remos."},w2:{name:"Balanceo de piernas",dose:"10\xD7 cada pierna, apoy\xE1ndote en una pared",why:"Suelta la cadera antes de las sentadillas."},w3:{name:"El mejor estiramiento del mundo",dose:"5\xD7 cada lado",why:"Cadera, espalda alta e isquiotibiales a la vez."},w4:{name:"Inchworm (gusano)",dose:"5\xD7",why:"Calienta todo el cuerpo y te lleva a la posici\xF3n de plancha."}},cool:{c1:{name:"Flexor de cadera, izquierda",why:"Pasar muchas horas en la silla (clases, PC) acorta la parte delantera de la cadera. Si solo haces un estiramiento, que sea este.",how:"Apoya la rodilla izquierda en el suelo, con el pie derecho delante. Aprieta los gl\xFAteos y lleva la cadera hacia delante hasta notar el estiramiento en la parte delantera de la cadera izquierda. No arquees la zona lumbar."},c2:{name:"Flexor de cadera, derecha",why:"Lo mismo del otro lado.",how:"Apoya la rodilla derecha en el suelo, con el pie izquierdo delante. Aprieta los gl\xFAteos y lleva la cadera hacia delante."},c4:{name:"Cobra",why:"Estira el abdomen y la parte delantera de la cadera. Compensa todo el encogerse de los ejercicios de abdomen.",how:"T\xFAmbate boca abajo, palmas bajo los hombros, codos pegados al cuerpo. Deja la cadera en el suelo y empuja despacio con los brazos hacia arriba hasta notar un estiramiento agradable en el abdomen. Hombros abajo, lejos de las orejas; los codos no tienen que estar del todo estirados. Si te pincha la zona lumbar, baja un poco."},c3:{name:"Postura del ni\xF1o",why:"Calma la respiraci\xF3n y relaja la espalda. Solo para sentirte bien.",how:"Rodillas separadas, si\xE9ntate con la cadera sobre los talones, estira los brazos hacia delante todo lo que puedas, frente en el suelo. Respira despacio."}},fig:{k1:["Arriba","Abajo, codos a ~45\xB0 del cuerpo"],k3:["Arriba","Abajo, codos pegados"],b5:["Bien: cuerpo recto","Mal: lumbar hundida"],n1:["Inicio","Abajo, talones en el suelo"],r1:["Arriba","Abajo, cabeza delante de las manos"],row1:["Inicio, brazo estirado","Tira, codo atr\xE1s"],row3:["Inicio, mano a la altura del hombro","Codo hacia el lado, a ~90\xB0 del cuerpo"],row2:["Inicio, brazos estirados","Pecho hacia la puerta"],n2:["Arriba","Abajo, rodilla de atr\xE1s al suelo"],b2:["Inicio","Brazo y pierna contraria abajo"],n7:["Cadera arriba, talones cerca de los gl\xFAteos","Piernas afuera, cadera arriba"],b4:["Codo a la rodilla contraria","Cambia de lado"],kKnee:["Arriba, rodillas en el suelo","Abajo, codos a ~45\xB0 del cuerpo"],kIncl:["Manos en la mesa, arriba","Pecho al borde, codos a ~45\xB0 del cuerpo"],superman:["Boca abajo","Levanta y aguanta 2 s"],ytw:["Y: brazos en diagonal al frente","T: brazos a los lados","W: codos a las costillas"],lunge:["Inicio","Paso atr\xE1s, rodilla al suelo"],bridge:["Boca arriba, rodillas dobladas","Cadera arriba, aprieta gl\xFAteos"],sbridge:["Boca arriba, una pierna arriba","Cadera arriba, aprieta gl\xFAteos"],r1e:["Arriba, pies en la silla","Abajo, cabeza delante de las manos"],k3e:["Arriba, pies en la silla","Abajo, codos pegados"],n1q:["Abajo del todo","Un cuarto arriba","Otra vez abajo del todo","Solo entonces arriba"],b5l:["Una pierna arriba","A mitad de tiempo, cambia de pierna"],wallsit:["Rodillas ~90\xB0, espalda en la pared"],birddog:["En cuatro apoyos: brazos y rodillas ~90\xB0","Brazo y pierna contraria"],hollow:["Lumbar pegada al suelo"],legraise:["Piernas arriba","Baja despacio, sin apoyarlas en el suelo"],hf:["Rodilla de atr\xE1s abajo, cadera adelante"],cobra:["Cadera en el suelo, pecho arriba"],child:["Cadera a los talones, brazos bien adelante"]},ch:{w3:"Haz 3 entrenamientos",pr1:"Supera un r\xE9cord personal",r3:"Haz 3 rondas una vez",warm:"Calentamiento completo 2\xD7",cool:"Estira despu\xE9s de entrenar 2\xD7",push100:"100 flexiones en total (de cualquier tipo)",rank:"Consigue un rango nuevo",reps300:"300 reps en total",legs100:"100 reps de piernas"},ach:{workouts:["Entrenamientos","{x}"],streak:["Racha","racha de {x}"],records:["R\xE9cords","{x}"],ranks:["Coleccionista de rangos","suma de rangos en todos los ejercicios: {n}"],weeks:["Retos semanales","{x} al 100\xA0%"],level:["Nivel","nivel {n}"],rounds3:["Tres rondas","{x} con 3 rondas"],pushups:["Flexiones seguidas","{x} en una serie"],reps:["Repeticiones","{x} en total"],birthday:["Cumplea\xF1os","{x} con la app"],calories:["Calor\xEDas","{x} con calor\xEDas anotadas"]},news14:[["Men\xFA","abajo una barra con 3 pesta\xF1as, el perfil desde la foto arriba a la derecha.","un men\xFA \u2630 arriba a la derecha con todo: Entrenar, Calor\xEDas, Historial, Perfil, Ajustes."],["Entreno en segundo plano","durante el entreno no pod\xEDas ir a ninguna otra parte.","el entreno se encoge en una ventanita abajo, el tiempo y los sonidos siguen, tocas y vuelves."],["Contador de repeticiones","el n\xFAmero ven\xEDa puesto seg\xFAn la \xFAltima vez o estimado.","empieza en 0 y muestra tu \xFAltimo resultado con un objetivo +1."],["\xDAltima ronda","1\u20132 repeticiones en reserva.","hasta el fallo t\xE9cnico: mientras cada repetici\xF3n sea limpia."],["Calor\xEDas","no exist\xEDan.","calculadora (perder, mantener, ganar) y registro diario de comida. Los entrenos de la app se suman solos."],["Insignias","15 insignias: las ten\xEDas o no.","11 tipos con niveles Madera \u2192 Diamante y una barra con lo que falta. Lo que ten\xEDas se queda."],["Cumplea\xF1os","nada.","con tu fecha de nacimiento: sorpresa, confeti, un freeze extra e insignia de cumplea\xF1os."],["Plancha","30 \u2013 75 s.","tambi\xE9n 15 s."],["Seguridad","las versiones dif\xEDciles no ten\xEDan avisos.","avisos en los pasos con riesgo (calambres, cadera, silla contra la pared, libros firmes)."],["Consejos","no exist\xEDan.","cada dos d\xEDas un \xAB\xBFSab\xEDas que\u2026?\xBB con un bot\xF3n que te lleva all\xED."]],news141:["La calculadora de calor\xEDas pregunta \xAB\xBFHombre o mujer?\xBB.","Los campos obligatorios llevan un asterisco *; de la fecha de nacimiento solo es obligatorio el a\xF1o."],news142:["\xABNovedades\xBB tiene p\xE1ginas: la primera es la gran actualizaci\xF3n; desliza a la izquierda para las peque\xF1as.","Tras una actualizaci\xF3n peque\xF1a, una tarjeta en el inicio te lleva a su p\xE1gina. Solo aparece la primera vez."],news10:[["App","una web en el navegador (Browser beta).","una app de Android de verdad con icono en la pantalla de inicio. En la web est\xE1 en el men\xFA \u2192 \u{1F4F1} App para Android."],["Tus datos","guardados en el navegador.","guardados en la app. P\xE1salos con una copia: en el navegador Ajustes \u2192 Guardar copia de seguridad, en la app Ajustes \u2192 Restaurar copia de seguridad."],["Actualizaciones","nueva versi\xF3n al volver a abrir la web.","las peque\xF1as se descargan solas y se activan al siguiente inicio; en una grande la app te muestra d\xF3nde bajar el nuevo APK."],["Copia de seguridad","se descargaba un archivo.","se abre el men\xFA Compartir: gu\xE1rdala en Archivos o en Google Drive, o env\xEDatela."],["Sin internet","las fuentes ven\xEDan de Google, sin internet la app se ve\xEDa distinta.","las fuentes van dentro de la app, todo funciona sin conexi\xF3n."],["Bot\xF3n atr\xE1s","\u2013","cierra una ventana o el men\xFA; en un entrenamiento te lleva al inicio y el entrenamiento sigue."],["N\xFAmeros de versi\xF3n","Browser beta 1.0.0 a 1.4.2.","se vuelve a contar desde 1.0.0, la primera versi\xF3n de la app."]],quotes:["La disciplina te lleva adonde la motivaci\xF3n no llega.","No hace falta que te apetezca. Haz la primera serie, lo dem\xE1s viene solo.","Cada rep es un ladrillo. Un cuerpo se construye ladrillo a ladrillo.","13 minutos hoy. Un cuerpo para toda la vida.","Nunca faltes dos veces seguidas.","Pasos peque\xF1os en d\xEDas alternos valen m\xE1s que grandes planes que nunca empiezas.","Tu yo del futuro te dar\xE1 las gracias por hoy.","No se trata del entrenamiento perfecto. Se trata de no faltar.","Donde empieza a quemar, empieza el crecimiento.","Comp\xE1rate solo con quien eras la semana pasada.","Mientras otros buscan motivaci\xF3n, t\xFA ya entrenaste.","Series duras, vida m\xE1s f\xE1cil.","Toda persona fuerte empez\xF3 desde cero."],restDay:["El m\xFAsculo se construye entrenando, pero crece comiendo y durmiendo.","Hoy toca descanso. Tambi\xE9n es parte del plan.","Descansar no es pereza. Ahora mismo est\xE1s creciendo.","El trabajo est\xE1 hecho. Ahora deja que tu cuerpo se reconstruya.","Come bien, duerme bien. Eso tambi\xE9n es entrenar.","La fuerza no se construye en un d\xEDa. Se construye un d\xEDa s\xED y otro no, mes tras mes.","Quien sabe descansar aguanta m\xE1s.","Hoy recargas pilas para tu pr\xF3ximo entrenamiento.","La constancia es tu superpoder. Mantenla.","El progreso no siempre se ve enseguida. Pero est\xE1 pasando.","Si\xE9ntete orgulloso de no rendirte.","Hoy es d\xEDa de recuperaci\xF3n. Disfr\xFAtalo.","Pasos peque\xF1os, muchos d\xEDas seguidos. As\xED llegan los grandes cambios."],doneTitles:["Hoy ya entrenaste","Listo por hoy","Hoy, tachado","\xA1Misi\xF3n cumplida!"],doneSubs:["D\xEDa {day} hecho. Ahora come y duerme: tus m\xFAsculos crecen mientras descansas.","El d\xEDa {day} ya est\xE1. Buen trabajo, ahora descansa.","D\xEDa {day} hecho. Otro ladrillo en el muro.","D\xEDa {day} registrado. Tu pr\xF3ximo entrenamiento es en dos d\xEDas.","D\xEDa {day} completado. Ahora trabaja tu cuerpo; t\xFA disfruta del resto del d\xEDa.","D\xEDa {day} superado. As\xED se construye la disciplina."],facts:["Puedes entrenar todos los d\xEDas, pero en d\xEDas alternos es lo mejor. Los m\xFAsculos crecen mientras descansas, no mientras entrenas.","El sue\xF1o es tu mejor suplemento. 7\u20139 horas por noche = recuperaci\xF3n m\xE1s r\xE1pida.","Las \xFAltimas reps de una serie son las que m\xE1s trabajan. Son las que construyen m\xFAsculo.","Bajar despacio (3 segundos) da m\xE1s trabajo a tus m\xFAsculos que las reps r\xE1pidas.","Tomar prote\xEDna en cada comida ayuda a que tus m\xFAsculos crezcan.","La constancia gana a la intensidad. Mejor 13 minutos en d\xEDas alternos que una hora una vez al mes.","Bebe un poco de agua. Incluso una sed leve baja tu rendimiento.","Respira despacio: inhala por la nariz, exhala por la boca. Te calmar\xE1s antes.","Rango de movimiento completo = m\xE1s m\xFAsculo trabajando. Menos reps, pero completas."],moti:["Creo en ti, \xA1t\xFA puedes! \u{1F4AA}","Cada serie te acerca a tu meta.","Tienes m\xE1s fuerza de la que crees.","Solo un poco m\xE1s, t\xFA puedes.","Hoy cuenta. No te rindas.","Este es el momento en que creces.","Tu yo del futuro te lo agradecer\xE1."],cheers:["\xA1Serie potente!","\xA1As\xED se hace!","\xA1Modo bestia!","\xA1Est\xE1s que ardes!","\xA1Trabajo limpio!","Este es el camino a un cuerpo fuerte.","\xA1Ya casi!"],finish:["Otro ladrillo en el muro. As\xED se hace.","Listo. Ahora come bien y duerme, que es cuando crece el m\xFAsculo.","La fuerza no es talento. Es la suma de d\xEDas exactamente como este.","Listo. Esto es disciplina en acci\xF3n.","Hoy hiciste lo que la mayor\xEDa solo planea."]};var lh={ui:{loading:"Chargement\u2026",close:"Fermer",cancel:"Annuler",save:"Enregistrer",home:"Accueil",back:"Retour",start:"D\xE9marrer",stop:"Arr\xEAter",copied:"\u2713 Copi\xE9",dayN:"Jour {d}",tabTrain:"Entra\xEEnement",tabHistory:"Historique",tabSettings:"R\xE9glages",tabProfile:"Profil",mainMenu:"Menu principal",tabCalories:"Calories",newsTitle:"Nouveaut\xE9s de la {v}",newsIntro:"Une grosse mise \xE0 jour. Voici tout ce qui est nouveau et comment c'\xE9tait avant.",newsBefore:"Avant :",newsNow:"Maintenant :",newsOk:"Super, c'est parti",newsLink:"Nouveaut\xE9s",newsSmall:"Petite mise \xE0 jour, rien de nouveau \xE0 t\xE9l\xE9charger.",newsSwipe:"Petites mises \xE0 jour : glisse vers la gauche ou touche i
