old, {n} s",hideHowTo:"\u25BE hide instructions",showHowTo:"\u25B8 how to",video:"\u25B6 Video",saveWorkout:"Save workout",skipSave:"Skip and save workout",nothingSaved:"Nothing saved",nothingSavedD:"You didn't finish any set, so nothing was added to your history.",great:"Great job!",dayDate:"Day {d}, {date}",levelLine:"Level {lvl}, {into} / {need} XP. Streak: {streak} in a row.",levelUp:"\u26A1 Level up! Level {lvl}",challengeDone:"\u2713 Challenge done: {text}",nextLine:"Next workout: day {d}, ideally {date}",copyAI:"Copy log for AI",dayRound:"Day {d}, round {r} of {n}",quit:"Quit",quitSave:"Quit and save?",quitConfirm:"Really quit?",progressAria:"{done} of {total} done",videoYT:"\u25B6 Video on YouTube",ladderTitle:"Ranks (best set: {v})",ladderNone:"Ranks (best set: none yet)",rankStart:"start",figureAria:"Drawing: {labels}",figBelly:"Yellow line = belly side",figTowel:"Orange line = towel or a strong cloth",figTowelSlide:"Orange = towel under the heels, slides on the floor",photoAlt:"Profile photo",hide:"Hide",editWorkout:"\u270F\uFE0F Edit",editTitle:"Edit workout",addTitle:"Add a workout",addWorkout:"\u2795 Add a workout manually",addWorkoutD:"For a workout you did without the app, or forgot to save.",fDate:"Date",fDay:"Day",fRounds:"Rounds",roundN:"Round {r}",secondsUnit:"seconds",editHint:"Leave a box empty if you didn't do that round. If you didn't do an exercise at all, remove it with \u2715.",removeEx:"Remove {name}",addEx:"\u2795 Add an exercise\u2026",editEmpty:"Fill in at least one number, or delete the workout.",editBadDate:"Pick a date that isn't in the future.",grp_push:"Push",grp_pull:"Pull",grp_legs:"Legs",grp_core:"Core",exMenu:"\u{1F3CB}\uFE0F Exercises",exMenuD:"How every exercise is done, and which ones you can do.",exTitle:"Exercises",exIntro:"Tap an exercise to see how it's done. Turn off the ones you can't do (no door, no chair, pain\u2026). The app then uses another exercise of the same type, so every workout still has push, pull, legs and core.",grpOn:"{on} of {n} on",grpLast:"Only one left, so it will be in every workout.",grpLastLock:"This is the last exercise of this type, so it has to stay on. Otherwise these muscles wouldn't get trained at all.",exAlt:"alternative",exInfo:"tap for info",exReplacedBy:"Off. Day {d} uses {name} instead.",exCanDo:"I can do {name}",resetAll:"\u{1F9F9} Start over from zero",resetAllD:"Deletes workouts, XP, levels, streak, ranks and badges. Name, photo and settings stay.",resetAllTitle:"Start over?",resetAllBody:"This deletes all your workouts ({count}) and everything that comes from them: XP, levels, the streak, freezes, ranks and badges. Your name, photo and settings stay. It can't be undone, so save a backup first if you might want the data back.",resetAllBackup:"\u{1F4BE} Save a backup first",resetAllYes:"Yes, delete it all",msgResetAll:"\u2713 Done. You're starting from zero."},pl:{workouts:{one:"{n} workout",other:"{n} workouts"},days:{one:"{n} day",other:"{n} days"},daysAgo:{one:"{n} day ago",other:"{n} days ago"},rounds:{one:"{n} round",other:"{n} rounds"},sets:{one:"{n} set",other:"{n} sets"},prs:{one:"{n} personal record",other:"{n} personal records"},weeks:{one:"{n} week",other:"{n} weeks"},pushups:{one:"{n} push-up",other:"{n} push-ups"},reps:{one:"{n} rep",other:"{n} reps"},birthdays:{one:"{n} birthday",other:"{n} birthdays"}},units:{arm:"/arm",leg:"/leg",side:"/side"},perUnit:{arm:"per arm",leg:"per leg",side:"per side"},themes:{navy:"Navy",black:"Black",forest:"Forest",plum:"Plum",ocean:"Ocean",wine:"Wine",slate:"Slate",coffee:"Coffee"},ranks:["Wood","Iron","Bronze","Silver","Gold","Platinum","Diamond"],ex:{k1:{name:"Push-up",muscles:"Chest, triceps, front shoulders",tempo:"3 s down, short pause, up",how:"Hands slightly wider than your shoulders, body straight from head to heels, abs and glutes tight. Lower yourself for 3 seconds until your chest almost touches the floor, hold briefly and push back up. Keep your elbows at ~45\xB0 to your body, not flared out.",tip:"Once you hit 25+ in the first round, put your hands on two thick books. Your chest goes deeper, the muscle stretches more and grows more. The books must be sturdy and the same height so they don't slip. If your shoulders hurt, go less deep.",lvl:"Put your hands on two thick books so your chest goes deeper. Your numbers will drop at first, that's fine. The books must be sturdy so they don't slip."},row1:{name:"Door frame row",muscles:"Back (lats), rear shoulders, biceps",tempo:"1 s up, 1 s hold, 3 s back",how:"Stand in an open doorway, side-on to the frame. Grab the frame with one hand at chest height, feet right next to the frame. Lean back with your arm straight and your body straight. Pull yourself to the frame: elbow goes back along your body, squeeze your shoulder blade back. Return slowly. Do all reps with one arm, then the other.",tip:"The closer your feet are to the frame and the further you lean back, the harder it gets. Hold the solid frame, not the door, and train barefoot so your feet don't slip.",lvl:"Move your feet closer to the frame and lean back further."},n1:{name:"ATG squat",muscles:"Front thighs, glutes",tempo:"3 s down, 1 s pause at the bottom, up",how:"Feet shoulder-width apart, toes slightly out. Lower yourself for 3 seconds as deep as you can, thighs below your knees, heels on the floor. Hold for 1 second at the bottom and stand up.",tip:"The slow tempo and the pause turn an easy squat into a hard one. If you do 20+ even with the tempo, swap it for the 1\xBC squat.",lvl:"Swap it for the 1\xBC squat (\u21C4 Swap)."},b5:{name:"Plank",muscles:"Whole core",how:"Forearms under your shoulders, body straight from head to heels. Brace your abs and glutes as if someone were about to punch your stomach. Don't let your hips rise or sag.",tip:"Once you hold 60 s in both rounds, swap it for the Single-leg plank. It's much harder.",lvl:"Swap it for the Single-leg plank (\u21C4 Swap)."},r1:{name:"Pike push-up",muscles:"Shoulders, triceps",tempo:"3 s down, up",how:"Get into an inverted V: hands on the floor, hips high, legs as straight as you can. Bend your elbows and lower the top of your head to the floor just in front of your hands, so your hands and head form a triangle. Push back up.",tip:"Once you do 15+ in both rounds, swap it for the Feet-elevated pike push-up. More of your weight goes onto your shoulders.",lvl:"Swap it for the Feet-elevated pike push-up (\u21C4 Swap)."},row2:{name:"Towel door row",muscles:"Mid back, shoulder blades, biceps",tempo:"1 s up, 1 s hold, 3 s back",how:"Open the door and stand facing its edge, with the door between your feet. Loop a towel around both handles and hold its ends, or grab both handles directly. Lean back with your arms straight and your body straight. Pull your chest to the edge of the door, squeeze your shoulder blades and lower slowly.",tip:"First check that the handles are solid and don't move. If anything moves, do the door frame row (day A) instead. Safety comes first.",lvl:"Move your feet closer to the door and lean back further."},n2:{name:"Bulgarian split squat",muscles:"Front thighs, glutes",tempo:"3 s down, up",how:"Stand in front of a chair and put the top of your back foot on the seat. Take a big step forward with your front foot. Lower yourself for 3 seconds, your back knee goes towards the floor. Push up through the heel of your front foot.",tip:"Put your front foot far enough forward that your knee stays above your foot. Leaning your torso slightly forward = more glutes. Put the chair against a wall so it can't slide under your foot.",lvl:"Slow down: 4 s down and a 2 s pause at the bottom."},b2:{name:"Dead bug",muscles:"Deep abdominal muscles",tempo:"slowly, 2 s out, 2 s back",how:"Lie on your back, arms straight up to the ceiling, legs raised with knees at 90\xB0. Slowly lower your right arm behind your head and your left leg towards the floor, then come back and switch sides.",tip:"Your lower back must stay pressed to the floor the whole time. If it lifts, don't lower your leg as far.",lvl:"Lower your arm and leg more slowly, 3 s out and 3 s back."},k3:{name:"Diamond push-up",muscles:"Triceps, inner chest",tempo:"3 s down, up",how:"Place your hands under your chest so your thumbs and index fingers touch and form a diamond. Lower yourself with your elbows going back along your body. Your chest goes towards your hands.",tip:"If your wrists or elbows hurt, move your hands a bit apart. A close-grip push-up works the triceps almost as much. The harder version is the Feet-elevated diamond push-up; you can swap to it.",lvl:"Swap it for the Feet-elevated diamond push-up (\u21C4 Swap)."},row3:{name:"Wide door frame row",muscles:"Rear shoulders, upper back",tempo:"1 s up, 1 s hold, 3 s back",how:"Same stance as the door frame row, but grab the frame at shoulder height and pull your elbow out to the side, not along your body. Your arm and torso form a T. You should feel it at the back of your shoulder and between your shoulder blades.",tip:"This angle trains the rear shoulders and upper back. They make your shoulders look wider and thicker from behind.",lvl:"Move your feet closer to the frame and lean back further."},n7:{name:"Towel hamstring curl",muscles:"Hamstrings, glutes",tempo:"3 s out, 1 s back",how:"Lie on your back on a smooth floor (wood, tiles), heels on a towel or in socks. Lift your hips into a bridge. Slide your legs out for 3 seconds until they're almost straight, hips still up. Then pull your heels back to your glutes.",tip:"On carpet, or can't slide? Swap it for a regular glute bridge.",lvl:"Do it with one leg, keep the other in the air. Start with a shorter range. If you cramp or your hips drop, go back to both legs."},b4:{name:"Bicycle crunch",muscles:"Obliques, whole abs",tempo:"slowly, 1 s per side",how:"Lie on your back, hands behind your head, shoulders off the floor. Bring your right elbow to your left knee while straightening your right leg. Then switch. Your torso rotates, not just your elbows.",tip:"Go slowly. Quick elbow flapping does nothing except strain your neck.",lvl:"Slow down to 2 s per side."},kKnee:{name:"Knee push-up",muscles:"Chest, triceps, front shoulders",tempo:"3 s down, up",how:"Kneel, hands slightly wider than your shoulders. Keep your body straight from knees to head, don't stick your hips out. Lower your chest to the floor for 3 seconds and push back up.",tip:"Once you do 20 in both rounds, go back to the regular push-up."},kIncl:{name:"Incline push-up",muscles:"Chest, triceps, front shoulders",tempo:"3 s down, up",how:"Put your hands on a sturdy table, bed or windowsill. Keep your body straight from heels to head. Lower your chest to the edge and push back. The lower the support, the harder it is.",tip:"A good replacement when your wrists hurt on the floor or you're running out of strength."},superman:{name:"Superman",muscles:"Lower back, glutes, rear shoulders",tempo:"up, 2 s hold, down",how:"Lie on your stomach with your arms stretched out in front of you. Lift your arms, chest and legs off the floor at the same time, hold for 2 seconds and lower slowly. Look at the floor, don't tilt your neck back.",tip:"It isn't a pull like a row, but it strengthens your back when you have nowhere to row."},ytw:{name:"Floor Y-T-W",muscles:"Mid and upper back, rear shoulders",tempo:"hold each position for 1 s",how:"Lie on your stomach, forehead on a towel. Lift your straight arms into a Y and hold for 1 s. Then out to the sides into a T. Finally pull your elbows to your ribs into a W and squeeze your shoulder blades. Y + T + W = 1 rep.",tip:"Thumbs point up, keep your shoulders away from your ears."},lunge:{name:"Reverse lunge",muscles:"Front thighs, glutes",tempo:"2 s down, up",how:"Stand tall. Take a big step back, your back knee goes almost to the floor and your front knee bends to 90\xB0. Push through the heel of your front foot back to standing. Do all reps with one leg, then the other.",tip:"Easier on the knees than a forward lunge. Keep your torso upright."},bridge:{name:"Glute bridge",muscles:"Glutes, hamstrings",tempo:"up, 2 s squeeze, down",how:"Lie on your back, knees bent, feet on the floor. Push through your heels and lift your hips until your body forms a straight line from knees to shoulders. Squeeze your glutes for 2 seconds at the top and lower slowly.",tip:"The harder version is the Single-leg glute bridge. When this one feels easy, swap it for that."},r1e:{name:"Feet-elevated pike push-up",muscles:"Shoulders, triceps",tempo:"3 s down, up",how:"Put your feet on a chair, hands on the floor a bit in front of it, and lift your hips high so your torso is almost vertical. Bend your elbows and lower your head to the floor just in front of your hands, elbows going back, not out to the sides. Push back up.",tip:"The more vertical your torso, the more weight goes onto your shoulders. Squeeze your glutes so your lower back doesn't arch. The chair must stand firm, ideally against a wall. Lower your head slowly, never drop onto it."},k3e:{name:"Feet-elevated diamond push-up",muscles:"Triceps, inner chest, shoulders",tempo:"3 s down, up",how:"Put your feet on a chair and your hands under your chest so your thumbs and index fingers touch and form a diamond. Body straight from head to heels. Lower yourself with your elbows going back along your body, chest towards your hands. Push back up.",tip:"Don't let your hips rise or sag. If your wrists or elbows hurt, move your hands a bit apart. The chair must stand firm, ideally against a wall."},n1q:{name:"1\xBC squat",muscles:"Front thighs, glutes",tempo:"down, quarter up, down, up",how:"Feet shoulder-width apart, toes slightly out. Go all the way down, come up only a quarter of the way, go all the way down again, and only then stand up. That's 1 rep. Heels stay on the floor.",tip:"Your muscles spend twice as long in the hardest, deepest part of the squat, which makes it harder. Don't drop down; lower yourself with control."},b5l:{name:"Single-leg plank",muscles:"Whole core, glutes",how:"Like a regular plank: forearms under your shoulders, body straight from head to heels. Lift one straight leg a little off the floor; halfway through, put it down and lift the other. Keep your hips level, don't let them rotate.",tip:"Don't lift the leg high; just off the floor is enough. The point is to keep your hips still."},sbridge:{name:"Single-leg glute bridge",muscles:"Glutes, hamstrings",tempo:"up, 2 s squeeze, down",how:"Lie on your back, knees bent, feet on the floor. Straighten one leg into the air and keep your thighs together. Push through the heel on the floor and lift your hips until your body forms a straight line from knee to shoulders. Squeeze your glutes for 2 seconds at the top and lower slowly. Do all reps with one leg first, then the other.",tip:"Keep your hips level; don't let them drop to the side of the raised leg. Log the count for one leg: 10 left + 10 right = log 10. If your hamstring cramps, go back to the two-leg bridge."},wallsit:{name:"Wall sit",muscles:"Front thighs",how:"Lean your back against a wall and slide down until your thighs are parallel to the floor and your knees are at 90\xB0. Whole back on the wall, knees above your ankles. Hold.",tip:"Don't put your hands on your thighs, or you're helping yourself."},birddog:{name:"Bird dog",muscles:"Core, lower back, glutes",tempo:"reach, 2 s hold, back",how:"Get on all fours: hands under your shoulders, knees under your hips. Reach your right arm forward and your left leg back at the same time, body in a straight line. Hold for 2 seconds, come back and switch sides.",tip:"Your hips must not rotate. Imagine a glass of water on your lower back."},hollow:{name:"Hollow body hold",muscles:"Whole core",how:"Lie on your back with your arms stretched behind your head. Press your lower back into the floor and lift your shoulders and straight legs a little off the floor. Hold without moving.",tip:"If your lower back lifts off the floor, raise your legs higher or bend them."},legraise:{name:"Leg raise",muscles:"Lower abs, hip flexors",tempo:"2 s up, 2 s down",how:"Lie on your back, arms by your sides. Slowly raise your straight legs until they're vertical and slowly lower them almost to the floor, but don't put them down. Your lower back stays on the floor.",tip:"If your lower back hurts, bend your knees."}},warm:{w1:{name:"Arm circles",dose:"15\xD7 forward, 15\xD7 back",why:"Loosens your shoulders before push-ups and rows."},w2:{name:"Leg swings",dose:"10\xD7 each leg, hold a wall",why:"Loosens your hips before squats."},w3:{name:"World's greatest stretch",dose:"5\xD7 each side",why:"Hips, upper back and hamstrings at once."},w4:{name:"Inchworm",dose:"5\xD7",why:"Warms up your whole body and takes you into a plank."}},cool:{c1:{name:"Hip flexor, left",why:"Sitting a lot (school, computer) shortens the front of your hips. If you only do one stretch, do this one.",how:"Kneel on your left knee, right foot in front. Squeeze your glutes and shift your hips forward until you feel a stretch at the front of your left hip. Don't arch your lower back."},c2:{name:"Hip flexor, right",why:"The same on the other side.",how:"Kneel on your right knee, left foot in front. Squeeze your glutes and shift your hips forward."},c4:{name:"Cobra",why:"Stretches your abs and the front of your hips. It balances out all the curling in the core exercises.",how:"Lie on your stomach, palms under your shoulders, elbows close to your body. Keep your hips on the floor and slowly press up with your arms until you feel a gentle stretch in your abs. Keep your shoulders down away from your ears; your elbows don't have to be fully straight. If your lower back pinches, go lower."},c3:{name:"Child's pose",why:"Calms your breathing and relaxes your back. Purely for feeling good.",how:"Knees apart, sit your hips back on your heels, reach your arms as far forward as you can, forehead on the floor. Breathe slowly."}},fig:{k1:["Up","Down, elbows ~45\xB0 from the body"],k3:["Up","Down, elbows in"],b5:["Right: straight body","Wrong: sagging lower back"],n1:["Start","Down, heels on the floor"],r1:["Up","Down, head in front of hands"],row1:["Start, arm straight","Pull, elbow back"],row3:["Start, hand at shoulder height","Elbow out to the side, ~90\xB0 from the body"],row2:["Start, arms straight","Chest to the door"],n2:["Up","Down, back knee to the floor"],b2:["Start","Arm and opposite leg down"],n7:["Hips up, heels near glutes","Slide legs out, hips still up"],b4:["Elbow to opposite knee","Switch sides"],kKnee:["Up, knees on the floor","Down, elbows ~45\xB0 from the body"],kIncl:["Hands on the table, up","Chest to the edge, elbows ~45\xB0 from the body"],superman:["Lie on your stomach","Lift and hold 2 s"],ytw:["Y: arms forward and out","T: arms out to the sides","W: elbows to the ribs"],lunge:["Start","Step back, knee to the floor"],bridge:["Lie down, knees bent","Hips up, squeeze glutes"],sbridge:["Lie down, one leg up","Hips up, squeeze glutes"],r1e:["Up, feet on a chair","Down, head in front of hands"],k3e:["Up, feet on a chair","Down, elbows in"],n1q:["All the way down","A quarter up","All the way down again","Only then up"],b5l:["One leg up","Halfway through, switch legs"],wallsit:["Knees ~90\xB0, back on the wall"],birddog:["On all fours: arms and knees ~90\xB0","Arm and opposite leg"],hollow:["Lower back pressed to the floor"],legraise:["Legs up","Lower slowly, don't put them on the floor"],hf:["Back knee down, hips forward"],cobra:["Hips on the floor, chest up"],child:["Hips to heels, arms far forward"]},ch:{w3:"Do 3 workouts",pr1:"Beat a personal record",r3:"Do 3 rounds once",warm:"Full warm-up 2\xD7",cool:"Stretch after a workout 2\xD7",push100:"100 push-ups in total (all kinds)",rank:"Reach a new rank",reps300:"300 reps in total",legs100:"100 leg reps"},ach:{workouts:["Workouts","{x}"],streak:["Streak","a streak of {x}"],records:["Records","{x}"],ranks:["Rank collector","rank levels across all exercises: {n}"],weeks:["Weekly challenges","{x} at 100%"],level:["Level","level {n}"],rounds3:["Three rounds","{x} with 3 rounds"],pushups:["Push-ups in a set","{x} in one set"],reps:["Reps","{x} in total"],birthday:["Birthdays","{x} with the app"],calories:["Calories","{x} with calories logged"]},news14:[["Menu","a bar with 3 tabs at the bottom, profile through the photo top right.","one \u2630 menu top right with everything: Workout, Calories, History, Profile, Settings."],["Workout in the background","during a workout you couldn't go anywhere else.","the workout shrinks to a small window at the bottom, time and sounds keep going, tap to go back."],["Rep counter","the number was preset from last time or a guess.","it starts at 0 and shows last time's result with a +1 goal."],["Last round","1\u20132 reps in reserve.","to technical failure: as long as each rep is clean."],["Calories","didn't exist.","a calculator (lose, keep, gain) and a daily food log. Workouts from the app are added automatically."],["Badges","15 badges, you either had them or not.","11 kinds with levels Wood \u2192 Diamond and a bar showing what's left. What you had stays."],["Birthday","nothing.","once you enter your birth date: a surprise, confetti, an extra freeze and a birthday badge."],["Plank","30 \u2013 75 s.","15 s too."],["Safety","harder versions had no warnings.","warnings on risky steps (cramps, hips, chair against a wall, sturdy books)."],["Tips","didn't exist.",'every other day one "Did you know?" with a button that takes you there.']],news141:['The calorie calculator asks "Man or woman?".',"Required fields have a star *; of the birth date only the year is required."],news142:[`"What's new" has pages: the first is the big update, swipe left for the small ones.`,"After a small update, a card on the home screen opens its page. It shows only the first time."],news10:[["App","a website in the browser (Browser beta).","a real Android app with an icon on your home screen. On the website it's in the menu \u2192 \u{1F4F1} Android app."],["Your data","saved in the browser.","saved in the app. Move it with a backup: in the browser Settings \u2192 Save backup, in the app Settings \u2192 Restore from backup."],["Updates","a new version on the next visit.","small updates download by themselves and switch on at the next start; for a big one the app shows where to get the new APK."],["Backup","downloaded as a file.","opens the share menu: save it to Files or Google Drive, or send it to yourself."],["Offline","fonts came from Google, so without internet the app looked different.","the fonts are inside the app, everything works offline."],["Back button","\u2013","closes a sheet or the menu; in a workout it takes you Home and the workout keeps running."],["Version numbers","Browser beta 1.0.0 to 1.4.2.","counting starts again at 1.0.0, the first version of the app."]],quotes:["Discipline takes you where motivation can't.","You don't need to feel like it. Just do the first set, the rest follows.","Every rep is a brick. A body is built brick by brick.","13 minutes today. A body for life.","Never miss twice in a row.","Small steps every other day beat big plans you never start.","Your future self will thank you for today.","It's not about the perfect workout. It's about showing up.","Where it starts to burn, growth begins.","Compare yourself only to who you were last week.","While others look for motivation, you've already trained.","Hard sets, easier life.","Every strong person started from zero."],restDay:["Muscles are built by training, but they grow with food and sleep.","Today is a rest day. That's part of the plan too.","Resting isn't laziness. This is when you grow.","The work is done. Now let your body rebuild.","Eat well, sleep well. That's training too.","Strength isn't built in a day. It's built every other day, month after month.","Those who know how to rest go the distance.","Today you recharge for your next workout.","Consistency is your superpower. Keep it.","Progress isn't always visible right away. But it's happening.","Be proud that you keep going.","Today belongs to recovery. Enjoy it.","Small steps, many days in a row. That's how big changes happen."],doneTitles:["You already trained today","Done for today","Today is ticked off","Mission complete!"],doneSubs:["Day {day} is done. Now eat and sleep, your muscles grow while you rest.","Day {day} is behind you. Good work, now take it easy.","Day {day} is done. Another brick in the wall.","Day {day} is logged. Your next workout is in two days.","Day {day} done. Your body does the work now, enjoy the rest of your day.","Day {day} handled. This is how discipline is built."],facts:["You can train every day, but every other day is best. Muscles grow while you rest, not while you train.","Sleep is your best supplement. 7\u20139 hours a night = faster recovery.","The last reps of a set do the most work. They're the ones that build muscle.","A slow lowering phase (3 seconds) gives your muscles more work than fast reps.","Protein in every meal helps your muscles grow.","Consistency beats intensity. Better 13 minutes every other day than an hour once a month.","Have some water. Even mild thirst lowers your performance.","Breathe slowly: in through your nose, out through your mouth. You'll calm down faster.","Full range of motion = more muscle at work. Fewer reps, but full ones."],moti:["I believe in you, you've got this! \u{1F4AA}","Every set takes you closer to your goal.","You're stronger than you think.","Just a bit more, you can do it.","Today counts. Don't give up.","This is the moment where you grow.","Your future self will thank you."],cheers:["Strong set!","That's how it's done!","Beast mode!","You're on fire!","Clean work!","This is the road to a strong body.","Almost there!"],finish:["Another brick in the wall. That's how it's done.","Done. Now eat well and sleep, that's when muscles grow.","Strength isn't talent. It's the sum of days exactly like this one.","Done. This is discipline  \u017Eivot.","Nikdy nevynechaj dvakr\xE1t po sebe.","Mal\xE9 kroky obde\u0148 porazia ve\u013Ek\xE9 pl\xE1ny, ktor\xE9 nikdy neza\u010Dne\u0161.","Tvoje bud\xFAce ja ti po\u010Fakuje za dne\u0161ok.","Nejde o dokonal\xFD tr\xE9ning. Ide o to, \u017Ee pr\xEDde\u0161.","Tam, kde to za\u010Dne p\xE1li\u0165, sa za\u010D\xEDna rast.","Porovn\xE1vaj sa len so sebou z minul\xE9ho t\xFD\u017Ed\u0148a.","K\xFDm ostatn\xED h\u013Eadaj\xFA motiv\xE1ciu, ty u\u017E m\xE1\u0161 odcvi\u010Den\xE9.","\u0164a\u017Ek\xE9 s\xE9rie, \u013Eah\u0161\xED \u017Eivot.","Ka\u017Ed\xFD sil\xE1k raz za\u010D\xEDnal od nuly."],restDay:["Svaly sa buduj\xFA cvi\u010Den\xEDm, ale rast\xFA jedlom a sp\xE1nkom.","Dnes je oddych. Aj ten je s\xFA\u010Das\u0165 pl\xE1nu.","Oddych nie je lenivos\u0165. Pr\xE1ve teraz rastie\u0161.","Pr\xE1ca je spraven\xE1. Teraz nechaj telo, nech si to posklad\xE1.","Dobre sa najedz, dobre sa vyspi. Aj to je tr\xE9ning.","Sila sa nestavia za jeden de\u0148. Stavia sa obde\u0148, mesiac po mesiaci.","Kto vie oddychova\u0165, vydr\u017E\xED dlh\u0161ie.","Dnes si dob\xEDja\u0161 baterky na \u010Fal\u0161\xED tr\xE9ning.","Pravidelnos\u0165 je tvoja superschopnos\u0165. Dr\u017E ju.","Pokrok nie je v\u017Edy hne\u010F vidie\u0165. Ale deje sa.","Bu\u010F hrd\xFD na to, \u017Ee sa nevzd\xE1va\u0161.","Dne\u0161ok patr\xED regener\xE1cii. U\u017Ei si ho.","Mal\xE9 kroky, ve\u013Ea dn\xED po sebe. Tak vznikaj\xFA ve\u013Ek\xE9 zmeny."],doneTitles:["Dnes si u\u017E cvi\u010Dil","Dnes m\xE1\u0161 hotovo","Dne\u0161ok je od\u0161krtnut\xFD","Splnen\xE9!"],doneSubs:["De\u0148 {day} je hotov\xFD. Teraz jedz a spi, svaly rast\xFA pri oddychu.","De\u0148 {day} m\xE1\u0161 za sebou. Dobr\xE1 pr\xE1ca, teraz si odd\xFDchni.","De\u0148 {day} je hotov\xFD. \u010Eal\u0161ia tehla v stene.","De\u0148 {day} je zap\xEDsan\xFD. \u010Eal\u0161\xED tr\xE9ning \u0165a \u010Dak\xE1 o dva dni.","De\u0148 {day} odcvi\u010Den\xFD. Telo teraz pracuje za teba, ty si u\u017E\xEDvaj zvy\u0161ok d\u0148a.","De\u0148 {day} zvl\xE1dnut\xFD. Takto sa buduje discipl\xEDna."],facts:["Cvi\u010Di\u0165 m\xF4\u017Ee\u0161 aj ka\u017Ed\xFD de\u0148, ale najlep\u0161ie je obde\u0148. Svaly rast\xFA po\u010Das oddychu, nie po\u010Das cvi\u010Denia.","Sp\xE1nok je tvoj najlep\u0161\xED doplnok. 7\u20139 hod\xEDn denne = r\xFDchlej\u0161ia regener\xE1cia.","Posledn\xE9 opakovania s\xE9rie robia najviac pr\xE1ce. Pr\xE1ve tie buduj\xFA svaly.","Pomal\xE9 sp\xFA\u0161\u0165anie (3 sekundy) d\xE1 svalom viac pr\xE1ce ne\u017E r\xFDchle opakovania.","Bielkoviny v ka\u017Edom jedle pom\xE1haj\xFA svalom r\xE1s\u0165.","Pravidelnos\u0165 poraz\xED intenzitu. Rad\u0161ej 13 min\xFAt obde\u0148 ako hodina raz za mesiac.","Napi sa vody. Aj mierny sm\xE4d zni\u017Euje v\xFDkon.","D\xFDchaj pomaly: nosom dnu, \xFAstami von. R\xFDchlej\u0161ie sa upokoj\xED\u0161.","Pln\xFD rozsah pohybu = viac svalov v pr\xE1ci. Rad\u0161ej menej opakovan\xED, ale cel\xFDch."],moti:["Ver\xEDm ti, ty to d\xE1\u0161! \u{1F4AA}","Ka\u017Ed\xE1 s\xE9ria \u0165a pos\xFAva bli\u017E\u0161ie k cie\u013Eu.","Si silnej\u0161\xED, ne\u017E si mysl\xED\u0161.","E\u0161te k\xFAsok, zvl\xE1dne\u0161 to.","Dne\u0161ok sa po\u010D\xEDta. Nevzd\xE1vaj to.","Toto je moment, kde sa rastie.","Bud\xFAce ja ti po\u010Fakuje."],cheers:["Siln\xE1 s\xE9ria!","Tak sa to rob\xED!","Mak\xE1\u0161!","Ide ti to!","\u010Cist\xE1 pr\xE1ca!","Toto je cesta k siln\xE9mu telu.","E\u0161te k\xFAsok!"],finish:["\u010Eal\u0161ia tehla v stene. Takto sa to rob\xED.","Odcvi\u010Den\xE9. Teraz sa poriadne najedz a vyspi, vtedy svaly rast\xFA.","Sila nie je talent. Je to s\xFA\u010Det presne tak\xFDchto dn\xED.","Hotovo. Toto je discipl\xEDna v praxi.","Dnes si spravil to, \u010Do v\xE4\u010D\u0161ina len pl\xE1nuje."]};var ah={ui:{loading:"Na\u010D\xEDt\xE1m\u2026",close:"Zav\u0159\xEDt",cancel:"Zru\u0161it",save:"Ulo\u017Eit",home:"Dom\u016F",back:"Zp\u011Bt",start:"Start",stop:"Stop",copied:"\u2713 Zkop\xEDrov\xE1no",dayN:"Den {d}",tabTr lne. Ksi\u0105\u017Cki musz\u0105 by\u0107 stabilne, \u017Ceby si\u0119 nie \u015Blizga\u0142y."},row1:{name:"Wios\u0142owanie we framudze drzwi",muscles:"Plecy (najszersze), tylne barki, biceps",tempo:"1 s w g\xF3r\u0119, 1 s trzymaj, 3 s z powrotem",how:"Sta\u0144 w otwartych drzwiach, bokiem do framugi. Z\u0142ap framug\u0119 jedn\u0105 r\u0119k\u0105 na wysoko\u015Bci klatki, stopy tu\u017C przy framudze. Odchyl si\u0119 do ty\u0142u z wyprostowan\u0105 r\u0119k\u0105 i prostym cia\u0142em. Przyci\u0105gnij si\u0119 do framugi: \u0142okie\u0107 idzie do ty\u0142u wzd\u0142u\u017C cia\u0142a, \u015Bci\u0105gnij \u0142opatk\u0119 do ty\u0142u. Wracaj powoli. Zr\xF3b wszystkie powt\xF3rzenia jedn\u0105 r\u0119k\u0105, potem drug\u0105.",tip:"Im bli\u017Cej framugi masz stopy i im bardziej si\u0119 odchylasz, tym trudniej. Trzymaj solidn\u0105 framug\u0119, nie drzwi, i \u0107wicz boso, \u017Ceby stopy si\u0119 nie \u015Blizga\u0142y.",lvl:"Przysu\u0144 stopy bli\u017Cej framugi i odchyl si\u0119 bardziej."},n1:{name:"Przysiad ATG",muscles:"Prz\xF3d ud, po\u015Bladki",tempo:"3 s w d\xF3\u0142, 1 s pauzy na dole, w g\xF3r\u0119",how:"Stopy na szeroko\u015B\u0107 bark\xF3w, palce lekko na zewn\u0105trz. Opuszczaj si\u0119 przez 3 sekundy tak nisko, jak dasz rad\u0119: uda poni\u017Cej kolan, pi\u0119ty na pod\u0142odze. Zatrzymaj si\u0119 na 1 sekund\u0119 na dole i wsta\u0144.",tip:"Wolne tempo i pauza na dole robi\u0105 z \u0142atwego przysiadu trudny. Je\u015Bli zrobisz 20+ nawet z tempem, zamie\u0144 go na Przysiad 1 i 1/4.",lvl:"Zamie\u0144 go na Przysiad 1 i 1/4 (\u21C4 Zamie\u0144)."},b5:{name:"Deska (plank)",muscles:"Ca\u0142y core",how:"Przedramiona pod barkami, cia\u0142o w linii prostej od g\u0142owy do pi\u0119t. Napnij brzuch i po\u015Bladki, jakby kto\u015B mia\u0142 ci\u0119 zaraz uderzy\u0107 w brzuch. Biodra nie mog\u0105 i\u015B\u0107 w g\xF3r\u0119 ani opada\u0107.",tip:"Gdy wytrzymasz 60 s w obu rundach, zamie\u0144 go na Plank z uniesion\u0105 nog\u0105. To du\u017Co trudniejsze.",lvl:"Zamie\u0144 go na Plank z uniesion\u0105 nog\u0105 (\u21C4 Zamie\u0144)."},r1:{name:"Pompka pike",muscles:"Barki, triceps",tempo:"3 s w d\xF3\u0142, w g\xF3r\u0119",how:"Ustaw si\u0119 w odwr\xF3cone V: d\u0142onie na pod\u0142odze, biodra wysoko, nogi jak najprostsze. Ugnij \u0142okcie i opu\u015B\u0107 czubek g\u0142owy do pod\u0142ogi tu\u017C przed d\u0142o\u0144mi, tak \u017Ceby d\u0142onie i g\u0142owa tworzy\u0142y tr\xF3jk\u0105t. Wypchnij si\u0119 z powrotem w g\xF3r\u0119.",tip:"Gdy zrobisz 15+ w obu rundach, zamie\u0144 je na Pompki pike z nogami na krze\u015Ble. Wi\u0119cej twojego ci\u0119\u017Caru p\xF3jdzie na barki.",lvl:"Zamie\u0144 je na Pompki pike z nogami na krze\u015Ble (\u21C4 Zamie\u0144)."},row2:{name:"Wios\u0142owanie z r\u0119cznikiem na drzwiach",muscles:"\u015Arodek plec\xF3w, \u0142opatki, biceps",tempo:"1 s w g\xF3r\u0119, 1 s trzymaj, 3 s z powrotem",how:"Otw\xF3rz drzwi i sta\u0144 przodem do ich kraw\u0119dzi, z drzwiami mi\u0119dzy stopami. Prze\u0142\xF3\u017C r\u0119cznik wok\xF3\u0142 obu klamek i trzymaj go za ko\u0144ce albo z\u0142ap bezpo\u015Brednio obie klamki. Odchyl si\u0119 do ty\u0142u z prostymi r\u0119kami i prostym cia\u0142em. Przyci\u0105gnij klatk\u0119 do kraw\u0119dzi drzwi, \u015Bci\u015Bnij \u0142opatki i opuszczaj si\u0119 powoli.",tip:"Najpierw sprawd\u017A, czy klamki s\u0105 solidne i si\u0119 nie ruszaj\u0105. Je\u015Bli cokolwiek si\u0119 rusza, zr\xF3b zamiast tego wios\u0142owanie we framudze (dzie\u0144 A). Bezpiecze\u0144stwo przede wszystkim.",lvl:"Przysu\u0144 stopy bli\u017Cej drzwi i odchyl si\u0119 bardziej."},n2:{name:"Przysiad bu\u0142garski",muscles:"Prz\xF3d ud, po\u015Bladki",tempo:"3 s w d\xF3\u0142, w g\xF3r\u0119",how:"Sta\u0144 przed krzes\u0142em i oprzyj grzbiet tylnej stopy na siedzisku. Zr\xF3b du\u017Cy krok do przodu przedni\u0105 stop\u0105. Opuszczaj si\u0119 przez 3 sekundy, tylne kolano idzie w stron\u0119 pod\u0142ogi. Wypchnij si\u011 roste od g\u0142owy do pi\u0119t. Opuszczaj si\u0119, \u0142okcie id\u0105 do ty\u0142u wzd\u0142u\u017C cia\u0142a, klatka w stron\u0119 d\u0142oni. Wypchnij si\u0119 w g\xF3r\u0119.",tip:"Nie uno\u015B ani nie opuszczaj bioder. Je\u015Bli bol\u0105 nadgarstki lub \u0142okcie, rozsu\u0144 troch\u0119 d\u0142onie. Krzes\u0142o musi sta\u0107 stabilnie, najlepiej oparte o \u015Bcian\u0119."},n1q:{name:"Przysiad 1 i 1/4",muscles:"Prz\xF3d ud, po\u015Bladki",tempo:"w d\xF3\u0142, \u0107wier\u0107 w g\xF3r\u0119, w d\xF3\u0142, w g\xF3r\u0119",how:"Stopy na szeroko\u015B\u0107 bark\xF3w, palce lekko na zewn\u0105trz. Zejd\u017A na sam d\xF3\u0142, podnie\u015B si\u0119 tylko o \u0107wier\u0107 drogi, znowu na sam d\xF3\u0142 i dopiero wtedy wsta\u0144. To 1 powt\xF3rzenie. Pi\u0119ty ca\u0142y czas na pod\u0142odze.",tip:"Mi\u0119\u015Bnie dwa razy pracuj\u0105 w najtrudniejszej, najg\u0142\u0119bszej cz\u0119\u015Bci przysiadu, dlatego jest trudniejszy. Nie opadaj, schod\u017A pod kontrol\u0105."},b5l:{name:"Plank z uniesion\u0105 nog\u0105",muscles:"Ca\u0142y korpus, po\u015Bladki",how:"Jak zwyk\u0142y plank: przedramiona pod barkami, cia\u0142o proste od g\u0142owy do pi\u0119t. Unie\u015B jedn\u0105 wyprostowan\u0105 nog\u0119 troch\u0119 nad pod\u0142og\u0119, w po\u0142owie czasu j\u0105 opu\u015B\u0107 i unie\u015B drug\u0105. Biodra trzymaj r\xF3wno, nie skr\u0119caj ich.",tip:"Nie uno\u015B nogi wysoko, wystarczy troch\u0119 nad pod\u0142og\u0105. Chodzi o to, by biodra si\u0119 nie rusza\u0142y."},sbridge:{name:"Mostek na jednej nodze",muscles:"Po\u015Bladki, ty\u0142 ud",tempo:"w g\xF3r\u0119, 2 s spi\u0119cia, w d\xF3\u0142",how:"Po\u0142\xF3\u017C si\u0119 na plecach, kolana zgi\u0119te, stopy na pod\u0142odze. Jedn\u0105 nog\u0119 wyprostuj w powietrzu, uda trzymaj razem. Wypchnij si\u0119 przez pi\u0119t\u0119 nogi na pod\u0142odze i unie\u015B biodra, a\u017C cia\u0142o utworzy prost\u0105 lini\u0119 od kolana do bark\xF3w. Na g\xF3rze spinaj po\u015Bladki przez 2 sekundy i powoli opu\u015B\u0107. Najpierw wszystkie powt\xF3rzenia jedn\u0105 nog\u0105, potem drug\u0105.",tip:"Trzymaj biodra r\xF3wno, nie pozw\xF3l im opada\u0107 na stron\u0119 uniesionej nogi. Zapisz liczb\u0119 dla jednej nogi: 10 lew\u0105 + 10 praw\u0105 = zapisz 10. Gdy \u0142apie skurcz w tylnej cz\u0119\u015Bci uda, wr\xF3\u0107 do mostka na obu nogach."},wallsit:{name:"Krzese\u0142ko przy \u015Bcianie",muscles:"Prz\xF3d ud",how:"Oprzyj plecy o \u015Bcian\u0119 i zjed\u017A w d\xF3\u0142, a\u017C uda b\u0119d\u0105 r\xF3wnoleg\u0142e do pod\u0142ogi, a kolana zgi\u0119te pod k\u0105tem 90\xB0. Ca\u0142e plecy przy \u015Bcianie, kolana nad kostkami. Trzymaj.",tip:"Nie opieraj d\u0142oni na udach, bo sobie pomagasz."},birddog:{name:"Bird dog",muscles:"Core, dolna cz\u0119\u015B\u0107 plec\xF3w, po\u015Bladki",tempo:"wyprost, 2 s trzymaj, powr\xF3t",how:"Sta\u0144 na czworakach: d\u0142onie pod barkami, kolana pod biodrami. Jednocze\u015Bnie wyci\u0105gnij praw\u0105 r\u0119k\u0119 do przodu, a lew\u0105 nog\u0119 do ty\u0142u, cia\u0142o w jednej linii. Wytrzymaj 2 sekundy, wr\xF3\u0107 i zmie\u0144 strony.",tip:"Biodra nie mog\u0105 si\u0119 obraca\u0107. Wyobra\u017A sobie szklank\u0119 wody na dolnej cz\u0119\u015Bci plec\xF3w."},hollow:{name:"Hollow body hold",muscles:"Ca\u0142y core",how:"Po\u0142\xF3\u017C si\u0119 na plecach z r\u0119kami wyci\u0105gni\u0119tymi za g\u0142ow\u0119. Doci\u015Bnij doln\u0105 cz\u0119\u015B\u0107 plec\xF3w do pod\u0142ogi i unie\u015B barki oraz proste nogi troch\u0119 nad pod\u0142og\u0119. Trzymaj bez ruchu.",tip:"Je\u015Bli dolna cz\u0119\u015B\u0107 plec\xF3w odrywa si\u0119 od pod\u0142ogi, unie\u015B nogi wy\u017Cej albo je ugnij."},legraise:{name:"Unoszenie n\xF3g w le\u017Ceniu",muscles:"Dolna cz\u0119\u015B\u0107 brzucha, zginacze bioder",tempo:"2 s w g\xF3r\u0119, 2 s w d\xF3\u0142",how:"Po\u0142\xF3\u017C si\u0119 na plecach, r\u0119ce wzd\u0142u\u017C cia\u0142a. Powoli unie\u015B proste nogi do pionu i powoli opu\u015B\u0107 je prawie do pod\u0142ogi, ale ich nie odk\u0142adaj. Dolna cz\u0119\u015B\u0107 plec\xF3w zostaje na pod\u0142odze.",tip:"Je\u015Bli boli ci\u0119 dolna cz\u0119\u015B\u0107 plec\xF3w, ugnij kolana."}},warm:{w1:{name:"Kr\u0105\u017Cenia ramion",dose:"15\xD7 do przodu, 15\xD7 do ty\u0142u",why:"Rozlu\u017Ania barki przed pompkami i wios\u0142owaniem."},w2:{name:"Wymachy n\xF3g",dose:"10\xD7 ka\u017Cda noga, trzymaj si\u0119 \u015Bciany",why:"Rozlu\u017Ania biodra przed przysiadami."},w3:{name:"World's greatest stretch",dose:"5\xD7 na ka\u017Cd\u0105 stron\u0119",why:"Biodra, g\xF3ra plec\xF3w i ty\u0142 ud naraz."},w4:{name:"Inchworm (g\u0105sienica)",dose:"5\xD7",why:"Rozgrzewa ca\u0142e cia\u0142o i wprowadza ci\u0119 do deski."}},cool:{c1:{name:"Zginacz biodra, lewy",why:"Du\u017Co siedzenia (szko\u0142a, komputer) skraca prz\xF3d bioder. Je\u015Bli robisz tylko jedno rozci\u0105ganie, zr\xF3b to.",how:"Ukl\u0119knij na lewym kolanie, prawa stopa z przodu. Napnij po\u015Bladki i przesu\u0144 biodra do przodu, a\u017C poczujesz rozci\u0105ganie z przodu lewego biodra. Nie wyginaj dolnej cz\u0119\u015Bci plec\xF3w."},c2:{name:"Zginacz biodra, prawy",why:"To samo po drugiej stronie.",how:"Ukl\u0119knij na prawym kolanie, lewa stopa z przodu. Napnij po\u015Bladki i przesu\u0144 biodra do przodu."},c4:{name:"Kobra",why:"Rozci\u0105ga brzuch i prz\xF3d bioder. To przeciwwaga dla zginania przy \u0107wiczeniach na brzuch.",how:"Po\u0142\xF3\u017C si\u0119 na brzuchu, d\u0142onie pod barkami, \u0142okcie przy ciele. Biodra zostaw na pod\u0142odze i powoli wypchnij si\u0119 r\u0119kami w g\xF3r\u0119, a\u017C poczujesz przyjemne rozci\u0105ganie brzucha. Barki trzymaj nisko, z dala od uszu, \u0142okcie nie musz\u0105 by\u0107 ca\u0142kiem wyprostowane. Je\u015Bli k\u0142uje ci\u0119 w krzy\u017Cu, zejd\u017A ni\u017Cej."},c3:{name:"Pozycja dziecka",why:"Uspokaja oddech i rozlu\u017Ania plecy. Czysto dla przyjemno\u015Bci.",how:"Kolana szeroko, usi\u0105d\u017A biodrami na pi\u0119tach, wyci\u0105gnij r\u0119ce jak najdalej do przodu, czo\u0142o na pod\u0142odze. Oddychaj powoli."}},fig:{k1:["G\xF3ra","D\xF3\u0142, \u0142okcie ~45\xB0 od cia\u0142a"],k3:["G\xF3ra","D\xF3\u0142, \u0142okcie przy ciele"],b5:["Dobrze: proste cia\u0142o","\u0179le: opadaj\u0105cy d\xF3\u0142 plec\xF3w"],n1:["Start","D\xF3\u0142, pi\u0119ty na pod\u0142odze"],r1:["G\xF3ra","D\xF3\u0142, g\u0142owa przed d\u0142o\u0144mi"],row1:["Start, r\u0119ka prosta","Przyci\u0105gnij, \u0142okie\u0107 do ty\u0142u"],row3:["Start, d\u0142o\u0144 na wysoko\u015Bci barku","\u0141okie\u0107 na bok, ~90\xB0 od cia\u0142a"],row2:["Start, r\u0119ce proste","Klatka do drzwi"],n2:["G\xF3ra","D\xF3\u0142, tylne kolano do pod\u0142ogi"],b2:["Start","R\u0119ka i przeciwna noga w d\xF3\u0142"],n7:["Biodra w g\xF3rze, pi\u0119ty przy po\u015Bladkach","Wysu\u0144 nogi, biodra wci\u0105\u017C w g\xF3rze"],b4:["\u0141okie\u0107 do przeciwnego kolana","Zmiana strony"],kKnee:["G\xF3ra, kolana na pod\u0142odze","D\xF3\u0142, \u0142okcie ~45\xB0 od cia\u0142a"],kIncl:["D\u0142onie na stole, g\xF3ra","Klatka do kraw\u0119dzi, \u0142okcie ~45\xB0 od cia\u0142a"],superman:["Le\u017Cenie na brzuchu","Unie\u015B i trzymaj 2 s"],ytw:["Y: r\u0119ce sko\u015Bnie do przodu","T: r\u0119ce na boki","W: \u0142okcie do \u017Ceber"],lunge:["Start","Krok w ty\u0142, kolano do pod\u0142ogi"],bridge:["Le\u017Cenie, kolana zgi\u0119te","Biodra w g\xF3r\u0119, spi\u0119te po\u015Bladki"],sbridge:["Le\u017Cenie, jedna noga w g\xF3rze","Biodra w g\xF3r\u0119, spi\u0119te po\u015Bladki"],r1e:["G\xF3ra, nogi na krze\u015Ble","D\xF3\u0142, g\u0142owa przed d\u0142o\u0144mi"],k3e:["G\xF3ra, nogi na krze\u015Ble","D\xF3\u0142, \u0142okcie przy ciele"],n1q:["Na sam d\xF3\u0142","\u0106wier\u0107 w g\xF3r\u0119","Zn\xF3w na sam d\xF3\u0142","Dopiero wtedy w g\xF3r\u0119"],b5l:["Jedna noga w g\xF3rze","W po\u0142owie czasu zmie\u0144 nogi"],wallsit:["Kolana ~90\xB0, plecy przy \u015Bcia bieranie) i dzienny zapis jedzenia. Treningi z aplikacji doliczaj\u0105 si\u0119 same."],["Odznaki","15 odznak: masz albo nie masz.","11 rodzaj\xF3w z poziomami Drewno \u2192 Diament i paskiem, ile brakuje. To, co mia\u0142e\u015B, zostaje."],["Urodziny","nic.","po wpisaniu daty urodzenia niespodzianka, konfetti, dodatkowy freeze i urodzinowa odznaka."],["Plank","30 \u2013 75 s.","tak\u017Ce 15 s."],["Bezpiecze\u0144stwo","trudniejsze wersje bez ostrze\u017Ce\u0144.","ostrze\u017Cenia przy ryzykownych krokach (skurcz, biodra, krzes\u0142o o \u015Bcian\u0119, stabilne ksi\u0105\u017Cki)."],["Wskaz\xF3wki","nie by\u0142o.","co drugi dzie\u0144 jedno \u201ECzy wiesz?\u201D z przyciskiem, kt\xF3ry ci\u0119 tam zabierze."]],news141:["Kalkulator kalorii pyta \u201EM\u0119\u017Cczyzna czy kobieta?\u201D.","Wymagane pola maj\u0105 gwiazdk\u0119 *, z daty urodzenia wymagany jest tylko rok."],news142:["\u201ECo nowego\u201D ma strony: pierwsza to du\u017Ca aktualizacja, w lewo s\u0105 ma\u0142e.","Po ma\u0142ej aktualizacji karta na ekranie g\u0142\xF3wnym otworzy jej stron\u0119. Pokazuje si\u0119 tylko za pierwszym razem."],news10:[["Aplikacja","strona w przegl\u0105darce (Browser beta).","prawdziwa aplikacja na Androida z ikon\u0105 na ekranie g\u0142\xF3wnym. Na stronie znajdziesz j\u0105 w menu \u2192 \u{1F4F1} Aplikacja na Androida."],["Twoje dane","zapisane w przegl\u0105darce.","zapisane w aplikacji. Przeniesiesz je kopi\u0105: w przegl\u0105darce Ustawienia \u2192 Zapisz kopi\u0119, w aplikacji Ustawienia \u2192 Przywr\xF3\u0107 z kopii."],["Aktualizacje","nowa wersja przy nast\u0119pnym otwarciu strony.","ma\u0142e aktualizacje pobieraj\u0105 si\u0119 same i w\u0142\u0105czaj\u0105 przy nast\u0119pnym uruchomieniu; przy du\u017Cej aplikacja poka\u017Ce, sk\u0105d pobra\u0107 nowy APK."],["Kopia zapasowa","pobiera\u0142 si\u0119 plik.","otwiera si\u0119 menu Udost\u0119pnij: zapisz j\u0105 w Plikach lub na Dysku Google albo wy\u015Blij j\u0105 sobie."],["Bez internetu","czcionki pobiera\u0142y si\u0119 z Google, bez internetu aplikacja wygl\u0105da\u0142a inaczej.","czcionki s\u0105 w aplikacji, wszystko dzia\u0142a offline."],["Przycisk wstecz","\u2013","zamyka okno lub menu; z treningu wracasz na start, a trening trwa dalej."],["Numery wersji","Browser beta 1.0.0 do 1.4.2.","liczymy od nowa od 1.0.0, pierwsza wersja aplikacji."]],quotes:["Dyscyplina zaprowadzi ci\u0119 tam, gdzie motywacja nie da rady.","Nie musi ci si\u0119 chcie\u0107. Zr\xF3b pierwsz\u0105 seri\u0119, reszta p\xF3jdzie sama.","Ka\u017Cde powt\xF3rzenie to ceg\u0142a. Cia\u0142o buduje si\u0119 ceg\u0142a po cegle.","Dzi\u015B 13 minut. Cia\u0142o na ca\u0142e \u017Cycie.","Nigdy nie odpuszczaj dwa razy z rz\u0119du.","Ma\u0142e kroki co drugi dzie\u0144 bij\u0105 wielkie plany, kt\xF3rych nigdy nie zaczynasz.","Twoje przysz\u0142e ja podzi\u0119kuje ci za dzi\u015B.","Nie chodzi o idealny trening. Chodzi o to, \u017Ceby si\u0119 pojawi\u0107.","Tam, gdzie zaczyna pali\u0107, zaczyna si\u0119 wzrost.","Por\xF3wnuj si\u0119 tylko do siebie sprzed tygodnia.","Inni szukaj\u0105 motywacji, a ty masz ju\u017C trening za sob\u0105.","Ci\u0119\u017Ckie serie, \u0142atwiejsze \u017Cycie.","Ka\u017Cdy silny cz\u0142owiek zaczyna\u0142 od zera."],restDay:["Mi\u0119\u015Bnie buduje trening, ale rosn\u0105 dzi\u0119ki jedzeniu i snowi.","Dzi\u015B odpoczynek. To te\u017C cz\u0119\u015B\u0107 planu.","Odpoczynek to nie lenistwo. W\u0142a\u015Bnie teraz ro\u015Bniesz.","Robota zrobiona. Teraz pozw\xF3l cia\u0142u si\u0119 odbudowa\u0107.","Dobrze zjedz, dobrze si\u0119 wy\u015Bpij. To te\u017C trening.","Si\u0142y nie buduje si\u0119 w jeden dzie\u0144. Buduje si\u0119 j\u0105 co drugi dzie\u0144, miesi\u0105c po miesi\u0105cu.","Kto umie odpoczywa\u0107, ten wytrzyma d\u0142u\u017Cej.","Dzi\u015B \u0142adujesz baterie na nast\u0119pny trening.","Regularno\u015B\u0107 to twoja supermoc. Trzymaj si\u0119 jej.","Post\u0119p\xF3w nie zawsze wida\u0107 od razu. Ale one s\u0105.","B\u0105d\u017A dumny, \u017Ce si\u0119 nie poddajesz.","Dzisiejszy dzie\u0144 nale\u017Cy do regeneracji. Ciesz si\u0119 nim.","Ma\u0142e kroki, wiele dni z rz\u0119du. Tak powstaj\u0105 wielkie zmiany."],doneTitles:["Dzisiejszy trening ju\u017C zaliczony","Na dzi\u015B zrobione","Dzisiaj odhaczone","Misja wykonana!"],doneSubs:["Dzie\u0144 {day} zrobiony. Teraz jedz i \u015Bpij, mi\u0119\u015Bnie rosn\u0105 podczas odpoczynku.","Dzie\u0144 {day} masz za sob\u0105. Dobra robota, teraz odpocznij.","Dzie\u0144 {day} zrobiony. Kolejna ceg\u0142a w murze.","Dzie\u0144 {day} zapisany. Nast\u0119pny trening za dwa dni.","Dzie\u0144 {day} zaliczony. Teraz pracuje twoje cia\u0142o, a ty ciesz si\u0119 reszt\u0105 dnia.","Dzie\u0144 {day} ogarni\u0119ty. Tak buduje si\u0119 dyscyplin\u0119."],facts:["Mo\u017Cesz trenowa\u0107 codziennie, ale co drugi dzie\u0144 jest najlepiej. Mi\u0119\u015Bnie rosn\u0105 podczas odpoczynku, nie podczas treningu.","Sen to tw\xF3j najlepszy suplement. 7\u20139 godzin na noc = szybsza regeneracja.","Ostatnie powt\xF3rzenia w serii robi\u0105 najwi\u0119cej roboty. To one buduj\u0105 mi\u0119\u015Bnie.","Wolne opuszczanie (3 sekundy) daje mi\u0119\u015Bniom wi\u0119cej pracy ni\u017C szybkie powt\xF3rzenia.","Bia\u0142ko w ka\u017Cdym posi\u0142ku pomaga mi\u0119\u015Bniom rosn\u0105\u0107.","Regularno\u015B\u0107 wygrywa z intensywno\u015Bci\u0105. Lepiej 13 minut co drugi dzie\u0144 ni\u017C godzina raz w miesi\u0105cu.","Napij si\u0119 wody. Nawet lekkie pragnienie obni\u017Ca form\u0119.","Oddychaj powoli: wdech nosem, wydech ustami. Szybciej si\u0119 uspokoisz.","Pe\u0142ny zakres ruchu = wi\u0119cej pracuj\u0105cych mi\u0119\u015Bni. Mniej powt\xF3rze\u0144, ale pe\u0142nych."],moti:["Wierz\u0119 w ciebie, dasz rad\u0119! \u{1F4AA}","Ka\u017Cda seria przybli\u017Ca ci\u0119 do celu.","Masz wi\u0119cej si\u0142y, ni\u017C my\u015Blisz.","Jeszcze troch\u0119, dasz rad\u0119.","Dzisiaj si\u0119 liczy. Nie poddawaj si\u0119.","To jest mo tabil keretet fogd, ne az ajt\xF3t, \xE9s eddz mez\xEDtl\xE1b, hogy ne cs\xFAsszon a l\xE1bad.",lvl:"Tedd a l\xE1bad k\xF6zelebb a kerethez, \xE9s d\u0151lj h\xE1tr\xE9bb."},n1:{name:"ATG guggol\xE1s",muscles:"El\xFCls\u0151 comb, farizom",tempo:"3 mp le, 1 mp sz\xFCnet lent, fel",how:"L\xE1bak v\xE1llsz\xE9less\xE9gben, l\xE1bujjak kicsit kifel\xE9. 3 m\xE1sodperc alatt ereszkedj le olyan m\xE9lyre, amennyire tudsz: a combod a t\xE9rded al\xE1 ker\xFCl, a sarkad a padl\xF3n marad. Lent tartsd meg 1 m\xE1sodpercig, majd \xE1llj fel.",tip:"A lass\xFA temp\xF3 \xE9s a lenti sz\xFCnet neh\xE9zz\xE9 teszi a k\xF6nny\u0171 guggol\xE1st. Ha temp\xF3val is megvan a 20+, cser\xE9ld le 1 \xE9s 1/4 guggol\xE1sra.",lvl:"Cser\xE9ld le 1 \xE9s 1/4 guggol\xE1sra (\u21C4 Csere)."},b5:{name:"Plank (alkart\xE1masz)",muscles:"Teljes t\xF6rzs",how:"Az alkarod a v\xE1llad alatt, a tested egyenes a fejedt\u0151l a sarkadig. Fesz\xEDtsd meg a hasad \xE9s a farizmod, mintha valaki mindj\xE1rt gyomron v\xE1gna. Ne engedd, hogy a cs\xEDp\u0151d megemelkedjen vagy bel\xF3gjon.",tip:"Ha mindk\xE9t k\xF6rben megvan a 60 mp, cser\xE9ld le Plankre felemelt l\xE1bbal. Sokkal nehezebb.",lvl:"Cser\xE9ld le Plankre felemelt l\xE1bbal (\u21C4 Csere)."},r1:{name:"Pike fekv\u0151t\xE1masz",muscles:"V\xE1ll, tricepsz",tempo:"3 mp le, fel",how:"\xC1llj ford\xEDtott V-be: a kezed a padl\xF3n, a cs\xEDp\u0151d magasan, a l\xE1bad amennyire lehet, ny\xFAjtva. Hajl\xEDtsd be a k\xF6ny\xF6k\xF6d, \xE9s engedd a fejed tetej\xE9t a padl\xF3hoz k\xF6zvetlen\xFCl a kezed el\xE9, hogy a kezed \xE9s a fejed h\xE1romsz\xF6get alkosson. Told vissza magad.",tip:"Ha mindk\xE9t k\xF6rben megvan a 15+, cser\xE9ld le Pike fekv\u0151t\xE1maszra emelt l\xE1bbal. T\xF6bb tests\xFAly ker\xFCl a v\xE1lladra.",lvl:"Cser\xE9ld le Pike fekv\u0151t\xE1maszra emelt l\xE1bbal (\u21C4 Csere)."},row2:{name:"Evez\xE9s t\xF6r\xF6lk\xF6z\u0151vel az ajt\xF3n",muscles:"K\xF6z\xE9ps\u0151 h\xE1t, lapock\xE1k, bicepsz",tempo:"1 mp fel, 1 mp tart\xE1s, 3 mp vissza",how:"Nyisd ki az ajt\xF3t, \xE9s \xE1llj szemben az \xE9l\xE9vel \xFAgy, hogy az ajt\xF3 a k\xE9t l\xE1bad k\xF6z\xF6tt legyen. Hurkolj egy t\xF6r\xF6lk\xF6z\u0151t a k\xE9t kilincs k\xF6r\xE9, \xE9s fogd a v\xE9geit, vagy fogd meg k\xF6zvetlen\xFCl a k\xE9t kilincset. D\u0151lj h\xE1tra ny\xFAjtott karral, egyenes testtel. H\xFAzd a mellkasod az ajt\xF3 \xE9l\xE9hez, szor\xEDtsd \xF6ssze a lapock\xE1idat, \xE9s lassan engedd vissza magad.",tip:"El\u0151bb ellen\u0151rizd, hogy a kilincsek stabilak \xE9s nem mozognak. Ha b\xE1rmi mozog, ink\xE1bb az ajt\xF3keretes evez\xE9st csin\xE1ld (A-nap). A biztons\xE1g az els\u0151.",lvl:"Tedd a l\xE1bad k\xF6zelebb az ajt\xF3hoz, \xE9s d\u0151lj h\xE1tr\xE9bb."},n2:{name:"Bolg\xE1r guggol\xE1s",muscles:"El\xFCls\u0151 comb, farizom",tempo:"3 mp le, fel",how:"\xC1llj egy sz\xE9k el\xE9, \xE9s tedd a h\xE1ts\xF3 l\xE1bfejed tetej\xE9t az \xFCl\xE9sre. L\xE9pj nagyot el\u0151re az el\xFCls\u0151 l\xE1baddal. 3 m\xE1sodperc alatt ereszkedj le, a h\xE1ts\xF3 t\xE9rded a padl\xF3 fel\xE9 megy. Az el\xFCls\u0151 l\xE1bad sark\xE1n kereszt\xFCl told fel magad.",tip:"Az el\xFCls\u0151 l\xE1bad legyen el\xE9g messze el\xF6l, hogy a t\xE9rded a l\xE1bfejed f\xF6l\xF6tt maradjon. Enyh\xE9n el\u0151red\xF6nt\xF6tt t\xF6rzs = t\xF6bb farizom. T\xE1maszd a sz\xE9ket a falnak, hogy ne cs\xFAsszon el a l\xE1bad alatt.",lvl:"Lass\xEDts: 4 mp le \xE9s 2 mp sz\xFCnet lent."},b2:{name:"Dead bug",muscles:"M\xE9ly hasizmok",tempo:"lassan, 2 mp ki, 2 mp vissza",how:"Fek\xFCdj a h\xE1tadra, a karod ny\xFAjtva a plafon fel\xE9, a l\xE1bad felemelve, a t\xE9rded 90\xB0-ban. Lassan engedd le a jobb karod a fejed m\xF6g\xE9 \xE9s a bal l\xE1bad a padl\xF3 fel\xE9, azt\xE1n gyere vissza, \xE9s cser\xE9lj oldalt.",tip:"A derekad v\xE9gig maradjon a padl\xF3hoz nyomva. Ha felemelkedik, ne engedd le annyira a l\xE1bad.",lvl:"Lassabban engedd le a karod \xE9s a l\xE1bad, 3 mp ki \xE9s 3 mp vissza."},k3:{name:"Gy\xE9m\xE1nt fekv\u0151t\xE1masz",muscles:"Tricepsz, bels\u0151 mell",tempo:"3 mp le, fel",how:"Tedd a kezed a mellkasod al\xE1 \xFAgy, hogy a h\xFCvelyk- \xE9s mutat\xF3ujjaid \xF6ssze\xE9rjenek, \xE9s gy\xE9m\xE1ntot form\xE1zzanak. Engedd le magad \xFAgy, hogy a k\xF6ny\xF6k\xF6d a tested mellett h\xE1trafel\xE9 megy. A mellkasod a kezed fel\xE9 megy.",tip:"Ha f\xE1j a csukl\xF3d vagy a k\xF6ny\xF6k\xF6d, tedd kicsit t\xE1volabb a kezed. A sz\u0171k fekv\u0151t\xE1masz majdnem ugyan\xFAgy terheli a tricepszet. A nehezebb v\xE1ltozat a Gy\xE9m\xE1nt fekv\u0151t\xE1masz emelt l\xE1bbal, lecser\xE9lheted arra.",lvl:"Cser\xE9ld le Gy\xE9m\xE1nt fekv\u0151t\xE1maszra emelt l\xE1bbal (\u21C4 Csere)."},row3:{name:"Sz\xE9les evez\xE9s ajt\xF3keretn\xE9l",muscles:"H\xE1ts\xF3 v\xE1ll, fels\u0151 h\xE1t",tempo:"1 mp fel, 1 mp tart\xE1s, 3 mp vissza",how:"Ugyanaz a testhelyzet, mint az ajt\xF3keretes evez\xE9sn\xE9l, de v\xE1llmagass\xE1gban fogd a keretet, \xE9s a k\xF6ny\xF6k\xF6d oldalra h\xFAzd, ne a tested mellett. A karod \xE9s a t\xF6rzsed T-t form\xE1z. A v\xE1llad h\xE1ts\xF3 r\xE9sz\xE9n \xE9s a lapock\xE1id k\xF6z\xF6tt kell \xE9rezned.",tip:"Ez a sz\xF6g a h\xE1ts\xF3 v\xE1llat \xE9s a fels\u0151 h\xE1tat edzi. Ezekt\u0151l t\u0171nik h\xE1tulr\xF3l sz\xE9lesebbnek \xE9s vastagabbnak a v\xE1llad.",lvl:"Tedd a l\xE1bad k\xF6zelebb a kerethez, \xE9s d\u0151lj h\xE1tr\xE9bb."},n7:{name:"Combhajl\xEDt\xE1s t\xF6r\xF6lk\xF6z\u0151vel",muscles:"Combhajl\xEDt\xF3k, farizom",tempo:"3 mp ki, 1 mp vissza",how:"Fek\xFCdj a h\xE1tadra sima padl\xF3n (parketta, csempe), a sarkad egy t\xF6r\xF6lk\xF6z\u0151n vagy zokniban. Emeld a cs\xEDp\u0151d h\xEDdba. 3 m\xE1sodperc alatt cs\xFAsztasd ki a l\xE1bad, am\xEDg majdnem egyenes nem lesz, a cs\xEDp\u0151d v\xE9gig fent marad. Azt\xE1n h\xFAzd vissza a sarkad a fenekedhez.",tip:"Sz\u0151nyegen vagy, vagy nem tudsz cs\xFAszni? Cser\xE9ld le sima cs\xEDp\u0151emel\xE9sre.",lvl:"Csin\xE1ld egy l\xE1bbal, a m\xE1sikat tartsd a leveg\u0151ben. El\u0151sz\x xE9ps\u0151 \xE9s fels\u0151 h\xE1t, h\xE1ts\xF3 v\xE1ll",tempo:"minden poz\xEDci\xF3t tarts 1 mp-ig",how:"Fek\xFCdj hasra, a homlokod egy t\xF6r\xF6lk\xF6z\u0151n. Emeld a ny\xFAjtott karod Y alakba, \xE9s tartsd 1 mp-ig. Azt\xE1n oldalra, T alakba. V\xE9g\xFCl h\xFAzd a k\xF6ny\xF6k\xF6d a bord\xE1idhoz W alakba, \xE9s szor\xEDtsd \xF6ssze a lapock\xE1idat. Y + T + W = 1 ism\xE9tl\xE9s.",tip:"A h\xFCvelykujjad felfel\xE9 mutat, a v\xE1llad maradjon t\xE1vol a f\xFCl\xE9dt\u0151l."},lunge:{name:"H\xE1tral\xE9p\xE9ses kit\xF6r\xE9s",muscles:"El\xFCls\u0151 comb, farizom",tempo:"2 mp le, fel",how:"\xC1llj egyenesen. L\xE9pj nagyot h\xE1tra, a h\xE1ts\xF3 t\xE9rded majdnem a padl\xF3ig megy, az el\xFCls\u0151 t\xE9rded 90\xB0-ra hajlik. Az el\xFCls\u0151 l\xE1bad sark\xE1n kereszt\xFCl told vissza magad \xE1ll\xE1sba. Csin\xE1ld meg az \xF6sszes ism\xE9tl\xE9st az egyik l\xE1bbal, azt\xE1n a m\xE1sikkal.",tip:"K\xEDm\xE9letesebb a t\xE9rdnek, mint az el\u0151rel\xE9p\xE9ses kit\xF6r\xE9s. Tartsd egyenesen a t\xF6rzsed."},bridge:{name:"Cs\xEDp\u0151emel\xE9s",muscles:"Farizom, combhajl\xEDt\xF3k",tempo:"fel, 2 mp szor\xEDt\xE1s, le",how:"Fek\xFCdj a h\xE1tadra, a t\xE9rded hajl\xEDtva, a talpad a padl\xF3n. Nyomd a sarkadat a padl\xF3ba, \xE9s emeld a cs\xEDp\u0151d addig, am\xEDg a tested egyenes vonalat alkot a t\xE9rdedt\u0151l a v\xE1lladig. Fent szor\xEDtsd meg a farizmod 2 m\xE1sodpercig, \xE9s lassan engedd le.",tip:"A nehezebb v\xE1ltozat az Egyl\xE1bas cs\xEDp\u0151emel\xE9s. Ha ez m\xE1r k\xF6nny\u0171, cser\xE9ld le arra."},r1e:{name:"Pike fekv\u0151t\xE1masz emelt l\xE1bbal",muscles:"V\xE1ll, tricepsz",tempo:"3 mp le, fel",how:"Tedd a l\xE1bad egy sz\xE9kre, a kezed a f\xF6ldre kicsit el\xE9, a cs\xEDp\u0151d emeld magasra, hogy a t\xF6rzsed majdnem f\xFCgg\u0151leges legyen. Hajl\xEDtsd a k\xF6ny\xF6k\xF6d, \xE9s engedd a fejed a f\xF6ldh\xF6z kicsit a kezed el\xE9, a k\xF6ny\xF6k h\xE1tra megy, nem oldalra. Told vissza magad.",tip:"Min\xE9l f\xFCgg\u0151l
