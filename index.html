and settings stay.",resetAllTitle:"Start over?",resetAllBody:"This deletes all your workouts ({count}) and everything that comes from them: XP, levels, the streak, freezes, ranks and badges. Your name, photo and settings stay. It can't be undone, so save a backup first if you might want the data back.",resetAllBackup:"\u{1F4BE} Save a backup first",resetAllYes:"Yes, delete it all",msgResetAll:"\u2713 Done. You're starting from zero."},pl:{workouts:{one:"{n} workout",other:"{n} workouts"},days:{one:"{n} day",other:"{n} days"},daysAgo:{one:"{n} day ago",other:"{n} days ago"},rounds:{one:"{n} round",other:"{n} rounds"},sets:{one:"{n} set",other:"{n} sets"},prs:{one:"{n} personal record",other:"{n} personal records"}},units:{arm:"/arm",leg:"/leg",side:"/side"},perUnit:{arm:"per arm",leg:"per leg",side:"per side"},themes:{navy:"Navy",black:"Black",forest:"Forest",plum:"Plum",ocean:"Ocean",wine:"Wine",slate:"Slate",coffee:"Coffee"},ranks:["Wood","Iron","Bronze","Silver","Gold","Platinum","Diamond"],ex:{k1:{name:"Push-up",muscles:"Chest, triceps, front shoulders",tempo:"3 s down, short pause, up",how:"Hands slightly wider than your shoulders, body straight from head to heels, abs and glutes tight. Lower yourself for 3 seconds until your chest almost touches the floor, hold briefly and push back up. Keep your elbows at ~45\xB0 to your body, not flared out.",tip:"Once you hit 25+ in the first round, put your hands on two thick books. Your chest goes deeper, the muscle stretches more and grows more.",lvl:"Put your hands on two thick books so your chest goes deeper. Your numbers will drop at first, that's fine."},row1:{name:"Door frame row",muscles:"Back (lats), rear shoulders, biceps",tempo:"1 s up, 1 s hold, 3 s back",how:"Stand in an open doorway, side-on to the frame. Grab the frame with one hand at chest height, feet right next to the frame. Lean back with your arm straight and your body straight. Pull yourself to the frame: elbow goes back along your body, squeeze your shoulder blade back. Return slowly. Do all reps with one arm, then the other.",tip:"The closer your feet are to the frame and the further you lean back, the harder it gets. Hold the solid frame, not the door, and train barefoot so your feet don't slip.",lvl:"Move your feet closer to the frame and lean back further."},n1:{name:"ATG squat",muscles:"Front thighs, glutes",tempo:"3 s down, 1 s pause at the bottom, up",how:"Feet shoulder-width apart, toes slightly out. Lower yourself for 3 seconds as deep as you can, thighs below your knees, heels on the floor. Hold for 1 second at the bottom and stand up.",tip:"The slow tempo and the pause turn an easy squat into a hard one. If you do 20+ even with the tempo, swap it for the 1\xBC squat.",lvl:"Swap it for the 1\xBC squat (\u21C4 Swap)."},b5:{name:"Plank",muscles:"Whole core",how:"Forearms under your shoulders, body straight from head to heels. Brace your abs and glutes as if someone were about to punch your stomach. Don't let your hips rise or sag.",tip:"Once you hold 60 s in both rounds, swap it for the Single-leg plank. It's much harder.",lvl:"Swap it for the Single-leg plank (\u21C4 Swap)."},r1:{name:"Pike push-up",muscles:"Shoulders, triceps",tempo:"3 s down, up",how:"Get into an inverted V: hands on the floor, hips high, legs as straight as you can. Bend your elbows and lower the top of your head to the floor just in front of your hands, so your hands and head form a triangle. Push back up.",tip:"Once you do 15+ in both rounds, swap it for the Feet-elevated pike push-up. More of your weight goes onto your shoulders.",lvl:"Swap it for the Feet-elevated pike push-up (\u21C4 Swap)."},row2:{name:"Towel door row",muscles:"Mid back, shoulder blades, biceps",tempo:"1 s up, 1 s hold, 3 s back",how:"Open the door and stand facing its edge, with the door between your feet. Loop a towel around both handles and hold its ends, or grab both handles directly. Lean back with your arms straight and your body straight. Pull your chest to the edge of the door, squeeze your shoulder blades and lower slowly.",tip:"First check that the handles are solid and don't move. If anything moves, do the door frame row (day A) instead. Safety comes first.",lvl:"Move your feet closer to the door and lean back further."},n2:{name:"Bulgarian split squat",muscles:"Front thighs, glutes",tempo:"3 s down, up",how:"Stand in front of a chair and put the top of your back foot on the seat. Take a big step forward with your front foot. Lower yourself for 3 seconds, your back knee goes towards the floor. Push up through the heel of your front foot.",tip:"Put your front foot far enough forward that your knee stays above your foot. Leaning your torso slightly forward = more glutes.",lvl:"Slow down: 4 s down and a 2 s pause at the bottom."},b2:{name:"Dead bug",muscles:"Deep abdominal muscles",tempo:"slowly, 2 s out, 2 s back",how:"Lie on your back, arms straight up to the ceiling, legs raised with knees at 90\xB0. Slowly lower your right arm behind your head and your left leg towards the floor, then come back and switch sides.",tip:"Your lower back must stay pressed to the floor the whole time. If it lifts, don't lower your leg as far.",lvl:"Lower your arm and leg more slowly, 3 s out and 3 s back."},k3:{name:"Diamond push-up",muscles:"Triceps, inner chest",tempo:"3 s down, up",how:"Place your hands under your chest so your thumbs and index fingers touch and form a diamond. Lower yourself with your elbows going back along your body. Your chest goes towards your hands.",tip:"If your wrists or elbows hurt, move your hands a bit apart. A close-grip push-up works the triceps almost as much. The harder version is the Feet-elevated diamond push-up; you can swap to it.",lvl:"Swap it for the Feet-elevated diamond push-up (\u21C4 Swap)."},row3:{name:"Wide door frame row",muscles:"Rear shoulders, upper back",tempo:"1 s up, 1 s hold, 3 s back",how:"Same stance as the door frame row, but grab the frame at shoulder height and pull your elbow out to the side, not along your body. Your arm and torso form a T. You should feel it at the back of your shoulder and between your shoulder blades.",tip:"This angle trains the rear shoulders and upper back. They make your shoulders look wider and thicker from behind.",lvl:"Move your feet closer to the frame and lean back further."},n7:{name:"Towel hamstring curl",muscles:"Hamstrings, glutes",tempo:"3 s out, 1 s back",how:"Lie on your back on a smooth floor (wood, tiles), heels on a towel or in socks. Lift your hips into a bridge. Slide your legs out for 3 seconds until they're almost straight, hips still up. Then pull your heels back to your glutes.",tip:"On carpet, or can't slide? Swap it for a regular glute bridge.",lvl:"Do it with one leg, keep the other in the air."},b4:{name:"Bicycle crunch",muscles:"Obliques, whole abs",tempo:"slowly, 1 s per side",how:"Lie on your back, hands behind your head, shoulders off the floor. Bring your right elbow to your left knee while straightening your right leg. Then switch. Your torso rotates, not just your elbows.",tip:"Go slowly. Quick elbow flapping does nothing except strain your neck.",lvl:"Slow down to 2 s per side."},kKnee:{name:"Knee push-up",muscles:"Chest, triceps, front shoulders",tempo:"3 s down, up",how:"Kneel, hands slightly wider than your shoulders. Keep your body straight from knees to head, don't stick your hips out. Lower your chest to the floor for 3 seconds and push back up.",tip:"Once you do 20 in both rounds, go back to the regular push-up."},kIncl:{name:"Incline push-up",muscles:"Chest, triceps, front shoulders",tempo:"3 s down, up",how:"Put your hands on a sturdy table, bed or windowsill. Keep your body straight from heels to head. Lower your chest to the edge and push back. The lower the support, the harder it is.",tip:"A good replacement when your wrists hurt on the floor or you're running out of strength."},superman:{name:"Superman",muscles:"Lower back, glutes, rear shoulders",tempo:"up, 2 s hold, down",how:"Lie on your stomach with your arms stretched out in front of you. Lift your arms, chest and legs off the floor at the same time, hold for 2 seconds and lower slowly. Look at the floor, don't tilt your neck back.",tip:"It isn't a pull like a row, but it strengthens your back when you have nowhere to row."},ytw:{name:"Floor Y-T-W",muscles:"Mid and upper back, rear shoulders",tempo:"hold each position for 1 s",how:"Lie on your stomach, forehead on a towel. Lift your straight arms into a Y and hold for 1 s. Then out to the sides into a T. Finally pull your elbows to your ribs into a W and squeeze your shoulder blades. Y + T + W = 1 rep.",tip:"Thumbs point up, keep your shoulders away from your ears."},lunge:{name:"Reverse lunge",muscles:"Front thighs, glutes",tempo:"2 s down, up",how:"Stand tall. Take a big step back, your back knee goes almost to the floor and your front knee bends to 90\xB0. Push through the heel of your front foot back to standing. Do all reps with one leg, then the other.",tip:"Easier on the knees than a forward lunge. Keep your torso upright."},bridge:{name:"Glute bridge",muscles:"Glutes, hamstrings",tempo:"up, 2 s squeeze, down",how:"Lie on your back, knees bent, feet on the floor. Push through your heels and lift your hips until your body forms a straight line from knees to shoulders. Squeeze your glutes for 2 seconds at the top and lower slowly.",tip:"The harder version is the Single-leg glute bridge. When this one feels easy, swap it for that."},r1e:{name:"Feet-elevated pike push-up",muscles:"Shoulders, triceps",tempo:"3 s down, up",how:"Put your feet on a chair, hands on the floor a bit in front of it, and lift your hips high so your torso is almost vertical. Bend your elbows and lower your head to the floor just in front of your hands, elbows going back, not out to the sides. Push back up.",tip:"The more vertical your torso, the more weight goes onto your shoulders. Squeeze your glutes so your lower back doesn't arch."},k3e:{name:"Feet-elevated diamond push-up",muscles:"Triceps, inner chest, shoulders",tempo:"3 s down, up",how:"Put your feet on a chair and your hands under your chest so your thumbs and index fingers touch and form a diamond. Body straight from head to heels. Lower yourself with your elbows going back along your body, chest towards your hands. Push back up.",tip:"Don't let your hips rise or sag. If your wrists or elbows hurt, move your hands a bit apart."},n1q:{name:"1\xBC squat",muscles:"Front thighs, glutes",tempo:"down, quarter up, down, up",how:"Feet shoulder-width apart, toes slightly out. Go all the way down, come up only a quarter of the way, go all the way down again, and only then stand up. That's 1 rep. Heels stay on the floor.",tip:"Your muscles spend twice as long in the hardest, deepest part of the squat, which makes it harder. Don't drop down; lower yourself with control."},b5l:{name:"Single-leg plank",muscles:"Whole core, glutes",how:"Like a regular plank: forearms under your shoulders, body straight from head to heels. Lift one straight leg a little off the floor; halfway through, put it down and lift the other. Keep your hips level, don't let them rotate.",tip:"Don't lift the leg high; just off the floor is enough. The point is to keep your hips still."},sbridge:{name:"Single-leg glute bridge",muscles:"Glutes, hamstrings",tempo:"up, 2 s squeeze, down",how:"Lie on your back, knees bent, feet on the floor. Straighten one leg into the air and keep your thighs together. Push through the heel on the floor and lift your hips until your body forms a straight line from knee to shoulders. Squeeze your glutes for 2 seconds at the top and lower slowly. Do all reps with one leg first, then the other.",tip:"Keep your hips level; don't let them drop to the side of the raised leg. Log the count for one leg: 10 left + 10 right = log 10."},wallsit:{name:"Wall sit",muscles:"Front thighs",how:"Lean your back against a wall and slide down until your thighs are parallel to the floor and your knees are at 90\xB0. Whole back on the wall, knees above your ankles. Hold.",tip:"Don't put your hands on your thighs, or you're helping yourself."},birddog:{name:"Bird dog",muscles:"Core, lower back, glutes",tempo:"reach, 2 s hold, back",how:"Get on all fours: hands under your shoulders, knees under your hips. Reach your right arm forward and your left leg back at the same time, body in a straight line. Hold for 2 seconds, come back and switch sides.",tip:"Your hips must not rotate. Imagine a glass of water on your lower back."},hollow:{name:"Hollow body hold",muscles:"Whole core",how:"Lie on your back with your arms stretched behind your head. Press your lower back into the floor and lift your shoulders and straight legs a little off the floor. Hold without moving.",tip:"If your lower back lifts off the floor, raise your legs higher or bend them."},legraise:{name:"Leg raise",muscles:"Lower abs, hip flexors",tempo:"2 s up, 2 s down",how:"Lie on your back, arms by your sides. Slowly raise your straight legs until they're vertical and slowly lower them almost to the floor, but don't put them down. Your lower back stays on the floor.",tip:"If your lower back hurts, bend your knees."}},warm:{w1:{name:"Arm circles",dose:"15\xD7 forward, 15\xD7 back",why:"Loosens your shoulders before push-ups and rows."},w2:{name:"Leg swings",dose:"10\xD7 each leg, hold a wall",why:"Loosens your hips before squats."},w3:{name:"World's greatest stretch",dose:"5\xD7 each side",why:"Hips, upper back and hamstrings at once."},w4:{name:"Inchworm",dose:"5\xD7",why:"Warms up your whole body and takes you into a plank."}},cool:{c1:{name:"Hip flexor, left",why:"Sitting a lot (school, computer) shortens the front of your hips. If you only do one stretch, do this one.",how:"Kneel on your left knee, right foot in front. Squeeze your glutes and shift your hips forward until you feel a stretch at the front of your left hip. Don't arch your lower back."},c2:{name:"Hip flexor, right",why:"The same on the other side.",how:"Kneel on your right knee, left foot in front. Squeeze your glutes and shift your hips forward."},c4:{name:"Cobra",why:"Stretches your abs and the front of your hips. It balances out all the curling in the core exercises.",how:"Lie on your stomach, palms under your shoulders, elbows close to your body. Keep your hips on the floor and slowly press up with your arms until you feel a gentle stretch in your abs. Keep your shoulders down away from your ears; your elbows don't have to be fully straight. If your lower back pinches, go lower."},c3:{name:"Child's pose",why:"Calms your breathing and relaxes your back. Purely for feeling good.",how:"Knees apart, sit your hips back on your heels, reach your arms as far forward as you can, forehead on the floor. Breathe slowly."}},fig:{k1:["Up","Down, elbows ~45\xB0 from the body"],k3:["Up","Down, elbows in"],b5:["Right: straight body","Wrong: sagging lower back"],n1:["Start","Down, heels on the floor"],r1:["Up","Down, head in front of hands"],row1:["Start, arm straight","Pull, elbow back"],row3:["Start, hand at shoulder height","Elbow out to the side, ~90\xB0 from the body"],row2:["Start, arms straight","Chest to the door"],n2:["Up","Down, back knee to the floor"],b2:["Start","Arm and opposite leg down"],n7:["Hips up, heels near glutes","Slide legs out, hips still up"],b4:["Elbow to opposite knee","Switch sides"],kKnee:["Up, knees on the floor","Down, elbows ~45\xB0 from the body"],kIncl:["Hands on the table, up","Chest to the edge, elbows ~45\xB0 from the body"],superman:["Lie on your stomach","Lift and hold 2 s"],ytw:["Y: arms forward and out","T: arms out to the sides","W: elbows to the ribs"],lunge:["Start","Step back, knee to the floor"],bridge:["Lie down, knees bent","Hips up, squeeze glutes"],sbridge:["Lie down, one leg up","Hips up, squeeze glutes"],r1e:["Up, feet on a chair","Down, head in front of hands"],k3e:["Up, feet on a chair","Down, elbows in"],n1q:["All the way down","A quarter up","All the way down again","Only then up"],b5l:["One leg up","Halfway through, switch legs"],wallsit:["Knees ~90\xB0, back on the wall"],birddog:["On all fours: arms and knees ~90\xB0","Arm and opposite leg"],hollow:["Lower back pressed to the floor"],legraise:["Legs up","Lower slowly, don't put them on the floor"],hf:["Back knee down, hips forward"],cobra:["Hips on the floor, chest up"],child:["Hips to heels, arms far forward"]},ch:{w3:"Do 3 workouts",pr1:"Beat a personal record",r3:"Do 3 rounds once",warm:"Full warm-up 2\xD7",cool:"Stretch after a workout 2\xD7",push100:"100 push-ups in total (all kinds)",rank:"Reach a new rank",reps300:"300 reps in total",legs100:"100 leg reps"},ach:{first:["First step","1st workout"],w5:["High five","5 workouts"],w10:["Perfect ten","10 workouts"],w25:["Quarter century","25 workouts"],w50:["Half century","50 workouts"],s3:["On a roll","Streak of 3"],s7:["Unstoppable","Streak of 7"],s15:["Discipline","Streak of 15"],pr:["Record breaker","1st personal record"],gold:["Golden","Gold in 1 exercise"],diamond:["Diamond","Diamond in 1 exercise"],week:["Perfect week","All 3 challenges"],lvl5:["Level 5","Reach level 5"],r3:["Three rounds","Do 3 rounds"],push30:["Thirty","30 push-ups in one set"]},quotes:["Discipline takes you where motivation can't.","You don't need to feel like it. Just do the first set, the rest follows.","Every rep is a brick. A body is built brick by brick.","13 minutes today. A body for life.","Never miss twice in a row.","Small steps every other day beat big plans you never start.","Your future self will thank you for today.","It's not about the perfect workout. It's about showing up.","Where it starts to burn, growth begins.","Compare yourself only to who you were last week.","While others look for motivation, you've already trained.","Hard sets, easier life.","Every strong person started from zero."],restDay:["Muscles are built by training, but they grow with food and sleep.","Today is a rest day. That's part of the plan too.","Resting isn't laziness. This is when you grow.","The work is done. Now let your body rebuild.","Eat well, sleep well. That's training too.","Strength isn't built in a day. It's built every other day, month after month.","Those who know how to rest go the distance.","Today you recharge for your next workout.","Consistency is your superpower. Keep it.","Progress isn't always visible right away. But it's happening.","Be proud that you keep going.","Today belongs to recovery. Enjoy it.","Small steps, many days in a row. That's how big changes happen."],doneTitles:["You already trained today","Done for today","Today is ticked off","Mission complete!"],doneSubs:["Day {day} is done. Now eat and sleep, your muscles grow while you rest.","Day {day} is behind you. Good work, now take it easy.","Day {day} is done. Another brick in the wall.","Day {day} is logged. Your next workout is in two days.","Day {day} done. Your body does the work now, enjoy the rest of your day.","Day {day} handled. This is how discipline is built."],facts:["You can train every day, but every other day is best. Muscles grow while you rest, not while you train.","Sleep is your best supplement. 7\u20139 hours a night = faster recovery.","The last reps of a set do the most work. They're the ones that build muscle.","A slow lowering phase (3 seconds) gives your muscles more work than fast reps.","Protein in every meal helps your muscles grow.","Consistency beats intensity. Better 13 minutes every other day than an hour once a month.","Have some water. Even mild thirst lowers your performance.","Breathe slowly: in through your nose, out through your mouth. You'll calm down faster.","Full range of motion = more muscle at work. Fewer reps, but full ones."],moti:["I believe in you, you've got this! \u{1F4AA}","Every set takes you closer to your goal.","You're stronger than you think.","Just a bit more, you can do it.","Today counts. Don't give up.","This is the moment where you grow.","Your future self will thank you."],cheers:["Strong set!","That's how it's done!","Beast mode!","You're on fire!","Clean work!","This is the road to a strong body.","Almost there!"],finish:["Another brick in the wall. That's how it's done.","Done. Now eat well and sleep, that's when muscles grow.","Strength isn't talent. It's the sum of days exactly like this one.","Done. This is discipline in action.","Today you did what most people only plan."]};var vp={ui:{loading:"Na\u010D\xEDtavam\u2026",close:"Zavrie\u0165",cancel:"Zru\u0161i\u0165",save:"Ulo\u017Ei\u0165",home:"Domov",back:"Sp\xE4\u0165",start:"\u0160tart",stop:"Stop",copied:"\u2713 Skop\xEDrovan\xE9",dayN:"De\u0148 {d}",tabTrain:"Tr\xE9ning",tabHistory:"Hist\xF3ria",tabSettings:"Nastavenia",tabProfile:"Profil",mainMenu:"Hlavn\xE9 menu",openProfile:"Otvori\u0165 profil",streakAria:"S\xE9ria {n}",levelAria:"Level {n}",weeklyChallenges:"V\xFDzvy t\xFD\u017Ed\u0148a",chLeft:"{done}/3, e\u0161te {left}",chFooter:"Spl\u0148 v\u0161etky 3 a dostane\u0161 \u{1F9CA} zamrazenie s\xE9rie.",firstWorkout:"Prv\xFD tr\xE9ning. Po\u010Fme na to.",anytime:"Kedyko\u013Evek bude\u0161 chcie\u0165.",idealOn:"Ide\xE1lne {date}, lebo cvi\u010D\xED\u0161 obde\u0148.",trainedYesterday:"V\u010Dera si cvi\u010Dil de\u0148 {day}. Pod\u013Ea pl\xE1nu (obde\u0148) je \u010Fal\u0161\xED tr\xE9ning zajtra, ale \xEDs\u0165 m\xF4\u017Ee\u0161 aj dnes.",streakAtRisk:"Dnes je tr\xE9ningov\xFD de\u0148. Ak dnes necvi\u010D\xED\u0161, zajtra ti skon\u010D\xED s\xE9ria \u{1F525} {n}.",trainingDay:"Dnes je tr\xE9ningov\xFD de\u0148. Posledn\xFD tr\xE9ning: {date} ({ago}).",welcomeTitle:"Vitaj! \u{1F44B}",welcome1:"Cvi\u010D\xED\u0161 doma, bez n\xE1radia, ~13 min\xFAt. Strieda\u0161 dni A, B, C a cvi\u010D\xED\u0161 obde\u0148. Ka\u017Ed\xFD tr\xE9ning m\xE1 zahriatie, potom 4 cviky dookola (2 alebo 3 kol\xE1) a volite\u013En\xFD stre\u010Ding.",welcome2:"\u0164ukni na cvik a uvid\xED\u0161 obr\xE1zok, postup a video. Ak ti cvik nejde, po\u010Das tr\x ED\u0161 po\u010Det za jednu nohu: 10 \u013Eavou + 10 pravou = zap\xED\u0161 10."},wallsit:{name:"Wall sit",muscles:"Predn\xE9 stehn\xE1",how:"Opri sa chrbtom o stenu a z\xED\u010F dole, k\xFDm stehn\xE1 nie s\xFA vodorovne so zemou a kolen\xE1 nezvieraj\xFA 90\xB0. Chrb\xE1t cel\xFD na stene, kolen\xE1 nad \u010Dlenkami. Dr\u017E.",tip:"Ruky ned\xE1vaj na stehn\xE1, inak si pom\xE1ha\u0161."},birddog:{name:"Bird dog",muscles:"Stred tela, spodn\xFD chrb\xE1t, zadok",tempo:"vystri, 2 s podr\u017E, sp\xE4\u0165",how:"K\u013Eakni si na \u0161tyri: ruky pod ramenami, kolen\xE1 pod bokmi. Vystri naraz prav\xFA ruku dopredu a \u013Eav\xFA nohu dozadu, telo tvor\xED rovn\xFA \u010Diaru. Podr\u017E 2 sekundy, vr\xE1\u0165 sa a vyme\u0148 strany.",tip:"Boky sa nesm\xFA ot\xE1\u010Da\u0165. Predstav si, \u017Ee m\xE1\u0161 na kr\xED\u017Eoch poh\xE1r vody."},hollow:{name:"Hollow body hold",muscles:"Cel\xFD stred tela",how:"\u013Dahni na chrb\xE1t, ruky vystri za hlavu. Spodok chrbta pritla\u010D k zemi a zdvihni ramen\xE1 aj vystret\xE9 nohy k\xFAsok od zeme. Dr\u017E bez pohybu.",tip:"Ak sa ti driek odlep\xED od zeme, zdvihni nohy vy\u0161\u0161ie alebo ich pokr\u010D."},legraise:{name:"Leg raise",muscles:"Spodn\xE9 brucho, bedrov\xE9 flexory",tempo:"2 s hore, 2 s dole",how:"\u013Dahni na chrb\xE1t, ruky ved\u013Ea tela. Vystret\xE9 nohy pomaly zdvihni do zvislej polohy a pomaly ich sp\xFA\u0161\u0165aj skoro k zemi, ale nepolo\u017E ich. Spodok chrbta ost\xE1va na zemi.",tip:"Ak \u0165a bol\xED driek, pokr\u010D kolen\xE1."}},warm:{w1:{name:"Kruhy rukami",dose:"15\xD7 dopredu, 15\xD7 dozadu",why:"Rozh\xFDbe ramen\xE1 pred klikmi a veslovan\xEDm."},w2:{name:"\u0160vihy nohou",dose:"10\xD7 ka\u017Edou nohou, dr\u017E sa steny",why:"Uvo\u013En\xED bedr\xE1 pred drepmi."},w3:{name:"World's greatest stretch",dose:"5\xD7 na ka\u017Ed\xFA stranu",why:"Bedr\xE1, hrudn\xFD chrb\xE1t a zadn\xE9 stehn\xE1 naraz."},w4:{name:"Inchworm",dose:"5\xD7",why:"Prehreje cel\xE9 telo a prejde\u0 l 5"],r3:["Tri kol\xE1","Odcvi\u010D 3 kol\xE1"],push30:["Tridsiatka","30 klikov v s\xE9rii"]},quotes:["Discipl\xEDna \u0165a dovedie tam, kam motiv\xE1cia nedo\u010Diahne.","Nemus\xED\u0161 ma\u0165 chu\u0165. Sta\u010D\xED spravi\u0165 prv\xFA s\xE9riu, zvy\u0161ok pr\xEDde s\xE1m.","Ka\u017Ed\xE9 opakovanie je tehla. Postava sa stavia tehlu po tehle.","13 min\xFAt dnes. Telo na cel\xFD \u017Eivot.","Nikdy nevynechaj dvakr\xE1t po sebe.","Mal\xE9 kroky obde\u0148 porazia ve\u013Ek\xE9 pl\xE1ny, ktor\xE9 nikdy neza\u010Dne\u0161.","Tvoje bud\xFAce ja ti po\u010Fakuje za dne\u0161ok.","Nejde o dokonal\xFD tr\xE9ning. Ide o to, \u017Ee pr\xEDde\u0161.","Tam, kde to za\u010Dne p\xE1li\u0165, sa za\u010D\xEDna rast.","Porovn\xE1vaj sa len so sebou z minul\xE9ho t\xFD\u017Ed\u0148a.","K\xFDm ostatn\xED h\u013Eadaj\xFA motiv\xE1ciu, ty u\u017E m\xE1\u0161 odcvi\u010Den\xE9.","\u0164a\u017Ek\xE9 s\xE9rie, \u013Eah\u0161\xED \u017Eivot.","Ka\u017Ed\xFD sil\xE1k raz za\u010D\xEDnal od nuly."],restDay:["Svaly sa buduj\xFA cvi\u010Den\xEDm, ale rast\xFA jedlom a sp\xE1nkom.","Dnes je oddych. Aj ten je s\xFA\u010Das\u0165 pl\xE1nu.","Oddych nie je lenivos\u0165. Pr\xE1ve teraz rastie\u0161.","Pr\xE1ca je spraven\xE1. Teraz nechaj telo, nech si to posklad\xE1.","Dobre sa najedz, dobre sa vyspi. Aj to je tr\xE9ning.","Sila sa nestavia za jeden de\u0148. Stavia sa obde\u0148, mesiac po mesiaci.","Kto vie oddychova\u0165, vydr\u017E\xED dlh\u0161ie.","Dnes si dob\xEDja\u0161 baterky na \u010Fal\u0161\xED tr\xE9ning.","Pravidelnos\u0165 je tvoja superschopnos\u0165. Dr\u017E ju.","Pokrok nie je v\u017Edy hne\u010F vidie\u0165. Ale deje sa.","Bu\u010F hrd\xFD na to, \u017Ee sa nevzd\xE1va\u0161.","Dne\u0161ok patr\xED regener\xE1cii. U\u017Ei si ho.","Mal\xE9 kroky, ve\u013Ea dn\xED po sebe. Tak vznikaj\xFA ve\u013Ek\xE9 zmeny."],doneTitles:["Dnes si u\u017E cvi\u010Dil","Dnes m\xE1\u0161 hotovo","Dne\u0161ok je od\u0161krtnut\xFD","Splnen\xE9!"],doneSubs:["De\u0148 {day} je hotov\x e.","Dnes 13 minut. T\u011Blo na cel\xFD \u017Eivot.","Nikdy nevynechej dvakr\xE1t za sebou.","Mal\xE9 kroky obden poraz\xED velk\xE9 pl\xE1ny, kter\xE9 nikdy neza\u010Dne\u0161.","Tvoje budouc\xED j\xE1 ti za dne\u0161ek pod\u011Bkuje.","Nejde o dokonal\xFD tr\xE9nink. Jde o to, \u017Ee se uk\xE1\u017Ee\u0161.","Kde to za\u010Dne p\xE1lit, tam za\u010D\xEDn\xE1 r\u016Fst.","Srovn\xE1vej se jen se sv\xFDm j\xE1 z minul\xE9ho t\xFDdne.","Zat\xEDmco jin\xED hledaj\xED motivaci, ty u\u017E m\xE1\u0161 odtr\xE9nov\xE1no.","T\u011B\u017Ek\xE9 s\xE9rie, leh\u010D\xED \u017Eivot.","Ka\u017Ed\xFD sil\xE1k za\u010D\xEDnal od nuly."],restDay:["Svaly se buduj\xED tr\xE9ninkem, ale rostou s j\xEDdlem a sp\xE1nkem.","Dnes je odpo\u010Dinek. I ten je sou\u010D\xE1st pl\xE1nu.","Odpo\u010Dinek nen\xED lenost. Pr\xE1v\u011B te\u010F roste\u0161.","Pr\xE1ce je hotov\xE1. Te\u010F nech t\u011Blo, a\u0165 se d\xE1 dohromady.","Dob\u0159e se najez, dob\u0159e se vyspi. I to je tr\xE9nink.","S\xEDla se nestav\xED za jeden den. Stav\xED se obden, m\u011Bs\xEDc po m\u011Bs\xEDci.","Kdo um\xED odpo\u010D\xEDvat, vydr\u017E\xED d\xE9le.","Dnes si dob\xEDj\xED\u0161 baterky na dal\u0161\xED tr\xE9nink.","Pravidelnost je tvoje superschopnost. Dr\u017E ji.","Pokrok nen\xED v\u017Edycky hned vid\u011Bt. Ale d\u011Bje se.","Bu\u010F hrd\xFD na to, \u017Ee to nevzd\xE1v\xE1\u0161.","Dne\u0161ek pat\u0159\xED regeneraci. U\u017Eij si ho.","Mal\xE9 kroky, hodn\u011B dn\xED po sob\u011B. Tak vznikaj\xED velk\xE9 zm\u011Bny."],doneTitles:["Dnes u\u017E m\xE1\u0161 odtr\xE9nov\xE1no","Dnes m\xE1\u0161 hotovo","Dne\u0161ek je od\u0161krtnut\xFD","Spln\u011Bno!"],doneSubs:["Den {day} je hotov\xFD. Te\u010F se najez a vyspi, svaly rostou, kdy\u017E odpo\u010D\xEDv\xE1\u0161.","Den {day} m\xE1\u0161 za sebou. Dobr\xE1 pr\xE1ce, te\u010F si odpo\u010Di\u0148.","Den {day} je hotov\xFD. Dal\u0161\xED cihla ve zdi.","Den {day} je zapsan\xFD. Dal\u0161\xED tr\xE9nink t\u011B \u010Dek\xE1 za dva dny.","Den {day} odcvi\u010Den\xFD. T\u011Blo te\u010F pracuje za tebe, ty si u\u017Eij zbytek dne.","Den {day} zvl\xE1dnut\xFD. Takhle se buduje discipl\xEDna."],facts:["Tr\xE9novat m\u016F\u017Ee\u0161 ka\u017Ed\xFD den, ale obden je nejlep\u0161\xED. Svaly rostou, kdy\u017E odpo\u010D\xEDv\xE1\u0161, ne kdy\u017E tr\xE9nuje\u0161.","Sp\xE1nek je tv\u016Fj nejlep\u0161\xED dopln\u011Bk. 7\u20139 hodin za noc = rychlej\u0161\xED regenerace.","Posledn\xED opakov\xE1n\xED v s\xE9rii odvedou nejv\xEDc pr\xE1ce. Pr\xE1v\u011B ta stav\xED svaly.","Pomal\xE9 spou\u0161t\u011Bn\xED (3 sekundy) d\xE1 sval\u016Fm v\xEDc pr\xE1ce ne\u017E rychl\xE1 opakov\xE1n\xED.","B\xEDlkoviny v ka\u017Ed\xE9m j\xEDdle pom\xE1haj\xED sval\u016Fm r\u016Fst.","Pravidelnost por\xE1\u017E\xED intenzitu. Rad\u0161i 13 minut obden ne\u017E hodina jednou za m\u011Bs\xEDc.","Napij se vody. I m\xEDrn\xE1 \u017E\xEDze\u0148 sni\u017Euje v\xFDkon.","D\xFDchej pomalu: nosem dovnit\u0159, pusou ven. Rychleji se uklidn\xED\u0161.","Pln\xFD rozsah pohybu = v\xEDc sval\u016F v akci. M\xE9n\u011B opakov\xE1n\xED, ale cel\xFDch."],moti:["V\u011B\u0159\xEDm ti, zvl\xE1dne\u0161 to! \u{1F4AA}","Ka\u017Ed\xE1 s\xE9rie t\u011B posouv\xE1 bl\xED\u017E k c\xEDli.","Jsi siln\u011Bj\u0161\xED, ne\u017E si mysl\xED\u0161.","Je\u0161t\u011B kousek, d\xE1\u0161 to.","Dne\u0161ek se po\u010D\xEDt\xE1. Nevzd\xE1vej to.","Tohle je chv\xEDle, kdy roste\u0161.","Tvoje budouc\xED j\xE1 ti pod\u011Bkuje."],cheers:["Siln\xE1 s\xE9rie!","Takhle se to d\u011Bl\xE1!","Beast mode!","Jsi v r\xE1\u017Ei!","\u010Cist\xE1 pr\xE1ce!","Tohle je cesta k siln\xE9mu t\u011Blu.","U\u017E skoro!"],finish:["Dal\u0161\xED cihla ve zdi. Takhle se to d\u011Bl\xE1.","Hotovo. Te\u010F se po\u0159\xE1dn\u011B najez a vyspi, tehdy svaly rostou.","S\xEDla nen\xED talent. Je to sou\u010Det dn\u016F p\u0159esn\u011B jako tenhle.","Hotovo. Tohle je discipl\xEDna v akci.","Dnes m\xE1\u0161 hotovo to, co v\u011Bt\u0161ina lid\xED jen pl\xE1nuje."]};var zp={ui:{loading 017C cz\u0119\u015B\u0107 planu.","Odpoczynek to nie lenistwo. W\u0142a\u015Bnie teraz ro\u015Bniesz.","Robota zrobiona. Teraz pozw\xF3l cia\u0142u si\u0119 odbudowa\u0107.","Dobrze zjedz, dobrze si\u0119 wy\u015Bpij. To te\u017C trening.","Si\u0142y nie buduje si\u0119 w jeden dzie\u0144. Buduje si\u0119 j\u0105 co drugi dzie\u0144, miesi\u0105c po miesi\u0105cu.","Kto umie odpoczywa\u0107, ten wytrzyma d\u0142u\u017Cej.","Dzi\u015B \u0142adujesz baterie na nast\u0119pny trening.","Regularno\u015B\u0107 to twoja supermoc. Trzymaj si\u0119 jej.","Post\u0119p\xF3w nie zawsze wida\u0107 od razu. Ale one s\u0105.","B\u0105d\u017A dumny, \u017Ce si\u0119 nie poddajesz.","Dzisiejszy dzie\u0144 nale\u017Cy do regeneracji. Ciesz si\u0119 nim.","Ma\u0142e kroki, wiele dni z rz\u0119du. Tak powstaj\u0105 wielkie zmiany."],doneTitles:["Dzisiejszy trening ju\u017C zaliczony","Na dzi\u015B zrobione","Dzisiaj odhaczone","Misja wykonana!"],doneSubs:["Dzie\u0144 {day} zrobiony. Teraz jedz i \u015Bpij, mi\u0119\u015Bnie rosn\u0105 podczas odpoczynku.","Dzie\u0144 {day} masz za sob\u0105. Dobra robota, teraz odpocznij.","Dzie\u0144 {day} zrobiony. Kolejna ceg\u0142a w murze.","Dzie\u0144 {day} zapisany. Nast\u0119pny trening za dwa dni.","Dzie\u0144 {day} zaliczony. Teraz pracuje twoje cia\u0142o, a ty ciesz si\u0119 reszt\u0105 dnia.","Dzie\u0144 {day} ogarni\u0119ty. Tak buduje si\u0119 dyscyplin\u0119."],facts:["Mo\u017Cesz trenowa\u0107 codziennie, ale co drugi dzie\u0144 jest najlepiej. Mi\u0119\u015Bnie rosn\u0105 podczas odpoczynku, nie podczas treningu.","Sen to tw\xF3j najlepszy suplement. 7\u20139 godzin na noc = szybsza regeneracja.","Ostatnie powt\xF3rzenia w serii robi\u0105 najwi\u0119cej roboty. To one buduj\u0105 mi\u0119\u015Bnie.","Wolne opuszczanie (3 sekundy) daje mi\u0119\u015Bniom wi\u0119cej pracy ni\u017C szybkie powt\xF3rzenia.","Bia\u0142ko w ka\u017Cdym posi\u0142ku pomaga mi\u0119\u015Bniom rosn\u0105\u0107.","Regularno\u015B\u0107 wygrywa z intensywno\u0 z\xE9ps\u0151 h\xE1t, lapock\xE1k, bicepsz",tempo:"1 mp fel, 1 mp tart\xE1s, 3 mp vissza",how:"Nyisd ki az ajt\xF3t, \xE9s \xE1llj szemben az \xE9l\xE9vel \xFAgy, hogy az ajt\xF3 a k\xE9t l\xE1bad k\xF6z\xF6tt legyen. Hurkolj egy t\xF6r\xF6lk\xF6z\u0151t a k\xE9t kilincs k\xF6r\xE9, \xE9s fogd a v\xE9geit, vagy fogd meg k\xF6zvetlen\xFCl a k\xE9t kilincset. D\u0151lj h\xE1tra ny\xFAjtott karral, egyenes testtel. H\xFAzd a mellkasod az ajt\xF3 \xE9l\xE9hez, szor\xEDtsd \xF6ssze a lapock\xE1idat, \xE9s lassan engedd vissza magad.",tip:"El\u0151bb ellen\u0151rizd, hogy a kilincsek stabilak \xE9s nem mozognak. Ha b\xE1rmi mozog, ink\xE1bb az ajt\xF3keretes evez\xE9st csin\xE1ld (A-nap). A biztons\xE1g az els\u0151.",lvl:"Tedd a l\xE1bad k\xF6zelebb az ajt\xF3hoz, \xE9s d\u0151lj h\xE1tr\xE9bb."},n2:{name:"Bolg\xE1r guggol\xE1s",muscles:"El\xFCls\u0151 comb, farizom",tempo:"3 mp le, fel",how:"\xC1llj egy sz\xE9k el\xE9, \xE9s tedd a h\xE1ts\xF3 l\xE1bfejed tetej\xE9t az \xFCl\xE9sre. L\xE9pj nagyot el\u0151re az el\xFCls\u0151 l\xE1baddal. 3 m\xE1sodperc alatt ereszkedj le, a h\xE1ts\xF3 t\xE9rded a padl\xF3 fel\xE9 megy. Az el\xFCls\u0151 l\xE1bad sark\xE1n kereszt\xFCl told fel magad.",tip:"Az el\xFCls\u0151 l\xE1bad legyen el\xE9g messze el\xF6l, hogy a t\xE9rded a l\xE1bfejed f\xF6l\xF6tt maradjon. Enyh\xE9n el\u0151red\xF6nt\xF6tt t\xF6rzs = t\xF6bb farizom.",lvl:"Lass\xEDts: 4 mp le \xE9s 2 mp sz\xFCnet lent."},b2:{name:"Dead bug",muscles:"M\xE9ly hasizmok",tempo:"lassan, 2 mp ki, 2 mp vissza",how:"Fek\xFCdj a h\xE1tadra, a karod ny\xFAjtva a plafon fel\xE9, a l\xE1bad felemelve, a t\xE9rded 90\xB0-ban. Lassan engedd le a jobb karod a fejed m\xF6g\xE9 \xE9s a bal l\xE1bad a padl\xF3 fel\xE9, azt\xE1n gyere vissza, \xE9s cser\xE9lj oldalt.",tip:"A derekad v\xE9gig maradjon a padl\xF3hoz nyomva. Ha felemelkedik, ne engedd le annyira a l\xE1bad.",lvl:"Lassabban engedd le a karod \xE9s a l\xE1bad, 3 mp ki \xE9s 3 mp vissza."},k3:{name:"Gy\xE9m\xE1nt fekv\u0151t\xE1masz",muscles:"Tricepsz, bels\u0151 mell",tempo:"3 mp le, fel",how:"Tedd a kezed a mellkasod al\xE1 \xFAgy, hogy a h\xFCvelyk- \xE9s mutat\xF3ujjaid \xF6ssze\xE9rjenek, \xE9s gy\xE9m\xE1ntot form\xE1zzanak. Engedd le magad \xFAgy, hogy a k\xF6ny\xF6k\xF6d a tested mellett h\xE1trafel\xE9 megy. A mellkasod a kezed fel\xE9 megy.",tip:"Ha f\xE1j a csukl\xF3d vagy a k\xF6ny\xF6k\xF6d, tedd kicsit t\xE1volabb a kezed. A sz\u0171k fekv\u0151t\xE1masz majdnem ugyan\xFAgy terheli a tricepszet. A nehezebb v\xE1ltozat a Gy\xE9m\xE1nt fekv\u0151t\xE1masz emelt l\xE1bbal, lecser\xE9lheted arra.",lvl:"Cser\xE9ld le Gy\xE9m\xE1nt fekv\u0151t\xE1maszra emelt l\xE1bbal (\u21C4 Csere)."},row3:{name:"Sz\xE9les evez\xE9s ajt\xF3keretn\xE9l",muscles:"H\xE1ts\xF3 v\xE1ll, fels\u0151 h\xE1t",tempo:"1 mp fel, 1 mp tart\xE1s, 3 mp vissza",how:"Ugyanaz a testhelyzet, mint az ajt\xF3keretes evez\xE9sn\xE9l, de v\xE1llmagass\xE1gban fogd a keretet, \xE9s a k\xF6ny\xF6k\xF6d oldalra h\xFAzd, ne a tested mellett. A karod \xE9s a t\xF6rzsed T-t form\xE1z. A v\xE1llad h\xE1ts\xF3 r\xE9sz\xE9n \xE9s a lapock\xE1id k\xF6z\xF6tt kell \xE9rezned.",tip:"Ez a sz\xF6g a h\xE1ts\xF3 v\xE1llat \xE9s a fels\u0151 h\xE1tat edzi. Ezekt\u0151l t\u0171nik h\xE1tulr\xF3l sz\xE9lesebbnek \xE9s vastagabbnak a v\xE1llad.",lvl:"Tedd a l\xE1bad k\xF6zelebb a kerethez, \xE9s d\u0151lj h\xE1tr\xE9bb."},n7:{name:"Combhajl\xEDt\xE1s t\xF6r\xF6lk\xF6z\u0151vel",muscles:"Combhajl\xEDt\xF3k, farizom",tempo:"3 mp ki, 1 mp vissza",how:"Fek\xFCdj a h\xE1tadra sima padl\xF3n (parketta, csempe), a sarkad egy t\xF6r\xF6lk\xF6z\u0151n vagy zokniban. Emeld a cs\xEDp\u0151d h\xEDdba. 3 m\xE1sodperc alatt cs\xFAsztasd ki a l\xE1bad, am\xEDg majdnem egyenes nem lesz, a cs\xEDp\u0151d v\xE9gig fent marad. Azt\xE1n h\xFAzd vissza a sarkad a fenekedhez.",tip:"Sz\u0151nyegen vagy, vagy nem tudsz cs\xFAszni? Cser\xE9ld le sima cs\xEDp\u0151emel\xE9sre.",lvl:"Csin\xE1ld egy l\xE1bbal, a m\xE1sikat tartsd a leveg\u0151ben."},b4:{name:"Biciklis F6r\xF6lk\xF6z\u0151n. Emeld a ny\xFAjtott karod Y alakba, \xE9s tartsd 1 mp-ig. Azt\xE1n oldalra, T alakba. V\xE9g\xFCl h\xFAzd a k\xF6ny\xF6k\xF6d a bord\xE1idhoz W alakba, \xE9s szor\xEDtsd \xF6ssze a lapock\xE1idat. Y + T + W = 1 ism\xE9tl\xE9s.",tip:"A h\xFCvelykujjad felfel\xE9 mutat, a v\xE1llad maradjon t\xE1vol a f\xFCl\xE9dt\u0151l."},lunge:{name:"H\xE1tral\xE9p\xE9ses kit\xF6r\xE9s",muscles:"El\xFCls\u0151 comb, farizom",tempo:"2 mp le, fel",how:"\xC1llj egyenesen. L\xE9pj nagyot h\xE1tra, a h\xE1ts\xF3 t\xE9rded majdnem a padl\xF3ig megy, az el\xFCls\u0151 t\xE9rded 90\xB0-ra hajlik. Az el\xFCls\u0151 l\xE1bad sark\xE1n kereszt\xFCl told vissza magad \xE1ll\xE1sba. Csin\xE1ld meg az \xF6sszes ism\xE9tl\xE9st az egyik l\xE1bbal, azt\xE1n a m\xE1sikkal.",tip:"K\xEDm\xE9letesebb a t\xE9rdnek, mint az el\u0151rel\xE9p\xE9ses kit\xF6r\xE9s. Tartsd egyenesen a t\xF6rzsed."},bridge:{name:"Cs\xEDp\u0151emel\xE9s",muscles:"Farizom, combhajl\xEDt\xF3k",tempo:"fel, 2 mp szor\xEDt\xE1s, le",how:"Fek\xFCdj a h\xE1tadra, a t\xE9rded hajl\xEDtva, a talpad a padl\xF3n. Nyomd a sarkadat a padl\xF3ba, \xE9s emeld a cs\xEDp\u0151d addig, am\xEDg a tested egyenes vonalat alkot a t\xE9rdedt\u0151l a v\xE1lladig. Fent szor\xEDtsd meg a farizmod 2 m\xE1sodpercig, \xE9s lassan engedd le.",tip:"A nehezebb v\xE1ltozat az Egyl\xE1bas cs\xEDp\u0151emel\xE9s. Ha ez m\xE1r k\xF6nny\u0171, cser\xE9ld le arra."},r1e:{name:"Pike fekv\u0151t\xE1masz emelt l\xE1bbal",muscles:"V\xE1ll, tricepsz",tempo:"3 mp le, fel",how:"Tedd a l\xE1bad egy sz\xE9kre, a kezed a f\xF6ldre kicsit el\xE9, a cs\xEDp\u0151d emeld magasra, hogy a t\xF6rzsed majdnem f\xFCgg\u0151leges legyen. Hajl\xEDtsd a k\xF6ny\xF6k\xF6d, \xE9s engedd a fejed a f\xF6ldh\xF6z kicsit a kezed el\xE9, a k\xF6ny\xF6k h\xE1tra megy, nem oldalra. Told vissza magad.",tip:"Min\xE9l f\xFCgg\u0151legesebb a t\xF6rzs, ann\xE1l t\xF6bb s\xFAly ker\xFCl a v\xE1llra. Fesz\xEDtsd meg a farizmod, hogy ne homor\xEDtson a derekad."},k3e:{name:"Gy\xE9m\xE1nt fekv\u0151t\xE1masz emelt l\xE1bbal",muscles:"Tricepsz, bels\u0151 mell, v\xE1ll",tempo:"3 mp le, fel",how:"Tedd a l\xE1bad egy sz\xE9kre, a kezed a mellkasod al\xE1 \xFAgy, hogy a h\xFCvelyk- \xE9s mutat\xF3ujjaid \xF6ssze\xE9rjenek \xE9s gy\xE9m\xE1ntot form\xE1ljanak. A test egyenes a fejt\u0151l a sarkig. Engedd le magad, a k\xF6ny\xF6k h\xE1tra megy a test mellett, a mellkas a k\xE9z fel\xE9. Told vissza magad.",tip:"Ne emeld \xE9s ne engedd le a cs\xEDp\u0151d. Ha f\xE1j a csukl\xF3d vagy a k\xF6ny\xF6k\xF6d, tedd kicsit t\xE1volabb a kezed."},n1q:{name:"1 \xE9s 1/4 guggol\xE1s",muscles:"Combfesz\xEDt\u0151, farizom",tempo:"le, negyedet fel, le, fel",how:"V\xE1llsz\xE9les terpesz, a l\xE1bujjak kicsit kifel\xE9. Menj le teljesen, emelkedj csak negyed \xFAtig, menj \xFAjra teljesen le, \xE9s csak ut\xE1na \xE1llj fel. Ez 1 ism\xE9tl\xE9s. A sarok v\xE9gig a f\xF6ld\xF6n.",tip:"Az izmok k\xE9tszer is a guggol\xE1s legnehezebb, legm\xE9lyebb r\xE9sz\xE9ben dolgoznak, ez\xE9rt nehezebb. Ne zuhanj le, kontroll\xE1ltan ereszkedj."},b5l:{name:"Plank felemelt l\xE1bbal",muscles:"Teljes t\xF6rzs, farizom",how:"Mint a sima plank: alkar a v\xE1ll alatt, a test egyenes a fejt\u0151l a sarkig. Emeld el egyik ny\xFAjtott l\xE1bad kicsit a f\xF6ldt\u0151l, f\xE9lid\u0151ben tedd le \xE9s emeld a m\xE1sikat. A cs\xEDp\u0151d maradjon egyenes, ne ford\xEDtsd el.",tip:"Ne emeld magasra a l\xE1bad, el\xE9g kicsit a f\xF6ld f\xF6l\xE9. A l\xE9nyeg, hogy a cs\xEDp\u0151 ne mozduljon."},sbridge:{name:"Egyl\xE1bas cs\xEDp\u0151emel\xE9s",muscles:"Farizom, combhajl\xEDt\xF3k",tempo:"fel, 2 mp szor\xEDt\xE1s, le",how:"Fek\xFCdj hanyatt, t\xE9rd hajl\xEDtva, talp a f\xF6ld\xF6n. Az egyik l\xE1bad ny\xFAjtsd ki a leveg\u0151be, a combokat tartsd egym\xE1s mellett. Told a f\xF6ld\xF6n l\xE9v\u0151 l\xE1b sark\xE1n kereszt\xFCl, \xE9s emeld a cs\xEDp\u0151d, am\xEDg a tested egyenes vonal nem lesz a t\xE9rdt\u0151l a v\xE1llig. Fent 2 m\xE1sodpercig szor\xEDtsd a farizmot, \xE9s lassan engedd le. El\u0151bb az \xF6sszes ism\xE9tl\xE9s az egyik l\xE1bbal, ut\xE1na a m\xE1sikkal.",tip:"A cs\xEDp\u0151d maradjon v\xEDzszintes, ne essen le a felemelt l\xE1b oldal\xE1n. Egy l\xE1b sz\xE1m\xE1t \xEDrd be: 10 bal + 10 jobb = \xEDrj 10-et."},wallsit:{name:"Faln\xE1l \xFCl\xE9s",muscles:"El\xFCls\u0151 comb",how:"T\xE1maszd a h\xE1tad a falnak, \xE9s cs\xFAssz le, am\xEDg a combod p\xE1rhuzamos a padl\xF3val, a t\xE9rded pedig 90\xB0-ban van. Az eg\xE9sz h\xE1tad a falon, a t\xE9rded a bok\xE1d f\xF6l\xF6tt. Tartsd.",tip:"Ne tedd a kezed a combodra, mert azzal seg\xEDtesz magadnak."},birddog:{name:"Bird dog",muscles:"T\xF6rzs, als\xF3 h\xE1t, farizom",tempo:"ny\xFAjt\xE1s, 2 mp tart\xE1s, vissza",how:"\xC1llj n\xE9gyk\xE9zl\xE1bra: a kezed a v\xE1llad alatt, a t\xE9rded a cs\xEDp\u0151d alatt. Ny\xFAjtsd el\u0151re a jobb karod \xE9s h\xE1tra a bal l\xE1bad egyszerre, a tested egy egyenes vonalban. Tartsd 2 m\xE1sodpercig, gyere vissza, \xE9s cser\xE9lj oldalt.",tip:"A cs\xEDp\u0151d nem fordulhat el. K\xE9pzelj egy poh\xE1r vizet a derekadra."},hollow:{name:"Hollow body hold",muscles:"Teljes t\xF6rzs",how:"Fek\xFCdj a h\xE1tadra, a karod ny\xFAjtva a fejed m\xF6g\xF6tt. Nyomd a derekad a padl\xF3ba, \xE9s emeld a v\xE1llad \xE9s a ny\xFAjtott l\xE1bad kicsit a padl\xF3 f\xF6l\xE9. Tartsd mozdulatlanul.",tip:"Ha a derekad felemelkedik a padl\xF3r\xF3l, emeld magasabbra a l\xE1bad, vagy hajl\xEDtsd be."},legraise:{name:"L\xE1bemel\xE9s",muscles:"Als\xF3 has, cs\xEDp\u0151hajl\xEDt\xF3k",tempo:"2 mp fel, 2 mp le",how:"Fek\xFCdj a h\xE1tadra, a karod a tested mellett. Lassan emeld fel a ny\xFAjtott l\xE1bad f\xFCgg\u0151legesig, \xE9s lassan engedd le majdnem a padl\xF3ig, de ne tedd le. A derekad a padl\xF3n marad.",tip:"Ha f\xE1j a derekad, hajl\xEDtsd be a t\xE9rded."}},warm:{w1:{name:"Kark\xF6rz\xE9s",dose:"15\xD7 el\u0151re, 15\xD7 h\xE1tra",why:"\xC1tmozgatja a v\xE1llad fekv\u0151t\xE1masz \xE9s evez\xE9s el\u0151tt."},w2:{name:"L\xE1blend\x 30 \u0431\u0443\u0434\u0443\u0454\u0442\u044C\u0441\u044F \u0447\u0435\u0440\u0435\u0437 \u0434\u0435\u043D\u044C, \u043C\u0456\u0441\u044F\u0446\u044C \u0437\u0430 \u043C\u0456\u0441\u044F\u0446\u0435\u043C.","\u0425\u0442\u043E \u0432\u043C\u0456\u0454 \u0432\u0456\u0434\u043F\u043E\u0447\u0438\u0432\u0430\u0442\u0438, \u0442\u043E\u0439 \u0432\u0438\u0442\u0440\u0438\u043C\u0430\u0454 \u0434\u043E\u0432\u0448\u0435.","\u0421\u044C\u043E\u0433\u043E\u0434\u043D\u0456 \u0442\u0438 \u0437\u0430\u0440\u044F\u0434\u0436\u0430\u0454\u0448\u0441\u044F \u043D\u0430 \u043D\u0430\u0441\u0442\u0443\u043F\u043D\u0435 \u0442\u0440\u0435\u043D\u0443\u0432\u0430\u043D\u043D\u044F.","\u0420\u0435\u0433\u0443\u043B\u044F\u0440\u043D\u0456\u0441\u0442\u044C \u2014 \u0442\u0432\u043E\u044F \u0441\u0443\u043F\u0435\u0440\u0441\u0438\u043B\u0430. \u0422\u0440\u0438\u043C\u0430\u0439 \u0457\u0457.","\u041F\u0440\u043E\u0433\u0440\u0435\u0441 \u043D\u0435 \u0437\u0430\u0432\u0436\u0434\u0438 \u0432\u0438\u0434\u043D\u043E \u043E\u0434\u0440\u0430\u0437\u0443. \u0410\u043B\u0435 \u0432\u0456\u043D \u0454.","\u041F\u0438\u0448\u0430\u0439\u0441\u044F \u0442\u0438\u043C, \u0449\u043E \u043D\u0435 \u0437\u0434\u0430\u0454\u0448\u0441\u044F.","\u0421\u044C\u043E\u0433\u043E\u0434\u043D\u0456 \u0434\u0435\u043D\u044C \u0432\u0456\u0434\u043D\u043E\u0432\u043B\u0435\u043D\u043D\u044F. \u041D\u0430\u0441\u043E\u043B\u043E\u0434\u0436\u0443\u0439\u0441\u044F \u043D\u0438\u043C.","\u041C\u0430\u043B\u0435\u043D\u044C\u043A\u0456 \u043A\u0440\u043E\u043A\u0438, \u0431\u0430\u0433\u0430\u0442\u043E \u0434\u043D\u0456\u0432 \u043F\u043E\u0441\u043F\u0456\u043B\u044C. \u0422\u0430\u043A \u0441\u0442\u0430\u044E\u0442\u044C\u0441\u044F \u0432\u0435\u043B\u0438\u043A\u0456 \u0437\u043C\u0456\u043D\u0438."],doneTitles:["\u0421\u044C\u043E\u0433\u043E\u0434\u043D\u0456 \u0442\u0440\u0435\u043D\u0443\u0432\u0430\u043D\u043D\u044F \u0432\u0436\u0435 \u0437\u0440\u043E\u0431\u043B\u0435\u043D\u043E","\u041D\u0430 \u0441\u044C\u043E\u0433\u043E\u0434\u043D\u0456 \u0432\u0441\u0435","\u0421\u044C\u043E\u0433\u043E\u0434\u043D\u0456 \u0432\u0456\u0434\u043C\u0456\u0447\u0435\u043D\u043E","\u041C\u0456\u0441\u0456\u044E \u0432\u0438\u043A\u043E\u043D\u0430\u043D\u043E!"],doneSubs:["\u0414\u0435\u043D\u044C {day} \u043F\u043E\u0437\u0430\u0434\u0443. \u0422\u0435\u043F\u0435\u0440 \u043F\u043E\u0457\u0436 \u0456 \u0432\u0438\u0441\u043F\u0438\u0441\u044C \u2014 \u043C'\u044F\u0437\u0438 \u0440\u043E\u0441\u0442\u0443\u0442\u044C, \u043F\u043E\u043A\u0438 \u0442\u0438 \u0432\u0456\u0434\u043F\u043E\u0447\u0438\u0432\u0430\u0454\u0448.","\u0414\u0435\u043D\u044C {day} \u043F\u043E\u0437\u0430\u0434\u0443. \u0413\u0430\u0440\u043D\u0430 \u0440\u043E\u0431\u043E\u0442\u0430, \u0442\u0435\u043F\u0435\u0440 \u0432\u0456\u0434\u043F\u043E\u0447\u0438\u043D\u044C.","\u0414\u0435\u043D\u044C {day} \u0432\u0438\u043A\u043E\u043D\u0430\u043D\u043E. \u0429\u0435 \u043E\u0434\u043D\u0430 \u0446\u0435\u0433\u043B\u0438\u043D\u0430 \u0432 \u0441\u0442\u0456\u043D\u0456.","\u0414\u0435\u043D\u044C {day} \u0437\u0430\u043F\u0438\u0441\u0430\u043D\u043E. \u041D\u0430\u0441\u0442\u0443\u043F\u043D\u0435 \u0442\u0440\u0435\u043D\u0443\u0432\u0430\u043D\u043D\u044F \u0447\u0435\u0440\u0435\u0437 \u0434\u0432\u0430 \u0434\u043D\u0456.","\u0414\u0435\u043D\u044C {day} \u0437\u0440\u043E\u0431\u043B\u0435\u043D\u043E. \u0422\u0435\u043F\u0435\u0440 \u043F\u0440\u0430\u0446\u044E\u0454 \u0442\u0432\u043E\u0454 \u0442\u0456\u043B\u043E, \u0430 \u0442\u0438 \u043D\u0430\u0441\u043E\u043B\u043E\u0434\u0436\u0443\u0439\u0441\u044F \u0440\u0435\u0448\u0442\u043E\u044E \u0434\u043D\u044F.","\u0414\u0435\u043D\u044C {day} \u043F\u043E\u0434\u043E\u043B\u0430\u043D\u043E. \u0422\u0430\u043A \u0431\u0443\u0434\u0443\u0454\u0442\u044C\u0441\u044F \u0434\u0438\u0441\u0446\u0438\u043F\u043B\u0456\u043D\u0430."],facts:["\u0422\u0440\u0435\u043D\u0443\u0432\u0430\u0442\u0438\u0441\u044F \u043C\u043E\u0436\u043  geht und welche du machen kannst.",exTitle:"\xDCbungen",exIntro:"Tippe auf eine \xDCbung, um zu sehen, wie sie geht. Schalte die aus, die du nicht machen kannst (keine T\xFCr, kein Stuhl, Schmerzen\u2026). Die App nimmt dann eine andere \xDCbung derselben Art, sodass jedes Training weiter Dr\xFCcken, Ziehen, Beine und Rumpf hat.",grpOn:"{on} von {n} an",grpLast:"Nur noch eine \xFCbrig, also ist sie in jedem Training dabei.",grpLastLock:"Das ist die letzte \xDCbung dieser Art, deshalb muss sie an bleiben. Sonst w\xFCrdest du diese Muskeln gar nicht trainieren.",exAlt:"Alternative",exInfo:"tippen f\xFCr Infos",exReplacedBy:"Aus. Tag {d} nimmt stattdessen: {name}.",exCanDo:"Kann ich machen: {name}",resetAll:"\u{1F9F9} Ganz von vorn anfangen",resetAllD:"L\xF6scht Trainings, XP, Level, Serie, R\xE4nge und Abzeichen. Name, Foto und Einstellungen bleiben.",resetAllTitle:"Von vorn anfangen?",resetAllBody:"Damit werden alle deine Trainings ({count}) gel\xF6scht und alles, was daraus folgt: XP, Level, die Serie, Freezes, R\xE4nge und Abzeichen. Name, Foto und Einstellungen bleiben. Das l\xE4sst sich nicht r\xFCckg\xE4ngig machen, also speichere zuerst ein Backup, falls du die Daten noch brauchen k\xF6nntest.",resetAllBackup:"\u{1F4BE} Zuerst Backup speichern",resetAllYes:"Ja, alles l\xF6schen",msgResetAll:"\u2713 Erledigt. Du f\xE4ngst bei null an."},pl:{workouts:{one:"{n} Training",other:"{n} Trainings"},days:{one:"{n} Tag",other:"{n} Tage"},daysAgo:{one:"vor {n} Tag",other:"vor {n} Tagen"},rounds:{one:"{n} Runde",other:"{n} Runden"},sets:{one:"{n} Satz",other:"{n} S\xE4tze"},prs:{one:"{n} pers\xF6nlicher Rekord",other:"{n} pers\xF6nliche Rekorde"}},units:{arm:"/Arm",leg:"/Bein",side:"/Seite"},perUnit:{arm:"pro Arm",leg:"pro Bein",side:"pro Seite"},themes:{navy:"Marine",black:"Schwarz",forest:"Wald",plum:"Pflaume",ocean:"Ozean",wine:"Wein",slate:"Schiefer",coffee:"Kaffee"},ranks:["Holz","Eisen","Bronze","Silber","Gold","Platin","Diamant"],ex:{k1:{name:"Liegest\xFCtz",muscles:"Brust, Trizeps, vordere Schultern",tempo:"3 s runter, kurze Pause, hoch",how:"H\xE4nde etwas weiter als schulterbreit, K\xF6rper gerade von Kopf bis Ferse, Bauch und Po angespannt. Senk dich 3 Sekunden lang ab, bis deine Brust fast den Boden ber\xFChrt, halte kurz und dr\xFCck dich wieder hoch. Ellbogen im ~45\xB0-Winkel zum K\xF6rper, nicht nach au\xDFen abspreizen.",tip:"Sobald du in der ersten Runde 25+ schaffst, stell die H\xE4nde auf zwei dicke B\xFCcher. Deine Brust geht tiefer, der Muskel wird st\xE4rker gedehnt und w\xE4chst mehr.",lvl:"Stell die H\xE4nde auf zwei dicke B\xFCcher, damit deine Brust tiefer geht. Deine Zahlen sinken erst mal, das ist okay."},row1:{name:"T\xFCrrahmen-Rudern",muscles:"R\xFCcken (Latissimus), hintere Schultern, Bizeps",tempo:"1 s ziehen, 1 s halten, 3 s zur\xFCck",how:"Stell dich seitlich in eine offene T\xFCr. Greif den Rahmen mit einer Hand auf Brusth\xF6he, F\xFC\xDFe direkt am Rahmen. Lehn dich mit gestrecktem Arm und geradem K\xF6rper zur\xFCck. Zieh dich zum Rahmen: Ellbogen nah am K\xF6rper nach hinten, Schulterblatt nach hinten ziehen. Langsam zur\xFCck. Alle Wiederholungen mit einem Arm, dann mit dem anderen.",tip:"Je n\xE4her deine F\xFC\xDFe am Rahmen sind und je weiter du dich zur\xFCcklehnst, desto schwerer wird's. Halt dich am festen Rahmen fest, nicht an der T\xFCr, und trainier barfu\xDF, damit deine F\xFC\xDFe nicht wegrutschen.",lvl:"Stell die F\xFC\xDFe n\xE4her an den Rahmen und lehn dich weiter zur\xFCck."},n1:{name:"ATG-Kniebeuge",muscles:"Oberschenkelvorderseite, Po",tempo:"3 s runter, 1 s Pause unten, hoch",how:"F\xFC\xDFe schulterbreit, Zehen leicht nach au\xDFen. Geh 3 Sekunden lang so tief runter, wie du kannst, Oberschenkel unter Knieh\xF6he, Fersen am Boden. Halte unten 1 Sekunde und steh auf.",tip:"Langsames Tempo und die Pause unten machen aus einer leichten Kniebeuge eine schwere. Wenn du 20+ auch mit Tempo schaffst, tausch sie gegen die 1\xBC-Kniebeuge.",lvl:"Tausch sie gegen die 1\xBC-Kniebeuge (\u21C4 Tauschen)."},b5:{name:"Unterarmst\xFCtz",muscles:"Gesamter Rumpf",how:"Unterarme unter den Schultern, K\xF6rper gerade von Kopf bis Ferse. Spann Bauch und Po an, als w\xFCrde dir gleich jemand in den Bauch boxen. H\xFCfte weder hochschieben noch durchh\xE4ngen lassen.",tip:"Wenn du 60 s in beiden Runden h\xE4ltst, tausch ihn gegen den Einbeinigen Plank. Das ist viel schwerer.",lvl:"Tausch ihn gegen den Einbeinigen Plank (\u21C4 Tauschen)."},r1:{name:"Pike Push-up",muscles:"Schultern, Trizeps",tempo:"3 s runter, hoch",how:"Geh in ein umgedrehtes V: H\xE4nde am Boden, H\xFCfte hoch, Beine so gestreckt wie m\xF6glich. Beug die Ellbogen und senk deinen Scheitel knapp vor den H\xE4nden zum Boden, sodass H\xE4nde und Kopf ein Dreieck bilden. Dr\xFCck dich wieder hoch.",tip:"Wenn du 15+ in beiden Runden schaffst, tausch sie gegen den Pike-Liegest\xFCtz mit F\xFC\xDFen auf dem Stuhl. Mehr deines Gewichts geht auf die Schultern.",lvl:"Tausch sie gegen den Pike-Liegest\xFCtz mit F\xFC\xDFen auf dem Stuhl (\u21C4 Tauschen)."},row2:{name:"T\xFCr-Rudern mit Handtuch",muscles:"Mittlerer R\xFCcken, Schulterbl\xE4tter, Bizeps",tempo:"1 s ziehen, 1 s halten, 3 s zur\xFCck",how:"\xD6ffne die T\xFCr und stell dich frontal vor ihre Kante, die T\xFCr zwischen deinen F\xFC\xDFen. Leg ein Handtuch um beide Klinken und halt die Enden fest, oder greif direkt beide Klinken. Lehn dich mit gestreckten Armen und geradem K\xF6rper zur\xFCck. Zieh die Brust zur T\xFCrkante, dr\xFCck die Schulterbl\xE4tter zusammen und geh langsam zur\xFCck.",tip:"Check zuerst, ob die Klinken fest sind und sich nicht bewegen. Wenn sich irgendwas bewegt, mach stattdessen T\xFCrrahmen-Rudern (Tag A). Sicherheit geht vor.",lvl:"Stell die F\xFC\xDFe n\xE4her an die T\xFCr und lehn dich weiter zur\xFCck."},n2:{name:"Bulgarische Kniebeuge",muscles:"Oberschenkelvorderseite, Po",tempo:"3 s runter, hoch",how:"Stell dich vor einen Stuhl und leg den Spann deines hinteren Fu\xDFes auf die Sitzfl\xE4che. Mach mit dem vorderen Fu\xDF einen gro\xDFen Schritt nach vorn. Senk dich 3 Sekunden lang ab, das hintere Knie geht Richtung Boden. Dr\xFCck dich \xFCber die Ferse des vorderen Fu\xDFes hoch.",tip:"Stell den vorderen Fu\xDF so weit nach vorn, dass dein Knie \xFCber dem Fu\xDF bleibt. Oberk\xF6rper leicht nach vorn geneigt = mehr Po.",lvl:"Langsamer: 4 s runter und 2 s Pause unten."},b2:{name:"Dead Bug",muscles:"Tiefe Bauchmuskulatur",tempo:"langsam, 2 s raus, 2 s zur\xFCck",how:"Leg dich auf den R\xFCcken, Arme gestreckt zur Decke, Beine angehoben mit Knien im 90\xB0-Winkel. Senk langsam den rechten Arm hinter den Kopf und das linke Bein Richtung Boden, dann zur\xFCck und Seite wechseln.",tip:"Dein unterer R\xFCcken muss die ganze Zeit fest am Boden bleiben. Wenn er abhebt, senk das Bein nicht so weit ab.",lvl:"Arm und Bein langsamer absenken, 3 s raus und 3 s zur\xFCck."},k3:{name:"Diamant-Liegest\xFCtz",muscles:"Trizeps, innere Brust",tempo:"3 s runter, hoch",how:"Setz die H\xE4nde unter deine Brust, sodass sich Daumen und Zeigefinger ber\xFChren und eine Raute bilden. Senk dich ab, die Ellbogen gehen nah am K\xF6rper nach hinten. Deine Brust geht Richtung H\xE4nde.",tip:"Wenn Handgelenke oder Ellbogen schmerzen, setz die H\xE4nde etwas auseinander. Ein enger Liegest\xFCtz belastet den Trizeps fast genauso. Die schwerere Variante ist der Diamant-Liegest\xFCtz mit F\xFC\xDFen auf dem Stuhl, du kannst dagegen tauschen.",lvl:"Tausch sie gegen den Diamant-Liegest\xFCtz mit F\xFC\xDFen auf dem Stuhl (\u21C4 Tauschen)."},row3:{name:"Breites T\xFCrrahmen-Rudern",muscles:"Hintere Schultern, oberer R\xFCcken",tempo:"1 s ziehen, 1 s halten, 3 s zur\xFCck",how:"Gleiche Position wie beim T\xFCrrahmen-Rudern, aber greif den Rahmen auf Schulterh\xF6he und zieh den Ellbogen seitlich nach au\xDFen, nicht am K\xF6rper entlang. Arm und Oberk\xF6rper bilden ein T. Du solltest es hinten an der Schulter und zwischen den Schulterbl\xE4ttern sp\xFCren.",tip:"Dieser Winkel trainiert hintere Schultern und oberen R\xFCcken. Sie lassen deine Schultern von hinten breiter und kr\xE4ftiger wirken.",lvl:"Stell die F\xFC\xDFe n\xE4her an den Rahmen und lehn dich weiter zur\xFCck."},n7:{name:"Beinbeuger mit Handtuch",muscles:"Oberschenkelr\xFCckseite, Po",tempo:"3 s raus, 1 s zur\xFCck",how:"Leg dich auf einem glatten Boden (Holz, Fliesen) auf den R\xFCcken, Fersen auf einem Handtuch oder in Socken. Heb die H\xFCfte in eine Br\xFCcke. Schieb die Beine 3 Sekunden lang nach vorn, bis sie fast gestreckt sind, H\xFCfte bleibt oben. Dann zieh die Fersen zur\xFCck zum Po.",tip:"Auf Teppich oder es rutscht nicht? Tausch sie gegen eine normale Glute Bridge.",lvl:"Mach's mit einem Bein, das andere bleibt in der Luft."},b4:{name:"Bicycle Crunch",muscles:"Seitliche Bauchmuskeln, gesamter Bauch",tempo:"langsam, 1 s pro Seite",how:"Leg dich auf den R\xFCcken, H\xE4nde hinter dem Kopf, Schultern vom Boden abgehoben. F\xFChr den rechten Ellbogen zum linken Knie und streck dabei das rechte Bein. Dann wechseln. Dein Oberk\xF6rper dreht sich mit, nicht nur die Ellbogen.",tip:"Mach langsam. Schnelles Ellbogen-Flattern bringt nichts au\xDFer einem verspannten Nacken.",lvl:"Langsamer: 2 s pro Seite."},kKnee:{name:"Knie-Liegest\xFCtz",muscles:"Brust, Trizeps, vordere Schultern",tempo:"3 s runter, hoch",how:"Geh auf die Knie, H\xE4nde etwas weiter als schulterbreit. K\xF6rper gerade von Knien bis Kopf, Po nicht rausstrecken. Senk die Brust 3 Sekunden lang zum Boden und dr\xFCck dich wieder hoch.",tip:"Sobald du in beiden Runden 20 schaffst, geh zur\xFCck zum normalen Liegest\xFCtz."},kIncl:{name:"Incline-Liegest\xFCtz",muscles:"Brust, Trizeps, vordere Schultern",tempo:"3 s runter, hoch",how:"St\xFCtz die H\xE4nde auf einen stabilen Tisch, ein Bett oder eine Fensterbank. K\xF6rper gerade von Ferse bis Kopf. Senk die Brust zur Kante und dr\xFCck dich zur\xFCck. Je niedriger die Auflage, desto schwerer.",tip:"Guter Ersatz, wenn dir am Boden die Handgelenke wehtun oder die Kraft ausgeht."},superman:{name:"Superman",muscles:"Unterer R\xFCcken, Po, hintere Schultern",tempo:"hoch, 2 s halten, runter",how:"Leg dich auf den Bauch, Arme nach vorn gestreckt. Heb Arme, Brust und Beine gleichzeitig vom Boden, halte 2 Sekunden und senk sie langsam ab. Blick zum Boden, Kopf nicht in den Nacken legen.",tip:"Es ist keine Zug\xFCbung wie Rudern, aber es st\xE4rkt deinen R\xFCcken, wenn du nirgends rudern kannst."},ytw:{name:"Y-T-W am Boden",muscles:"Mittlerer und oberer R\xFCcken, hintere Schultern",tempo:"jede Position 1 s halten",how:"Leg dich auf den Bauch, Stirn auf einem Handtuch. Heb die gestreckten Arme zu einem Y und halte 1 s. Dann seitlich zu einem T. Zum Schluss zieh die Ellbogen zu den Rippen zu einem W und dr\xFCck die Schulterbl\xE4tter zusammen. Y + T + W = 1 Wiederholung.",tip:"Daumen zeigen nach oben, Schultern weg von den Ohren."},lunge:{name:"Ausfallschritt r\xFCckw\xE4rts",muscles:"Oberschenkelvorderseite, Po",tempo:"2 s runter, hoch",how:"Steh aufrecht. Mach einen gro\xDFen Schritt nach hinten, das hintere Knie geht fast bis zum Boden, das vordere Knie beugt sich auf 90\xB0. Dr\xFCck dich \xFCber die Ferse des vorderen Fu\xDFes zur\xFCck in den Stand. Alle Wiederholungen mit einem Bein, dann mit dem anderen.",tip:"Schonender f\xFCr die Knie als ein Ausfallschritt nach vorn. Oberk\xF6rper aufrecht halten."},bridge:{name:"Glute Bridge",muscles:"Po, Oberschenkelr\xFCckseite",tempo:"hoch, 2 s anspannen, runter",how:"Leg dich auf den R\xFCcken, Knie angewinkelt, F\xFC\xDFe am Boden. Dr\xFCck dich \xFCber die Fersen hoch und heb die H\xFCfte, bis dein K\xF6rper von Knien bis Schultern eine gerade Linie bildet. Spann oben 2 Sekunden den Po an und senk dich langsam ab.",tip:"Die schwerere Variante ist die Einbeinige Glute Bridge. Wenn dir diese leicht f\xE4llt, tausch sie dagegen."},r1e:{name:"Pike-Liegest\xFCtz mit F\xFC\xDFen auf dem Stuhl",muscles:"Schultern, Trizeps",tempo:"3 s runter, hoch",how:"Leg die F\xFC\xDFe auf einen Stuhl, die H\xE4nde etwas davor auf den Boden, und schieb die H\xFCfte hoch, sodass der Oberk\xF6rper fast senkrecht ist. Beug die Ellbogen und senk den Kopf knapp vor den H\xE4nden zum Boden, die Ellbogen gehen nach hinten, nicht zur Seite. Dr\xFCck dich wieder hoch.",tip:"Je senkrechter der Oberk\xF6rper, desto mehr Gewicht geht auf die Schultern. Spann den Po an, damit du kein Hohlkreuz machst."},k3e:{name:"Diamant-Liegest\xFCtz mit F\xFC\xDFen auf dem Stuhl",muscles:"Trizeps, innere Brust, Schultern",tempo:"3 s runter, hoch",how:"Leg die F\xFC\xDFe auf einen Stuhl und die H\xE4nde so unter die Brust, dass sich Daumen und Zeigefinger ber\xFChren und einen Diamanten bilden. K\xF6rper gerade von Kopf bis Ferse. Senk dich ab, die Ellbogen gehen nah am K\xF6rper nach hinten, die Brust zu den H\xE4nden. Dr\xFCck dich wieder hoch.",tip:"H\xFCfte weder hochschieben noch durchh\xE4ngen lassen. Wenn Handgelenke oder Ellbogen schmerzen, setz die H\xE4nde etwas auseinander."},n1q:{name:"1\xBC-Kniebeuge",muscles:"Oberschenkelvorderseite, Po",tempo:"runter, ein Viertel hoch, runter, hoch",how:"F\xFC\xDFe schulterbreit, Zehen leicht nach au\xDFen. Geh ganz runter, komm nur ein Viertel hoch, geh wieder ganz runter und steh erst dann auf. Das ist 1 Wiederholung. Fersen bleiben am Boden.",tip:"Die Muskeln arbeiten zweimal im schwersten, tiefsten Teil der Kniebeuge, deshalb ist sie schwerer. Nicht runterfallen lassen, kontrolliert absenken."},b5l:{name:"Einbeiniger Plank",muscles:"Ganzer Rumpf, Po",how:"Wie ein normaler Plank: Unterarme unter den Schultern, K\xF6rper gerade von Kopf bis Ferse. Heb ein gestrecktes Bein etwas vom Boden, nach der H\xE4lfte der Zeit leg es ab und heb das andere. H\xFCfte gerade halten, nicht verdrehen.",tip:"Heb das Bein nicht hoch, knapp \xFCber dem Boden reicht. Es geht darum, dass die H\xFCfte ruhig bleibt."},sbridge:{name:"Einbeinige Glute Bridge",muscles:"Po, Oberschenkelr\xFCckseite",tempo:"hoch, 2 s anspannen, runter",how:"Leg dich auf den R\xFCcken, Knie angewinkelt, F\xFC\xDFe am Boden. Streck ein Bein in die Luft und halte die Oberschenkel nebeneinander. Dr\xFCck \xFCber die Ferse des Standbeins und heb die H\xFCfte, bis dein K\xF6rper vom Knie bis zu den Schultern eine gerade Linie bildet. Oben 2 Sekunden den Po anspannen und langsam absenken. Erst alle Wiederholungen mit einem Bein, dann mit dem anderen.",tip:"Halte die H\xFCfte gerade, lass sie nicht zur Seite des gehobenen Beins absinken. Trag die Zahl f\xFCr ein Bein ein: 10 links + 10 rechts = 10 eintragen."},wallsit:{name:"Wall Sit",muscles:"Oberschenkelvorderseite",how:"Lehn dich mit dem R\xFCcken an eine Wand und rutsch runter, bis deine Oberschenkel parallel zum Boden sind und die Knie im 90\xB0-Winkel. Ganzer R\xFCcken an der Wand, Knie \xFCber den Kn\xF6cheln. Halten.",tip:"Leg die H\xE4nde nicht auf die Oberschenkel, sonst hilfst du nach."},birddog:{name:"Bird Dog",muscles:"Rumpf, unterer R\xFCcken, Po",tempo:"strecken, 2 s halten, zur\xFCck",how:"Geh in den Vierf\xFC\xDFlerstand: H\xE4nde unter den Schultern, Knie unter der H\xFCfte. Streck gleichzeitig den rechten Arm nach vorn und das linke Bein nach hinten, K\xF6rper in einer geraden Linie. Halte 2 Sekunden, geh zur\xFCck und wechsel die Seite.",tip:"Deine H\xFCfte darf sich nicht verdrehen. Stell dir ein Glas Wasser auf deinem unteren R\xFCcken vor."},hollow:{name:"Hollow Body Hold",muscles:"Gesamter Rumpf",how:"Leg dich auf den R\xFCcken, Arme hinter dem Kopf gestreckt. Dr\xFCck den unteren R\xFCcken in den Boden und heb Schultern und gestreckte Beine ein St\xFCck vom Boden ab. Halte, ohne dich zu bewegen.",tip:"Wenn dein unterer R\xFCcken vom Boden abhebt, nimm die Beine h\xF6her oder winkel sie an."},legraise:{name:"Beinheben",muscles:"Unterer Bauch, H\xFCftbeuger",tempo:"2 s hoch, 2 s runter",how:"Leg dich auf den R\xFCcken, Arme neben dem K\xF6rper. Heb die gestreckten Beine langsam, bis sie senkrecht sind, und senk sie langsam fast bis zum Boden, aber leg sie nicht ab. Dein unterer R\xFCcken bleibt am Boden.",tip:"Wenn dir der untere R\xFCcken wehtut, winkel die Knie an."}},warm:{w1:{name:"Armkreisen",dose:"15\xD7 vorw\xE4rts, 15\xD7 r\xFCckw\xE4rts",why:"Lockert deine Schultern vor Liegest\xFCtzen und Rudern."},w2:{name:"Beinpendeln",dose:"10\xD7 pro Bein, an der Wand festhalten",why:"Lockert deine H\xFCfte vor Kniebeugen."},w3:{name:"World's Greatest Stretch",dose:"5\xD7 pro Seite",why:"H\xFCfte, oberer R\xFCcken und Oberschenkelr\xFCckseite auf einmal."},w4:{name:"Inchworm",dose:"5\xD7",why:"W\xE4rmt den ganzen K\xF6rper auf und bringt dich in den Liegest\xFCtz."}},cool:{c1:{name:"H\xFCftbeuger, links",why:"Viel Sitzen (Schule, Computer) verk\xFCrzt die Vorderseite deiner H\xFCfte. Wenn du nur eine Dehnung machst, dann diese.",how:"Knie dich auf das linke Knie, rechter Fu\xDF vorne. Spann den Po an und schieb die H\xFCfte nach vorn, bis du eine Dehnung vorne an der linken H\xFCfte sp\xFCrst. Kein Hohlkreuz machen."},c2:{name:"H\xFCftbeuger, rechts",why:"Das Gleiche auf der anderen Seite.",how:"Knie dich auf das rechte Knie, linker Fu\xDF vorne. Spann den Po an und schieb die H\xFCfte nach vorn."},c4:{name:"Kobra",why:"Dehnt den Bauch und die Vorderseite der H\xFCfte. Ein Gegengewicht zu all dem Einrollen bei den Bauch\xFCbungen.",how:"Leg dich auf den Bauch, Handfl\xE4chen unter die Schultern, Ellbogen nah am K\xF6rper. Lass die H\xFCfte am Boden und dr\xFCck dich langsam mit den Armen hoch, bis du eine angenehme Dehnung im Bauch sp\xFCrst. Schultern weg von den Ohren, die Ellbogen m\xFCssen nicht ganz gestreckt sein. Wenn es im unteren R\xFCcken zwickt, geh tiefer."},c3:{name:"Kindhaltung",why:"Beruhigt deine Atmung und entspannt den R\xFCcken. Einfach nur zum Wohlf\xFChlen.",how:"Knie auseinander, setz die H\xFCfte zur\xFCck auf die Fersen, streck die Arme so weit wie m\xF6glich nach vorn, Stirn auf den Boden. Atme langsam."}},fig:{k1:["Oben","Unten, Ellbogen ~45\xB0 vom K\xF6rper"],k3:["Oben","Unten, Ellbogen eng"],b5:["Richtig: K\xF6rper gerade","Falsch: Hohlkreuz"],n1:["Start","Unten, Fersen am Boden"],r1:["Oben","Unten, Kopf vor den H\xE4nden"],row1:["Start, Arm gestreckt","Ziehen, Ellbogen nach hinten"],row3:["Start, Hand auf Schulterh\xF6he","Ellbogen zur Seite, ~90\xB0 vom K\xF6rper"],row2:["Start, Arme gestreckt","Brust zur T\xFCr"],n2:["Oben","Unten, hinteres Knie zum Boden"],b2:["Start","Arm und Gegenbein runter"],n7:["H\xFCfte hoch, Fersen am Po","Beine raus, H\xFCfte bleibt oben"],b4:["Ellbogen zum Gegenknie","Seite wechseln"],kKnee:["Oben, Knie am Boden","Unten, Ellbogen ~45\xB0 vom K\xF6rper"],kIncl:["H\xE4nde auf dem Tisch, oben","Brust zur Kante, Ellbogen ~45\xB0 vom K\xF6rper"],superman:["Auf dem Bauch liegen","Heben, 2 s halten"],ytw:["Y: Arme schr\xE4g nach vorn","T: Arme zur Seite","W: Ellbogen zu den Rippen"],lunge:["Start","Schritt zur\xFCck, Knie zum Boden"],bridge:["Liegen, Knie angewinkelt","H\xFCfte hoch, Po anspannen"],sbridge:["Liegen, ein Bein oben","H\xFCfte hoch, Po anspannen"],r1e:["Oben, F\xFC\xDFe auf dem Stuhl","Unten, Kopf vor den H\xE4nden"],k3e:["Oben, F\xFC\xDFe auf dem Stuhl","Unten, Ellbogen am K\xF6rper"],n1q:["Ganz runter","Ein Viertel hoch","Wieder ganz runter","Erst dann hoch"],b5l:["Ein Bein oben","Nach der H\xE4lfte Beine wechseln"],wallsit:["Knie ~90\xB0, R\xFCcken an der Wand"],birddog:["Vierf\xFC\xDFlerstand: Arme und Knie ~90\xB0","Arm und Gegenbein"],hollow:["Unterer R\xFCcken fest am Boden"],legraise:["Beine oben","Langsam runter, nicht auf den Boden ablegen"],hf:["Hinteres Knie unten, H\xFCfte vor"],cobra:["H\xFCfte am Boden, Brust hoch"],child:["H\xFCfte zu den Fersen, Arme weit vor"]},ch:{w3:"3 Trainings machen",pr1:"Einen pers\xF6nlichen Rekord brechen",r3:"Einmal 3 Runden machen",warm:"2\xD7 komplett aufw\xE4rmen",cool:"2\xD7 nach dem Training dehnen",push100:"100 Liegest\xFCtze insgesamt (alle Arten)",rank:"Einen neuen Rang erreichen",reps300:"300 Wiederholungen insgesamt",legs100:"100 Bein-Wiederholungen"},ach:{first:["Erster Schritt","1. Training"],w5:["High Five","5 Trainings"],w10:["Perfekte Zehn","10 Trainings"],w25:["Vierteljahrhundert","25 Trainings"],w50:["Halbes Jahrhundert","50 Trainings"],s3:["L\xE4uft bei dir","Serie von 3"],s7:["Unaufhaltsam","Serie von 7"],s15:["Disziplin","Serie von 15"],pr:["Rekordbrecher","1. pers\xF6nlicher Rekord"],gold:["Goldwert","Gold in 1 \xDCbung"],diamond:["Diamant","Diamant in 1 \xDCbung"],week:["Perfekte Woche","Alle 3 Challenges"],lvl5:["Level 5","Erreiche Level 5"],r3:["Drei Runden","Mach 3 Runden"],push30:["Drei\xDFig","30 Liegest\xFCtze in einem Satz"]},quotes:["Disziplin bringt dich dahin, wo Motivation nicht hinkommt.","Du musst keine Lust haben. Mach einfach den ersten Satz, der Rest kommt von allein.","Jede Wiederholung ist ein Ziegelstein. Ein K\xF6rper wird Stein f\xFCr Stein gebaut.","Heute 13 Minuten. Ein K\xF6rper f\xFCrs Leben.","Setz nie zweimal hintereinander aus.","Kleine Schritte jeden zweiten Tag schlagen gro\xDFe Pl\xE4ne, die du nie anf\xE4ngst.","Dein zuk\xFCnftiges Ich wird dir f\xFCr heute danken.","Es geht nicht ums perfekte Training. Es geht ums Dranbleiben.","Wo es anf\xE4ngt zu brennen, beginnt das Wachstum.","Vergleich dich nur mit dem, der du letzte Woche warst.","W\xE4hrend andere noch Motivation suchen, hast du schon trainiert.","Harte S\xE4tze, leichteres Leben.","Jeder starke Mensch hat mal bei null angefangen."],restDay:["Muskeln werden im Training aufgebaut, aber sie wachsen durch Essen und Schlaf.","Heute ist Ruhetag. Auch der geh\xF6rt zum Plan.","Ausruhen ist nicht faul. Genau jetzt w\xE4chst du.","Die Arbeit ist getan. Jetzt lass deinen K\xF6rper aufbauen.","Gut essen, gut schlafen. Auch das ist Training.","St\xE4rke entsteht nicht an einem Tag. Sie entsteht jeden zweiten Tag, Monat f\xFCr Monat.","Wer sich ausruhen kann, h\xE4lt l\xE4nger durch.","Heute l\xE4dst du die Akkus f\xFCr dein n\xE4chstes Training.","Regelm\xE4\xDFigkeit ist deine Superkraft. Bleib dran.","Fortschritt sieht man nicht immer sofort. Aber er passiert.","Sei stolz darauf, dass du dranbleibst.","Heute geh\xF6rt der Erholung. Genie\xDF ihn.","Kleine Schritte, viele Tage hintereinander. So entstehen gro\xDFe Ver\xE4nderungen."],doneTitles:["Du hast heute schon trainiert","F\xFCr heute erledigt","Heute abgehakt","Mission erf\xFCllt!"],doneSubs:["Tag {day} ist erledigt. Jetzt essen und schlafen, deine Muskeln wachsen in der Pause.","Tag {day} liegt hinter dir. Gute Arbeit, jetzt erhol dich.","Tag {day} ist erledigt. Noch ein Stein in der Mauer.","Tag {day} ist eingetragen. Dein n\xE4chstes Training ist in zwei Tagen.","Tag {day} geschafft. Jetzt arbeitet dein K\xF6rper, genie\xDF den Rest des Tages.","Tag {day} gemeistert. So baut man Disziplin auf."],facts:["Du kannst jeden Tag trainieren, aber jeden zweiten Tag ist am besten. Muskeln wachsen in der Pause, nicht beim Training.","Schlaf ist dein bestes Supplement. 7\u20139 Stunden pro Nacht = schnellere Regeneration.","Die letzten Wiederholungen eines Satzes leisten die meiste Arbeit. Genau die bauen Muskeln auf.","Langsames Absenken (3 Sekunden) gibt deinen Muskeln mehr Arbeit als schnelle Wiederholungen.","Protein in jeder Mahlzeit hilft deinen Muskeln beim Wachsen.","Regelm\xE4\xDFigkeit schl\xE4gt Intensit\xE4t. Lieber 13 Minuten jeden zweiten Tag als eine Stunde einmal im Monat.","Trink etwas Wasser. Schon leichter Durst senkt deine Leistung.","Atme langsam: durch die Nase ein, durch den Mund aus. So beruhigst du dich schneller.","Volle Bewegungsamplitude = mehr Muskeln im Einsatz. Weniger Wiederholungen, daf\xFCr vollst\xE4ndige."],moti:["Ich glaub an dich, du schaffst das! \u{1F4AA}","Jeder Satz bringt dich deinem Ziel n\xE4her.","Du bist st\xE4rker, als du denkst.","Nur noch ein bisschen, du packst das.","Heute z\xE4hlt. Gib nicht auf.","Genau jetzt w\xE4chst du.","Dein zuk\xFCnftiges Ich wird dir danken."],cheers:["Starker Satz!","So geht das!","Beast Mode!","Du bist on fire!","Saubere Arbeit!","So baut man einen starken K\xF6rper.","Fast geschafft!"],finish:["Wieder ein Stein in der Mauer. So geht das.","Geschafft. Jetzt gut essen und schlafen, dann wachsen die Muskeln.","St\xE4rke ist kein Talent. Sie ist die Summe aus genau solchen Tagen.","Fertig. Das ist Disziplin in Aktion.","Heute hast du gemacht, was die meisten nur planen."]};var jp={ui:{loading:"Cargando\u2026",close:"Cerrar",cancel:"Cancelar",save:"Guardar",home:"Inicio",back:"Atr\xE1s",start:"Empezar",stop:"Parar",copied:"\u2713 Copiado",dayN:"D\xEDa {d}",tabTrain:"Entrenar",tabHistory:"Historial",tabSettings:"Ajustes",tabProfile:"Perfil",mainMenu:"Men\xFA principal",openProfile:"Abrir perfil",streakAria:"Racha {n}",levelAria:"Nivel {n}",weeklyChallenges:"Retos semanales",chLeft:"{done}/3, {left} por delante",chFooter:"Completa los 3 y ganas un \u{1F9CA} protector de racha.",firstWorkout:"Tu primer entrenamiento. \xA1Vamos!",anytime:"Cuando quieras.",idealOn:"Lo ideal: {date}, porque entrenas en d\xEDas alternos.",trainedYesterday:"Ayer entrenaste el d\xEDa {day}. Seg\xFAn el plan (d\xEDas alternos), el pr\xF3ximo entrenamiento es ma\xF1ana, pero tambi\xE9n puedes entrenar hoy.",streakAtRisk:"Hoy toca entrenar. Si te lo saltas, tu racha de \u{1F525} {n} se acaba ma\xF1ana.",trainingDay:"Hoy toca entrenar. \xDAltimo entrenamiento: {date} ({ago}).",welcomeTitle:"\xA1Hola! \u{1F44B}",welcome1:"Entrenas en casa, sin material, ~13 minutos. Vas rotando los d\xEDas A, B y C y entrenas en d\xEDas alternos. Cada entrenamiento tiene un calentamiento, luego 4 ejercicios en circuito (2 o 3 rondas) y estiramientos opcionales.",welcome2:"Toca un ejercicio para ver un dibujo, instrucciones y un video. Si un ejercicio no te va bien, c\xE1mbialo durante el entrenamiento con el bot\xF3n \u21C4. Pon tu nombre y tu foto en el perfil (arriba a la derecha).",weekLine:"Esta semana: {count}. Meta: 3\u20134 (d\xEDas alternos).",nextWorkout:"Pr\xF3ximo entrenamiento",todayWorkout:"Entrenamiento de hoy",freezeOffer:"\u{1F9CA} \xBFHoy no puedes? Usa un protector ({n})",frozenToday:"\u{1F9CA} Hoy est\xE1
