en position, {n}",coolHold:"tiens, {n} s",hideHowTo:"\u25BE masquer les consignes",showHowTo:"\u25B8 comment faire",video:"\u25B6 Vid\xE9o",saveWorkout:"Enregistrer la s\xE9ance",skipSave:"Passer et enregistrer la s\xE9ance",nothingSaved:"Rien d'enregistr\xE9",nothingSavedD:"Tu n'as termin\xE9 aucune s\xE9rie, donc rien n'a \xE9t\xE9 ajout\xE9 \xE0 ton historique.",great:"Bien jou\xE9 !",dayDate:"Jour {d}, {date}",levelLine:"Niveau {lvl}, {into} / {need} XP. Flamme : {streak} d'affil\xE9e.",levelUp:"\u26A1 Niveau sup\xE9rieur ! Niveau {lvl}",challengeDone:"\u2713 D\xE9fi r\xE9ussi : {text}",nextLine:"Prochaine s\xE9ance : jour {d}, id\xE9alement le {date}",copyAI:"Copier le journal pour l'IA",dayRound:"Jour {d}, tour {r} sur {n}",quit:"Quitter",quitSave:"Quitter et enregistrer ?",quitConfirm:"Vraiment quitter ?",progressAria:"{done} sur {total} faits",videoYT:"\u25B6 Vid\xE9o sur YouTube",ladderTitle:"Rangs (meilleure s\xE9rie : {v})",ladderNone:"Rangs (meilleure s\xE9rie : aucune pour l'instant)",rankStart:"d\xE9part",figureAria:"Dessin : {labels}",photoAlt:"Photo de profil"},pl:{workouts:{one:"{n} s\xE9ance",many:"{n} s\xE9ances",other:"{n} s\xE9ances"},days:{one:"{n} jour",many:"{n} jours",other:"{n} jours"},daysAgo:{one:"il y a {n} jour",many:"il y a {n} jours",other:"il y a {n} jours"},rounds:{one:"{n} tour",many:"{n} tours",other:"{n} tours"},sets:{one:"{n} s\xE9rie",many:"{n} s\xE9ries",other:"{n} s\xE9ries"},prs:{one:"{n} record perso",many:"{n} records perso",other:"{n} records perso"}},units:{arm:"/bras",leg:"/jambe",side:"/c\xF4t\xE9"},perUnit:{arm:"par bras",leg:"par jambe",side:"par c\xF4t\xE9"},themes:{navy:"Marine",black:"Noir",forest:"For\xEAt",plum:"Prune"},ranks:["Bois","Fer","Bronze","Argent","Or","Platine","Diamant"],ex:{k1:{name:"Pompe",muscles:"Pectoraux, triceps, avant des \xE9paules",tempo:"3 s en descente, courte pause, remont\xE9e",how:"Mains un peu plus \xE9cart\xE9es que les \xE9paules, corps align\xE9 de la t\xEAte aux talons, abdos et fessiers contract\xE9s. Descends en 3 secondes jusqu'\xE0 ce que ta poitrine fr\xF4le le sol, marque une courte pause et repousse vers le haut. Garde les coudes \xE0 environ 45\xB0 du corps, pas \xE9cart\xE9s sur les c\xF4t\xE9s.",tip:"D\xE8s que tu fais 25+ au premier tour, pose tes mains sur deux gros livres. Ta poitrine descend plus bas, le muscle s'\xE9tire davantage et se d\xE9veloppe plus.",lvl:"Pose tes mains sur deux gros livres pour que ta poitrine descende plus bas. Tes chiffres vont baisser au d\xE9but, c'est normal."},row1:{name:"Rowing au cadre de porte",muscles:"Dos (grands dorsaux), arri\xE8re des \xE9paules, biceps",tempo:"1 s en tirant, 1 s de maintien, 3 s en revenant",how:"Place-toi dans l'embrasure d'une porte ouverte, de profil par rapport au cadre. Attrape le cadre d'une main \xE0 hauteur de poitrine, pieds tout pr\xE8s du cadre. Penche-toi en arri\xE8re, bras tendu et corps droit. Tire-toi vers le cadre : le coude part en arri\xE8re le long du corps, serre l'omoplate vers l'arri\xE8re. Reviens lentement. Fais toutes les r\xE9p\xE9titions d'un bras, puis de l'autre.",tip:"Plus tes pieds sont proches du cadre et plus tu te penches en arri\xE8re, plus c'est dur. Tiens le cadre solide, pas la porte, et entra\xEEne-toi pieds nus pour ne pas glisser.",lvl:"Rapproche tes pieds du cadre et penche-toi plus en arri\xE8re."},n1:{name:"Squat ATG",muscles:"Quadriceps, fessiers",tempo:"3 s en descente, 1 s de pause en bas, remont\xE9e",how:"Pieds \xE9cart\xE9s \xE0 largeur d'\xE9paules, pointes l\xE9g\xE8rement vers l'ext\xE9rieur. Descends en 3 secondes aussi bas que possible, cuisses sous les genoux, talons au sol. Tiens 1 seconde en bas et remonte.",tip:"Le tempo lent et la pause transforment un squat facile en squat difficile. Si tu en fais 20+ m\xEAme avec le tempo, passe \xE0 la version plus dure.",lvl:"Fais un squat 1\xBC : descends, remonte d'un quart, redescends tout en bas, puis remonte. \xC7a fait 1 r\xE9p\xE9tition."},b5:{name:"Gainage (planche)",muscles:"Toute la sangle abdominale",how:"Avant-bras sous les \xE9paules, corps align\xE9 de la t\xEAte aux talons. Contracte abdos et fessiers comme si quelqu'un allait te donner un coup dans le ventre. Ne laisse pas tes hanches monter ni s'affaisser.",tip:"D\xE8s que tu tiens 60 s aux deux tours, l\xE8ve une jambe pendant le gainage (en alternant). C'est beaucoup plus dur.",lvl:"L\xE8ve une jambe pendant le gainage et change de jambe \xE0 mi-temps."},r1:{name:"Pompe pike",muscles:"\xC9paules, triceps",tempo:"3 s en descente, remont\xE9e",how:"Mets-toi en V invers\xE9 : mains au sol, hanches hautes, jambes aussi tendues que possible. Plie les coudes et descends le sommet de la t\xEAte vers le sol, juste devant tes mains, pour que tes mains et ta t\xEAte forment un triangle. Repousse vers le haut.",tip:"D\xE8s que tu en fais 15+ aux deux tours, pose tes pieds sur une chaise. Une plus grande partie de ton poids passe sur tes \xE9paules.",lvl:"Pose tes pieds sur une chaise."},row2:{name:"Rowing \xE0 la porte avec serviette",muscles:"Milieu du dos, omoplates, biceps",tempo:"1 s en tirant, 1 s de maintien, 3 s en revenant",how:"Ouvre la porte et place-toi face \xE0 sa tranche, la porte entre tes pieds. Passe une serviette autour des deux poign\xE9es et tiens-en les extr\xE9mit\xE9s, ou attrape directement les deux poign\xE9es. Penche-toi en arri\xE8re, bras tendus et corps droit. Tire ta poitrine vers la tranche de la porte, serre les omoplates et redescends lentement.",tip:"V\xE9rifie d'abord que les poign\xE9es sont solides et ne bougent pas. Si quelque chose bouge, fais plut\xF4t le rowing au cadre de porte (jour A). La s\xE9curit\xE9 d'abord.",lvl:"Rapproche tes pieds de la porte et penche-toi plus en arri\xE8re."},n2:{name:"Squat bulgare",muscles:"Quadriceps, fessiers",tempo:"3 s en descente, remont\xE9e",how:"Dos \xE0 une chaise, pose le dessus de ton pied arri\xE8re sur l'assise. Fais un grand pas en avant avec le pied avant. Descends en 3 secondes, le genou arri\xE8re va vers le sol. Remonte en poussant dans le talon du pied avant.",tip:"Place ton pied avant assez loin pour que ton genou reste au-dessus du pied. Buste l\xE9g\xE8rement pench\xE9 en avant = plus de fessiers.",lvl:"Ralentis : 4 s en descente et 2 s de pause en bas."},b2:{name:"Dead bug",muscles:"Abdominaux profonds",tempo:"lentement, 2 s pour tendre, 2 s pour revenir",how:"Allonge-toi sur le dos, bras tendus vers le plafond, jambes lev\xE9es, genoux \xE0 90\xB0. Descends lentement le bras droit derri\xE8re la t\xEAte et la jambe gauche vers le sol, puis reviens et change de c\xF4t\xE9.",tip:"Le bas du dos doit rester plaqu\xE9 au sol tout le temps. S'il se d\xE9colle, descends moins la jambe.",lvl:"Descends le bras et la jambe plus lentement : 3 s pour tendre, 3 s pour revenir."},k3:{name:"Pompe diamant",muscles:"Triceps, int\xE9rieur des pectoraux",tempo:"3 s en descente, remont\xE9e",how:"Place tes mains sous ta poitrine, pouces et index qui se touchent pour former un diamant. Descends, coudes vers l'arri\xE8re le long du corps. Ta poitrine va vers tes mains.",tip:"Si tes poignets ou tes coudes font mal, \xE9carte un peu les mains. Une pompe mains serr\xE9es travaille presque autant les triceps.",lvl:"Pose tes pieds sur une chaise."},row3:{name:"Rowing large au cadre de porte",muscles:"Arri\xE8re des \xE9paules, haut du dos",tempo:"1 s en tirant, 1 s de maintien, 3 s en revenant",how:"M\xEAme position que pour le rowing au cadre de porte, mais attrape le cadre \xE0 hauteur d'\xE9paule et tire le coude sur le c\xF4t\xE9, pas le long du corps. Ton bras et ton buste forment un T. Tu dois le sentir \xE0 l'arri\xE8re de l'\xE9paule et entre les omoplates.",tip:"Cet angle travaille l'arri\xE8re des \xE9paules et le haut du dos. Vu de dos, ce sont eux qui rendent tes \xE9paules plus larges et plus \xE9paisses.",lvl:"Rapproche tes pieds du cadre et penche-toi plus en arri\xE8re."},n7:{name:"Leg curl gliss\xE9 (serviette)",muscles:"Ischio-jambiers, fessiers",tempo:"3 s pour tendre, 1 s pour revenir",how:"Allonge-toi sur le dos sur un sol lisse (parquet, carrelage), talons sur une serviette ou en chaussettes. Monte les hanches en pont. Fais glisser tes jambes vers l'avant en 3 secondes jusqu'\xE0 ce qu'elles soient presque tendues, hanches toujours en l'air. Puis ram\xE8ne tes talons vers tes fessiers.",tip:"\xC7a ne glisse pas sur la moquette. Dans ce cas, fais plut\xF4t un pont sur une jambe : hanches en l'air, une jambe en l'air, et note les r\xE9p\xE9titions par jambe.",lvl:"Fais-le sur une jambe, garde l'autre en l'air."},b4:{name:"Crunch bicyclette",muscles:"Obliques, tous les abdos",tempo:"lentement, 1 s par c\xF4t\xE9",how:"Allonge-toi sur le dos, mains derri\xE8re la t\xEAte, \xE9paules d\xE9coll\xE9es du sol. Am\xE8ne le coude droit vers le genou gauche en tendant la jambe droite. Puis change. C'est le buste qui tourne, pas seulement les coudes.",tip:"Va lentement. Agiter vite les coudes ne sert \xE0 rien, \xE0 part tirer sur ta nuque.",lvl:"Ralentis \xE0 2 s par c\xF4t\xE9."},kKnee:{name:"Pompe sur les genoux",muscles:"Pectoraux, triceps, avant des \xE9paules",tempo:"3 s en descente, remont\xE9e",how:"\xC0 genoux, mains un peu plus \xE9cart\xE9es que les \xE9paules. Garde le corps align\xE9 des genoux \xE0 la t\xEAte, sans sortir les fesses. Descends la poitrine vers le sol en 3 secondes et repousse.",tip:"D\xE8s que tu en fais 20 aux deux tours, reviens \xE0 la pompe classique."},kIncl:{name:"Pompe inclin\xE9e",muscles:"Pectoraux, triceps, avant des \xE9paules",tempo:"3 s en descente, remont\xE9e",how:"Pose tes mains sur une table solide, un lit ou un rebord de fen\xEAtre. Garde le corps align\xE9 des talons \xE0 la t\xEAte. Descends la poitrine vers le bord et repousse. Plus l'appui est bas, plus c'est dur.",tip:"Un bon remplacement quand tes poignets font mal au sol ou que tu commences \xE0 manquer de force."},superman:{name:"Superman",muscles:"Bas du dos, fessiers, arri\xE8re des \xE9paules",tempo:"mont\xE9e, 2 s de maintien, descente",how:"Allonge-toi sur le ventre, bras tendus devant toi. D\xE9colle en m\xEAme temps les bras, la poitrine et les jambes du sol, tiens 2 secondes et redescends lentement. Regarde le sol, ne bascule pas la t\xEAte en arri\xE8re.",tip:"Ce n'est pas un tirage comme le rowing, mais \xE7a renforce ton dos quand tu n'as rien pour faire du rowing."},ytw:{name:"Y-T-W au sol",muscles:"Milieu et haut du dos, arri\xE8re des \xE9paules",tempo:"tiens chaque position 1 s",how:"Allonge-toi sur le ventre, front sur une serviette. L\xE8ve tes bras tendus en Y et tiens 1 s. Puis ouvre-les sur les c\xF4t\xE9s en T. Enfin, ram\xE8ne les coudes vers les c\xF4tes en W et serre les omoplates. Y + T + W = 1 r\xE9p\xE9tition.",tip:"Pouces vers le haut, garde les \xE9paules loin des oreilles."},lunge:{name:"Fente arri\xE8re",muscles:"Quadriceps, fessiers",tempo:"2 s en descente, remont\xE9e",how:"Debout, le buste droit. Fais un grand pas en arri\xE8re : le genou arri\xE8re descend presque au sol et le genou avant se plie \xE0 90\xB0. Pousse dans le talon du pied avant pour revenir debout. Fais toutes les r\xE9p\xE9titions d'une jambe, puis de l'autre.",tip:"Plus douce pour les genoux qu'une fente avant. Garde le buste droit."},bridge:{name:"Pont fessier",muscles:"Fessiers, ischio-jambiers",tempo:"mont\xE9e, 2 s de contraction, descente",how:"Allonge-toi sur le dos, genoux pli\xE9s, pieds au sol. Pousse dans les talons et monte les hanches jusqu'\xE0 ce que ton corps forme une ligne droite des genoux aux \xE9paules. Serre les fessiers 2 secondes en haut et redescends lentement.",tip:"Version plus dure : une jambe en l'air. Note alors les r\xE9p\xE9titions par jambe."},wallsit:{name:"Chaise (wall sit)",muscles:"Quadriceps",how:"Plaque ton dos contre un mur et descends jusqu'\xE0 ce que tes cuisses soient parall\xE8les au sol et tes genoux \xE0 90\xB0. Tout le dos contre le mur, genoux au-dessus des chevilles. Tiens.",tip:"Ne pose pas les mains sur tes cuisses, sinon tu t'aides."},birddog:{name:"Bird dog",muscles:"Sangle abdominale, bas du dos, fessiers",tempo:"tends, 2 s de maintien, reviens",how:"Mets-toi \xE0 quatre pattes : mains sous les \xE9paules, genoux sous les hanches. Tends en m\xEAme temps le bras droit vers l'avant et la jambe gauche vers l'arri\xE8re, corps align\xE9. Tiens 2 secondes, reviens et change de c\xF4t\xE9.",tip:"Tes hanches ne doivent pas tourner. Imagine un verre d'eau pos\xE9 sur le bas de ton dos."},hollow:{name:"Hollow body",muscles:"Toute la sangle abdominale",how:"Allonge-toi sur le dos, bras tendus derri\xE8re la t\xEAte. Plaque le bas du dos au sol et d\xE9colle un peu du sol les \xE9paules et les jambes tendues. Tiens sans bouger.",tip:"Si le bas de ton dos se d\xE9colle, l\xE8ve les jambes plus haut ou plie-les."},legraise:{name:"Relev\xE9 de jambes",muscles:"Bas des abdos, fl\xE9chisseurs de la hanche",tempo:"2 s en mont\xE9e, 2 s en descente",how:"Allonge-toi sur le dos, bras le long du corps. L\xE8ve lentement tes jambes tendues jusqu'\xE0 la verticale, puis redescends-les lentement presque jusqu'au sol, sans les poser. Le bas du dos reste au sol.",tip:"Si le bas du dos te fait mal, plie les genoux."}},warm:{w1:{name:"Moulinets de bras",dose:"15\xD7 vers l'avant, 15\xD7 vers l'arri\xE8re",why:"D\xE9lie tes \xE9paules avant les pompes et les rowings."},w2:{name:"Balanc\xE9s de jambe",dose:"10\xD7 par jambe, en te tenant au mur",why:"D\xE9lie tes hanches avant les squats."},w3:{name:"World's greatest stretch",dose:"5\xD7 par c\xF4t\xE9",why:"Hanches, haut du dos et ischios en m\xEAme temps."},w4:{name:"Chenille (inchworm)",dose:"5\xD7",why:"\xC9chauffe tout ton corps et t'am\xE8ne en position de planche."}},cool:{c1:{name:"Fl\xE9chisseur de hanche, gauche",why:"Rester beaucoup assis (\xE9cole, ordi) raccourcit l'avant des hanches. Si tu ne fais qu'un \xE9tirement, fais celui-l\xE0.",how:"Genou gauche au sol, pied droit devant. Serre les fessiers et avance les hanches jusqu'\xE0 sentir un \xE9tirement \xE0 l'avant de la hanche gauche. Ne creuse pas le bas du dos."},c2:{name:"Fl\xE9chisseur de hanche, droite",why:"Pareil de l'autre c\xF4t\xE9.",how:"Genou droit au sol, pied gauche devant. Serre les fessiers et avance les hanches."},c3:{name:"Posture de l'enfant",why:"Calme ta respiration et d\xE9tend ton dos. Juste pour le bien-\xEAtre.",how:"Genoux \xE9cart\xE9s, assieds tes fesses sur tes talons, tends les bras le plus loin possible devant toi, front au sol. Respire lentement."}},fig:{k1:["En haut","En bas"],k3:["En haut","En bas, coudes serr\xE9s"],b5:["Correct : corps droit","Incorrect : bas du dos qui s'affaisse"],n1:["D\xE9part","En bas, talons au sol"],r1:["En haut","En bas, t\xEAte devant les mains"],row1:["D\xE9part, bras tendu","Tirage, coude en arri\xE8re"],row3:["D\xE9part, main \xE0 hauteur d'\xE9paule","Coude sur le c\xF4t\xE9, en hauteur"],row2:["D\xE9part, bras tendus","Poitrine vers la porte"],n2:["En haut","En bas, genou arri\xE8re vers le sol"],b2:["D\xE9part","Bras et jambe oppos\xE9e vers le bas"],n7:["Hanches en l'air, talons pr\xE8s des fessiers","Jambes gliss\xE9es, hanches toujours en l'air"],b4:["Coude vers le genou oppos\xE9","Change de c\xF4t\xE9"],kKnee:["En haut, genoux au sol","En bas"],kIncl:["Mains sur la table, en haut","Poitrine vers le bord"],superman:["Sur le ventre","D\xE9colle et tiens 2 s"],ytw:["Y : bras en avant et en haut","W : coudes vers les c\xF4tes"],lunge:["D\xE9part","Pas en arri\xE8re, genou vers le sol"],bridge:["Sur le dos, genoux pli\xE9s","Hanches en haut, fessiers serr\xE9s"],wallsit:["Cuisses \xE0 l'horizontale, dos au mur"],birddog:["\xC0 quatre pattes","Bras et jambe oppos\xE9e"],hollow:["Bas du dos plaqu\xE9 au sol"],legraise:["Jambes en l'air","Descends lentement, sans toucher le sol"],hf:["Genou arri\xE8re au sol, hanches en avant"],child:["Fesses sur les talons, bras loin devant"]},ch:{w3:"Fais 3 s\xE9ances",pr1:"Bats un record perso",r3:"Fais 3 tours une fois",warm:"\xC9chauffement complet 2\xD7",cool:"\xC9tirements apr\xE8s une s\xE9ance 2\xD7",push100:"100 pompes au total (tous types)",rank:"Atteins un nouveau rang",reps300:"300 r\xE9p\xE9titions au total",legs100:"100 r\xE9p\xE9titions de jambes"},ach:{first:["Premier pas","1re s\xE9ance"],w5:["Tope l\xE0","5 s\xE9ances"],w10:["Dix sur dix","10 s\xE9ances"],w25:["Quart de si\xE8cle","25 s\xE9ances"],w50:["Demi-si\xE8cle","50 s\xE9ances"],s3:["Sur la lanc\xE9e","Flamme de 3"],s7:["Inarr\xEAtable","Flamme de 7"],s15:["Discipline","Flamme de 15"],pr:["Record battu","1er record perso"],gold:["En or","Or sur 1 exercice"],diamond:["Diamant","Diamant sur 1 exercice"],week:["Semaine parfaite","Les 3 d\xE9fis"],lvl5:["Niveau 5","Atteins le niveau 5"],r3:["Trois tours","Fais 3 tours"],push30:["Trente","30 pompes en une s\xE9rie"]},quotes:["La discipline t'emm\xE8ne l\xE0 o\xF9 la motivation ne peut pas aller.","Pas besoin d'en avoir envie. Fais juste la premi\xE8re s\xE9rie, le reste suit.","Chaque r\xE9p\xE9tition est une brique. Un corps se construit brique par brique.","13 minutes aujourd'hui. Un corps pour la vie.","Ne rate jamais deux fois de suite.","De petits pas un jour sur deux valent mieux que de grands plans jamais commenc\xE9s.","Ton futur toi te remerciera pour aujourd'hui.","Le but n'est pas la s\xE9ance parfaite. Le but, c'est d'\xEAtre l\xE0.","Quand \xE7a commence \xE0 br\xFBler, c'est l\xE0 que tu progresses.","Les muscles se construisent \xE0 l'entra\xEEnement, mais ils grandissent gr\xE2ce \xE0 la nourriture et au sommeil.","Compare-toi seulement \xE0 la personne que tu \xE9tais la semaine derni\xE8re.","Pendant que les autres cherchent la motivation, ta s\xE9ance est d\xE9j\xE0 faite.","S\xE9ries dures, vie plus facile.","Toute personne forte a commenc\xE9 de z\xE9ro."],facts:["Tu peux t'entra\xEEner tous les jours, mais un jour sur deux, c'est l'id\xE9al. Les muscles grandissent pendant le repos, pas pendant l'entra\xEEnement.","Le sommeil est ton meilleur compl\xE9ment. 7\u20139 heures par nuit = r\xE9cup\xE9ration plus rapide.","Les derni\xE8res r\xE9p\xE9titions d'une s\xE9rie font le plus de travail. Ce sont elles qui construisent le muscle.","Une descente lente (3 secondes) donne plus de travail \xE0 tes muscles que des r\xE9p\xE9titions rapides.","Des prot\xE9ines \xE0 chaque repas aident tes muscles \xE0 grandir.","La r\xE9gularit\xE9 bat l'intensit\xE9. Mieux vaut 13 minutes un jour sur deux qu'une heure une fois par mois.","Bois un peu d'eau. M\xEAme une l\xE9g\xE8re soif fait baisser tes performances.","Respire lentement : inspire par le nez, expire par la bouche. Tu te calmeras plus vite.","Amplitude compl\xE8te = plus de muscle au travail. Moins de r\xE9p\xE9titions, mais compl\xE8tes."],moti:["Je crois en toi, tu vas y arriver ! \u{1F4AA}","Chaque s\xE9rie te rapproche de ton objectif.","Tu as plus de force que tu ne le crois.","Encore un peu, tu peux le faire.","Aujourd'hui compte. N'abandonne pas.","C'est maintenant que tu progresses.","Ton futur toi te remerciera."],cheers:["S\xE9rie solide !","C'est comme \xE7a qu'on fait !","Mode machine activ\xE9 !","Tu es en feu !","Du travail propre !","C'est la route vers un corps fort.","Presque fini !"],finish:["Encore une brique au mur. C'est comme \xE7a qu'on fait.","Termin\xE9. Maintenant, mange bien et dors : c'est l\xE0 que les muscles grandissent.","La force n'est pas un talent. C'est la somme de journ\xE9es exactement comme celle-ci.","Termin\xE9. \xC7a, c'est la discipline en action.","Aujourd'hui, tu as fait ce que la plupart des gens se contentent de pr\xE9voir."]};var pp={ui:{loading:"Caricamento\u2026",close:"Chiudi",cancel:"Annulla",save:"Salva",home:"Home",back:"Indietro",start:"Inizia",stop:"Stop",copied:"\u2713 Copiato",dayN:"Giorno {d}",tabTrain:"Allenamento",tabHistory:"Storico",tabSettings:"Impostazioni",tabProfile:"Profilo",mainMenu:"Menu principale",openProfile:"Apri profilo",streakAria:"Striscia {n}",levelAria:"Livello {n}",weeklyChallenges:"Sfide settimanali",chLeft:"{done} ro.",lastRound:"Ultimo giro. \xC8 la serie che costruisce muscolo: vai vicino al cedimento, tieni 1\u20132 ripetizioni di riserva. \u{1F4AA}",less:"Meno",more:"Pi\xF9",reps:"ripetizioni",newRank:"Nuovo rango: {rank}!",pr:"\u{1F3C6} Record personale",numFromLast:"Il numero \xE8 preso dall'ultima volta.",numGuess:"Il numero \xE8 solo una stima.",adjust:"Fai la serie e correggilo con quello che hai fatto davvero.",doneBtn:"Fatto, {v}",secondsHint:"secondi. Dopo l'avvio hai 5 s per metterti in posizione.",getReady:"mettiti in posizione",hold:"tieni",giveUp:"Non ce la faccio, stop",cheerDefault:"Bella serie!",newPR:"\u{1F3C6} Nuovo record personale!",roundDone:"Giro completato! Recupera prima del giro {r} di {n}",rest:"Recupero",next:"Prossimo",prepare:"Prepara la tua postazione durante il conto alla rovescia.",ready:"Ci sono",coolTitle:"Allenamento finito",coolIntro:"Lo stretching finale \xE8 facoltativo. Gli esperti concordano che non aiuta il recupero n\xE9 la crescita muscolare, solo la flessibilit\xE0. Se vuoi farlo, questi due hanno senso: flessori dell'anca (entrambi i lati) e posizione del bambino. 90 secondi in tutto.",coolDone:"\u2713 fatto",coolPrep:"mettiti in posizione, {n}",coolHold:"tieni, {n} s",hideHowTo:"\u25BE nascondi istruzioni",showHowTo:"\u25B8 come si fa",video:"\u25B6 Video",saveWorkout:"Salva allenamento",skipSave:"Salta e salva allenamento",nothingSaved:"Niente di salvato",nothingSavedD:"Non hai completato nessuna serie, quindi non \xE8 stato aggiunto niente allo storico.",great:"Ottimo lavoro!",dayDate:"Giorno {d}, {date}",levelLine:"Livello {lvl}, {into} / {need} XP. Striscia: {streak} di fila.",levelUp:"\u26A1 Level up! Livello {lvl}",challengeDone:"\u2713 Sfida completata: {text}",nextLine:"Prossimo allenamento: giorno {d}, idealmente {date}",copyAI:"Copia log per l'IA",dayRound:"Giorno {d}, giro {r} di {n}",quit:"Esci",quitSave:"Uscire e salvare?",quitConfirm:"Uscire davvero?",progressAria:"{done} di {total} completati",videoYT:"\u25B6 Video su YouTube",ladderTitle:"Ranghi (serie migliore: {v})",ladderNone:"Ranghi (serie migliore: ancora nessuna)",rankStart:"inizio",figureAria:"Disegno: {labels}",photoAlt:"Foto profilo"},pl:{workouts:{one:"{n} allenamento",many:"{n} allenamenti",other:"{n} allenamenti"},days:{one:"{n} giorno",many:"{n} giorni",other:"{n} giorni"},daysAgo:{one:"{n} giorno fa",many:"{n} giorni fa",other:"{n} giorni fa"},rounds:{one:"{n} giro",many:"{n} giri",other:"{n} giri"},sets:{one:"{n} serie",many:"{n} serie",other:"{n} serie"},prs:{one:"{n} record personale",many:"{n} record personali",other:"{n} record personali"}},units:{arm:"/braccio",leg:"/gamba",side:"/lato"},perUnit:{arm:"per braccio",leg:"per gamba",side:"per lato"},themes:{navy:"Blu notte",black:"Nero",forest:"Foresta",plum:"Prugna"},ranks:["Legno","Ferro","Bronzo","Argento","Oro","Platino","Diamante"],ex:{k1:{name:"Piegamento",muscles:"Petto, tricipiti, deltoidi anteriori",tempo:"3 s gi\xF9, breve pausa, su",how:"Mani un po' pi\xF9 larghe delle spalle, corpo dritto dalla testa ai talloni, addominali e glutei contratti. Scendi in 3 secondi finch\xE9 il petto quasi tocca il pavimento, fermati un attimo e spingi di nuovo su. Tieni i gomiti a circa 45\xB0 dal corpo, non aperti verso l'esterno.",tip:"Quando arrivi a 25+ nel primo giro, appoggia le mani su due libri spessi. Il petto scende pi\xF9 in basso, il muscolo si allunga di pi\xF9 e cresce di pi\xF9.",lvl:"Appoggia le mani su due libri spessi cos\xEC il petto scende pi\xF9 in basso. All'inizio i tuoi numeri caleranno, \xE8 normale."},row1:{name:"Rematore allo stipite",muscles:"Schiena (dorsali), deltoidi posteriori, bicipiti",tempo:"1 s su, 1 s tenuta, 3 s indietro",how:"Mettiti in una porta aperta, di fianco allo stipite. Afferra lo stipite con una mano all'altezza del petto, piedi proprio accanto allo stipite. Lasciati andare indietro con il braccio teso e il corpo dritto. Tirati verso lo stipite: il gomito va indietro lungo il corpo, stringi la scapola indietro. Torna lentamente. Fai tutte le ripetizioni con un braccio, poi con l'altro.",tip:"Pi\xF9 i piedi sono vicini allo stipite e pi\xF9 ti inclini indietro, pi\xF9 \xE8 difficile. Tieniti allo stipite solido, non alla porta, e allenati a piedi nudi cos\xEC non scivoli.",lvl:"Avvicina i piedi allo stipite e inclinati pi\xF9 indietro."},n1:{name:"Squat ATG",muscles:"Quadricipiti, glutei",tempo:"3 s gi\xF9, 1 s pausa in basso, su",how:"Piedi alla larghezza delle spalle, punte leggermente in fuori. Scendi in 3 secondi pi\xF9 in basso che puoi, cosce sotto le ginocchia, talloni a terra. Resta 1 secondo in basso e risali.",tip:"Il tempo lento e la pausa trasformano uno squat facile in uno difficile. Se ne fai 20+ anche con il tempo, passa alla versione pi\xF9 difficile.",lvl:"Fai uno squat 1\xBC: gi\xF9, risali di un quarto, di nuovo gi\xF9 fino in fondo, poi su. Questa \xE8 1 ripetizione."},b5:{name:"Plank",muscles:"Tutto il core",how:"Avambracci sotto le spalle, corpo dritto dalla testa ai talloni. Contrai addominali e glutei come se qualcuno stesse per darti un pugno nello stomaco. Non lasciare che i fianchi salgano o cedano.",tip:"Quando tieni 60 s in entrambi i giri, solleva una gamba durante il plank (alternando). \xC8 molto pi\xF9 difficile.",lvl:"Solleva una gamba durante il plank e cambia gamba a met\xE0."},r1:{name:"Pike push-up",muscles:"Spalle, tricipiti",tempo:"3 s gi\xF9, su",how:"Mettiti a V rovesciata: mani a terra, fianchi alti, gambe pi\xF9 tese che puoi. Piega i gomiti e porta la sommit\xE0 della testa verso il pavimento appena davanti alle mani, cos\xEC mani e testa formano un triangolo. Spingi di nuovo su.",tip:"Quando ne fai 15+ in entrambi i giri, metti i piedi su una sedia. Pi\xF9 peso va sulle spalle.",lvl:"Metti i piedi su una sedia."},row2:{name:"Rematore alla porta con asciugamano",muscles:"Centro della schiena, scapole, bicipiti",tempo:"1 s su, 1 s tenuta, 3 s indietro",how:"Apri la porta e mettiti di fronte al suo bordo, con la porta tra i piedi. Passa un asciugamano attorno a entrambe le maniglie e tienine le estremit\xE0, oppure afferra direttamente le due maniglie. Lasciati andare indietro con le braccia tese e il corpo dritto. Porta il petto verso il bordo della porta, stringi le scapole e torna gi\xF9 lentamente.",tip:"Prima controlla che le maniglie siano solide e non si muovano. Se qualcosa si muove, fai invece il rematore allo stipite (giorno A). La sicurezza prima di tutto.",lvl:"Avvicina i piedi alla porta e inclinati pi\xF9 indietro."},n2:{name:"Squat bulgaro",muscles:"Quadricipiti, glutei",tempo:"3 s gi\xF9, su",how:"Mettiti davanti a una sedia e appoggia il dorso del piede posteriore sulla seduta. Fai un bel passo avanti con il piede anteriore. Scendi in 3 secondi, il ginocchio posteriore va verso il pavimento. Spingi su attraverso il tallone del piede anteriore.",tip:"Porta il piede anteriore abbastanza avanti da tenere il ginocchio sopra il piede. Busto leggermente inclinato in avanti = pi\xF9 glutei.",lvl:"Rallenta: 4 s gi\xF9 e 2 s di pausa in basso."},b2:{name:"Dead bug",muscles:"Addominali profondi",tempo:"lentamente, 2 s fuori, 2 s dentro",how:"Sdraiati sulla schiena, braccia tese verso il soffitto, gambe sollevate con le ginocchia a 90\xB0. Abbassa lentamente il braccio destro dietro la testa e la gamba sinistra verso il pavimento, poi torna e cambia lato.",tip:"La zona lombare deve restare schiacciata a terra per tutto il tempo. Se si solleva, non abbassare cos\xEC tanto la gamba.",lvl:"Abbassa braccio e gamba pi\xF9 lentamente, 3 s fuori e 3 s dentro."},k3:{name:"Piegamento a diamante",muscles:"Tricipiti, parte interna del petto",tempo:"3 s gi\xF9, su",how:"Metti le mani sotto il petto cos\xEC pollici e indici si toccano e formano un diamante. Scendi con i gomiti che vanno indietro lungo il corpo. Il petto va verso le mani.",tip:"Se ti fanno male i polsi o i gomiti, allarga un po' le mani. Un piegamento a presa stretta lavora i tricipiti quasi altrettanto.",lvl:"Metti i piedi su una sedia."},row3:{name:"Rematore largo allo stipite",muscles:"Deltoidi posteriori, parte alta della schiena",tempo:"1 s su, 1 s tenuta, 3 s indietro",how:"Stessa posizione del rematore allo stipite, ma afferra lo stipite all'altezza della spalla e porta il gomito di lato, non lungo il corpo. Braccio e busto formano una T. Dovresti sentirlo dietro la spalla e tra le scapole.",tip:"Questo angolo allena i deltoidi posteriori e la parte alta della schiena. Rendono le spalle pi\xF9 larghe e piene viste da dietro.",lvl:"Avvicina i piedi allo stipite e inclinati pi\xF9 indietro."},n7:{name:"Leg curl con asciugamano",muscles:"Femorali, glutei",tempo:"3 s fuori, 1 s dentro",how:"Sdraiati sulla schiena su un pavimento liscio (parquet, piastrelle), talloni su un asciugamano o con i calzini. Solleva i fianchi in un ponte. Fai scivolare le gambe in avanti in 3 secondi finch\xE9 sono quasi tese, fianchi sempre su. Poi riporta i talloni verso i glutei.",tip:"Sul tappeto non scivola. In quel caso fai un ponte su una gamba: fianchi su, una gamba in aria, e registra le ripetizioni per gamba.",lvl:"Fallo con una gamba sola, tieni l'altra in aria."},b4:{name:"Bicycle crunch",muscles:"Obliqui, tutti gli addominali",tempo:"lentamente, 1 s per lato",how:"Sdraiati sulla schiena, mani dietro la testa, spalle sollevate da terra. Porta il gomito destro verso il ginocchio sinistro mentre distendi la gamba destra. Poi cambia. Ruota il busto, non solo i gomiti.",tip:"Vai piano. Sbattere i gomiti in fretta non serve a niente, affatica solo il collo.",lvl:"Rallenta a 2 s per lato."},kKnee:{name:"Piegamento sulle ginocchia",muscles:"Petto, tricipiti, deltoidi anteriori",tempo:"3 s gi\xF9, su",how:"In ginocchio, mani un po' pi\xF9 larghe delle spalle. Tieni il corpo dritto dalle ginocchia alla testa, non spingere i fianchi indietro. Porta il petto verso il pavimento in 3 secondi e spingi di nuovo su.",tip:"Quando ne fai 20 in entrambi i giri, torna al piegamento normale."},kIncl:{name:"Piegamento inclinato",muscles:"Petto, tricipiti, deltoidi anteriori",tempo:"3 s gi\xF9, su",how:"Appoggia le mani su un tavolo robusto, un letto o un davanzale. Tieni il corpo dritto dai talloni alla testa. Porta il petto verso il bordo e spingi indietro. Pi\xF9 basso \xE8 l'appoggio, pi\xF9 \xE8 difficile.",tip:"Una buona alternativa quando ti fanno male i polsi a terra o stai finendo le forze."},superman:{name:"Superman",muscles:"Zona lombare, glutei, deltoidi posteriori",tempo:"su, 2 s tenuta, gi\xF9",how:"Sdraiati a pancia in gi\xF9 con le braccia tese davanti a te. Solleva braccia, petto e gambe da terra nello stesso momento, tieni 2 secondi e torna gi\xF9 lentamente. Guarda il pavimento, non piegare il collo all'indietro.",tip:"Non \xE8 una trazione come un rematore, ma rinforza la schiena quando non hai dove fare il rematore."},ytw:{name:"Y-T-W a terra",muscles:"Centro e parte alta della schiena, deltoidi posteriori",tempo:"tieni ogni posizione 1 s",how:"Sdraiati a pancia in gi\xF9, fronte su un asciugamano. Solleva le braccia tese a Y e tieni 1 s. Poi aprile di lato a T. Infine porta i gomiti verso le costole a W e stringi le scapole. Y + T + W = 1 ripetizione.",tip:"Pollici verso l'alto, tieni le spalle lontane dalle orecchie."},lunge:{name:"Affondo indietro",muscles:"Quadricipiti, glutei",tempo:"2 s gi\xF9, su",how:"In piedi, busto dritto. Fai un bel passo indietro, il ginocchio posteriore arriva quasi a terra e quello anteriore si piega a 90\xB0. Spingi attraverso il tallone del piede anteriore per tornare in piedi. Fai tutte le ripetizioni con una gamba, poi con l'altra.",tip:"Pi\xF9 delicato sulle ginocchia dell'affondo in avanti. Tieni il busto dritto."},bridge:{name:"Ponte glutei",muscles:"Glutei, femorali",tempo:"su, 2 s contrazione, gi\xF9",how:"Sdraiati sulla schiena, ginocchia piegate, piedi a terra. Spingi con i talloni e solleva i fianchi finch\xE9 il corpo forma una linea dritta dalle ginocchia alle spalle. Stringi i glutei per 2 secondi in alto e torna gi\xF9 lentamente.",tip:"Versione pi\xF9 difficile: una gamba in aria. In quel caso registra le ripetizioni per gamba."},wallsit:{name:"Wall sit",muscles:"Quadricipiti",how:"Appoggia la schiena al muro e scivola gi\xF9 finch\xE9 le cosce sono parallele al pavimento e le ginocchia a 90\xB0. Tutta la schiena sul muro, ginocchia sopra le caviglie. Tieni.",tip:"Non appoggiare le mani sulle cosce, altrimenti ti aiuti."},birddog:{name:"Bird dog",muscles:"Core, zona lombare, glutei",tempo:"allunga, 2 s tenuta, torna",how:"Mettiti a quattro zampe: mani sotto le spalle, ginocchia sotto i fianchi. Allunga il braccio destro in avanti e la gamba sinistra indietro nello stesso momento, corpo in linea retta. Tieni 2 secondi, torna e cambia lato.",tip:"I fianchi non devono ruotare. Immagina un bicchiere d'acqua sulla zona lombare."},hollow:{name:"Hollow body hold",muscles:"Tutto il core",how:"Sdraiati sulla schiena con le braccia tese dietro la testa. Schiaccia la zona lombare a terra e solleva un po' le spalle e le gambe tese dal pavimento. Tieni senza muoverti.",tip:"Se la zona lombare si stacca da terra, alza di pi\xF9 le gambe o piegale."},legraise:{name:"Leg raise",muscles:"Addominali bassi, flessori dell'anca",tempo:"2 s su, 2 s gi\xF9",how:"Sdraiati sulla schiena, braccia lungo i fianchi. Solleva lentamente le gambe tese finch\xE9 sono verticali e abbassale lentamente quasi fino a terra, ma senza appoggiarle. La zona lombare resta a terra.",tip:"Se ti fa male la zona lombare, piega le ginocchia."}},warm:{w1:{name:"Circonduzioni delle braccia",dose:"15\xD7 avanti, 15\xD7 indietro",why:"Scioglie le spalle prima di piegamenti e rematori."},w2:{name:"Slanci delle gambe",dose:"10\xD7 per gamba, tieniti a un muro",why:"Scioglie i fianchi prima degli squat."},w3:{name:"World's greatest stretch",dose:"5\xD7 per lato",why:"Anche, parte alta della schiena e femorali in un colpo solo."},w4:{name:"Inchworm",dose:"5\xD7",why:"Scalda tutto il corpo e ti porta in plank."}},cool:{c1:{name:"Flessori dell'anca, sinistra",why:"Stare molto seduti (scuola, computer) accorcia la parte anteriore delle anche. Se fai un solo allungamento, fai questo.",how:"Appoggia il ginocchio sinistro a terra, piede destro davanti. Stringi i glutei e porta i fianchi in avanti finch\xE9 senti l'allungamento davanti all'anca sinistra. Non inarcare la zona lombare."},c2:{name:"Flessori dell'anca, destra",why:"Lo stesso dall'altro lato.",how:"Appoggia il ginocchio destro a terra, piede sinistro davanti. Stringi i glutei e porta i fianchi in avanti."},c3:{name:"Posizione del bambino",why:"Calma il respiro e rilassa la schiena. Solo per stare bene.",how:"Ginocchia divaricate, siediti con i fianchi sui talloni, allunga le braccia in avanti pi\xF9 che puoi, fronte a terra. Respira lentamente."}},fig:{k1:["Su","Gi\xF9"],k3:["Su","Gi\xF9, gomiti stretti"],b5:["Giusto: corpo dritto","Sbagliato: zona lombare che cede"],n1:["Inizio","Gi\xF9, talloni a terra"],r1:["Su","Gi\xF9, testa davanti alle mani"],row1:["Inizio, braccio teso","Tira, gomito indietro"],row3:["Inizio, mano all'altezza della spalla","Gomito di lato, in alto"],row2:["Inizio, braccia tese","Petto verso la porta"],n2:["Su","Gi\xF9, ginocchio posteriore verso terra"],b2:["Inizio","Braccio e gamba opposta gi\xF9"],n7:["Fianchi su, talloni vicino ai glutei","Gambe in avanti, fianchi sempre su"],b4:["Gomito al ginocchio opposto","Cambia lato"],kKnee:["Su, ginocchia a terra","Gi\xF9"],kIncl:["Mani sul tavolo, su","Petto verso il bordo"],superman:["A pancia in gi\xF9","Solleva e tieni 2 s"],ytw:["Y: braccia avanti e in alto","W: gomiti alle costole"],lunge:["Inizio","Passo indietro, ginocchio verso terra"],bridge:["Sdraiati, ginocchia piegate","Fianchi su, stringi i glutei"],wallsit:["Cosce parallele, schiena al muro"],birddog:["A quattro zampe","Braccio e gamba opposta"],hollow:["Zona lombare schiacciata a terra"],legraise:["Gambe su","Abbassa piano, senza toccare terra"],hf:["Ginocchio dietro a terra, fianchi avanti"],child:["Fianchi sui talloni, braccia ben avanti"]},ch:{w3:"Fai 3 allenamenti",pr1:"Batti un record personale",r3:"Fai 3 giri una volta",warm:"Riscaldamento completo 2\xD7",cool:"Stretching dopo l'allenamento 2\xD7",push100:"100 piegamenti in totale (di ogni tipo)",rank:"Raggiungi un nuovo rango",reps300:"300 ripetizioni in totale",legs100:"100 ripetizioni per le gambe"},ach:{first:["Primo passo","1\xB0 allenamento"],w5:["Batti cinque","5 allenamenti"],w10:["Dieci e lode","10 allenamenti"],w25:["Un quarto di secolo","25 allenamenti"],w50:["Mezzo secolo","50 allenamenti"],s3:["Si ingrana","Striscia di 3"],s7:["Inarrestabile","Striscia di 7"],s15:["Disciplina","Striscia di 15"],pr:["Batti-record","1\xB0 record personale"],gold:["D'oro","Oro in 1 esercizio"],diamond:["Diamante","Diamante in 1 esercizio"],week:["Settimana perfetta","Tutte e 3 le sfide"],lvl5:["Livello 5","Raggiungi il livello 5"],r3:["Tre giri","Fai 3 giri"],push30:["Trenta","30 piegamenti in una serie"]},quotes:["La disciplina ti porta dove la motivazione non arriva.","Non serve averne voglia. Fai solo la prima serie, il resto viene da s\xE9.","Ogni ripetizione \xE8 un mattone. Un fisico si costruisce mattone dopo mattone.","13 minuti oggi. Un fisico per la vita.","Mai saltare due volte di fila.","Piccoli passi a giorni alterni battono grandi piani mai iniziati.","Il te del futuro ti ringrazier\xE0 per oggi.","Non conta l'allenamento perfetto. Conta esserci.","Dove inizia a bruciare, inizia la crescita.","I muscoli si costruiscono con l'allenamento, ma crescono con il cibo e il sonno.","Confrontati solo con chi eri la settimana scorsa.","Mentre gli altri cercano la motivazione, tu hai gi\xE0 finito l'allenamento.","Serie dure, vita pi\xF9 facile.","Ogni persona forte \xE8 partita da zero."],facts:["Puoi allenarti ogni giorno, ma a giorni alterni \xE8 meglio. I muscoli crescono mentre riposi, non mentre ti alleni.","Il sonno \xE8 il tuo integratore migliore. 7\u20139 ore a notte = recupero pi\xF9 rapido.","Le ultime ripetizioni di una serie fanno il lavoro pi\xF9 grosso. Sono quelle che costruiscono muscolo.","Una discesa lenta (3 secondi) d\xE0 ai muscoli pi\xF9 lavoro delle ripetizioni veloci.","Le proteine a ogni pasto aiutano i muscoli a crescere.","La costanza batte l'intensit\xE0. Meglio 13 minuti a giorni alterni che un'ora una volta al mese.","Bevi un po' d'acqua. Anche una leggera sete abbassa la tua prestazione.","Respira lentamente: dentro dal naso, fuori dalla bocca. Ti calmi prima.","Movimento completo = pi\xF9 muscoli al lavoro. Meno ripetizioni, ma complete."],moti:["Credo in te, ce la fai! \u{1F4AA}","Ogni serie ti avvicina al tuo obiettivo.","Sei pi\xF9 forte di quanto pensi.","Ancora un po', puoi farcela.","Oggi conta. Non mollare.","\xC8 questo il momento in cui cresci.","Il te del futuro ti ringrazier\xE0."],cheers:["Serie potente!","Cos\xEC si fa!","Modalit\xE0 bestia!","Sei on fire!","Lavoro pulito!","Questa \xE8 la strada per un fisico forte.","Ci sei quasi!"],finish:["Un altro mattone nel muro. Cos\xEC si fa.","Fatto. Ora mangia bene e dormi, \xE8 l\xEC che crescono i muscoli.","La forza non \xE8 talento. \xC8 la somma di giorni esattamente come questo.","Fatto. Questa \xE8 disciplina in azione.","Oggi hai fatto quello che la maggior parte delle persone si limita a programmare."]};var mp={ui:{loading:"Carregando\u2026",close:"Fechar",cancel:"Cancelar",save:"Salvar",home:"In\xEDcio",back:"Voltar",start:"Come\xE7ar",stop:"Parar",copied:"\u2713 Copiado",dayN:"Dia {d}",tabTrain:"Treino",tabHistory:"Hist\xF3rico",tabSettings:"Ajustes",tabProfile:"Perfil",mainMenu:"Menu principal",openProfile:"Abrir perfil",streakAria:"Sequ\xEAncia {n}",levelAria:"N\xEDvel {n}",weeklyChallenges:"Desafios da semana",chLeft:"{done}/3, {left} pela frente",chFooter:"Complete os 3 e ganhe um \u{1F9CA} congelamento de sequ\xEAncia.",firstWorkout:"Seu primeiro treino. Bora!",anytime:"Quando voc\xEA quiser.",idealOn:"O ideal: {date}, j\xE1 que voc\xEA treina dia sim, dia n\xE3o.",trainedYes : {labels}",photoAlt:"Foto de perfil"},pl:{workouts:{one:"{n} treino",many:"{n} treinos",other:"{n} treinos"},days:{one:"{n} dia",many:"{n} dias",other:"{n} dias"},daysAgo:{one:"h\xE1 {n} dia",many:"h\xE1 {n} dias",other:"h\xE1 {n} dias"},rounds:{one:"{n} rodada",many:"{n} rodadas",other:"{n} rodadas"},sets:{one:"{n} s\xE9rie",many:"{n} s\xE9ries",other:"{n} s\xE9ries"},prs:{one:"{n} recorde pessoal",many:"{n} recordes pessoais",other:"{n} recordes pessoais"}},units:{arm:"/bra\xE7o",leg:"/perna",side:"/lado"},perUnit:{arm:"por bra\xE7o",leg:"por perna",side:"por lado"},themes:{navy:"Marinho",black:"Preto",forest:"Floresta",plum:"Ameixa"},ranks:["Madeira","Ferro","Bronze","Prata","Ouro","Platina","Diamante"],ex:{k1:{name:"Flex\xE3o",muscles:"Peito, tr\xEDceps, ombros (parte da frente)",tempo:"3 s descendo, pausa curta, sobe",how:"M\xE3os um pouco mais abertas que os ombros, corpo reto da cabe\xE7a aos calcanhares, abd\xF4men e gl\xFAteos contra\xEDdos. Des\xE7a em 3 segundos at\xE9 o peito quase encostar no ch\xE3o, segure um instante e empurre de volta para cima. Mantenha os cotovelos a uns 45\xB0 do corpo, n\xE3o abertos para os lados.",tip:"Quando passar de 25 na primeira rodada, apoie as m\xE3os em dois livros grossos. O peito desce mais, o m\xFAsculo alonga mais e cresce mais.",lvl:"Apoie as m\xE3os em dois livros grossos para o peito descer mais. No come\xE7o seus n\xFAmeros v\xE3o cair, tudo bem."},row1:{name:"Remada no batente da porta",muscles:"Costas (dorsais), ombros (parte de tr\xE1s), b\xEDceps",tempo:"1 s subindo, 1 s segurando, 3 s voltando",how:"Fique numa porta aberta, de lado para o batente. Segure o batente com uma m\xE3o na altura do peito, com os p\xE9s bem colados ao batente. Incline-se para tr\xE1s com o bra\xE7o esticado e o corpo reto. Puxe-se at\xE9 o batente: o cotovelo vai para tr\xE1s rente ao corpo, aperte a esc\xE1pula para tr\xE1s. Volte devagar. Fa\xE7a todas as repeti\xE7\xF5es com um bra\xE7o, depois com o outro.",tip:"Quanto mais perto do batente estiverem os p\xE9s e quanto mais voc\xEA inclinar para tr\xE1s, mais dif\xEDcil fica. Segure o batente firme, n\xE3o a porta, e treine descal\xE7o para os p\xE9s n\xE3o escorregarem.",lvl:"Aproxime os p\xE9s do batente e incline-se mais para tr\xE1s."},n1:{name:"Agachamento ATG",muscles:"Coxa (parte da frente), gl\xFAteos",tempo:"3 s descendo, 1 s de pausa embaixo, sobe",how:"P\xE9s na largura dos ombros, pontas levemente para fora. Des\xE7a em 3 segundos o mais fundo que conseguir, coxas abaixo dos joelhos, calcanhares no ch\xE3o. Segure 1 segundo l\xE1 embaixo e suba.",tip:"O ritmo lento e a pausa transformam um agachamento f\xE1cil num dif\xEDcil. Se fizer 20+ mesmo com o ritmo, passe para a vers\xE3o mais dif\xEDcil.",lvl:"Fa\xE7a o agachamento 1\xBC: desce, sobe um quarto do caminho, desce tudo de novo e ent\xE3o sobe. Isso \xE9 1 repeti\xE7\xE3o."},b5:{name:"Prancha",muscles:"Core inteiro",how:"Antebra\xE7os embaixo dos ombros, corpo reto da cabe\xE7a aos calcanhares. Contraia o abd\xF4men e os gl\xFAteos como se algu\xE9m fosse dar um soco na sua barriga. N\xE3o deixe o quadril subir nem cair.",tip:"Quando aguentar 60 s nas duas rodadas, levante uma perna durante a prancha (alternando). Fica bem mais dif\xEDcil.",lvl:"Levante uma perna durante a prancha e troque de perna na metade do tempo."},r1:{name:"Flex\xE3o pike",muscles:"Ombros, tr\xEDceps",tempo:"3 s descendo, sobe",how:"Fa\xE7a um V invertido: m\xE3os no ch\xE3o, quadril alto, pernas o mais esticadas poss\xEDvel. Dobre os cotovelos e des\xE7a o topo da cabe\xE7a at\xE9 o ch\xE3o, logo \xE0 frente das m\xE3os, de modo que m\xE3os e cabe\xE7a formem um tri\xE2ngulo. Empurre de volta para cima.",tip:"Quando fizer 15+ nas duas rodadas, apoie os p\xE9s numa cadeira. Mais do seu peso vai para os ombros.",lvl:"Apoie os p\xE9s numa cadeira."},row2:{name:"Remada na porta com toalha",muscles:"Meio das costas, esc\xE1pulas, b\xEDceps",tempo:"1 s subindo, 1 s segurando, 3 s voltando",how:"Abra a porta e fique de frente para a borda dela, com a porta entre os p\xE9s. Passe uma toalha em volta das duas ma\xE7anetas e segure as pontas, ou segure as duas ma\xE7anetas direto. Incline-se para tr\xE1s com os bra\xE7os esticados e o corpo reto. Puxe o peito at\xE9 a borda da porta, aperte as esc\xE1pulas e des\xE7a devagar.",tip:"Antes, confira se as ma\xE7anetas est\xE3o firmes e n\xE3o se mexem. Se algo se mexer, fa\xE7a a remada no batente (dia A) no lugar. Seguran\xE7a em primeiro lugar.",lvl:"Aproxime os p\xE9s da porta e incline-se mais para tr\xE1s."},n2:{name:"Agachamento b\xFAlgaro",muscles:"Coxa (parte da frente), gl\xFAteos",tempo:"3 s descendo, sobe",how:"Fique de costas para uma cadeira e apoie o peito do p\xE9 de tr\xE1s no assento. D\xEA um passo grande \xE0 frente com o p\xE9 da frente. Des\xE7a em 3 segundos, com o joelho de tr\xE1s indo em dire\xE7\xE3o ao ch\xE3o. Suba empurrando pelo calcanhar do p\xE9 da frente.",tip:"Coloque o p\xE9 da frente longe o bastante para o joelho ficar acima do p\xE9. Inclinar o tronco um pouco para a frente = mais gl\xFAteo.",lvl:"V\xE1 mais devagar: 4 s descendo e 2 s de pausa embaixo."},b2:{name:"Dead bug",muscles:"M\xFAsculos profundos do abd\xF4men",tempo:"devagar, 2 s indo, 2 s voltando",how:"Deite de barriga para cima, bra\xE7os esticados para o teto, pernas elevadas com os joelhos a 90\xB0. Des\xE7a devagar o bra\xE7o direito para tr\xE1s da cabe\xE7a e a perna esquerda em dire\xE7\xE3o ao ch\xE3o, depois volte e troque de lado.",tip:"A lombar tem que ficar colada no ch\xE3o o tempo todo. Se ela levantar, n\xE3o des\xE7a tanto a perna.",lvl:"Des\xE7a o bra\xE7o e a perna mais devagar, 3 s indo e 3 s voltando."},k3:{name:"Flex\xE3o diamante",muscles:"Tr\xEDceps, parte interna do peito",tempo:"3 s descendo, sobe",how:"Coloque as m\xE3os embaixo do peito, com os polegares e os indicadores se tocando e formando um diamante. Des\xE7a com os cotovelos indo para tr\xE1s rente ao corpo. O peito vai em dire\xE7\xE3o \xE0s m\xE3os.",tip:"Se doer o punho ou o cotovelo, afaste um pouco as m\xE3os. Uma flex\xE3o com as m\xE3os pr\xF3ximas trabalha o tr\xEDceps quase do mesmo jeito.",lvl:"Apoie os p\xE9s numa cadeira."},row3:{name:"Remada aberta no batente",muscles:"Ombros (parte de tr\xE1s), parte de cima das costas",tempo:"1 s subindo, 1 s segurando, 3 s voltando",how:"Mesma posi\xE7\xE3o da remada no batente, mas segure o batente na altura do ombro e puxe o cotovelo para o lado, n\xE3o rente ao corpo. O bra\xE7o e o tronco formam um T. Voc\xEA deve sentir na parte de tr\xE1s do ombro e entre as esc\xE1pulas.",tip:"Esse \xE2ngulo trabalha a parte de tr\xE1s dos ombros e a parte de cima das costas. Eles deixam os ombros mais largos e encorpados vistos de tr\xE1s.",lvl:"Aproxime os p\xE9s do batente e incline-se mais para tr\xE1s."},n7:{name:"Flexora deslizante com toalha",muscles:"Posteriores da coxa, gl\xFAteos",tempo:"3 s esticando, 1 s voltando",how:"Deite de barriga para cima num ch\xE3o liso (madeira, piso frio), com os calcanhares sobre uma toalha ou de meias. Suba o quadril numa ponte. Deslize as pernas para a frente em 3 segundos at\xE9 ficarem quase esticadas, com o quadril ainda no alto. Depois puxe os calcanhares de volta at\xE9 os gl\xFAteos.",tip:"No tapete n\xE3o desliza. Nesse caso, fa\xE7a a ponte com uma perna s\xF3: quadril para cima, uma perna no ar, e anote as repeti\xE7\xF5es por perna.",lvl:"Fa\xE7a com uma perna s\xF3, mantendo a outra no ar."},b4:{name:"Abdominal bicicleta",muscles:"Obl\xEDquos, abd\xF4men inteiro",tempo:"devagar, 1 s por lado",how:"Deite de barriga para cima, m\xE3os atr\xE1s da cabe\xE7a, ombros fora do ch\xE3o. Leve o cotovelo direito ao joelho esquerdo enquanto estica a perna direita. Depois troque. \xC9 o tronco que gira, n\xE3o s\xF3 os cotovelos.",tip:"V\xE1 devagar. Ficar batendo os cotovelos r\xE1pido n\xE3o adianta nada, s\xF3 for\xE7a o pesco\xE7o.",lvl:"Diminua para 2 s por lado."},kKnee:{name:"Flex\xE3o com joelhos apoiados",muscles:"Peito, tr\xEDceps, ombros (parte da frente)",tempo:"3 s descendo, sobe",how:"Fique de joelhos, m\xE3os um pouco mais abertas que os ombros. Mantenha o corpo reto dos joelhos \xE0 cabe\xE7a, sem empinar o quadril. Des\xE7a o peito at\xE9 o ch\xE3o em 3 segundos e empurre de volta para cima.",tip:"Quando fizer 20 nas duas rodadas, volte para a flex\xE3o normal."},kIncl:{name:"Flex\xE3o inclinada",muscles:"Peito, tr\xEDceps, ombros (parte da frente)",tempo:"3 s descendo, sobe",how:"Apoie as m\xE3os numa mesa firme, numa cama ou no parapeito da janela. Mantenha o corpo reto dos calcanhares \xE0 cabe\xE7a. Des\xE7a o peito at\xE9 a borda e empurre de volta. Quanto mais baixo o apoio, mais dif\xEDcil.",tip:"Uma boa substituta quando o punho d\xF3i no ch\xE3o ou quando a for\xE7a est\xE1 acabando."},superman:{name:"Superman",muscles:"Lombar, gl\xFAteos, ombros (parte de tr\xE1s)",tempo:"sobe, 2 s segurando, desce",how:"Deite de barriga para baixo com os bra\xE7os esticados \xE0 frente. Tire os bra\xE7os, o peito e as pernas do ch\xE3o ao mesmo tempo, segure 2 segundos e des\xE7a devagar. Olhe para o ch\xE3o, n\xE3o jogue o pesco\xE7o para tr\xE1s.",tip:"N\xE3o \xE9 um exerc\xEDcio de puxar como a remada, mas fortalece as costas quando voc\xEA n\xE3o tem onde fazer remada."},ytw:{name:"Y-T-W no ch\xE3o",muscles:"Meio e parte de cima das costas, ombros (parte de tr\xE1s)",tempo:"segure cada posi\xE7\xE3o por 1 s",how:"Deite de barriga para baixo, testa apoiada numa toalha. Levante os bra\xE7os esticados formando um Y e segure 1 s. Depois abra para os lados formando um T. Por fim, puxe os cotovelos at\xE9 as costelas formando um W e aperte as esc\xE1pulas. Y + T + W = 1 repeti\xE7\xE3o.",tip:"Polegares para cima, ombros longe das orelhas."},lunge:{name:"Afundo reverso",muscles:"Coxa (parte da frente), gl\xFAteos",tempo:"2 s descendo, sobe",how:"Fique em p\xE9, com a postura ereta. D\xEA um passo grande para tr\xE1s: o joelho de tr\xE1s vai quase at\xE9 o ch\xE3o e o joelho da frente dobra a 90\xB0. Empurre pelo calcanhar do p\xE9 da frente para voltar \xE0 posi\xE7\xE3o em p\xE9. Fa\xE7a todas as repeti\xE7\xF5es com uma perna, depois com a outra.",tip:"Pega mais leve nos joelhos que o afundo para a frente. Mantenha o tronco ereto."},bridge:{name:"Eleva\xE7\xE3o p\xE9lvica",muscles:"Gl\xFAteos, posteriores da coxa",tempo:"sobe, 2 s contraindo, desce",how:"Deite de barriga para cima, joelhos dobrados, p\xE9s no ch\xE3o. Empurre pelos calcanhares e suba o quadril at\xE9 o corpo formar uma linha reta dos joelhos aos ombros. Contraia os gl\xFAteos por 2 segundos l\xE1 em cima e des\xE7a devagar.",tip:"Vers\xE3o mais dif\xEDcil: uma perna no ar. A\xED anote as repeti\xE7\xF5es por perna."},wallsit:{name:"Cadeirinha na parede",muscles:"Coxa (parte da frente)",how:"Encoste as costas numa parede e deslize para baixo at\xE9 as coxas ficarem paralelas ao ch\xE3o e os joelhos a 90\xB0. Costas inteiras na parede, joelhos acima dos tornozelos. Segure.",tip:"N\xE3o apoie as m\xE3os nas coxas, sen\xE3o voc\xEA est\xE1 se ajudando."},birddog:{name:"Bird dog",muscles:"Core, lombar, gl\xFAteos",tempo:"estica, 2 s segurando, volta",how:"Fique de quatro apoios: m\xE3os embaixo dos ombros, joelhos embaixo do quadril. Estique o bra\xE7o direito para a frente e a perna esquerda para tr\xE1s ao mesmo tempo, com o corpo em linha reta. Segure 2 segundos, volte e troque de lado.",tip:"O quadril n\xE3o pode girar. Imagine um copo d'\xE1gua em cima da sua lombar."},hollow:{name:"Hollow body",muscles:"Core inteiro",how:"Deite de barriga para cima com os bra\xE7os esticados para tr\xE1s da cabe\xE7a. Pressione a lombar no ch\xE3o e tire os ombros e as pernas esticadas um pouco do ch\xE3o. Segure sem se mexer.",tip:"Se a lombar sair do ch\xE3o, suba mais as pernas ou dobre os joelhos."},legraise:{name:"Eleva\xE7\xE3o de pernas",muscles:"Parte de baixo do abd\xF4men, flexores do quadril",tempo:"2 s subindo, 2 s descendo",how:"Deite de barriga para cima, bra\xE7os
