er",exReplacedBy:"Desligado. O dia {d} usa no lugar: {name}.",exCanDo:"Consigo fazer: {name}",resetAll:"\u{1F9F9} Come\xE7ar do zero",resetAllD:"Apaga treinos, XP, n\xEDveis, sequ\xEAncia, patentes e medalhas. Nome, foto e configura\xE7\xF5es continuam.",resetAllTitle:"Come\xE7ar do zero?",resetAllBody:"Todos os seus treinos ({count}) ser\xE3o apagados, junto com tudo o que vem deles: XP, n\xEDveis, a sequ\xEAncia, congelamentos, patentes e medalhas. Seu nome, foto e configura\xE7\xF5es continuam. N\xE3o d\xE1 para desfazer, ent\xE3o salve um backup antes se talvez quiser os dados de volta.",resetAllBackup:"\u{1F4BE} Salvar backup antes",resetAllYes:"Sim, apagar tudo",msgResetAll:"\u2713 Pronto. Voc\xEA est\xE1 come\xE7ando do zero."},pl:{workouts:{one:"{n} treino",many:"{n} treinos",other:"{n} treinos"},days:{one:"{n} dia",many:"{n} dias",other:"{n} dias"},daysAgo:{one:"h\xE1 {n} dia",many:"h\xE1 {n} dias",other:"h\xE1 {n} dias"},rounds:{one:"{n} rodada",many:"{n} rodadas",other:"{n} rodadas"},sets:{one:"{n} s\xE9rie",many:"{n} s\xE9ries",other:"{n} s\xE9ries"},prs:{one:"{n} recorde pessoal",many:"{n} recordes pessoais",other:"{n} recordes pessoais"}},units:{arm:"/bra\xE7o",leg:"/perna",side:"/lado"},perUnit:{arm:"por bra\xE7o",leg:"por perna",side:"por lado"},themes:{navy:"Marinho",black:"Preto",forest:"Floresta",plum:"Ameixa",ocean:"Oceano",wine:"Vinho",slate:"Ard\xF3sia",coffee:"Caf\xE9"},ranks:["Madeira","Ferro","Bronze","Prata","Ouro","Platina","Diamante"],ex:{k1:{name:"Flex\xE3o",muscles:"Peito, tr\xEDceps, ombros (parte da frente)",tempo:"3 s descendo, pausa curta, sobe",how:"M\xE3os um pouco mais abertas que os ombros, corpo reto da cabe\xE7a aos calcanhares, abd\xF4men e gl\xFAteos contra\xEDdos. Des\xE7a em 3 segundos at\xE9 o peito quase encostar no ch\xE3o, segure um instante e empurre de volta para cima. Mantenha os cotovelos a ~45\xB0 do corpo, n\xE3o abertos para os lados.",tip:"Quando passar de 25 na primeira rodada, apoie as m\xE3os em dois livros grossos. O peito desce mais, o m\xFAsculo alonga mais e cresce mais.",lvl:"Apoie as m\xE3os em dois livros grossos para o peito descer mais. No come\xE7o seus n\xFAmeros v\xE3o cair, tudo bem."},row1:{name:"Remada no batente da porta",muscles:"Costas (dorsais), ombros (parte de tr\xE1s), b\xEDceps",tempo:"1 s subindo, 1 s segurando, 3 s voltando",how:"Fique numa porta aberta, de lado para o batente. Segure o batente com uma m\xE3o na altura do peito, com os p\xE9s bem colados ao batente. Incline-se para tr\xE1s com o bra\xE7o esticado e o corpo reto. Puxe-se at\xE9 o batente: o cotovelo vai para tr\xE1s rente ao corpo, aperte a esc\xE1pula para tr\xE1s. Volte devagar. Fa\xE7a todas as repeti\xE7\xF5es com um bra\xE7o, depois com o outro.",tip:"Quanto mais perto do batente estiverem os p\xE9s e quanto mais voc\xEA inclinar para tr\xE1s, mais dif\xEDcil fica. Segure o batente firme, n\xE3o a porta, e treine descal\xE7o para os p\xE9s n\xE3o escorregarem.",lvl:"Aproxime os p\xE9s do batente e incline-se mais para tr\xE1s."},n1:{name:"Agachamento ATG",muscles:"Coxa (parte da frente), gl\xFAteos",tempo:"3 s descendo, 1 s de pausa embaixo, sobe",how:"P\xE9s na largura dos ombros, pontas levemente para fora. Des\xE7a em 3 segundos o mais fundo que conseguir, coxas abaixo dos joelhos, calcanhares no ch\xE3o. Segure 1 segundo l\xE1 embaixo e suba.",tip:"O ritmo lento e a pausa embaixo tornam um agachamento f\xE1cil em dif\xEDcil. Se fizer 20+ mesmo com o ritmo, troque pelo Agachamento 1 e 1/4.",lvl:"Troque pelo Agachamento 1 e 1/4 (\u21C4 Trocar)."},b5:{name:"Prancha",muscles:"Core inteiro",how:"Antebra\xE7os embaixo dos ombros, corpo reto da cabe\xE7a aos calcanhares. Contraia o abd\xF4men e os gl\xFAteos como se algu\xE9m fosse dar um soco na sua barriga. N\xE3o deixe o quadril subir nem cair.",tip:"Quando segurar 60 s nas duas rodadas, troque pela Prancha com uma perna. \xC9 bem mais dif\xEDcil.",lvl:"Troque pela Prancha com uma perna (\u21C4 Trocar)."},r1:{name:"Flex\xE3o pike",muscles:"Ombros, tr\xEDceps",tempo:"3 s descendo, sobe",how:"Fa\xE7a um V invertido: m\xE3os no ch\xE3o, quadril alto, pernas o mais esticadas poss\xEDvel. Dobre os cotovelos e des\xE7a o topo da cabe\xE7a at\xE9 o ch\xE3o, logo \xE0 frente das m\xE3os, de modo que m\xE3os e cabe\xE7a formem um tri\xE2ngulo. Empurre de volta para cima.",tip:"Quando fizer 15+ nas duas rodadas, troque pela Flex\xE3o pike com p\xE9s na cadeira. Mais do seu peso vai para os ombros.",lvl:"Troque pela Flex\xE3o pike com p\xE9s na cadeira (\u21C4 Trocar)."},row2:{name:"Remada na porta com toalha",muscles:"Meio das costas, esc\xE1pulas, b\xEDceps",tempo:"1 s subindo, 1 s segurando, 3 s voltando",how:"Abra a porta e fique de frente para a borda dela, com a porta entre os p\xE9s. Passe uma toalha em volta das duas ma\xE7anetas e segure as pontas, ou segure as duas ma\xE7anetas direto. Incline-se para tr\xE1s com os bra\xE7os esticados e o corpo reto. Puxe o peito at\xE9 a borda da porta, aperte as esc\xE1pulas e des\xE7a devagar.",tip:"Antes, confira se as ma\xE7anetas est\xE3o firmes e n\xE3o se mexem. Se algo se mexer, fa\xE7a a remada no batente (dia A) no lugar. Seguran\xE7a em primeiro lugar.",lvl:"Aproxime os p\xE9s da porta e incline-se mais para tr\xE1s."},n2:{name:"Agachamento b\xFAlgaro",muscles:"Coxa (parte da frente), gl\xFAteos",tempo:"3 s descendo, sobe",how:"Fique de costas para uma cadeira e apoie o peito do p\xE9 de tr\xE1s no assento. D\xEA um passo grande \xE0 frente com o p\xE9 da frente. Des\xE7a em 3 segundos, com o joelho de tr\xE1s indo em dire\xE7\xE3o ao ch\xE3o. Suba empurrando pelo calcanhar do p\xE9 da frente.",tip:"Coloque o p\xE9 da frente longe o bastante para o joelho ficar acima do p\xE9. Inclinar o tronco um pouco para a frente = mais gl\xFAteo.",lvl:"V\xE1 mais devagar: 4 s descendo e 2 s de pausa embaixo."},b2:{name:"Dead bug",muscles:"M\xFAsculos profundos do abd\xF4men",tempo:"devagar, 2 s indo, 2 s voltando",how:"Deite de barriga para cima, bra\xE7os esticados para o teto, pernas elevadas com os joelhos a 90\xB0. Des\xE7a devagar o bra\xE7o direito para tr\xE1s da cabe\xE7a e a perna esquerda em dire\xE7\xE3o ao ch\xE3o, depois volte e troque de lado.",tip:"A lombar tem que ficar colada no ch\xE3o o tempo todo. Se ela levantar, n\xE3o des\xE7a tanto a perna.",lvl:"Des\xE7a o bra\xE7o e a perna mais devagar, 3 s indo e 3 s voltando."},k3:{name:"Flex\xE3o diamante",muscles:"Tr\xEDceps, parte interna do peito",tempo:"3 s descendo, sobe",how:"Coloque as m\xE3os embaixo do peito, com os polegares e os indicadores se tocando e formando um diamante. Des\xE7a com os cotovelos indo para tr\xE1s rente ao corpo. O peito vai em dire\xE7\xE3o \xE0s m\xE3os.",tip:"Se os punhos ou cotovelos doerem, afaste um pouco as m\xE3os. A flex\xE3o fechada trabalha o tr\xEDceps quase igual. A vers\xE3o mais dif\xEDcil \xE9 a Flex\xE3o diamante com p\xE9s na cadeira; voc\xEA pode trocar por ela.",lvl:"Troque pela Flex\xE3o diamante com p\xE9s na cadeira (\u21C4 Trocar)."},row3:{name:"Remada aberta no batente",muscles:"Ombros (parte de tr\xE1s), parte de cima das costas",tempo:"1 s subindo, 1 s segurando, 3 s voltando",how:"Mesma posi\xE7\xE3o da remada no batente, mas segure o batente na altura do ombro e puxe o cotovelo para o lado, n\xE3o rente ao corpo. O bra\xE7o e o tronco formam um T. Voc\xEA deve sentir na parte de tr\xE1s do ombro e entre as esc\xE1pulas.",tip:"Esse \xE2ngulo trabalha a parte de tr\xE1s dos ombros e a parte de cima das costas. Eles deixam os ombros mais largos e encorpados vistos de tr\xE1s.",lvl:"Aproxime os p\xE9s do batente e incline-se mais para tr\xE1s."},n7:{name:"Flexora deslizante com toalha",muscles:"Posteriores da coxa, gl\xFAteos",tempo:"3 s esticando, 1 s voltando",how:"Deite de barriga para cima num ch\xE3o liso (madeira, piso frio), com os calcanhares sobre uma toalha ou de meias. Suba o quadril numa ponte. Deslize as pernas para a frente em 3 segundos at\xE9 ficarem quase esticadas, com o quadril ainda no alto. Depois puxe os calcanhares de volta at\xE9 os gl\xFAteos.",tip:"Est\xE1 no tapete ou n\xE3o consegue deslizar? Troque por uma ponte normal.",lvl:"Fa\xE7a com uma perna s\xF3, mantendo a outra no ar."},b4:{name:"Abdominal bicicleta",muscles:"Obl\xEDquos, abd\xF4men inteiro",tempo:"devagar, 1 s por lado",how:"Deite de barriga para cima, m\xE3os atr\xE1s da cabe\xE7a, ombros fora do ch\xE3o. Leve o cotovelo direito ao joelho esquerdo enquanto estica a perna direita. Depois troque. \xC9 o tronco que gira, n\xE3o s\xF3 os cotovelos.",tip:"V\xE1 devagar. Ficar batendo os cotovelos r\xE1pido n\xE3o adianta nada, s\xF3 for\xE7a o pesco\xE7o.",lvl:"Diminua para 2 s por lado."},kKnee:{name:"Flex\xE3o com joelhos apoiados",muscles:"Peito, tr\xEDceps, ombros (parte da frente)",tempo:"3 s descendo, sobe",how:"Fique de joelhos, m\xE3os um pouco mais abertas que os ombros. Mantenha o corpo reto dos joelhos \xE0 cabe\xE7a, sem empinar o quadril. Des\xE7a o peito at\xE9 o ch\xE3o em 3 segundos e empurre de volta para cima.",tip:"Quando fizer 20 nas duas rodadas, volte para a flex\xE3o normal."},kIncl:{name:"Flex\xE3o inclinada",muscles:"Peito, tr\xEDceps, ombros (parte da frente)",tempo:"3 s descendo, sobe",how:"Apoie as m\xE3os numa mesa firme, numa cama ou no parapeito da janela. Mantenha o corpo reto dos calcanhares \xE0 cabe\xE7a. Des\xE7a o peito at\xE9 a borda e empurre de volta. Quanto mais baixo o apoio, mais dif\xEDcil.",tip:"Uma boa substituta quando o punho d\xF3i no ch\xE3o ou quando a for\xE7a est\xE1 acabando."},superman:{name:"Superman",muscles:"Lombar, gl\xFAteos, ombros (parte de tr\xE1s)",tempo:"sobe, 2 s segurando, desce",how:"Deite de barriga para baixo com os bra\xE7os esticados \xE0 frente. Tire os bra\xE7os, o peito e as pernas do ch\xE3o ao mesmo tempo, segure 2 segundos e des\xE7a devagar. Olhe para o ch\xE3o, n\xE3o jogue o pesco\xE7o para tr\xE1s.",tip:"N\xE3o \xE9 um exerc\xEDcio de puxar como a remada, mas fortalece as costas quando voc\xEA n\xE3o tem onde fazer remada."},ytw:{name:"Y-T-W no ch\xE3o",muscles:"Meio e parte de cima das costas, ombros (parte de tr\xE1s)",tempo:"segure cada posi\xE7\xE3o por 1 s",how:"Deite de barriga para baixo, testa apoiada numa toalha. Levante os bra\xE7os esticados formando um Y e segure 1 s. Depois abra para os lados formando um T. Por fim, puxe os cotovelos at\xE9 as costelas formando um W e aperte as esc\xE1pulas. Y + T + W = 1 repeti\xE7\xE3o.",tip:"Polegares para cima, ombros longe das orelhas."},lunge:{name:"Afundo reverso",muscles:"Coxa (parte da frente), gl\xFAteos",tempo:"2 s descendo, sobe",how:"Fique em p\xE9, com a postura ereta. D\xEA um passo grande para tr\xE1s: o joelho de tr\xE1s vai quase at\xE9 o ch\xE3o e o joelho da frente dobra a 90\xB0. Empurre pelo calcanhar do p\xE9 da frente para voltar \xE0 posi\xE7\xE3o em p\xE9. Fa\xE7a todas as repeti\xE7\xF5es com uma perna, depois com a outra.",tip:"Pega mais leve nos joelhos que o afundo para a frente. Mantenha o tronco ereto."},bridge:{name:"Eleva\xE7\xE3o p\xE9lvica",muscles:"Gl\xFAteos, posteriores da coxa",tempo:"sobe, 2 s contraindo, desce",how:"Deite de barriga para cima, joelhos dobrados, p\xE9s no ch\xE3o. Empurre pelos calcanhares e suba o quadril at\xE9 o corpo formar uma linha reta dos joelhos aos ombros. Contraia os gl\xFAteos por 2 segundos l\xE1 em cima e des\xE7a devagar.",tip:"A vers\xE3o mais dif\xEDcil \xE9 a Eleva\xE7\xE3o p\xE9lvica unilateral. Quando esta ficar f\xE1cil, troque por ela."},r1e:{name:"Flex\xE3o pike com p\xE9s na cadeira",muscles:"Ombros, tr\xEDceps",tempo:"3 s descendo, sobe",how:"Coloque os p\xE9s numa cadeira e as m\xE3os no ch\xE3o um pouco \xE0 frente, com o quadril bem alto para o tronco ficar quase vertical. Dobre os cotovelos e des\xE7a a cabe\xE7a at\xE9 o ch\xE3o logo \xE0 frente das m\xE3os, cotovelos para tr\xE1s, n\xE3o para os lados. Empurre de volta para cima.",tip:"Quanto mais vertical o tronco, mais peso vai para os ombros. Contraia os gl\xFAteos para n\xE3o arquear a lombar."},k3e:{name:"Flex\xE3o diamante com p\xE9s na cadeira",muscles:"Tr\xEDceps, parte interna do peito, ombros",tempo:"3 s descendo, sobe",how:"Coloque os p\xE9s numa cadeira e as m\xE3os sob o peito, com polegares e indicadores se tocando em forma de diamante. Corpo reto da cabe\xE7a aos calcanhares. Des\xE7a com os cotovelos para tr\xE1s junto ao corpo, peito em dire\xE7\xE3o \xE0s m\xE3os. Empurre de volta para cima.",tip:"N\xE3o deixe o quadril subir nem cair. Se os punhos ou cotovelos doerem, afaste um pouco as m\xE3os."},n1q:{name:"Agachamento 1 e 1/4",muscles:"Frente das coxas, gl\xFAteos",tempo:"desce, um quarto acima, desce, sobe",how:"P\xE9s na largura dos ombros, pontas um pouco para fora. Des\xE7a at\xE9 embaixo, suba s\xF3 um quarto, des\xE7a de novo at\xE9 embaixo e s\xF3 ent\xE3o fique de p\xE9. Isso \xE9 1 repeti\xE7\xE3o. Calcanhares sempre no ch\xE3o.",tip:"Os m\xFAsculos passam duas vezes pela parte mais dif\xEDcil e profunda do agachamento, por isso \xE9 mais dif\xEDcil. N\xE3o despenque, des\xE7a com controle."},b5l:{name:"Prancha com uma perna",muscles:"Todo o core, gl\xFAteos",how:"Como a prancha normal: antebra\xE7os sob os ombros, corpo reto da cabe\xE7a aos calcanhares. Levante uma perna esticada um pouco do ch\xE3o; na metade do tempo, abaixe e levante a outra. Quadril nivelado, sem girar.",tip:"N\xE3o levante muito a perna, basta tirar do ch\xE3o. O importante \xE9 o quadril n\xE3o se mexer."},sbridge:{name:"Eleva\xE7\xE3o p\xE9lvica unilateral",muscles:"Gl\xFAteos, posteriores da coxa",tempo:"sobe, 2 s contraindo, desce",how:"Deite de costas, joelhos dobrados, p\xE9s no ch\xE3o. Estique uma perna no ar e mantenha as coxas juntas. Empurre pelo calcanhar da perna no ch\xE3o e suba o quadril at\xE9 o corpo formar uma linha reta do joelho aos ombros. Em cima, contraia os gl\xFAteos por 2 segundos e des\xE7a devagar. Primeiro todas as repeti\xE7\xF5es com uma perna, depois com a outra.",tip:"Mantenha o quadril nivelado, sem deixar cair para o lado da perna levantada. Anote o n\xFAmero de uma perna: 10 esquerda + 10 direita = anote 10."},wallsit:{name:"Cadeirinha na parede",muscles:"Coxa (parte da frente)",how:"Encoste as costas numa parede e deslize para baixo at\xE9 as coxas ficarem paralelas ao ch\xE3o e os joelhos a 90\xB0. Costas inteiras na parede, joelhos acima dos tornozelos. Segure.",tip:"N\xE3o apoie as m\xE3os nas coxas, sen\xE3o voc\xEA est\xE1 se ajudando."},birddog:{name:"Bird dog",muscles:"Core, lombar, gl\xFAteos",tempo:"estica, 2 s segurando, volta",how:"Fique de quatro apoios: m\xE3os embaixo dos ombros, joelhos embaixo do quadril. Estique o bra\xE7o direito para a frente e a perna esquerda para tr\xE1s ao mesmo tempo, com o corpo em linha reta. Segure 2 segundos, volte e troque de lado.",tip:"O quadril n\xE3o pode girar. Imagine um copo d'\xE1gua em cima da sua lombar."},hollow:{name:"Hollow body",muscles:"Core inteiro",how:"Deite de barriga para cima com os bra\xE7os esticados para tr\xE1s da cabe\xE7a. Pressione a lombar no ch\xE3o e tire os ombros e as pernas esticadas um pouco do ch\xE3o. Segure sem se mexer.",tip:"Se a lombar sair do ch\xE3o, suba mais as pernas ou dobre os joelhos."},legraise:{name:"Eleva\xE7\xE3o de pernas",muscles:"Parte de baixo do abd\xF4men, flexores do quadril",tempo:"2 s subindo, 2 s descendo",how:"Deite de barriga para cima, bra\xE7os ao lado do corpo. Suba devagar as pernas esticadas at\xE9 ficarem na vertical e des\xE7a devagar at\xE9 quase o ch\xE3o, mas sem encostar. A lombar fica no ch\xE3o.",tip:"Se a lombar doer, dobre os joelhos."}},warm:{w1:{name:"C\xEDrculos com os bra\xE7os",dose:"15\xD7 para a frente, 15\xD7 para tr\xE1s",why:"Solta os ombros antes das flex\xF5es e remadas."},w2:{name:"Balan\xE7o de pernas",dose:"10\xD7 cada perna, apoiado na parede",why:"Solta o quadril antes dos agachamentos."},w3:{name:"World's greatest stretch",dose:"5\xD7 cada lado",why:"Quadril, parte de cima das costas e posteriores de uma vez s\xF3."},w4:{name:"Inchworm",dose:"5\xD7",why:"Aquece o corpo inteiro e te leva at\xE9 a prancha."}},cool:{c1:{name:"Flexor do quadril, esquerdo",why:"Ficar muito tempo sentado (escola, computador) encurta a parte da frente do quadril. Se for fazer s\xF3 um alongamento, fa\xE7a este.",how:"Ajoelhe com o joelho esquerdo no ch\xE3o e o p\xE9 direito \xE0 frente. Contraia os gl\xFAteos e leve o quadril para a frente at\xE9 sentir alongar a parte da frente do quadril esquerdo. N\xE3o arqueie a lombar."},c2:{name:"Flexor do quadril, direito",why:"O mesmo do outro lado.",how:"Ajoelhe com o joelho direito no ch\xE3o e o p\xE9 esquerdo \xE0 frente. Contraia os gl\xFAteos e leve o quadril para a frente."},c4:{name:"Cobra",why:"Alonga o abd\xF4men e a frente do quadril. Compensa todo o enrolar dos exerc\xEDcios de abd\xF4men.",how:"Deite de bru\xE7os, palmas sob os ombros, cotovelos junto ao corpo. Deixe o quadril no ch\xE3o e empurre devagar com os bra\xE7os at\xE9 sentir um alongamento agrad\xE1vel no abd\xF4men. Ombros baixos, longe das orelhas; os cotovelos n\xE3o precisam ficar totalmente esticados. Se incomodar na lombar, des\xE7a um pouco."},c3:{name:"Postura da crian\xE7a",why:"Acalma a respira\xE7\xE3o e relaxa as costas. Puro bem-estar.",how:"Joelhos afastados, sente o quadril para tr\xE1s sobre os calcanhares, estique os bra\xE7os o mais \xE0 frente que puder, testa no ch\xE3o. Respire devagar."}},fig:{k1:["Em cima","Embaixo, cotovelos a ~45\xB0 do corpo"],k3:["Em cima","Embaixo, cotovelos junto ao corpo"],b5:["Certo: corpo reto","Errado: lombar ca\xEDda"],n1:["In\xEDcio","Embaixo, calcanhares no ch\xE3o"],r1:["Em cima","Embaixo, cabe\xE7a \xE0 frente das m\xE3os"],row1:["In\xEDcio, bra\xE7o esticado","Puxe, cotovelo para tr\xE1s"],row3:["In\xEDcio, m\xE3o na altura do ombro","Cotovelo para o lado, a ~90\xB0 do corpo"],row2:["In\xEDcio, bra\xE7os esticados","Peito at\xE9 a porta"],n2:["Em cima","Embaixo, joelho de tr\xE1s ao ch\xE3o"],b2:["In\xEDcio","Bra\xE7o e perna oposta descem"],n7:["Quadril alto, calcanhares perto dos gl\xFAteos","Deslize as pernas, quadril ainda alto"],b4:["Cotovelo no joelho oposto","Troque de lado"],kKnee:["Em cima, joelhos no ch\xE3o","Embaixo, cotovelos a ~45\xB0 do corpo"],kIncl:["M\xE3os na mesa, em cima","Peito at\xE9 a borda, cotovelos a ~45\xB0 do corpo"],superman:["De barriga para baixo","Suba e segure 2 s"],ytw:["Y: bra\xE7os na diagonal \xE0 frente","T: bra\xE7os para os lados","W: cotovelos junto \xE0s costelas"],lunge:["In\xEDcio","Passo para tr\xE1s, joelho ao ch\xE3o"],bridge:["Deite, joelhos dobrados","Quadril para cima, contraia os gl\xFAteos"],sbridge:["Deite, uma perna para cima","Quadril para cima, contraia os gl\xFAteos"],r1e:["Em cima, p\xE9s na cadeira","Embaixo, cabe\xE7a \xE0 frente das m\xE3os"],k3e:["Em cima, p\xE9s na cadeira","Embaixo, cotovelos junto ao corpo"],n1q:["At\xE9 embaixo","Um quarto acima","De novo at\xE9 embaixo","S\xF3 ent\xE3o sobe"],b5l:["Uma perna em cima","Na metade do tempo, troque de perna"],wallsit:["Joelhos ~90\xB0, costas na parede"],birddog:["De quatro apoios: bra\xE7os e joelhos ~90\xB0","Bra\xE7o e perna oposta"],hollow:["Lombar colada no ch\xE3o"],legraise:["Pernas para cima","Des\xE7a devagar, sem apoiar no ch\xE3o"],hf:["Joelho de tr\xE1s no ch\xE3o, quadril \xE0 frente"],cobra:["Quadril no ch\xE3o, peito para cima"],child:["Quadril nos calcanhares, bra\xE7os bem \xE0 frente"]},ch:{w3:"Fa\xE7a 3 treinos",pr1:"Bata um recorde pessoal",r3:"Fa\xE7a 3 rodadas uma vez",warm:"Aquecimento completo 2\xD7",cool:"Alongue depois do treino 2\xD7",push100:"100 flex\xF5es no total (de qualquer tipo)",rank:"Alcance uma nova patente",reps300:"300 repeti\xE7\xF5es no total",legs100:"100 repeti\xE7\xF5es de perna"},ach:{first:["Primeiro passo","1\xBA treino"],w5:["Toca aqui","5 treinos"],w10:["Nota dez","10 treinos"],w25:["Um quarto de s\xE9culo","25 treinos"],w50:["Meio s\xE9culo","50 treinos"],s3:["Pegando o ritmo","Sequ\xEAncia de 3"],s7:["Impar\xE1vel","S
