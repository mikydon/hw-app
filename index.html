serie",other:"{n} series"},prs:{one:"{n} r\xE9cord personal",other:"{n} r\xE9cords personales"}},units:{arm:"/brazo",leg:"/pierna",side:"/lado"},perUnit:{arm:"por brazo",leg:"por pierna",side:"por lado"},themes:{navy:"Marino",black:"Negro",forest:"Bosque",plum:"Ciruela",ocean:"Oc\xE9ano",wine:"Vino",slate:"Pizarra",coffee:"Caf\xE9"},ranks:["Madera","Hierro","Bronce","Plata","Oro","Platino","Diamante"],ex:{k1:{name:"Flexi\xF3n",muscles:"Pecho, tr\xEDceps, deltoides anterior",tempo:"3 s abajo, pausa corta, arriba",how:"Manos un poco m\xE1s abiertas que los hombros, cuerpo recto de la cabeza a los talones, abdomen y gl\xFAteos apretados. Baja durante 3 segundos hasta que el pecho casi toque el suelo, aguanta un instante y vuelve a subir. Mant\xE9n los codos a ~45\xB0 del cuerpo, no abiertos hacia los lados.",tip:"Cuando llegues a 25+ en la primera ronda, apoya las manos en dos libros gruesos. El pecho baja m\xE1s, el m\xFAsculo se estira m\xE1s y crece m\xE1s.",lvl:"Apoya las manos en dos libros gruesos para que el pecho baje m\xE1s. Al principio har\xE1s menos reps, es normal."},row1:{name:"Remo en el marco de la puerta",muscles:"Espalda (dorsales), deltoides posterior, b\xEDceps",tempo:"1 s arriba, 1 s pausa, 3 s de vuelta",how:"Ponte en una puerta abierta, de lado al marco. Agarra el marco con una mano a la altura del pecho, con los pies justo al lado del marco. Incl\xEDnate hacia atr\xE1s con el brazo estirado y el cuerpo recto. Tira de ti hacia el marco: el codo va hacia atr\xE1s pegado al cuerpo, lleva el om\xF3plato hacia atr\xE1s. Vuelve despacio. Haz todas las reps con un brazo y luego con el otro.",tip:"Cuanto m\xE1s cerca del marco est\xE9n tus pies y m\xE1s te inclines hacia atr\xE1s, m\xE1s dif\xEDcil es. Agarra el marco firme, no la puerta, y entrena sin zapatos ni calcetines para que los pies no resbalen.",lvl:"Acerca los pies al marco e incl\xEDnate m\xE1s hacia atr\xE1s."},n1:{name:"Sentadilla ATG",muscles:"Cu\xE1driceps, gl\xFAteos",tempo:"3 s abajo, 1 s de pausa abajo, arriba",how:"Pies a la anchura de los hombros, puntas un poco hacia fuera. Baja durante 3 segundos lo m\xE1s profundo que puedas, con los muslos por debajo de las rodillas y los talones en el suelo. Aguanta 1 segundo abajo y sube.",tip:"El tempo lento y la pausa abajo convierten una sentadilla f\xE1cil en dif\xEDcil. Si haces 20+ incluso con el tempo, c\xE1mbiala por la Sentadilla 1 y 1/4.",lvl:"C\xE1mbiala por la Sentadilla 1 y 1/4 (\u21C4 Cambiar)."},b5:{name:"Plancha",muscles:"Todo el core",how:"Antebrazos debajo de los hombros, cuerpo recto de la cabeza a los talones. Aprieta el abdomen y los gl\xFAteos como si alguien fuera a darte un golpe en el est\xF3mago. No dejes que la cadera suba ni se hunda.",tip:"Cuando aguantes 60 s en ambas rondas, c\xE1mbiala por la Plancha con una pierna. Es mucho m\xE1s dif\xEDcil.",lvl:"C\xE1mbiala por la Plancha con una pierna (\u21C4 Cambiar)."},r1:{name:"Flexi\xF3n pike",muscles:"Hombros, tr\xEDceps",tempo:"3 s abajo, arriba",how:"Ponte en V invertida: manos en el suelo, cadera alta, piernas lo m\xE1s rectas que puedas. Dobla los codos y baja la coronilla hacia el suelo justo delante de las manos, de modo que manos y cabeza formen un tri\xE1ngulo. Vuelve a subir.",tip:"Cuando hagas 15+ en ambas rondas, c\xE1mbiala por la Flexi\xF3n pike con pies en la silla. M\xE1s peso ir\xE1 a los hombros.",lvl:"C\xE1mbiala por la Flexi\xF3n pike con pies en la silla (\u21C4 Cambiar)."},row2:{name:"Remo con toalla en la puerta",muscles:"Espalda media, om\xF3platos, b\xEDceps",tempo:"1 s arriba, 1 s pausa, 3 s de vuelta",how:"Abre la puerta y col\xF3cate de frente al canto, con la puerta entre los pies. Pasa una toalla alrededor de los dos pomos y ag\xE1rrala por los extremos, o agarra los dos pomos directamente. Incl\xEDnate hacia atr\xE1s con los brazos estirados y el cuerpo recto. Lleva el pecho hacia el canto de la puerta, junta los om\xF3platos y baja despacio.",tip:"Primero comprueba que los pomos est\xE9n firmes y no se muevan. Si algo se mueve, haz mejor el remo en el marco de la puerta (d\xEDa A). La seguridad es lo primero.",lvl:"Acerca los pies a la puerta e incl\xEDnate m\xE1s hacia atr\xE1s."},n2:{name:"Sentadilla b\xFAlgara",muscles:"Cu\xE1driceps, gl\xFAteos",tempo:"3 s abajo, arriba",how:"Ponte delante de una silla y apoya el empeine del pie de atr\xE1s en el asiento. Da un paso largo hacia delante con el otro pie. Baja durante 3 segundos, con la rodilla de atr\xE1s yendo hacia el suelo. Sube empujando con el tal\xF3n del pie de delante.",tip:"Adelanta el pie de delante lo suficiente para que la rodilla quede sobre el pie. Inclinar un poco el torso hacia delante = m\xE1s gl\xFAteos.",lvl:"Ve m\xE1s lento: 4 s abajo y 2 s de pausa abajo."},b2:{name:"Dead bug",muscles:"M\xFAsculos abdominales profundos",tempo:"despacio, 2 s afuera, 2 s de vuelta",how:"T\xFAmbate boca arriba, brazos estirados hacia el techo, piernas en el aire con las rodillas a 90\xB0. Baja despacio el brazo derecho por detr\xE1s de la cabeza y la pierna izquierda hacia el suelo, luego vuelve y cambia de lado.",tip:"La zona lumbar tiene que quedarse pegada al suelo todo el tiempo. Si se levanta, no bajes tanto la pierna.",lvl:"Baja el brazo y la pierna m\xE1s despacio, 3 s afuera y 3 s de vuelta."},k3:{name:"Flexi\xF3n diamante",muscles:"Tr\xEDceps, parte interna del pecho",tempo:"3 s abajo, arriba",how:"Coloca las manos debajo del pecho, de modo que los pulgares y los \xEDndices se toquen y formen un diamante. Baja con los codos yendo hacia atr\xE1s pegados al cuerpo. El pecho va hacia las manos.",tip:"Si te duelen las mu\xF1ecas o los codos, separa un poco las manos. La flexi\xF3n cerrada trabaja el tr\xEDceps casi igual. La versi\xF3n m\xE1s dif\xEDcil es la Flexi\xF3n diamante con pies en la silla; puedes cambiarla por esa.",lvl:"C\xE1mbiala por la Flexi\xF3n diamante con pies en la silla (\u21C4 Cambiar)."},row3:{name:"Remo abierto en el marco de la puerta",muscles:"Deltoides posterior, espalda alta",tempo:"1 s arriba, 1 s pausa, 3 s de vuelta",how:"Misma posici\xF3n que el remo en el marco de la puerta, pero agarra el marco a la altura del hombro y lleva el codo hacia el lado, no pegado al cuerpo. El brazo y el torso forman una T. Deber\xEDas sentirlo en la parte de atr\xE1s del hombro y entre los om\xF3platos.",tip:"Este \xE1ngulo trabaja el deltoides posterior y la espalda alta. Hacen que los hombros se vean m\xE1s anchos y gruesos por detr\xE1s.",lvl:"Acerca los pies al marco e incl\xEDnate m\xE1s hacia atr\xE1s."},n7:{name:"Curl femoral con toalla",muscles:"Isquiotibiales, gl\xFAteos",tempo:"3 s afuera, 1 s de vuelta",how:"T\xFAmbate boca arriba en un suelo liso (madera, baldosas), con los talones sobre una toalla o en calcetines. Sube la cadera en puente. Desliza las piernas hacia fuera durante 3 segundos hasta que est\xE9n casi rectas, con la cadera todav\xEDa arriba. Luego lleva los talones de vuelta hacia los gl\xFAteos.",tip:"\xBFEst\xE1s en alfombra o no puedes deslizar? C\xE1mbialo por un puente normal.",lvl:"Hazlo con una pierna y mant\xE9n la otra en el aire."},b4:{name:"Abdominal bicicleta",muscles:"Oblicuos, todo el abdomen",tempo:"despacio, 1 s por lado",how:"T\xFAmbate boca arriba, manos detr\xE1s de la cabeza, hombros despegados del suelo. Lleva el codo derecho hacia la rodilla izquierda mientras estiras la pierna derecha. Luego cambia. Gira el torso, no solo los codos.",tip:"Ve despacio. Mover los codos r\xE1pido no sirve de nada, solo carga el cuello.",lvl:"Ve m\xE1s lento: 2 s por lado."},kKnee:{name:"Flexi\xF3n de rodillas",muscles:"Pecho, tr\xEDceps, deltoides anterior",tempo:"3 s abajo, arriba",how:"De rodillas, manos un poco m\xE1s abiertas que los hombros. Mant\xE9n el cuerpo recto de las rodillas a la cabeza, sin sacar la cadera. Baja el pecho al suelo durante 3 segundos y vuelve a subir.",tip:"Cuando hagas 20 en las dos rondas, vuelve a la flexi\xF3n normal."},kIncl:{name:"Flexi\xF3n inclinada",muscles:"Pecho, tr\xEDceps, deltoides anterior",tempo:"3 s abajo, arriba",how:"Apoya las manos en una mesa firme, una cama o el alf\xE9izar de una ventana. Mant\xE9n el cuerpo recto de los talones a la cabeza. Baja el pecho hacia el borde y empuja de vuelta. Cuanto m\xE1s bajo sea el apoyo, m\xE1s dif\xEDcil.",tip:"Buena alternativa cuando te duelen las mu\xF1ecas en el suelo o te quedas sin fuerza."},superman:{name:"Superman",muscles:"Zona lumbar, gl\xFAteos, deltoides posterior",tempo:"arriba, 2 s pausa, abajo",how:"T\xFAmbate boca abajo con los brazos estirados hacia delante. Levanta los brazos, el pecho y las piernas del suelo a la vez, aguanta 2 segundos y baja despacio. Mira al suelo, no eches el cuello hacia atr\xE1s.",tip:"No es un ejercicio de tir\xF3n como el remo, pero fortalece la espalda cuando no tienes d\xF3nde hacer remo."},ytw:{name:"Y-T-W en el suelo",muscles:"Espalda media y alta, deltoides posterior",tempo:"aguanta cada posici\xF3n 1 s",how:"T\xFAmbate boca abajo, con la frente sobre una toalla. Levanta los brazos estirados en Y y aguanta 1 s. Luego \xE1brelos a los lados en T. Por \xFAltimo, lleva los codos hacia las costillas en W y junta los om\xF3platos. Y + T + W = 1 rep.",tip:"Pulgares hacia arriba, hombros lejos de las orejas."},lunge:{name:"Zancada hacia atr\xE1s",muscles:"Cu\xE1driceps, gl\xFAteos",tempo:"2 s abajo, arriba",how:"De pie, con la espalda recta. Da un paso largo hacia atr\xE1s: la rodilla de atr\xE1s baja casi hasta el suelo y la de delante se dobla a 90\xB0. Empuja con el tal\xF3n del pie de delante para volver a ponerte de pie. Haz todas las reps con una pierna y luego con la otra.",tip:"Es m\xE1s suave para las rodillas que la zancada hacia delante. Mant\xE9n el torso erguido."},bridge:{name:"Puente de gl\xFAteos",muscles:"Gl\xFAteos, isquiotibiales",tempo:"arriba, 2 s apretando, abajo",how:"T\xFAmbate boca arriba, rodillas dobladas, pies en el suelo. Empuja con los talones y sube la cadera hasta que el cuerpo forme una l\xEDnea recta de las rodillas a los hombros. Aprieta los gl\xFAteos 2 segundos arriba y baja despacio.",tip:"La versi\xF3n m\xE1s dif\xEDcil es el Puente a una pierna. Cuando este te resulte f\xE1cil, c\xE1mbialo por ese."},r1e:{name:"Flexi\xF3n pike con pies en la silla",muscles:"Hombros, tr\xEDceps",tempo:"3 s abajo, arriba",how:"Pon los pies en una silla y las manos en el suelo un poco por delante, con la cadera alta para que el torso quede casi vertical. Dobla los codos y baja la cabeza al suelo justo delante de las manos, con los codos hacia atr\xE1s, no hacia los lados. Vuelve a subir.",tip:"Cuanto m\xE1s vertical el torso, m\xE1s peso va a los hombros. Aprieta los gl\xFAteos para no arquear la zona lumbar."},k3e:{name:"Flexi\xF3n diamante con pies en la silla",muscles:"Tr\xEDceps, pecho interior, hombros",tempo:"3 s abajo, arriba",how:"Pon los pies en una silla y las manos bajo el pecho de modo que pulgares e \xEDndices se toquen y formen un diamante. Cuerpo recto de la cabeza a los talones. Baja con los codos hacia atr\xE1s pegados al cuerpo y el pecho hacia las manos. Vuelve a subir.",tip:"Que la cadera no suba ni se hunda. Si te duelen las mu\xF1ecas o los codos, separa un poco las manos."},n1q:{name:"Sentadilla 1 y 1/4",muscles:"Parte delantera del muslo, gl\xFAteos",tempo:"abajo, un cuarto arriba, abajo, arriba",how:"Pies a la anchura de los hombros, puntas un poco hacia fuera. Baja del todo, sube solo un cuarto, vuelve a bajar del todo y solo entonces ponte de pie. Eso es 1 rep. Talones siempre en el suelo.",tip:"Los m\xFAsculos pasan dos veces por la parte m\xE1s dura y profunda de la sentadilla, por eso es m\xE1s dif\xEDcil. No te dejes caer, baja con control."},b5l:{name:"Plancha con una pierna",muscles:"Todo el core, gl\xFAteos",how:"Como la plancha normal: antebrazos bajo los hombros, cuerpo recto de la cabeza a los talones. Levanta una pierna estirada un poco del suelo; a mitad de tiempo b\xE1jala y levanta la otra. Cadera nivelada, sin girarla.",tip:"No subas mucho la pierna, basta con despegarla del suelo. Lo importante es que la cadera no se mueva."},sbridge:{name:"Puente a una pierna",muscles:"Gl\xFAteos, isquiotibiales",tempo:"arriba, 2 s apretando, abajo",how:"T\xFAmbate boca arriba, rodillas dobladas, pies en el suelo. Estira una pierna en el aire y mant\xE9n los muslos juntos. Empuja con el tal\xF3n de la pierna apoyada y sube la cadera hasta que el cuerpo forme una l\xEDnea recta de la rodilla a los hombros. Arriba aprieta los gl\xFAteos 2 segundos y baja despacio. Primero todas las reps con una pierna y luego con la otra.",tip:"Mant\xE9n la cadera nivelada, que no caiga hacia el lado de la pierna levantada. Apunta el n\xFAmero de una pierna: 10 izquierda + 10 derecha = apunta 10."},wallsit:{name:"Sentadilla en pared",muscles:"Cu\xE1driceps",how:"Apoya la espalda en una pared y desl\xEDzate hacia abajo hasta que los muslos queden paralelos al suelo y las rodillas a 90\xB0. Toda la espalda en la pared, rodillas sobre los tobillos. Aguanta.",tip:"No apoyes las manos en los muslos, o te estar\xE1s ayudando."},birddog:{name:"Bird dog",muscles:"Core, zona lumbar, gl\xFAteos",tempo:"estira, 2 s pausa, vuelve",how:"Ponte en cuatro apoyos: manos debajo de los hombros, rodillas debajo de la cadera. Estira a la vez el brazo derecho hacia delante y la pierna izquierda hacia atr\xE1s, con el cuerpo en l\xEDnea recta. Aguanta 2 segundos, vuelve y cambia de lado.",tip:"La cadera no debe girar. Imagina un vaso de agua sobre la zona lumbar."},hollow:{name:"Hollow body",muscles:"Todo el core",how:"T\xFAmbate boca arriba con los brazos estirados por detr\xE1s de la cabeza. Pega la zona lumbar al suelo y levanta un poco del suelo los hombros y las piernas estiradas. Aguanta sin moverte.",tip:"Si la zona lumbar se despega del suelo, sube m\xE1s las piernas o d\xF3blalas."},legraise:{name:"Elevaci\xF3n de piernas",muscles:"Abdomen inferior, flexores de cadera",tempo:"2 s arriba, 2 s abajo",how:"T\xFAmbate boca arriba, brazos a los lados. Sube despacio las piernas estiradas hasta que queden verticales y b\xE1jalas despacio casi hasta el suelo, pero sin apoyarlas. La zona lumbar se queda en el suelo.",tip:"Si te duele la zona lumbar, dobla las rodillas."}},warm:{w1:{name:"C\xEDrculos de brazos",dose:"15\xD7 hacia delante, 15\xD7 hacia atr\xE1s",why:"Suelta los hombros antes de las flexiones y los remos."},w2:{name:"Balanceo de piernas",dose:"10\xD7 cada pierna, apoy\xE1ndote en una pared",why:"Suelta la cadera antes de las sentadillas."},w3:{name:"El mejor estiramiento del mundo",dose:"5\xD7 cada lado",why:"Cadera, espalda alta e isquiotibiales a la vez."},w4:{name:"Inchworm (gusano)",dose:"5\xD7",why:"Calienta todo el cuerpo y te lleva a la posici\xF3n de plancha."}},cool:{c1:{name:"Flexor de cadera, izquierda",why:"Pasar muchas horas en la silla (clases, PC) acorta la parte delantera de la cadera. Si solo haces un estiramiento, que sea este.",how:"Apoya la rodilla izquierda en el suelo, con el pie derecho delante. Aprieta los gl\xFAteos y lleva la cadera hacia delante hasta notar el estiramiento en la parte delantera de la cadera izquierda. No arquees la zona lumbar."},c2:{name:"Flexor de cadera, derecha",why:"Lo mismo del otro lado.",how:"Apoya la rodilla derecha en el suelo, con el pie izquierdo delante. Aprieta los gl\xFAteos y lleva la cadera hacia delante."},c4:{name:"Cobra",why:"Estira el abdomen y la parte delantera de la cadera. Compensa todo el encogerse de los ejercicios de abdomen.",how:"T\xFAmbate boca abajo, palmas bajo los hombros, codos pegados al cuerpo. Deja la cadera en el suelo y empuja despacio con los brazos hacia arriba hasta notar un estiramiento agradable en el abdomen. Hombros abajo, lejos de las orejas; los codos no tienen que estar del todo estirados. Si te pincha la zona lumbar, baja un poco."},c3:{name:"Postura del ni\xF1o",why:"Calma la respiraci\xF3n y relaja la espalda. Solo para sentirte bien.",how:"Rodillas separadas, si\xE9ntate con la cadera sobre los talones, estira los brazos hacia delante todo lo que puedas, frente en el suelo. Respira despacio."}},fig:{k1:["Arriba","Abajo, codos a ~45\xB0 del cuerpo"],k3:["Arriba","Abajo, codos pegados"],b5:["Bien: cuerpo recto","Mal: lumbar hundida"],n1:["Inicio","Abajo, talones en el suelo"],r1:["Arriba","Abajo, cabeza delante de las manos"],row1:["Inicio, brazo estirado","Tira, codo atr\xE1s"],row3:["Inicio, mano a la altura del hombro","Codo hacia el lado, a ~90\xB0 del cuerpo"],row2:["Inicio, brazos estirados","Pecho hacia la puerta"],n2:["Arriba","Abajo, rodilla de atr\xE1s al suelo"],b2:["Inicio","Brazo y pierna contraria abajo"],n7:["Cadera arriba, talones cerca de los gl\xFAteos","Piernas afuera, cadera arriba"],b4:["Codo a la rodilla contraria","Cambia de lado"],kKnee:["Arriba, rodillas en el suelo","Abajo, codos a ~45\xB0 del cuerpo"],kIncl:["Manos en la mesa, arriba","Pecho al borde, codos a ~45\xB0 del cuerpo"],superman:["Boca abajo","Levanta y aguanta 2 s"],ytw:["Y: brazos en diagonal al frente","T: brazos a los lados","W: codos a las costillas"],lunge:["Inicio","Paso atr\xE1s, rodilla al suelo"],bridge:["Boca arriba, rodillas dobladas","Cadera arriba, aprieta gl\xFAteos"],sbridge:["Boca arriba, una pierna arriba","Cadera arriba, aprieta gl\xFAteos"],r1e:["Arriba, pies en la silla","Abajo, cabeza delante de las manos"],k3e:["Arriba, pies en la silla","Abajo, codos pegados"],n1q:["Abajo del todo","Un cuarto arriba","Otra vez abajo del todo","Solo entonces arriba"],b5l:["Una pierna arriba","A mitad de tiempo, cambia de pierna"],wallsit:["Rodillas ~90\xB0, espalda en la pared"],birddog:["En cuatro apoyos: brazos y rodillas ~90\xB0","Brazo y pierna contraria"],hollow:["Lumbar pegada al suelo"],legraise:["Piernas arriba","Baja despacio, sin apoyarlas en el suelo"],hf:["Rodilla de atr\xE1s abajo, cadera adelante"],cobra:["Cadera en el suelo, pecho arriba"],child:["Cadera a los talones, brazos bien adelante"]},ch:{w3:"Haz 3 entrenamientos",pr1:"Supera un r\xE9cord personal",r3:"Haz 3 rondas una vez",warm:"Calentamiento completo 2\xD7",cool:"Estira despu\xE9s de entrenar 2\xD7",push100:"100 flexiones en total (de cualquier tipo)",rank:"Consigue un rango nuevo",reps300:"300 reps en total",legs100:"100 reps de piernas"},ach:{first:["Primer paso","1.er entrenamiento"],w5:["Choca esos cinco","5 entrenamientos"],w10:["Un diez","10 entrenamientos"],w25:["Cuarto de siglo","25 entrenamientos"],w50:["Medio siglo","50 entrenamientos"],s3:["En racha","Racha de 3"],s7:["Imparable","Racha de 7"],s15:["Disciplina","Racha de 15"],pr:["Rompe r\xE9cords","1.er r\xE9cord personal"],gold:["De oro","Oro en 1 ejercicio"],diamond:["Diamante","Diamante en 1 ejercicio"],week:["Semana perfecta","Los 3 retos"],lvl5:["Nivel 5","Llega al nivel 5"],r3:["Tres rondas","Haz 3 rondas"],push30:["Treinta","30 flexiones en una serie"]},quotes:["La disciplina te lleva adonde la motivaci\xF3n no llega.","No hace falta que te apetezca. Haz la primera serie, lo dem\xE1s viene solo.","Cada rep es un ladrillo. Un cuerpo se construye ladrillo a ladrillo.","13 minutos hoy. Un cuerpo para toda la vida.","Nunca faltes dos veces seguidas.","Pasos peque\xF1os en d\xEDas alternos valen m\xE1s que grandes planes que nunca empiezas.","Tu yo del futuro te dar\xE1 las gracias por hoy.","No se trata del entrenamiento perfecto. Se trata de no faltar.","Donde empieza a quemar, empieza el crecimiento.","Comp\xE1rate solo con quien eras la semana pasada.","Mientras otros buscan motivaci\xF3n, t\xFA ya entrenaste.","Series duras, vida m\xE1s f\xE1cil.","Toda persona fuerte empez\xF3 desde cero."],restDay:["El m\xFAsculo se construye entrenando, pero crece comiendo y durmiendo.","Hoy toca descanso. Tambi\xE9n es parte del plan.","Descansar no es pereza. Ahora mismo est\xE1s creciendo.","El trabajo est\xE1 hecho. Ahora deja que tu cuerpo se reconstruya.","Come bien, duerme bien. Eso tambi\xE9n es entrenar.","La fuerza no se construye en un d\xEDa. Se construye un d\xEDa s\xED y otro no, mes tras mes.","Quien sabe descansar aguanta m\xE1s.","Hoy recargas pilas para tu pr\xF3ximo entrenamiento.","La constancia es tu superpoder. Mantenla.","El progreso no siempre se ve enseguida. Pero est\xE1 pasando.","Si\xE9ntete orgulloso de no rendirte.","Hoy es d\xEDa de recuperaci\xF3n. Disfr\xFAtalo.","Pasos peque\xF1os, muchos d\xEDas seguidos. As\xED llegan los grandes cambios."],doneTitles:["Hoy ya entrenaste","Listo por hoy","Hoy, tachado","\xA1Misi\xF3n cumplida!"],doneSubs:["D\xEDa {day} hecho. Ahora come y duerme: tus m\xFAsculos crecen mientras descansas.","El d\xEDa {day} ya est\xE1. Buen trabajo, ahora descansa.","D\xEDa {day} hecho. Otro ladrillo en el muro.","D\xEDa {day} registrado. Tu pr\xF3ximo entrenamiento es en dos d\xEDas.","D\xEDa {day} completado. Ahora trabaja tu cuerpo; t\xFA disfruta del resto del d\xEDa.","D\xEDa {day} superado. As\xED se construye la disciplina."],facts:["Puedes entrenar todos los d\xEDas, pero en d\xEDas alternos es lo mejor. Los m\xFAsculos crecen mientras descansas, no mientras entrenas.","El sue\xF1o es tu mejor suplemento. 7\u20139 horas por noche = recuperaci\xF3n m\xE1s r\xE1pida.","Las \xFAltimas reps de una serie son las que m\xE1s trabajan. Son las que construyen m\xFAsculo.","Bajar despacio (3 segundos) da m\xE1s trabajo a tus m\xFAsculos que las reps r\xE1pidas.","Tomar prote\xEDna en cada comida ayuda a que tus m\xFAsculos crezcan.","La constancia gana a la intensidad. Mejor 13 minutos en d\xEDas alternos que una hora una vez al mes.","Bebe un poco de agua. Incluso una sed leve baja tu rendimiento.","Respira despacio: inhala por la nariz, exhala por la boca. Te calmar\xE1s antes.","Rango de movimiento completo = m\xE1s m\xFAsculo trabajando. Menos reps, pero completas."],moti:["Creo en ti, \xA1t\xFA puedes! \u{1F4AA}","Cada serie te acerca a tu meta.","Tienes m\xE1s fuerza de la que crees.","Solo un poco m\xE1s, t\xFA puedes.","Hoy cuenta. No te rindas.","Este es el momento en que creces.","Tu yo del futuro te lo agradecer\xE1."],cheers:["\xA1Serie potente!","\xA1As\xED se hace!","\xA1Modo bestia!","\xA1Est\xE1s que ardes!","\xA1Trabajo limpio!","Este es el camino a un cuerpo fuerte.","\xA1Ya casi!"],finish:["Otro ladrillo en el muro. As\xED se hace.","Listo. Ahora come bien y duerme, que es cuando crece el m\xFAsculo.","La fuerza no es talento. Es la suma de d\xEDas exactamente como este.","Listo. Esto es disciplina en acci\xF3n.","Hoy hiciste lo que la mayor\xEDa solo planea."]};var xp={ui:{loading:"Chargement\u2026",close:"Fermer",cancel:"Annuler",save:"Enregistrer",home:"Accueil",back:"Retour",start:"D\xE9marrer",stop:"Arr\xEAter",copied:"\u2713 Copi\xE9",dayN:"Jour {d}",tabTrain:"Entra\xEEnement",tabHistory:"Historique",tabSettings:"R\xE9glages",tabProfile:"Profil",mainMenu:"Menu principal",openProfile:"Ouvrir le profil",streakAria:"Flamme {n}",levelAria:"Niveau {n}",weeklyChallenges:"D\xE9fis de la semaine",chLeft:"{done}/3, encore {left}",chFooter:"R\xE9ussis les 3 pour gagner un \u{1F9CA} gel de flamme.",firstWorkout:"Ta premi\xE8re s\xE9ance. C'est parti.",anytime:"Quand tu veux.",idealOn:"Id\xE9alement le {date}, puisque tu t'entra\xEEnes un jour sur deux.",trainedYesterday:"Tu as fait le jour {day} hier. Le plan (un jour sur deux) pr\xE9voit la prochaine s\xE9ance demain, mais tu peux aussi y aller aujourd'hui.",streakAtRisk:"Aujourd'hui, c'est jour d'entra\xEEnement. Si tu le sautes, ta flamme \u{1F525} de {n} s'\xE9teint demain.",trainingDay:"Aujourd'hui, c'est jour d'entra\xEEnement. Derni\xE8re s\xE9ance : {date} ({ago}).",welcomeTitle:"Bienvenue ! \u{1F44B}",welcome1:"Tu t'entra\xEEnes \xE0 la maison, sans mat\xE9riel, pendant ~13 minutes. Tu alternes les jours A, B et C, un jour sur deux. Chaque s\xE9ance comprend un \xE9chauffement, puis 4 exercices en circuit (2 ou 3 tours) et des \xE9tirements facultatifs.",welcome2:"Touche un exercice pour voir un dessin, les consignes et une vid\xE9o. Si un exercice ne te convient pas, remplace-le pendant la s\xE9ance avec le bouton \u21C4. Aj ges restent.",resetAllTitle:"Repartir de z\xE9ro ?",resetAllBody:"Toutes tes s\xE9ances ({count}) seront supprim\xE9es, avec tout ce qui en d\xE9coule : XP, niveaux, s\xE9rie, gels, rangs et badges. Ton nom, ta photo et tes r\xE9glages restent. Impossible d'annuler, alors enregistre d'abord une sauvegarde si tu pourrais vouloir r\xE9cup\xE9rer les donn\xE9es.",resetAllBackup:"\u{1F4BE} D'abord une sauvegarde",resetAllYes:"Oui, tout supprimer",msgResetAll:"\u2713 C'est fait. Tu repars de z\xE9ro."},pl:{workouts:{one:"{n} s\xE9ance",many:"{n} s\xE9ances",other:"{n} s\xE9ances"},days:{one:"{n} jour",many:"{n} jours",other:"{n} jours"},daysAgo:{one:"il y a {n} jour",many:"il y a {n} jours",other:"il y a {n} jours"},rounds:{one:"{n} tour",many:"{n} tours",other:"{n} tours"},sets:{one:"{n} s\xE9rie",many:"{n} s\xE9ries",other:"{n} s\xE9ries"},prs:{one:"{n} record perso",many:"{n} records perso",other:"{n} records perso"}},units:{arm:"/bras",leg:"/jambe",side:"/c\xF4t\xE9"},perUnit:{arm:"par bras",leg:"par jambe",side:"par c\xF4t\xE9"},themes:{navy:"Marine",black:"Noir",forest:"For\xEAt",plum:"Prune",ocean:"Oc\xE9an",wine:"Vin",slate:"Ardoise",coffee:"Caf\xE9"},ranks:["Bois","Fer","Bronze","Argent","Or","Platine","Diamant"],ex:{k1:{name:"Pompe",muscles:"Pectoraux, triceps, avant des \xE9paules",tempo:"3 s en descente, courte pause, remont\xE9e",how:"Mains un peu plus \xE9cart\xE9es que les \xE9paules, corps align\xE9 de la t\xEAte aux talons, abdos et fessiers contract\xE9s. Descends en 3 secondes jusqu'\xE0 ce que ta poitrine fr\xF4le le sol, marque une courte pause et repousse vers le haut. Garde les coudes \xE0 ~45\xB0 du corps, pas \xE9cart\xE9s sur les c\xF4t\xE9s.",tip:"D\xE8s que tu fais 25+ au premier tour, pose tes mains sur deux gros livres. Ta poitrine descend plus bas, le muscle s'\xE9tire davantage et se d\xE9veloppe plus.",lvl:"Pose tes mains sur deux gros livres pour que ta poitrine descende plus bas. Tes chiffres vont baisser au d\xE9but, c'est normal."},row1:{name:"Rowing au cadre de porte",muscles:"Dos (grands dorsaux), arri\xE8re des \xE9paules, biceps",tempo:"1 s en tirant, 1 s de maintien, 3 s en revenant",how:"Place-toi dans l'embrasure d'une porte ouverte, de profil par rapport au cadre. Attrape le cadre d'une main \xE0 hauteur de poitrine, pieds tout pr\xE8s du cadre. Penche-toi en arri\xE8re, bras tendu et corps droit. Tire-toi vers le cadre : le coude part en arri\xE8re le long du corps, serre l'omoplate vers l'arri\xE8re. Reviens lentement. Fais toutes les r\xE9p\xE9titions d'un bras, puis de l'autre.",tip:"Plus tes pieds sont proches du cadre et plus tu te penches en arri\xE8re, plus c'est dur. Tiens le cadre solide, pas la porte, et entra\xEEne-toi pieds nus pour ne pas glisser.",lvl:"Rapproche tes pieds du cadre et penche-toi plus en arri\xE8re."},n1:{name:"Squat ATG",muscles:"Quadriceps, fessiers",tempo:"3 s en descente, 1 s de pause en bas, remont\xE9e",how:"Pieds \xE9cart\xE9s \xE0 largeur d'\xE9paules, pointes l\xE9g\xE8rement vers l'ext\xE9rieur. Descends en 3 secondes aussi bas que possible, cuisses sous les genoux, talons au sol. Tiens 1 seconde en bas et remonte.",tip:"Le tempo lent et la pause en bas rendent un squat facile difficile. Si tu fais 20+ m\xEAme avec le tempo, remplace-le par le Squat 1 et 1/4.",lvl:"Remplace-le par le Squat 1 et 1/4 (\u21C4 Remplacer)."},b5:{name:"Gainage (planche)",muscles:"Toute la sangle abdominale",how:"Avant-bras sous les \xE9paules, corps align\xE9 de la t\xEAte aux talons. Contracte abdos et fessiers comme si quelqu'un allait te donner un coup dans le ventre. Ne laisse pas tes hanches monter ni s'affaisser.",tip:"Quand tu tiens 60 s aux deux tours, remplace-la par la Planche sur une jambe. C'est bien plus dur.",lvl:"Remplace-la par la Planche sur une jambe (\u21C4 Remplacer)."},r1:{name:"Pompe pike",muscles:"\xC9paules, triceps",tempo:"3 s en descente, remont\xE9e",how:"Mets-toi en V invers\xE9 : mains au sol, hanches hautes, jambes aussi tendues que possible. Plie les coudes et descends le sommet de la t\xEAte vers le sol, juste devant tes mains, pour que tes mains et ta t\xEAte forment un triangle. Repousse vers le haut.",tip:"Quand tu fais 15+ aux deux tours, remplace-les par les Pompes pik\xE9 pieds sur une chaise. Plus de ton poids va sur les \xE9paules.",lvl:"Remplace-les par les Pompes pik\xE9 pieds sur une chaise (\u21C4 Remplacer)."},row2:{name:"Rowing \xE0 la porte avec serviette",muscles:"Milieu du dos, omoplates, biceps",tempo:"1 s en tirant, 1 s de maintien, 3 s en revenant",how:"Ouvre la porte et place-toi face \xE0 sa tranche, la porte entre tes pieds. Passe une serviette autour des deux poign\xE9es et tiens-en les extr\xE9mit\xE9s, ou attrape directement les deux poign\xE9es. Penche-toi en arri\xE8re, bras tendus et corps droit. Tire ta poitrine vers la tranche de la porte, serre les omoplates et redescends lentement.",tip:"V\xE9rifie d'abord que les poign\xE9es sont solides et ne bougent pas. Si quelque chose bouge, fais plut\xF4t le rowing au cadre de porte (jour A). La s\xE9curit\xE9 d'abord.",lvl:"Rapproche tes pieds de la porte et penche-toi plus en arri\xE8re."},n2:{name:"Squat bulgare",muscles:"Quadriceps, fessiers",tempo:"3 s en descente, remont\xE9e",how:"Dos \xE0 une chaise, pose le dessus de ton pied arri\xE8re sur l'assise. Fais un grand pas en avant avec le pied avant. Descends en 3 secondes, le genou arri\xE8re va vers le sol. Remonte en poussant dans le talon du pied avant.",tip:"Place ton pied avant assez loin pour que ton genou reste au-dessus du pied. Buste l\xE9g\xE8rement pench\xE9 en avant = plus de fessiers.",lvl:"Ralentis : 4 s en descente et 2 s de pause en bas."},b2:{name:"Dead bug",muscles:"Abdominaux profonds",tempo:"lentement, 2 s pour tendre, 2 s pour revenir",how:"Allonge-toi sur le dos, bras tendus vers le plafond, jambes lev\xE9es, genoux \xE0 90\xB0. Descends lentement le bras droit derri\xE8re la t\xEAte et la jambe gauche vers le sol, puis reviens et change de c\xF4t\xE9.",tip:"Le bas du dos doit rester plaqu\xE9 au sol tout le temps. S'il se d\xE9colle, descends moins la jambe.",lvl:"Descends le bras et la jambe plus lentement : 3 s pour tendre, 3 s pour revenir."},k3:{name:"Pompe diamant",muscles:"Triceps, int\xE9rieur des pectoraux",tempo:"3 s en descente, remont\xE9e",how:"Place tes mains sous ta poitrine, pouces et index qui se touchent pour former un diamant. Descends, coudes vers l'arri\xE8re le long du corps. Ta poitrine va vers tes mains.",tip:"Si tes poignets ou tes coudes font mal, \xE9carte un peu les mains. Les pompes serr\xE9es travaillent presque autant les triceps. La version plus dure : Pompes diamant pieds sur une chaise, tu peux les remplacer par celles-ci.",lvl:"Remplace-les par les Pompes diamant pieds sur une chaise (\u21C4 Remplacer)."},row3:{name:"Rowing large au cadre de porte",muscles:"Arri\xE8re des \xE9paules, haut du dos",tempo:"1 s en tirant, 1 s de maintien, 3 s en revenant",how:"M\xEAme position que pour le rowing au cadre de porte, mais attrape le cadre \xE0 hauteur d'\xE9paule et tire le coude sur le c\xF4t\xE9, pas le long du corps. Ton bras et ton buste forment un T. Tu dois le sentir \xE0 l'arri\xE8re de l'\xE9paule et entre les omoplates.",tip:"Cet angle travaille l'arri\xE8re des \xE9paules et le haut du dos. Vu de dos, ce sont eux qui rendent tes \xE9paules plus larges et plus \xE9paisses.",lvl:"Rapproche tes pieds du cadre et penche-toi plus en arri\xE8re."},n7:{name:"Leg curl gliss\xE9 (serviette)",muscles:"Ischio-jambiers, fessiers",tempo:"3 s pour tendre, 1 s pour revenir",how:"Allonge-toi sur le dos sur un sol lisse (parquet, carrelage), talons sur une serviette ou en chaussettes. Monte les hanches en pont. Fais glisser tes jambes vers l'avant en 3 secondes jusqu'\xE0 ce qu'elles soient presque tendues, hanches toujours en l'air. Puis ram\xE8ne tes talons vers tes fessiers.",tip:"Sur la moquette ou \xE7a ne glisse pas ? Remplace-le par un pont classique.",lvl:"Fais-le sur une jambe, garde l'autre en l'air."},b4:{name:"Crunch bicyclette",muscles:"Obliques, tous les abdos",tempo:"lentement, 1 s par c\xF4t\xE9",how:"Allonge-toi sur le dos, mains derri\xE8re la t\xEAte, \xE9paules d\xE9coll\xE9es du sol. Am\xE8ne le coude droit vers le genou gauche en tendant la jambe droite. Puis change. C'est le buste qui tourne, pas seulement les coudes.",tip:"Va lentement. Agiter vite les coudes ne sert \xE0 rien, \xE0 part tirer sur ta nuque.",lvl:"Ralentis \xE0 2 s par c\xF4t\xE9."},kKnee:{name:"Pompe sur les genoux",muscles:"Pectoraux, triceps, avant des \xE9paules",tempo:"3 s en descente, remont\xE9e",how:"\xC0 genoux, mains un peu plus \xE9cart\xE9es que les \xE9paules. Garde le corps align\xE9 des genoux \xE0 la t\xEAte, sans sortir les fesses. Descends la poitrine vers le sol en 3 secondes et repousse.",tip:"D\xE8s que tu en fais 20 aux deux tours, reviens \xE0 la pompe classique."},kIncl:{name:"Pompe inclin\xE9e",muscles:"Pectoraux, triceps, avant des \xE9paules",tempo:"3 s en descente, remont\xE9e",how:"Pose tes mains sur une table solide, un lit ou un rebord de fen\xEAtre. Garde le corps align\xE9 des talons \xE0 la t\xEAte. Descends la poitrine vers le bord et repousse. Plus l'appui est bas, plus c'est dur.",tip:"Un bon remplacement quand tes poignets font mal au sol ou que tu commences \xE0 manquer de force."},superman:{name:"Superman",muscles:"Bas du dos, fessiers, arri\xE8re des \xE9paules",tempo:"mont\xE9e, 2 s de maintien, descente",how:"Allonge-toi sur le ventre, bras tendus devant toi. D\xE9colle en m\xEAme temps les bras, la poitrine et les jambes du sol, tiens 2 secondes et redescends lentement. Regarde le sol, ne bascule pas la t\xEAte en arri\xE8re.",tip:"Ce n'est pas un tirage comme le rowing, mais \xE7a renforce ton dos quand tu n'as rien pour faire du rowing."},ytw:{name:"Y-T-W au sol",muscles:"Milieu et haut du dos, arri\xE8re des \xE9paules",tempo:"tiens chaque position 1 s",how:"Allonge-toi sur le ventre, front sur une serviette. L\xE8ve tes bras tendus en Y et tiens 1 s. Puis ouvre-les sur les c\xF4t\xE9s en T. Enfin, ram\xE8ne les coudes vers les c\xF4tes en W et serre les omoplates. Y + T + W = 1 r\xE9p\xE9tition.",tip:"Pouces vers le haut, garde les \xE9paules loin des oreilles."},lunge:{name:"Fente arri\xE8re",muscles:"Quadriceps, fessiers",tempo:"2 s en descente, remont\xE9e",how:"Debout, le buste droit. Fais un grand pas en arri\xE8re : le genou arri\xE8re descend presque au sol et le genou avant se plie \xE0 90\xB0. Pousse dans le talon du pied avant pour revenir debout. Fais toutes les r\xE9p\xE9titions d'une jambe, puis de l'autre.",tip:"Plus douce pour les genoux qu'une fente avant. Garde le buste droit."},bridge:{name:"Pont fessier",muscles:"Fessiers, ischio-jambiers",tempo:"mont\xE9e, 2 s de contraction, descente",how:"Allonge-toi sur le dos, genoux pli\xE9s, pieds au sol. Pousse dans les talons et monte les hanches jusqu'\xE0 ce que ton corps forme une ligne droite des genoux aux \xE9paules. Serre les fessiers 2 secondes en haut et redescends lentement.",tip:"La version plus dure est le Pont sur une jambe. Quand celui-ci devient facile, remplace-le par celui-l\xE0."},r1e:{name:"Pompes pik\xE9 pieds sur une chaise",muscles:"\xC9paules, triceps",tempo:"3 s en bas, en haut",how:"Pose les pieds sur une chaise, les mains au sol un peu devant, et monte les hanches pour que ton buste soit presque vertical. Plie les coudes et descends la t\xEAte vers le sol juste devant les mains, coudes vers l'arri\xE8re, pas sur les c\xF4t\xE9s. Repousse vers le haut.",tip:"Plus le buste est vertical, plus le poids va sur les \xE9paules. Serre les fessiers pour ne pas cambrer le bas du dos."},k3e:{name:"Pompes diamant pieds sur une chaise",muscles:"Triceps, int\xE9rieur des pectoraux, \xE9paules",tempo:"3 s en bas, en haut",how:"Pose les pieds sur une chaise et les mains sous la poitrine, pouces et index qui se touchent pour former un diamant. Corps align\xE9 de la t\xEAte aux talons. Descends, coudes vers l'arri\xE8re le long du corps, poitrine vers les mains. Repousse vers le haut.",tip:"Ne l\xE8ve pas les hanches et ne les laisse pas tomber. Si tes poignets ou tes coudes font mal, \xE9carte un peu les mains."},n1q:{name:"Squat 1 et 1/4",muscles:"Avant des cuisses, fessiers",tempo:"en bas, un quart en haut, en bas, en haut",how:"Pieds \xE0 largeur d'\xE9paules, pointes un peu vers l'ext\xE9rieur. Descends tout en bas, remonte seulement d'un quart, redescends tout en bas et seulement ensuite rel\xE8ve-toi. \xC7a fait 1 r\xE9p\xE9tition. Talons toujours au sol.",tip:"Les muscles passent deux fois par la partie la plus dure et la plus profonde du squat, d'o\xF9 la difficult\xE9. Ne te laisse pas tomber, descends avec contr\xF4le."},b5l:{name:"Planche sur une jambe",muscles:"Tout le gainage, fessiers",how:"Comme une planche normale : avant-bras sous les \xE9paules, corps align\xE9 de la t\xEAte aux talons. L\xE8ve une jambe tendue un peu du sol ; \xE0 mi-temps, repose-la et l\xE8ve l'autre. Garde les hanches \xE0 plat, sans les tourner.",tip:"Ne l\xE8ve pas la jambe haut, juste au-dessus du sol suffit. Le but est que les hanches ne bougent pas."},sbridge:{name:"Pont sur une jambe",muscles:"Fessiers, ischio-jambiers",tempo:"mont\xE9e, 2 s de contraction, descente",how:"Allonge-toi sur le dos, genoux pli\xE9s, pieds au sol. Tends une jambe en l'air et garde les cuisses l'une contre l'autre. Pousse dans le talon de la jambe au sol et monte les hanches jusqu'\xE0 ce que ton corps forme une ligne droite du genou aux \xE9paules. En haut, serre les fessiers 2 secondes et redescends lentement. D'abord toutes les r\xE9p\xE9titions d'une jambe, puis de l'autre.",tip:"Garde les hanches \xE0 niveau, ne les laisse pas tomber du c\xF4t\xE9 de la jambe lev\xE9e. Note le nombre pour une jambe : 10 \xE0 gauche + 10 \xE0 droite = note 10."},wallsit:{name:"Chaise (wall sit)",muscles:"Quadriceps",how:"Plaque ton dos contre un mur et descends jusqu'\xE0 ce que tes cuisses soient parall\xE8les au sol et tes genoux \xE0 90\xB0. Tout le dos contre le mur, genoux au-dessus des chevilles. Tiens.",tip:"Ne pose pas les mains sur tes cuisses, sinon tu t'aides."},birddog:{name:"Bird dog",muscles:"Sangle abdominale, bas du dos, fessiers",tempo:"tends, 2 s de maintien, reviens",how:"Mets-toi \xE0 quatre pattes : mains sous les \xE9paules, genoux sous les hanches. Tends en m\xEAme temps le bras droit vers l'avant et la jambe gauche vers l'arri\xE8re, corps align\xE9. Tiens 2 secondes, reviens et change de c\xF4t\xE9.",tip:"Tes hanches ne doivent pas tourner. Imagine un verre d'eau pos\xE9 sur le bas de ton dos."},hollow:{name:"Hollow body",muscles:"Toute la sangle abdominale",how:"Allonge-toi sur le dos, bras tendus derri\xE8re la t\xEAte. Plaque le bas du dos au sol et d\xE9colle un peu du sol les \xE9paules et les jambes tendues. Tiens sans bouger.",tip:"Si le bas de ton dos se d\xE9colle, l\xE8ve les jambes plus haut ou plie-les."},legraise:{name:"Relev\xE9 de jambes",muscles:"Bas des abdos, fl\xE9chisseurs de la hanche",tempo:"2 s en mont\xE9e, 2 s en descente",how:"Allonge-toi sur le dos, bras le long du corps. L\xE8ve lentement tes jambes tendues jusqu'\xE0 la verticale, puis redescends-les lentement presque jusqu'au sol, sans les poser. Le bas du dos reste au sol.",tip:"Si le bas du dos te fait mal, plie les genoux."}},warm:{w1:{name:"Moulinets de bras",dose:"15\xD7 vers l'avant, 15\xD7 vers l'arri\xE8re",why:"D\xE9lie tes \xE9paules avant les pompes et les rowings."},w2:{name:"Balanc\xE9s de jambe",dose:"10\xD7 par jambe, en te tenant au mur",why:"D\xE9lie tes hanches avant les squats."},w3:{name:"World's greatest stretch",dose:"5\xD7 par c\xF4t\xE9",why:"Hanches, haut du dos et ischios en m\xEAme temps."},w4:{name:"Chenille (inchworm)",dose:"5\xD7",why:"\xC9chauffe tout ton corps et t'am\xE8ne en position de planche."}},cool:{c1:{name:"Fl\xE9chisseur de hanche, gauche",why:"Rester beaucoup assis (\xE9cole, ordi) raccourcit l'avant des hanches. Si tu ne fais qu'un \xE9tirement, fais celui-l\xE0.",how:"Genou gauche au sol, pied droit devant. Serre les fessiers et avance les hanches jusqu'\xE0 sentir un \xE9tirement \xE0 l'avant de la hanche gauche. Ne creuse pas le bas du dos."},c2:{name:"Fl\xE9chisseur de hanche, droite",why:"Pareil de l'autre c\xF4t\xE9.",how:"Genou droit au sol, pied gauche devant. Serre les fessiers et avance les hanches."},c4:{name:"Cobra",why:"\xC9tire les abdos et l'avant des hanches. \xC7a compense tous les enroulements des exercices d'abdos.",how:"Allonge-toi sur le ventre, paumes sous les \xE9paules, coudes pr\xE8s du corps. Laisse les hanches au sol et pousse lentement avec les bras jusqu'\xE0 sentir un \xE9tirement agr\xE9able dans le ventre. Garde les \xE9paules basses, loin des oreilles ; les coudes n'ont pas besoin d'\xEAtre tendus. Si \xE7a pince dans le bas du dos, descends un peu."},c3:{name:"Posture de l'enfant",why:"Calme ta respiration et d\xE9tend ton dos. Juste pour le bien-\xEAtre.",how:"Genoux \xE9cart\xE9s, assieds tes fesses sur tes talons, tends les bras le plus loin possible devant toi, front au sol. Respire lentement."}},fig:{k1:["En haut","En bas, coudes \xE0 ~45\xB0 du corps"],k3:["En haut","En bas, coudes serr\xE9s"],b5:["Correct : corps droit","Incorrect : bas du dos qui s'affaisse"],n1:["D\xE9part","En bas, talons au sol"],r1:["En haut","En bas, t\xEAte devant les mains"],row1:["D\xE9part, bras tendu","Tirage, coude en arri\xE8re"],row3:["D\xE9part, main \xE0 hauteur d'\xE9paule","Coude sur le c\xF4t\xE9, \xE0 ~90\xB0 du corps"],row2:["D\xE9part, bras tendus","Poitrine vers la porte"],n2:["En haut","En bas, genou arri\xE8re vers le sol"],b2:["D\xE9part","Bras et jambe oppos\xE9e vers le bas"],n7:["Hanches en l'air, talons pr\xE8s des fessiers","Jambes gliss\xE9es, hanches toujours en l'air"],b4:["Coude vers le genou oppos\xE9","Change de c\xF4t\xE9"],kKnee:["En haut, genoux au sol","En bas, coudes \xE0 ~45\xB0 du corps"],kIncl:["Mains sur la table, en haut","Poitrine vers le bord, coudes \xE0 ~45\xB0 du corps"],superman:["Sur le ventre","D\xE9colle et tiens 2 s"],ytw:["Y : bras en diagonale vers l'avant","T : bras sur les c\xF4t\xE9s","W : coudes vers les c\xF4tes"],lunge:["D\xE9part","Pas en arri\xE8re, genou vers le sol"],bridge:["Sur le dos, genoux pli\xE9s","Hanches en haut, fessiers serr\xE9s"],sbridge:["Sur le dos, une jambe en l'air","Hanches en haut, fessiers serr\xE9s"],r1e:["En haut, pieds sur la chaise","En bas, t\xEAte devant les mains"],k3e:["En haut, pieds sur la chaise","En bas, coudes serr\xE9s"],n1q:["Tout en bas","Un quart en haut","De nouveau tout en bas","Seulement ensuite en haut"],b5l:["Une jambe en l'air","\xC0 mi-temps, change de jambe"],wallsit:["Genoux ~90\xB0, dos au mur"],birddog:["\xC0 quatre pattes : bras et genoux ~90\xB0","Bras et jambe oppos\xE9e"],hollow:["Bas du dos plaqu\xE9 au sol"],legraise:["Jambes en l'air","Descends lentement, sans les poser au sol"],hf:["Genou arri\xE8re au sol, hanches en avant"],cobra:["Hanches au sol, poitrine en haut"],child:["Fesses sur les talons, bras loin devant"]},ch:{w3:"Fais 3 s\xE9ances",pr1:"Bats un record perso",r3:"Fais 3 tours une fois",warm:"\xC9chauffement complet 2\xD7",cool:"\xC9tirements apr\xE8s une s\xE9ance 2\xD7",push100:"100 pompes au total (tous types)",rank:"Atteins un nouveau rang",reps300:"300 r\xE9p\xE9titions au total",legs100:"100 r\xE9p\xE9titions de jambes"},ach:{first:["Premier pas","1re s\xE9ance"],w5:["Tope l\xE0","5 s\xE9ances"],w10:["Dix sur dix","10 s\xE9ances"],w25:["Quart de si\xE8cle","25 s\xE9ances"],w50:["Demi-si\xE8cle","50 s\xE9ances"],s3:["Sur la lanc\xE9e","Flamme de 3"],s7:["Inarr\xEAtable","Flamme de 7"],s15:["Discipline","Flamme de 15"],pr:["Record battu","1er record perso"],gold:["En or","Or sur 1 exercice"],diamond:["Diamant","Diamant sur 1 exercice"],week:["Semaine parfaite","Les 3 d\xE9fis"],lvl5:["Niveau 5","Atteins le niveau 5"],r3:["Trois tours","Fais 3 tours"],push30:["Trente","30 pompes en une s\xE9rie"]},quotes:["La discipline t'emm\xE8ne l\xE0 o\xF9 la motivation ne peut pas aller.","Pas besoin d'en avoir envie. Fais juste la premi\xE8re s\xE9rie, le reste suit.","Chaque r\xE9p\xE9tition est une brique. Un corps se construit brique par brique.","13 minutes aujourd'hui. Un corps pour la vie.","Ne rate jamais deux fois de suite.","De petits pas un jour sur deux valent mieux que de grands plans jamais commenc\xE9s.","Ton futur toi te remerciera pour aujourd'hui.","Le but n'est pas la s\xE9ance parfaite. Le but, c'est d'\xEAtre l\xE0.","Quand \xE7a commence \xE0 br\xFBler, c'est l\xE0 que tu progresses.","Compare-toi seulement \xE0 la personne que tu \xE9tais la semaine derni\xE8re.","Pendant que les autres cherchent la motivation, ta s\xE9ance est d\xE9j\xE0 faite.","S\xE9ries dures, vie plus facile.","Toute personne forte a commenc\xE9 de z\xE9ro."],restDay:["Les muscles se construisent \xE0 l'entra\xEEnement, mais ils grandissent gr\xE2ce \xE0 la nourriture et au sommeil.","Aujourd'hui, c'est repos. \xC7a fait aussi partie du plan.","Se reposer, ce n'est pas \xEAtre paresseux. C'est maintenant que tu progresses.","Le travail est fait. Laisse maintenant ton corps se reconstruire.","Bien manger, bien dormir. \xC7a aussi, c'est de l'entra\xEEnement.","La force ne se construit pas en un jour. Elle se construit un jour sur deux, mois apr\xE8s mois.","Celui qui sait se reposer tient plus longtemps.","Aujourd'hui, tu recharges les batteries pour ta prochaine s\xE9ance.","La r\xE9gularit\xE9, c'est ton super-pouvoir. Garde-la.","Les progr\xE8s ne se voient pas toujours tout de suite. Mais ils sont l\xE0.","Sois fier de ne pas l\xE2cher.","Aujourd'hui appartient \xE0 la r\xE9cup\xE9ration. Profites-en.","De petits pas, beaucoup de jours d'affil\xE9e. C'est comme \xE7a qu'arrivent les grands changements."],doneTitles:["S\xE9ance du jour d\xE9j\xE0 faite","C'est bon pour aujourd'hui","Aujourd'hui, c'est coch\xE9","Mission accomplie !"],doneSubs:["Le jour {day} est boucl\xE9. Maintenant, mange et dors : tes muscles grandissent pendant le repos.","Le jour {day} est derri\xE8re toi. Beau travail, maintenant repose-toi.","Jour {day} boucl\xE9. Une brique de plus dans le mur.","Jour {day} enregistr\xE9. Ta prochaine s\xE9ance, c'est dans deux jours.","Jour {day} fait. Maintenant c'est ton corps qui bosse, profite du reste de la journ\xE9e.","Jour {day} assur\xE9. C'est comme \xE7a qu'on construit la discipline."],facts:["Tu peux t'entra\xEEner tous les jours, mais un jour sur deux, c'est l'id\xE9al. Les muscles grandissent pendant le repos, pas pendant l'entra\xEEnement.","Le sommeil est ton meilleur compl\xE9ment. 7\u20139 heures par nuit = r\xE9cup\xE9ration plus rapide.","Les derni\xE8res r\xE9p\xE9titions d'une s\xE9rie font le plus de travail. Ce sont elles qui construisent le muscle.","Une descente lente (3 secondes) donne plus de travail \xE0 tes muscles que des r\xE9p\xE9titions rapides.","Des prot\xE9ines \xE0 chaque repas aident tes muscles \xE0 grandir.","La r\xE9gularit\xE9 bat l'intensit\xE9. Mieux vaut 13 minutes un jour sur deux qu'une heure une fois par mois.","Bois un peu d'eau. M\xEAme une l\xE9g\xE8re soif fait baisser tes performances.","Respire lentement : inspire par le nez, expire par la bouche. Tu te calmeras plus vite.","Amplitude compl\xE8te = plus de muscle au travail. Moins de r\xE9p\xE9titions, mais compl\xE8tes."],moti:["Je crois en toi, tu vas y arriver ! \u{1F4AA}","Chaque s\xE9rie te rapproche de ton objectif.","Tu as plus de force que tu ne le crois.","Encore un peu, tu peux le faire.","Aujourd'hui compte. N'abandonne pas.","C'est maintenant que tu progresses.","Ton futur toi te remerciera."],cheers:["S\xE9rie solide !","C'est comme \xE7a qu'on fait !","Mode machine activ\xE9 !","Tu es en feu !","Du travail propre !","C'est la route vers un corps fort.","Presque fini !"],finish:["Encore une brique au mur. C'est comme \xE7a qu'on fait.","Termin\xE9. Maintenant, mange bien et dors : c'est l\xE0 que les muscles grandissent.","La force n'est pas un talent. C'est la somme de journ\xE9es exactement comme celle-ci.","Termin\xE9. \xC7a, c'est la discipline en action.","Aujourd'hui, tu as fait ce que la plupart des gens se contentent de pr\xE9voir."]};var Tp={ui:{loading:"Caricamento\u2026",close:"Chiudi",cancel:"Annulla",save:"Salva",home:"Home",back:"Indietro",start:"Inizia",stop:"Stop",copied:"\u2713 Copiato",dayN:"Giorno {d}",tabTrain:"Allenamento",tabHistory:"Storico",tabSettings:"Impostazioni",tabProfile:"Profilo",mainMenu:"Menu principale",openProfile:"Apri profilo",streakAria:"Striscia {n}",levelAria:"Livello {n}",weeklyChallenges:"Sfide settimanali",chLeft:"{done}/3, ancora {left}",chFooter:"Completale tutte e 3 per ottenere un \u{1F9CA} congelamento della striscia.",firstWorkout:"Il tuo primo allenamento. Si parte!",anytime:"Quando vuoi.",idealOn:"L'ideale \xE8 {date}, visto che ti alleni a giorni alterni.",trainedYesterday:"Ieri hai fatto il giorno {day}. Il piano (a giorni alterni) dice che il prossimo allenamento \xE8 domani, ma puoi farlo anche oggi.",streakAtRisk:"Oggi \xE8 giorno di allenamento. Se lo salti, domani la tua striscia \u{1F525} di {n} si interrompe.",trainingDay:"Oggi \xE8 giorno di allenamento. Ultimo allenamento: {date} ({ago}).",welcomeTitle:"Ti diamo il benvenuto! \u{1F44B}",welcome1:"Ti alleni a casa, senza attrezzi, per ~13 minuti. Fai a rotazione i giorni A, B e C e ti alleni a giorni alterni. Ogni allenamento ha un riscaldamento, poi 4 esercizi in circuito (2 o 3 giri) e uno stretching facoltativo.",welcome2:"Tocca un esercizio per vedere disegno, istruzioni e video. Se un esercizio non fa per te, sostituiscilo durante l'allenamento con il pulsante \u21C4. Imposta nome e foto nel profilo (in alto a destra).",weekLine:"Questa settimana: {count}. Obiettivo: 3\u20134 (a giorni alterni).",nextWorkout:"Prossimo allenamento",todayWorkout:"Allenamento di oggi",freezeOffer:"\u{1F9CA} Oggi non puoi? Usa un congelamento ({n})",frozenToday:"\u{1F9CA} Oggi \xE8 congelato, la tua striscia \xE8 salva.",pickDay:"Scegli un giorno",upNext:"il prossimo",toNext:"ancora {n}",harderShort:"\u2B06 \xC8 ora di una versione pi\xF9 difficile",newEx:"nuovo",lastTime:"l'ultima volta",tapInfo:"tocca per info",tapHint:"Tocca un esercizio: disegno, istruzioni, video e ranghi.",roundsBtn:"{n} giri, ~{m} min",roundsHint:"3 giri significano pi\xF9 serie a settimana, quindi crescita pi\xF9 rapida. Quando hai poco tempo, 2 giri bastano.",startDay:"Inizia giorno {d}",prevMonth:"Mese precedente",nextMonth:"Mese successivo",tileTrainings:"Allenamenti",tileSets:"Serie",tilePRs:"Record",progress:"Progressi",workoutsTitle:"Allenamenti",noHistory:"Ancora nessun allenamento. Fai il primo nella scheda Allenamento.",chartTitle:"{name}: serie migliore per allenamento",chartSeconds:" (secondi)",chartHint:"Tocca un punto per vederne il valore. Linea tratteggiata = rango successivo.",rankThen:"{rank} in quel momento",confirmDelete:"Eliminare davvero?",deleteWorkout:"Elimina allenamento",changePhoto:"Cambia foto profilo",photoErr:"Impossibile caricare questa foto. Provane un'altra (JPG o PNG).",nameLabel:"Nome",defaultName:"User",since:"Ti alleni da {date}",newMember:"Nuovo membro",streak:"Striscia",streakRisk:"Allenati oggi per non perderla!",streakHold:"Regge finch\xE9 non salti 2 giorni.",level:"Livello",xpLine:"{into}/{need} XP, {total} in totale",freezeTitle:"Congelamenti della striscia: {n}/2",freezeDesc:"Quando non puoi allenarti, congela il giorno e la tua striscia non si interrompe. Ne guadagni di nuovi completando tutte e 3 le sfide settimanali.",freezeUse:"Usa",freezeToday:"Oggi \u2713",statTrainings:"Allenamenti",statSets:"Serie totali",statReps:"Ripetizioni totali",statBestStreak:"Striscia pi\xF9 lunga",ranksTitle:"Ranghi",badgesTitle:"Medaglie",maxBest:", max {v}",appearance:"Aspetto",language:"Lingua",sounds:"Suoni",sndTap:"Suoni dei pulsanti",sndTapD:"Un clic leggero quando tocchi.",sndFx:"Effetti sonori",sndFxD:"Melodie dopo una serie, u futuro.",grp_push:"Spinta",grp_pull:"Trazione",grp_legs:"Gambe",grp_core:"Core",exMenu:"\u{1F3CB}\uFE0F Esercizi",exMenuD:"Come si fa ogni esercizio e quali puoi fare.",exTitle:"Esercizi",exIntro:"Tocca un esercizio per vedere come si fa. Disattiva quelli che non puoi fare (niente porta, niente sedia, dolore\u2026). L'app user\xE0 un altro esercizio dello stesso tipo, cos\xEC ogni allenamento avr\xE0 sempre spinta, trazione, gambe e core.",grpOn:"{on} su {n} attivi",grpLast:"Ne \xE8 rimasto solo uno, quindi sar\xE0 in ogni allenamento.",grpLastLock:"\xC8 l'ultimo esercizio di questo tipo, quindi deve restare attivo. Altrimenti questi muscoli non verrebbero allenati per niente.",exAlt:"alternativa",exInfo:"tocca per info",exReplacedBy:"Disattivato. Il giorno {d} usa al suo posto: {name}.",exCanDo:"Posso farlo: {name}",resetAll:"\u{1F9F9} Ricomincia da zero",resetAllD:"Elimina allenamenti, XP, livelli, serie, ranghi e badge. Nome, foto e impostazioni restano.",resetAllTitle:"Ricominciare da zero?",resetAllBody:"Verranno eliminati tutti i tuoi allenamenti ({count}) e tutto ci\xF2 che ne deriva: XP, livelli, la serie, i congelamenti, i ranghi e i badge. Nome, foto e impostazioni restano. Non si pu\xF2 annullare, quindi salva prima un backup se potresti volere di nuovo i dati.",resetAllBackup:"\u{1F4BE} Prima salva un backup",resetAllYes:"S\xEC, elimina tutto",msgResetAll:"\u2713 Fatto. Riparti da zero."},pl:{workouts:{one:"{n} allenamento",many:"{n} allenamenti",other:"{n} allenamenti"},days:{one:"{n} giorno",many:"{n} giorni",other:"{n} giorni"},daysAgo:{one:"{n} giorno fa",many:"{n} giorni fa",other:"{n} giorni fa"},rounds:{one:"{n} giro",many:"{n} giri",other:"{n} giri"},sets:{one:"{n} serie",many:"{n} serie",other:"{n} serie"},prs:{one:"{n} record personale",many:"{n} record personali",other:"{n} record personali"}},units:{arm:"/braccio",leg:"/gamba",side:"/lato"},perUnit:{arm:"per braccio",leg:"per gamba",side:"per lato"},themes:{navy:"Blu notte",black:"Nero",forest:"Foresta",plum:"Prugna",ocean:"Oceano",wine:"Vino",slate:"Ardesia",coffee:"Caff\xE8"},ranks:["Legno","Ferro","Bronzo","Argento","Oro","Platino","Diamante"],ex:{k1:{name:"Piegamento",muscles:"Petto, tricipiti, deltoidi anteriori",tempo:"3 s gi\xF9, breve pausa, su",how:"Mani un po' pi\xF9 larghe delle spalle, corpo dritto dalla testa ai talloni, addominali e glutei contratti. Scendi in 3 secondi finch\xE9 il petto quasi tocca il pavimento, fermati un attimo e spingi di nuovo su. Tieni i gomiti a ~45\xB0 dal corpo, non aperti verso l'esterno.",tip:"Quando arrivi a 25+ nel primo giro, appoggia le mani su due libri spessi. Il petto scende pi\xF9 in basso, il muscolo si allunga di pi\xF9 e cresce di pi\xF9.",lvl:"Appoggia le mani su due libri spessi cos\xEC il petto scende pi\xF9 in basso. All'inizio i tuoi numeri caleranno, \xE8 normale."},row1:{name:"Rematore allo stipite",muscles:"Schiena (dorsali), deltoidi posteriori, bicipiti",tempo:"1 s su, 1 s tenuta, 3 s indietro",how:"Mettiti in una porta aperta, di fianco allo stipite. Afferra lo stipite con una mano all'altezza del petto, piedi proprio accanto allo stipite. Lasciati andare indietro con il braccio teso e il corpo dritto. Tirati verso lo stipite: il gomito va indietro lungo il corpo, stringi la scapola indietro. Torna lentamente. Fai tutte le ripetizioni con un braccio, poi con l'altro.",tip:"Pi\xF9 i piedi sono vicini allo stipite e pi\xF9 ti inclini indietro, pi\xF9 \xE8 difficile. Tieniti allo stipite solido, non alla porta, e allenati a piedi nudi cos\xEC non scivoli.",lvl:"Avvicina i piedi allo stipite e inclinati pi\xF9 indietro."},n1:{name:"Squat ATG",muscles:"Quadricipiti, glutei",tempo:"3 s gi\xF9, 1 s pausa in basso, su",how:"Piedi alla larghezza delle spalle, punte leggermente in fuori. Scendi in 3 secondi pi\xF9 in basso che puoi, cosce sotto le ginocchia, talloni a terra. Resta 1 secondo in basso e risali.",tip:"Il tempo lento e la pausa in basso rendono difficile uno squat facile. Se fai 20+ anche con il tempo, sostituiscilo con lo Squat 1 e 1/4.",lvl:"Sostituiscilo con lo Squat 1 e 1/4 (\u21C4 Cambia)."},b5:{name:"Plank",muscles:"Tutto il core",how:"Avambracci sotto le spalle, corpo dritto dalla testa ai talloni. Contrai addominali e glutei come se qualcuno stesse per darti un pugno nello stomaco. Non lasciare che i fianchi salgano o cedano.",tip:"Quando tieni 60 s in entrambi i giri, sostituiscilo con il Plank su una gamba. \xC8 molto pi\xF9 difficile.",lvl:"Sostituiscilo con il Plank su una gamba (\u21C4 Cambia)."},r1:{name:"Pike push-up",muscles:"Spalle, tricipiti",tempo:"3 s gi\xF9, su",how:"Mettiti a V rovesciata: mani a terra, fianchi alti, gambe pi\xF9 tese che puoi. Piega i gomiti e porta la sommit\xE0 della testa verso il pavimento appena davanti alle mani, cos\xEC mani e testa formano un triangolo. Spingi di nuovo su.",tip:"Quando fai 15+ in entrambi i giri, sostituiscili con i Piegamenti pike con piedi sulla sedia. Pi\xF9 peso va sulle spalle.",lvl:"Sostituiscili con i Piegamenti pike con piedi sulla sedia (\u21C4 Cambia)."},row2:{name:"Rematore alla porta con asciugamano",muscles:"Centro della schiena, scapole, bicipiti",tempo:"1 s su, 1 s tenuta, 3 s indietro",how:"Apri la porta e mettiti di fronte al suo bordo, con la porta tra i piedi. Passa un asciugamano attorno a entrambe le maniglie e tienine le estremit\xE0, oppure afferra direttamente le due maniglie. Lasciati andare indietro con le braccia tese e il corpo dritto. Porta il petto verso il bordo della porta, stringi le scapole e torna gi\xF9 lentamente.",tip:"Prima controlla che le maniglie siano solide e non si muovano. Se qualcosa si muove, fai invece il rematore allo stipite (giorno A). La sicurezza prima di tutto.",lvl:"Avvicina i piedi alla porta e inclinati pi\xF9 indietro."},n2:{name:"Squat bulgaro",muscles:"Quadricipiti, glutei",tempo:"3 s gi\xF9, su",how:"Mettiti davanti a una sedia e appoggia il dorso del piede posteriore sulla seduta. Fai un bel passo avanti con il piede anteriore. Scendi in 3 secondi, il ginocchio posteriore va verso il pavimento. Spingi su attraverso il tallone del piede anteriore.",tip:"Porta il piede anteriore abbastanza avanti da tenere il ginocchio sopra il piede. Busto leggermente inclinato in avanti = pi\xF9 glutei.",lvl:"Rallenta: 4 s gi\xF9 e 2 s di pausa in basso."},b2:{name:"Dead bug",muscles:"Addominali profondi",tempo:"lentamente, 2 s fuori, 2 s dentro",how:"Sdraiati sulla schiena, braccia tese verso il soffitto, gambe sollevate con le ginocchia a 90\xB0. Abbassa lentamente il braccio destro dietro la testa e la gamba sinistra verso il pavimento, poi torna e cambia lato.",tip:"La zona lombare deve restare schiacciata a terra per tutto il tempo. Se si solleva, non abbassare cos\xEC tanto la gamba.",lvl:"Abbassa braccio e gamba pi\xF9 lentamente, 3 s fuori e 3 s dentro."},k3:{name:"Piegamento a diamante",muscles:"Tricipiti, parte interna del petto",tempo:"3 s gi\xF9, su",how:"Metti le mani sotto il petto cos\xEC pollici e indici si toccano e formano un diamante. Scendi con i gomiti che vanno indietro lungo il corpo. Il petto va verso le mani.",tip:"Se ti fanno male i polsi o i gomiti, allarga un po' le mani. I piegamenti stretti lavorano i tricipiti quasi allo stesso modo. La versione pi\xF9 difficile sono i Piegamenti diamante con piedi sulla sedia, puoi sostituirli con quelli.",lvl:"Sostituiscili con i Piegamenti diamante con piedi sulla sedia (\u21C4 Cambia)."},row3:{name:"Rematore largo allo stipite",muscles:"Deltoidi posteriori, parte alta della schiena",tempo:"1 s su, 1 s tenuta, 3 s indietro",how:"Stessa posizione del rematore allo stipite, ma afferra lo stipite all'altezza della spalla e porta il gomito di lato, non lungo il corpo. Braccio e busto formano una T. Dovresti sentirlo dietro la spalla e tra le scapole.",tip:"Questo angolo allena i deltoidi posteriori e la parte alta della schiena. Rendono le spalle pi\xF9 larghe e piene viste da dietro.",lvl:"Avvicina i piedi allo stipite e inclinati pi\xF9 indietro."},n7:{name:"Leg curl con asciugamano",muscles:"Femorali, glutei",tempo:"3 s fuori, 1 s dentro",how:"Sdraiati sulla schiena su un pavimento liscio (parquet, piastrelle), talloni su un asciugamano o con i calzini. Solleva i fianchi in un ponte. Fai scivolare le gambe in avanti in 3 secondi finch\xE9 sono quasi tese, fianchi sempre su. Poi riporta i talloni verso i glutei.",tip:"Sei sul tappeto o non riesci a scivolare? Sostituiscilo con un ponte normale.",lvl:"Fallo con una gamba sola, tieni l'altra in aria."},b4:{name:"Bicycle crunch",muscles:"Obliqui, tutti gli addominali",tempo:"lentamente, 1 s per lato",how:"Sdraiati sulla schiena, mani dietro la testa, spalle sollevate da terra. Porta il gomito destro verso il ginocchio sinistro mentre distendi la gamba destra. Poi cambia. Ruota il busto, non solo i gomiti.",tip:"Vai piano. Sbattere i gomiti in fretta non serve a niente, affatica solo il collo.",lvl:"Rallenta a 2 s per lato."},kKnee:{name:"Piegamento sulle ginocchia",muscles:"Petto, tricipiti, deltoidi anteriori",tempo:"3 s gi\xF9, su",how:"In ginocchio, mani un po' pi\xF9 larghe delle spalle. Tieni il corpo dritto dalle ginocchia alla testa, non spingere i fianchi indietro. Porta il petto verso il pavimento in 3 secondi e spingi di nuovo su.",tip:"Quando ne fai 20 in entrambi i giri, torna al piegamento normale."},kIncl:{name:"Piegamento inclinato",muscles:"Petto, tricipiti, deltoidi anteriori",tempo:"3 s gi\xF9, su",how:"Appoggia le mani su un tavolo robusto, un letto o un davanzale. Tieni il corpo dritto dai talloni alla testa. Porta il petto verso il bordo e spingi indietro. Pi\xF9 basso \xE8 l'appoggio, pi\xF9 \xE8 difficile.",tip:"Una buona alternativa quando ti fanno male i polsi a terra o stai finendo le forze."},superman:{name:"Superman",muscles:"Zona lombare, glutei, deltoidi posteriori",tempo:"su, 2 s tenuta, gi\xF9",how:"Sdraiati a pancia in gi\xF9 con le braccia tese davanti a te. Solleva braccia, petto e gambe da terra nello stesso momento, tieni 2 secondi e torna gi\xF9 lentamente. Guarda il pavimento, non piegare il collo all'indietro.",tip:"Non \xE8 una trazione come un rematore, ma rinforza la schiena quando non hai dove fare il rematore."},ytw:{name:"Y-T-W a terra",muscles:"Centro e parte alta della schiena, deltoidi posteriori",tempo:"tieni ogni posizione 1 s",how:"Sdraiati a pancia in gi\xF9, fronte su un asciugamano. Solleva le braccia tese a Y e tieni 1 s. Poi aprile di lato a T. Infine porta i gomiti verso le costole a W e stringi le scapole. Y + T + W = 1 ripetizione.",tip:"Pollici verso l'alto, tieni le spalle lontane dalle orecchie."},lunge:{name:"Affondo indietro",muscles:"Quadricipiti, glutei",tempo:"2 s gi\xF9, su",how:"In piedi, busto dritto. Fai un bel passo indietro, il ginocchio posteriore arriva quasi a terra e quello anteriore si piega a 90\xB0. Spingi attraverso il tallone del piede anteriore per tornare in piedi. Fai tutte le ripetizioni con una gamba, poi con l'altra.",tip:"Pi\xF9 delicato sulle ginocchia dell'affondo in avanti. Tieni il busto dritto."},bridge:{name:"Ponte glutei",muscles:"Glutei, femorali",tempo:"su, 2 s contrazione, gi\xF9",how:"Sdraiati sulla schiena, ginocchia piegate, piedi a terra. Spingi con i talloni e solleva i fianchi finch\xE9 il corpo forma una linea dritta dalle ginocchia alle spalle. Stringi i glutei per 2 secondi in alto e torna gi\xF9 lentamente.",tip:"La versione pi\xF9 difficile \xE8 il Ponte su una gamba. Quando questo ti sembra facile, sostituiscilo con quello."},r1e:{name:"Piegamenti pike con piedi sulla sedia",muscles:"Spalle, tricipiti",tempo:"3 s gi\xF9, su",how:"Metti i piedi su una sedia, le mani a terra un po' pi\xF9 avanti e porta i fianchi in alto, cos\xEC il busto \xE8 quasi verticale. Piega i gomiti e porta la testa verso terra appena davanti alle mani, gomiti indietro, non di lato. Spingi di nuovo su.",tip:"Pi\xF9 il busto \xE8 verticale, pi\xF9 peso va sulle spalle. Stringi i glutei per non inarcare la zona lombare."},k3e:{name:"Piegamenti diamante con piedi sulla sedia",muscles:"Tricipiti, petto interno, spalle",tempo:"3 s gi\xF9, su",how:"Metti i piedi su una sedia e le mani sotto il petto in modo che pollici e indici si tocchino formando un diamante. Corpo dritto dalla testa ai talloni. Scendi con i gomiti indietro lungo il corpo, petto verso le mani. Spingi di nuovo su.",tip:"Non alzare n\xE9 far cadere i fianchi. Se ti fanno male i polsi o i gomiti, allarga un po' le mani."},n1q:{name:"Squat 1 e 1/4",muscles:"Parte anteriore delle cosce, glutei",tempo:"gi\xF9, un quarto su, gi\xF9, su",how:"Piedi alla larghezza delle spalle, punte leggermente in fuori. Scendi fino in fondo, risali solo di un quarto, scendi di nuovo fino in fondo e solo allora alzati. Questa \xE8 1 ripetizione. Talloni sempre a terra.",tip:"I muscoli passano due volte nella parte pi\xF9 dura e profonda dello squat, per questo \xE8 pi\xF9 difficile. Non lasciarti cadere, scendi con controllo."},b5l:{name:"Plank su una gamba",muscles:"Tutto il core, glutei",how:"Come un plank normale: avambracci sotto le spalle, corpo dritto dalla testa ai talloni. Solleva una gamba tesa poco da terra; a met\xE0 tempo appoggiala e solleva l'altra. Fianchi in linea, non ruotarli.",tip:"Non sollevare troppo la gamba, basta staccarla da terra. L'importante \xE8 che i fianchi non si muovano."},sbridge:{name:"Ponte su una gamba",muscles:"Glutei, femorali",tempo:"su, 2 s contrazione, gi\xF9",how:"Sdraiati sulla schiena, ginocchia piegate, piedi a terra. Distendi una gamba in aria e tieni le cosce vicine. Spingi con il tallone della gamba a terra e solleva i fianchi finch\xE9 il corpo forma una linea retta dal ginocchio alle spalle. In alto stringi i glutei per 2 secondi e scendi piano. Prima tutte le ripetizioni con una gamba, poi con l'altra.",tip:"Tieni i fianchi in linea, non lasciarli cadere dal lato della gamba sollevata. Registra il numero di una gamba: 10 sinistra + 10 destra = scrivi 10."},wallsit:{name:"Wall sit",muscles:"Quadricipiti",how:"Appoggia la schiena al muro e scivola gi\xF9 finch\xE9 le cosce sono parallele al pavimento e le ginocchia a 90\xB0. Tutta la schiena sul muro, ginocchia sopra le caviglie. Tieni.",tip:"Non appoggiare le mani sulle cosce, altrimenti ti aiuti."},birddog:{name:"Bird dog",muscles:"Core, zona lombare, glutei",tempo:"allunga, 2 s tenuta, torna",how:"Mettiti a quattro zampe: mani sotto le spalle, ginocchia sotto i fianchi. Allunga il braccio destro in avanti e la gamba sinistra indietro nello stesso momento, corpo in linea retta. Tieni 2 secondi, torna e cambia lato.",tip:"I fianchi non devono ruotare. Immagina un bicchiere d'acqua sulla zona lombare."},hollow:{name:"Hollow body hold",muscles:"Tutto il core",how:"Sdraiati sulla schiena con le braccia tese dietro la testa. Schiaccia la zona lombare a terra e solleva un po' le spalle e le gambe tese dal pavimento. Tieni senza muoverti.",tip:"Se la zona lombare si stacca da terra, alza di pi\xF9 le gambe o piegale."},legraise:{name:"Leg raise",muscles:"Addominali bassi, flessori dell'anca",tempo:"2 s su, 2 s gi\xF9",how:"Sdraiati sulla schiena, braccia lungo i fianchi. Solleva lentamente le gambe tese finch\xE9 sono verticali e abbassale lentamente quasi fino a terra, ma senza appoggiarle. La zona lombare resta a terra.",tip:"Se ti fa male la zona lombare, piega le ginocchia."}},warm:{w1:{name:"Circonduzioni delle braccia",dose:"15\xD7 avanti, 15\xD7 indietro",why:"Scioglie le spalle prima di piegamenti e rematori."},w2:{name:"Slanci delle gambe",dose:"10\xD7 per gamba, tieniti a un muro",why:"Scioglie i fianchi prima degli squat."},w3:{name:"World's greatest stretch",dose:"5\xD7 per lato",why:"Anche, parte alta della schiena e femorali in un colpo solo."},w4:{name:"Inchworm",dose:"5\xD7",why:"Scalda tutto il corpo e ti porta in plank."}},cool:{c1:{name:"Flessori dell'anca, sinistra",why:"Stare molto seduti (scuola, computer) accorcia la parte anteriore delle anche. Se fai un solo allungamento, fai questo.",how:"Appoggia il ginocchio sinistro a terra, piede destro davanti. Stringi i glutei e porta i fianchi in avanti finch\xE9 senti l'allungamento davanti all'anca sinistra. Non inarcare la zona lombare."},c2:{name:"Flessori dell'anca, destra",why:"Lo stesso dall'altro lato.",how:"Appoggia il ginocchio destro a terra, piede sinistro davanti. Stringi i glutei e porta i fianchi in avanti."},c4:{name:"Cobra",why:"Allunga l'addome e la parte anteriore delle anche. Bilancia tutto l'arrotolarsi degli esercizi per l'addome.",how:"Sdraiati a pancia in gi\xF9, mani sotto le spalle, gomiti vicini al corpo. Lascia i fianchi a terra e spingi piano con le braccia verso l'alto finch\xE9 senti un allungamento piacevole sull'addome. Spalle basse, lontane dalle orecchie; i gomiti non devono essere del tutto tesi. Se senti fastidio nella zona lombare, scendi un po'."},c3:{name:"Posizione del bambino",why:"Calma il respiro e rilassa la schiena. Solo per stare bene.",how:"Ginocchia divaricate, siediti con i fianchi sui talloni, allunga le braccia in avanti pi\xF9 che puoi, fronte a terra. Respira lentamente."}},fig:{k1:["Su","Gi\xF9, gomiti a ~45\xB0 dal corpo"],k3:["Su","Gi\xF9, gomiti stretti"],b5:["Giusto: corpo dritto","Sbagliato: zona lombare che cede"],n1:["Inizio","Gi\xF9, talloni a terra"],r1:["Su","Gi\xF9, testa davanti alle mani"],row1:["Inizio, braccio teso","Tira, gomito indietro"],row3:["Inizio, mano all'altezza della spalla","Gomito di lato, a ~90\xB0 dal corpo"],row2:["Inizio, braccia tese","Petto verso la porta"],n2:["Su","Gi\xF9, ginocchio posteriore verso terra"],b2:["Inizio","Braccio e gamba opposta gi\xF9"],n7:["Fianchi su, talloni vicino ai glutei","Gambe in avanti, fianchi sempre su"],b4:["Gomito al ginocchio opposto","Cambia lato"],kKnee:["Su, ginocchia a terra","Gi\xF9, gomiti a ~45\xB0 dal corpo"],kIncl:["Mani sul tavolo, su","Petto verso il bordo, gomiti a ~45\xB0 dal corpo"],superman:["A pancia in gi\xF9","Solleva e tieni 2 s"],ytw:["Y: braccia in diagonale avanti","T: braccia ai lati","W: gomiti verso le costole"],lunge:["Inizio","Passo indietro, ginocchio verso terra"],bridge:["Sdraiati, ginocchia piegate","Fianchi su, stringi i glutei"],sbridge:["Sdraiati, una gamba su","Fianchi su, stringi i glutei"],r1e:["Su, piedi sulla sedia","Gi\xF9, testa davanti alle mani"],k3e:["Su, piedi sulla sedia","Gi\xF9, gomiti stretti"],n1q:["Fino in fondo","Un quarto su","Di nuovo fino in fondo","Solo allora su"],b5l:["Una gamba su","A met\xE0 tempo cambia gamba"],wallsit:["Ginocchia ~90\xB0, schiena al muro"],birddog:["A quattro zampe: braccia e ginocchia ~90\xB0","Braccio e gamba opposta"],hollow:["Zona lombare schiacciata a terra"],legraise:["Gambe su","Abbassa piano, senza appoggiarle a terra"],hf:["Ginocchio dietro a terra, fianchi avanti"],cobra:["Fianchi a terra, petto su"],child:["Fianchi sui talloni, braccia ben avanti"]},ch:{w3:"Fai 3 allenamenti",pr1:"Batti un record personale",r3:"Fai 3 giri una volta",warm:"Riscaldamento completo 2\xD7",cool:"Stretching dopo l'allenamento 2\xD7",push100:"100 piegamenti in totale (di ogni tipo)",rank:"Raggiungi un nuovo rango",reps300:"300 ripetizioni in totale",legs100:"100 ripetizioni per le gambe"},ach:{first:["Primo passo","1\xB0 allenamento"],w5:["Batti cinque","5 allenamenti"],w10:["Dieci e lode","10 allenamenti"],w25:["Un quarto di secolo","25 allenamenti"],w50:["Mezzo secolo","50 allenamenti"],s3:["Si ingrana","Striscia di 3"],s7:["Inarrestabile","Striscia di 7"],s15:["Disciplina","Striscia di 15"],pr:["Batti-record","1\xB0 record personale"],gold:["D'oro","Oro in 1 esercizio"],diamond:["Diamante","Diamante in 1 esercizio"],week:["Settimana perfetta","Tutte e 3 le sfide"],lvl5:["Livello 5","Raggiungi il livello 5"],r3:["Tre giri","Fai 3 giri"],push30:["Trenta","30 piegamenti in una serie"]},quotes:["La disciplina ti porta dove la motivazione non arriva.","Non serve averne voglia. Fai solo la prima serie, il resto viene da s\xE9.","Ogni ripetizione \xE8 un mattone. Un fisico si costruisce mattone dopo mattone.","13 minuti oggi. Un fisico per la vita.","Mai saltare due volte di fila.","Piccoli passi a giorni alterni battono grandi piani mai iniziati.","Il te del futuro ti ringrazier\xE0 per oggi.","Non conta l'allenamento perfetto. Conta esserci.","Dove inizia a bruciare, inizia la crescita.","Confrontati solo con chi eri la settimana scorsa.","Mentre gli altri cercano la motivazione, tu hai gi\xE0 finito l'allenamento.","Serie dure, vita pi\xF9 facile.","Ogni persona forte \xE8 partita da zero."],restDay:["I muscoli si costruiscono con l'allenamento, ma crescono con il cibo e il sonno.","Oggi si riposa. Anche questo fa parte del piano.","Riposare non \xE8 pigrizia. \xC8 adesso che cresci.","Il lavoro \xE8 fatto. Ora lascia che il corpo si ricostruisca.","Mangia bene, dormi bene. Anche questo \xE8 allenamento.","La forza non si costruisce in un giorno. Si costruisce a giorni alterni, mese dopo mese.","Chi sa riposare dura di pi\xF9.","Oggi ricarichi le batterie per il prossimo allenamento.","La costanza \xE8 il tuo superpotere. Tienila stretta.","I progressi non si vedono sempre subito. Ma ci sono.","Sii orgoglioso di non mollare.","Oggi \xE8 il giorno del recupero. Goditelo.","Piccoli passi, tanti giorni di fila. \xC8 cos\xEC che arrivano i grandi cambiamenti."],doneTitles:["Allenamento di oggi gi\xE0 fatto","Per oggi \xE8 fatta","Oggi \xE8 spuntato","Missione compiuta!"],doneSubs:["Il giorno {day} \xE8 completato. Ora mangia e dormi: i muscoli crescono mentre riposi.","Il giorno {day} \xE8 alle spalle. Bel lavoro, ora riposati.","Giorno {day} fatto. Un altro mattone nel muro.","Giorno {day} registrato. Il prossimo allenamento \xE8 tra due giorni.","Giorno {day} completato. Ora lavora il tuo corpo, tu goditi il resto della giornata.","Giorno {day} superato. Cos\xEC si costruisce la disciplina."],facts:["Puoi allenarti ogni giorno, ma a giorni alterni \xE8 meglio. I muscoli crescono mentre riposi, non mentre ti alleni.","Il sonno \xE8 il tuo integratore migliore. 7\u20139 ore a notte = recupero pi\xF9 rapido.","Le ultime ripetizioni di una serie fanno il lavoro pi\xF9 grosso. Sono quelle che costruiscono muscolo.","Una discesa lenta (3 secondi) d\xE0 ai muscoli pi\xF9 lavoro delle ripetizioni veloci.","Le proteine a ogni pasto aiutano i muscoli a crescere.","La costanza batte l'intensit\xE0. Meglio 13 minuti a giorni alterni che un'ora una volta al mese.","Bevi un po' d'acqua. Anche una leggera sete abbassa la tua prestazione.","Respira lentamente: dentro dal naso, fuori dalla bocca. Ti calmi prima.","Movimento completo = pi\xF9 muscoli al lavoro. Meno ripetizioni, ma complete."],moti:["Credo in te, ce la fai! \u{1F4AA}","Ogni serie ti avvicina al tuo obiettivo.","Sei pi\xF9 forte di quanto pensi.","Ancora un po', puoi farcela.","Oggi conta. Non mollare.","\xC8 questo il momento in cui cresci.","Il te del futuro ti ringrazier\xE0."],cheers:["Serie potente!","Cos\xEC si fa!","Modalit\xE0 bestia!","Sei on fire!","Lavoro pulito!","Questa \xE8 la strada per un fisico forte.","Ci sei quasi!"],finish:["Un altro mattone nel muro. Cos\xEC si fa.","Fatto. Ora mangia bene e dormi, \xE8 l\xEC che crescono i muscoli.","La forza non \xE8 talento. \xC8 la somma di giorni esattamente come questo.","Fatto. Questa \xE8 disciplina in azione.","Oggi hai fatto quello che la maggior parte delle persone si limita a programmare."]};var Dp={ui:{loading:"Carregando\u2026",close:"Fechar",cancel:"Cancelar",save:"Salvar",home:"In\xEDcio",back:"Voltar",start:"Come\xE7ar",stop:"Parar",copied:"\u2713 Copiado",dayN:"Dia {d}",tabTrain:"Treino",tabHistory:"Hist\xF3rico",tabSettings:"Ajustes",tabProfile:"Perfil",mainMenu:"Menu principal",openProfile:"Abrir perfil",streakAria:"Sequ\xEAncia {n}",levelAria:"N\xEDvel {n}",weeklyChallenges:"Desafios da semana",chLeft:"{done}/3, {left} pela frente",chFooter:"Complete os 3 e ganhe um \u{1F9CA} congelamento de sequ\xEAncia.",firstWorkout:"Seu primeiro treino. Bora!",anytime:"Quando voc\xEA quiser.",idealOn
